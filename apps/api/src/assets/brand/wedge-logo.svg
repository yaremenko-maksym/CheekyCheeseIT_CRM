<?xml version="1.0" encoding="UTF-8"?>
<!--
  CheekyCheeseIT "Wedge Terminal" brand mark — outline variant, graphite stroke
  for the white-background PDF render. See user memory `feedback_brand_icon`
  (commit 3bc5dc5 on branch `claude/naughty-rubin-9c42c5` for the canonical
  apps/web/app/components/brand-mark.tsx implementation).

  Used by `apps/api/src/invoices/invoice-pdf.service.ts` — drawn into the
  invoice header via pdf-lib's PDFOperator path drawing primitives. Kept as
  SVG so designers can iterate without touching code, even though pdf-lib
  itself doesn't render SVG (we re-encode the path data into native pdf-lib
  draw calls inside `drawBrandMark`).

  Geometry skeleton (512 viewBox): wedge apex (96,124) → ... → (110,416);
  holes chevron (192,216 r14) (240,272 r20) (192,328 r14) + cursor pill
  rect (300,258, 80×28) + 1 ambient hole (396,340, r9).
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
  <path
    d="M 112 112 L 422 215 A 18 18 0 0 1 432 233 L 432 402 A 18 18 0 0 1 414 416 L 110 416 A 18 18 0 0 1 96 398 L 96 124 A 18 18 0 0 1 112 112 Z"
    stroke-width="18"
    stroke-linejoin="round"
  />
  <g stroke-linecap="round">
    <circle cx="192" cy="216" r="14" stroke-width="10" />
    <circle cx="240" cy="272" r="20" stroke-width="12" />
    <circle cx="192" cy="328" r="14" stroke-width="10" />
    <rect x="300" y="258" width="80" height="28" rx="13" stroke-width="11" />
    <circle cx="396" cy="340" r="9" stroke-width="7" />
  </g>
</svg>
