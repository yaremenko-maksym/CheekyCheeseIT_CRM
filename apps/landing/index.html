<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffc300" />
    <title>CheekyCheeseIT — AI, EdTech, E-Commerce</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Both fonts are self-hosted — see app/styles/globals.css `@font-face`
         + public/fonts/*.woff2 (task-landing-seo-prerender.md §3; was Google
         Fonts CDN, whose <link rel="stylesheet"> Lighthouse flagged as a
         ~1s render-blocking-resources cost). Only Inter is preloaded: it's
         the hero H1 LCP element's font, so starting its fetch immediately
         (in parallel with everything else, same-origin, no CSS round trip
         first) is the highest-leverage LCP fix here. JetBrains Mono (terminal
         / eyebrow labels only, never above the true fold content) is left to
         load on its own schedule — preloading it too would compete with
         Inter and the app JS for the same early bandwidth for no LCP benefit. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable-latin.woff2"
      crossorigin
    />
    <!-- Cloudflare Turnstile (public vacancy-apply form spam guard) is
         injected lazily by app/lib/use-turnstile.ts on mount — see that
         file's module doc (task-landing-seo-prerender.md §3). Every page
         (`/`, `/careers`) used to pay for this ~24 KB script + widget
         fetch eagerly even though only `/careers/:slug` renders the form. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/client.tsx"></script>
  </body>
</html>
