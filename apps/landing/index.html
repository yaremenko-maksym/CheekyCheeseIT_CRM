<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffc300" />
    <title>CheekyCheeseIT — AI, EdTech, E-Commerce</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Inter (body/heading font, incl. the hero H1 LCP element) is
         self-hosted — see app/styles/globals.css `@font-face` +
         public/fonts/inter-variable-latin.woff2 (task-landing-seo-prerender.md
         §3). This preload is the highest-leverage LCP fix in that task: it
         collapses "fetch CSS from googleapis.com, then fetch the font file
         from gstatic.com" (2 cross-origin round trips) down to 1 same-origin
         fetch that starts in parallel with everything else. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-variable-latin.woff2"
      crossorigin
    />
    <!-- JetBrains Mono (terminal/eyebrow labels only, not LCP-critical) stays
         on Google Fonts CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Cloudflare Turnstile — public vacancy-apply form spam guard (VacancyApplyForm).
         No `integrity=` on purpose: Cloudflare serves this bundle from a rotating CDN
         and explicitly documents that it must NOT be pinned via SRI (the script content
         changes without notice as CF updates challenge logic) — https://developers.cloudflare.com/turnstile/troubleshooting/faqs/ -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/client.tsx"></script>
  </body>
</html>
