[project]
name = "signal-plus"
version = "0.1.0"
description = "Daily morning Signal '+' roll-call to the owner's group via signal-cli"
# CR-L-1 (PR #650 code review, id 5105099737): signal_plus/updater.py's
# install_release() uses tarfile.extractall(filter="data"), which requires
# Python >=3.11.4 (or >=3.12) -- ">=3.11" alone would allow an interpreter
# where that call raises. The runtime image is python:3.12-slim (unaffected);
# this is about what a local `pip install -e .` could otherwise accept.
requires-python = ">=3.11.4"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signal-plus = "signal_plus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_plus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
