[project]
name = "signal-plus"
version = "0.1.0"
description = "Daily morning Signal '+' roll-call to the owner's group via signal-cli"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signal-plus = "signal_plus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_plus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
