<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/cheekycheeseit-crm-89317b4c-60ea-4ff5-832a-231b4ad76c23/_ds_bundle.css">
  <link rel="stylesheet" href="_ds/cheekycheeseit-crm-89317b4c-60ea-4ff5-832a-231b4ad76c23/styles.css">
  <script src="_ds/cheekycheeseit-crm-89317b4c-60ea-4ff5-832a-231b4ad76c23/_ds_bundle.js"></script>
</helmet>
<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-sans,ui-sans-serif,system-ui,sans-serif);min-width:0">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:9px;min-width:0">
      <h3 style="margin:0;font-size:17px;font-weight:650;color:var(--foreground);line-height:1.25;text-wrap:pretty">{{ title }}</h3>
      <div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--foreground)"><span style="width:7px;height:7px;border-radius:999px;background:{{ domainColor }}"></span>{{ domain }}</span>
        <span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:var(--secondary);font-size:12px;font-weight:500;color:var(--muted-foreground)">{{ seniority }}</span>
        <span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:var(--secondary);font-size:12px;font-weight:500;color:var(--muted-foreground)">{{ employment }}</span>
      </div>
    </div>
    <sc-if value="{{ isDraft }}" hint-placeholder-val="{{ true }}"><span style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--secondary);color:var(--muted-foreground)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor;opacity:.7"></span>Чернетка</span></sc-if>
    <sc-if value="{{ isPublished }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in oklab, oklch(72% 0.16 150) 16%, transparent);color:oklch(80% 0.15 152)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Опубліковано</span></sc-if>
    <sc-if value="{{ isClosed }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in oklab, var(--destructive) 15%, transparent);color:oklch(72% 0.18 22)"><span style="width:6px;height:6px;border-radius:999px;background:currentColor"></span>Закрито</span></sc-if>
  </div>
  <div style="display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted-foreground);flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></svg>{{ location }}</span>
    <span style="display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px">/careers/{{ slug }}</span>
  </div>
  <div style="height:1px;background:var(--border)"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:9px;min-width:0">
      <sc-if value="{{ showApps }}" hint-placeholder-val="{{ true }}">
        <span style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--foreground)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted-foreground)"><path d="M14 19v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="7.5" cy="7" r="3.5"/><path d="M21 19v-2a4 4 0 0 0-3-3.9"/><path d="M15 3.1a4 4 0 0 1 0 7.8"/></svg>{{ appsLabel }}</span>
        <sc-if value="{{ hasNew }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:700">{{ newLabel }}</span></sc-if>
      </sc-if>
      <sc-if value="{{ isDraft }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:var(--muted-foreground)">Ще не опубліковано</span></sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
      <sc-if value="{{ isDraft }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>Опублікувати</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="outline" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Редагувати</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="ghost" className="text-destructive hover:text-destructive" hint-size="auto,32px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg></x-import>
      </sc-if>
      <sc-if value="{{ isPublished }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>Відгуки</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="outline" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Редагувати</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="ghost" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Закрити</x-import>
      </sc-if>
      <sc-if value="{{ isClosed }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="outline" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Відновити</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="outline" hint-size="auto,32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Редагувати</x-import>
        <x-import component-from-global-scope="CrmWeb.Button" size="sm" variant="ghost" className="text-destructive hover:text-destructive" hint-size="auto,32px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg></x-import>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:210},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Senior ML Engineer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;domain&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;AI&quot;,&quot;options&quot;:[&quot;AI&quot;,&quot;EdTech&quot;,&quot;E-Commerce&quot;,&quot;Other&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;seniority&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Senior&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;employment&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Повна зайнятість&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;location&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Київ / Віддалено&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;slug&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;senior-ml-engineer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;published&quot;,&quot;options&quot;:[&quot;draft&quot;,&quot;published&quot;,&quot;closed&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;apps&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;newCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = (this.props.status || '').toLowerCase();
    const nc = parseInt(this.props.newCount || '0', 10) || 0;
    const apps = parseInt(this.props.apps || '0', 10) || 0;
    const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
    const dc = { 'ai': 'oklch(72% 0.17 300)', 'edtech': 'oklch(70% 0.15 250)', 'e-commerce': 'oklch(74% 0.13 180)', 'other': 'oklch(62% 0 0)' };
    return {
      isDraft: s === 'draft', isPublished: s === 'published', isClosed: s === 'closed',
      hasNew: nc > 0, showApps: s !== 'draft',
      domainColor: dc[(this.props.domain || 'other').toLowerCase()] || dc.other,
      appsLabel: apps + ' ' + plural(apps, 'відгук', 'відгуки', 'відгуків'),
      newLabel: nc + ' ' + plural(nc, 'новий', 'нові', 'нових'),
    };
  }
}
</script>
</body>
</html>
