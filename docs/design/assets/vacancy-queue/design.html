<!doctype html>
<html lang="uk" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacancy queue — design reference (Tier 1, hand-authored)</title>
<!--
  VISUAL REFERENCE ONLY — NOT CODE TO PASTE. Built by hand (design-gate: degraded, no Claude Design session).
  Colours are the .dark custom properties of apps/web/app/styles/globals.css copied verbatim; no other colour exists
  in this file. Layout uses container queries so a fixed-width frame behaves exactly like a viewport of that width.
  Usage:  design.html                                         -> board with every frame
          design.html?s=list&w=320&st=default&lang=uk         -> one isolated frame (screenshot source)
          s = list | card | sources ; st = state ; w = viewport width ; lang = uk | en ; admin=1 adds the sources block
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
<style>
:root{
  /* === globals.css .dark, verbatim === */
  --background:oklch(0.08 0 0);--card:oklch(0.12 0 0);--surface:oklch(0.16 0.006 85);--foreground:oklch(0.97 0 0);
  --card-foreground:oklch(0.97 0 0);--popover:oklch(0.13 0 0);--muted-foreground:oklch(0.58 0 0);
  --primary:oklch(0.84 0.183 85.3);--primary-foreground:oklch(0.08 0 0);--yellow-muted:oklch(0.72 0.13 85.3);
  --yellow-subtle:oklch(0.22 0.04 85.3);--avatar-text:oklch(0.84 0.183 85.3);--secondary:oklch(0.2 0 0);
  --muted:oklch(0.16 0 0);--accent:oklch(0.19 0.012 85);--destructive:oklch(0.65 0.21 22.2);
  --border:oklch(0.22 0.004 85);--input:oklch(0.16 0 0);--ring:oklch(0.84 0.183 85.3);--radius:0.625rem;
  --radius-sm:calc(var(--radius) - 4px);--radius-md:calc(var(--radius) - 2px);--radius-lg:var(--radius);--radius-xl:calc(var(--radius) + 4px);
  --font-sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;border-color:var(--border);margin:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{flex:none;display:block}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-foreground)}
.fg{color:var(--foreground)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.board{padding:24px;display:flex;flex-direction:column;gap:40px}
.board h2{font-size:15px;font-weight:600}.cap{font-size:12px;color:var(--muted-foreground);margin:2px 0 10px}
.row-of{display:flex;gap:24px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}

/* ===== frame = viewport ===== */
.frame{width:var(--w);container:vp/inline-size;background:var(--background);box-shadow:0 0 0 1px var(--border);flex:none;position:relative}
.shell{display:flex;min-height:100%}
.side{display:none;width:208px;flex:none;border-right:1px solid color-mix(in oklch,var(--border) 60%,transparent);padding:16px 12px;flex-direction:column;gap:6px}
.side .brand{font-weight:700;margin-bottom:10px;color:var(--primary);font-size:13px}
.side .nav{height:36px;border-radius:var(--radius-md);display:flex;align-items:center;padding:0 10px;color:var(--muted-foreground);font-size:13px}
.side .nav.on{background:var(--accent);color:var(--foreground);border-left:2px solid var(--primary)}
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 4px 0 6px}
.topbar .ib{width:44px;height:44px;display:grid;place-items:center;color:var(--foreground)}
.topbar b{font-size:14px}
@container vp (min-width:768px){.side{display:flex}.topbar{display:none}}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.main{container:main/inline-size;padding:16px 16px 24px}
@container vp (min-width:768px){.main{padding:24px}}
.page{display:flex;flex-direction:column;gap:12px}
@container vp (min-width:1440px){.page{max-width:64rem}} /* max-w-5xl: the list never stretches */

/* ===== header / tabs / toolbar ===== */
.h1row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px;font-weight:600;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;border:1px solid transparent}
.btn.pri{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px rgb(0 0 0/.3)}
.btn.out{border-color:var(--border);box-shadow:0 1px 2px rgb(0 0 0/.3)}
.btn.ghost{color:var(--foreground)}
.btn.dis{opacity:.5;pointer-events:none}
.btn.full{width:100%}
.btn.ic{padding:0;width:44px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.tab{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted-foreground);font-weight:500;position:relative;padding:4px 2px;text-align:center}
.tab .n{font-size:12px;font-weight:600;min-height:16px}
.tab.on{color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
@container main (min-width:560px){.tabs{display:flex}.tab{flex-direction:row;gap:8px;padding:0 16px;min-height:44px}.tab .n{background:var(--secondary);color:var(--foreground);border-radius:999px;padding:1px 8px;min-height:0}.tab.on::after{left:0;right:0}}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1 1 180px;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border);background:var(--input);border-radius:var(--radius-md);color:var(--muted-foreground)}
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--border);background:var(--input);border-radius:var(--radius-md);flex:1 1 100%;min-width:0}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container main (min-width:560px){.field,.sel,.btn{min-height:40px}.sel{flex:0 0 220px}}
.fbadge{background:var(--primary);color:var(--primary-foreground);border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

/* ===== notices (Alert-like) ===== */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-lg);font-size:13px;background:var(--card)}
.note .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.note b{font-weight:600}
.note .sub{color:var(--muted-foreground);font-size:12px}
.note.info{border-color:color-mix(in oklch,var(--primary) 40%,transparent);background:var(--yellow-subtle)}
.note.info>svg:first-child{color:var(--primary)}
.note.info .sub{color:var(--foreground);opacity:.8}
.note.dash{border-style:dashed}
.note.bad{border-color:color-mix(in oklch,var(--destructive) 55%,transparent)}
.note.bad>svg:first-child{color:var(--destructive)}
.note.bad b{color:var(--destructive)}
.note.soft{background:transparent;color:var(--muted-foreground)}
.note .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

/* ===== queue list ===== */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);background:var(--card);border-radius:var(--radius-xl);min-height:44px;width:100%;position:relative}
.item .ttl{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.co{color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted-foreground)}
.meta .sep{opacity:.5}
.meta .i{display:inline-flex;align-items:flex-start;gap:5px}
.meta .i svg{margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-md);background:var(--secondary);font-size:12px;font-weight:500;white-space:nowrap}
.chip.hit{background:var(--yellow-subtle);color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--primary) 35%,transparent)}
.chip.more{background:transparent;color:var(--muted-foreground);box-shadow:inset 0 0 0 1px var(--border)}
.bdg{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-md);border:1px solid var(--border);font-size:12px;font-weight:600;white-space:nowrap}
.bdg.tri{border-style:dashed;border-color:var(--yellow-muted)}
.bdg.tri svg{color:var(--primary)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}
.flag.upd{color:var(--primary)}
.chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);display:none}
.who{display:flex;align-items:center;gap:8px;font-size:12px;border-top:1px solid var(--border);padding-top:8px;color:var(--muted-foreground);flex-wrap:wrap}
.who .btn{min-height:44px;padding:0 10px;margin-left:auto}
.item .l,.item .r{display:flex;flex-direction:column;gap:6px;min-width:0}
.line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.line1 .co{flex:1 1 0}
.btn .lbl{display:none}
.btn.tool{width:44px;padding:0;position:relative;flex:none}
.fbadge{position:absolute;top:-6px;right:-6px}
@container main (min-width:560px){.btn .lbl{display:inline}.btn.tool{padding:0 16px;width:auto}.fbadge{position:static}}
.src{width:20px;height:20px;border-radius:var(--radius-sm);background:var(--secondary);display:grid;place-items:center;color:var(--muted-foreground)}
@container main (min-width:560px){
  .list{gap:0;border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card);overflow:hidden}
  .item{border:0;border-radius:0;border-bottom:1px solid var(--border);background:transparent;padding:12px 40px 12px 16px}
  .item:last-child{border-bottom:0}
  .chev{display:block}
}
@container main (min-width:720px){
  .item{display:grid;grid-template-columns:minmax(0,1fr) 230px;column-gap:24px;row-gap:6px;align-items:start}
  .item .who{grid-column:1/-1}
}
.sk{background:var(--muted);border-radius:var(--radius-md);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:40px 16px;border:1px dashed var(--border);border-radius:var(--radius-xl)}
.empty .ico{width:40px;height:40px;border-radius:999px;background:var(--secondary);display:grid;place-items:center;color:var(--muted-foreground);margin-bottom:4px}
.empty p{max-width:36ch;color:var(--muted-foreground);font-size:13px}

/* ===== card dialog ===== */
.scrim{background:color-mix(in oklch,var(--background) 80%,transparent)}
@container vp (min-width:640px){.scrim{padding:24px 0;display:flex;justify-content:center}}
.dlg{background:var(--card);width:100%;display:flex;flex-direction:column}
@container vp (min-width:640px){.dlg{max-width:672px;border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:0 10px 30px rgb(0 0 0/.5);align-self:flex-start}}
.dh{display:flex;gap:8px;padding:12px 8px 12px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.dh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.dh h2{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.db{padding:16px;display:flex;flex-direction:column;gap:18px}
.df{border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.df .btn.pri{order:-1}
.pair{display:flex;gap:8px}.pair .btn:first-child{flex:1}
@container vp (min-width:640px){.df{flex-direction:row;justify-content:flex-end;align-items:center}.df .grow{margin-right:auto}.df .btn.pri{order:3}.df .btn{min-height:40px}}
.sec h3{font-size:12px;font-weight:600;color:var(--muted-foreground);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.md p{margin-bottom:8px;opacity:.92}.md ul{padding-left:18px;margin-bottom:8px}.md li{margin-bottom:2px}.md strong{font-weight:600}
.md .u{color:var(--primary);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.srcrow{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--border)}
.srcrow .nm{flex:1;min-width:0}.srcrow .nm div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .btn{min-height:44px;width:44px;padding:0}
.sn{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:10px;row-gap:6px;padding:12px 0;border-bottom:1px solid var(--border);align-items:start}
.sn .sact{grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.sn .sact .btn.ic{align-self:flex-end}
.sn .done{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600}
.sn .done svg{color:var(--primary)}
@container vp (min-width:640px){.sn{grid-template-columns:32px minmax(0,1fr) auto}.sn .sact{grid-column:3;grid-row:1;align-items:flex-end;min-width:150px}}
.grp{font-size:12px;font-weight:600;color:var(--muted-foreground);padding:10px 0 2px;border-bottom:1px solid var(--border)}
.dupask{background:var(--accent)}
.foot-status,.foot-end{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;color:var(--muted-foreground);font-size:13px}
.foot-status svg{animation:spin 1s linear infinite}
.foot-end{border-top:1px dashed var(--border);margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.foot-status svg{animation:none}}
.btn.more{color:var(--muted-foreground)}
.tools{position:relative}
.fsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.fsum .t{flex:1 1 200px;min-width:0}.fsum .btn{min-height:44px;padding:0 10px;color:var(--primary)}
.fp-pop,.fp-sheet,.fp-scrim{display:none}
.fp{background:var(--popover);color:var(--foreground)}
.fp-pop{position:absolute;top:46px;right:0;width:min(400px,100%);z-index:5;border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:0 10px 30px rgb(0 0 0/.5);overflow:hidden}
.fp-sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;max-height:88%;flex-direction:column;border-top:1px solid var(--border);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:0 -10px 30px rgb(0 0 0/.5)}
.fp-scrim{position:absolute;inset:0;z-index:6;background:color-mix(in oklch,var(--background) 70%,transparent)}
.fp-sheet{display:flex}.fp-scrim{display:block}
@container main (min-width:560px){.fp-pop{display:block}.fp-sheet,.fp-scrim{display:none}}
.fp .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 16px;border-bottom:1px solid var(--border);font-weight:600}
.fp .grip{width:36px;height:4px;border-radius:999px;background:var(--border);margin:8px auto 0}
.fp .bd{overflow:hidden;padding:4px 16px}
.fp .ft{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);justify-content:space-between}
.fp .ft .btn{flex:1}
.fg1{padding:8px 0;border-bottom:1px solid var(--border)}.fg1:last-child{border-bottom:0}
.fg1 h4{font-size:12px;font-weight:600;color:var(--muted-foreground);margin:2px 0}
.fo{display:flex;align-items:center;gap:10px;min-height:44px}
.fb{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--muted-foreground);display:grid;place-items:center;flex:none;color:var(--primary-foreground)}
.fb.r{border-radius:999px}
.fb.on{background:var(--primary);box-shadow:none}
.fb.r.on{background:transparent;box-shadow:inset 0 0 0 5px var(--primary)}
.prop{border:1px dashed var(--yellow-muted);border-radius:var(--radius-lg);padding:4px 10px 6px;margin:10px 0}
.prop .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--primary);background:var(--yellow-subtle);border-radius:var(--radius-sm);padding:1px 6px;margin:6px 0 0}
.fsel{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--input);margin:4px 0}
.cnt{text-align:center;font-size:12px}
.ghostlist{margin-top:12px;opacity:.7}
.av{width:32px;height:32px;border-radius:999px;background:var(--yellow-subtle);color:var(--avatar-text);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.sn .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sn .nm{font-weight:500}
.disc{display:inline-flex;align-items:center;gap:4px;color:var(--primary);min-height:44px;font-size:12px;font-weight:500}
.ev{padding:8px 10px;border-left:2px solid var(--border);color:var(--muted-foreground);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--foreground)}
.dot.hollow{background:transparent;box-shadow:inset 0 0 0 2px var(--muted-foreground)}
.menu{border:1px solid var(--border);background:var(--popover);border-radius:var(--radius-lg);padding:4px;box-shadow:0 10px 30px rgb(0 0 0/.5)}
.menu div{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--radius-md)}
.menu div.f{background:var(--accent)}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 2px 14px;border:1px solid var(--border);background:var(--popover);border-radius:var(--radius-lg);box-shadow:0 10px 30px rgb(0 0 0/.5)}
.anno{font-size:11px;color:var(--muted-foreground);border:1px dashed var(--border);border-radius:var(--radius-md);padding:4px 8px;margin:0 16px 8px}

/* ===== sources (ADMIN) ===== */
.srcs{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--card)}
.sumrow{display:flex;flex-wrap:wrap;align-items:center;column-gap:10px;min-height:48px;padding:4px 14px 0;list-style:none;cursor:pointer}
.srcs[open]>.sumrow{border-bottom:1px solid var(--border)}
.s1{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.s1:last-child{border-bottom:0}
.s1 .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.s1 .top .nm{font-weight:600;flex:1;min-width:80px}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--radius-md);font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{box-shadow:inset 0 0 0 1px var(--border)}
.st.off{background:var(--secondary);color:var(--foreground)} /* muted-foreground on secondary = 4.23:1, below AA — so foreground */
.st.pause{background:var(--yellow-subtle);color:var(--primary);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--primary) 35%,transparent)}
.st.block{box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--destructive) 60%,transparent);color:var(--destructive)}
.sw{width:44px;height:44px;display:grid;place-items:center;flex:none}
.sw i{width:36px;height:20px;border-radius:999px;background:var(--secondary);position:relative;box-shadow:inset 0 0 0 1px var(--border)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--muted-foreground)}
.sw.on i{background:var(--primary)}.sw.on i::after{left:18px;background:var(--primary-foreground)}
.quota{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--secondary);gap:1px}
.quota .u{background:var(--primary)}
.quota .r{background:var(--yellow-muted);opacity:.6}
.quota .q{background:repeating-linear-gradient(45deg,var(--muted-foreground) 0 2px,transparent 2px 5px)}
.qkey{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.qkey .k{display:inline-flex;align-items:center;gap:5px}.qkey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dl{display:grid;grid-template-columns:1fr;gap:6px 24px;font-size:12px}
@container main (min-width:560px){.dl{grid-template-columns:repeat(3,1fr)}}
.dl dt{color:var(--muted-foreground)}.dl dd{margin:0 0 2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q=new URLSearchParams(location.search);
const LANG=Q.get('lang')||'uk';

function ageHtml(r){
  const [k,u,n]=r.age;
  let s=k==='posted'?`<span class="i">${tr('posted',{ago:ago(u,n)})}</span>`
   :`<span class="i">${ic('caloff',13)}<span>${tr('unknownDate')} · ${tr('firstSeen',{ago:ago(u,n)})}</span></span>`;
  if(r.lastSeen)s+=`<span class="i">${tr('lastSeen',{ago:ago(r.lastSeen[0],r.lastSeen[1])})}</span>`;

function listScreenBase(st,admin){

  const scope=isAdmin||st==='adminmenu'?tr('hideScopeA'):tr('hideScopeT');
  const menu=st==='hidemenu'?`<div class="menu" role="menu"><div class="muted" style="padding:8px 10px 4px;font-size:12px">${tr('hideScopeT')}</div><div class="f" role="menuitem">${tr('r1')}</div><div role="menuitem">${tr('r2')}</div><div role="menuitem">${tr('r3')}</div></div>`:
    st==='adminmenu'?`<div class="menu" role="menu" style="margin-left:auto;width:min(280px,100%)"><div class="muted" style="padding:8px 10px 4px;font-size:12px">${scope}</div><div class="f" role="menuitem">${tr('suppress')}</div>${r.triage?`<div role="menuitem">${tr('triageAdmin')}</div>`:''}</div>`:'';
  const toast=st==='toast'?`<div class="toast" role="status"><span>${tr('hidden')}</span><button class="btn ghost fg">${ic('undo',16)}${tr('undo')}</button></div>`:'';
  const avail=st==='closed'?`<span class="st block">${ic('warn',12)}${tr('closed')}</span>`:'';
  return `<div class="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="t">
   <div class="dh"><div class="t"><div class="line1">${r.triage?`<span class="bdg tri">${ic('help',13)}${tr('triage')}</span>`:''}${senStr(r)}${avail}</div><h2 id="t">${r.t}</h2><div class="co" style="white-space:normal;overflow-wrap:anywhere">${co(r)}</div><div class="meta">${meta}</div></div><button class="btn ghost ic" aria-label="${tr('close')}">${ic('x',20)}</button></div>
   <div class="db">${warn.join('')}${seniors}${desc}${sources}${stack}</div>
   <div class="anno">sticky footer in product · rendered unrolled here</div>
   <div class="df">${foot}</div>${menu?`<div style="padding:0 16px 12px">${menu}</div>`:''}${toast?`<div style="padding:0 16px 12px">${toast}</div>`:''}
  </div></div>`;
}
function dialogsScreen(){
  const nm=(uk,en)=>LANG==='uk'?uk:en;
  const dlg=(t,p,yes,no,dest)=>`<div class="dlg" style="max-width:420px;border:1px solid var(--border);border-radius:var(--radius-xl);padding:16px;gap:8px;margin:12px auto" role="alertdialog"><b style="font-size:16px">${t}</b><div class="muted">${p}</div><div class="muted" style="font-size:12px">${tr('r1')} · ${tr('r2')} · ${tr('r3')}</div><div style="display:flex;gap:8px;flex-direction:column;margin-top:8px"><button class="btn ${dest?'dest':'out'}" style="${dest?'background:var(--destructive);color:var(--foreground)':''}">${yes}</button><button class="btn pri" data-initial-focus>${no}</button></div></div>`;
  return `<div class="scrim" style="padding:12px 0">${dlg(tr('suppT'),tr('suppP'),tr('suppYes'),tr('keep'),true)}${dlg(tr('cancSubT'),tr('cancSubP',{who:nm('Іван Петренко','Ivan Petrenko')}),tr('cancSubYes'),tr('cancSubNo'),true)}
   <div style="padding:0 16px 12px;display:flex;flex-direction:column;gap:8px">
    <div class="toast" role="status"><span>${tr('subOk',{who:nm('Олена Ковальчук','Olena Kovalchuk')})}</span></div>
    <div class="note bad" role="alert">${ic('warn',18)}<div class="tx"><b>${tr('subFail')}</b></div></div>
    <div class="note bad" role="alert">${ic('refresh',18)}<div class="tx"><b>${tr('conflict')}</b></div></div>
    <div class="note bad" role="alert">${ic('lock',18)}<div class="tx"><b>${tr('noAccess')}</b></div></div>
    <div class="muted" style="font-size:12px" aria-live="polite">${tr('loadedMore',{n:20,a:40,b:87})}</div></div></div>`;
}
function sourcesScreen(){return `<div class="main"><div class="page"><div class="h1row"><h1>${tr('s_title')}</h1></div>${sourcesBlock(true)}</div></div>`}

/* ---------- mount ---------- */
const frame=(w,html,raw,h)=>`<div class="frame" id="frame" style="--w:${w}px${h?';height:'+h+'px;overflow:hidden':''}">${raw?html:shell(html)}</div>`;
function render(){
  const s=Q.get('s'),w=+Q.get('w')||1440,st=Q.get('st')||'default',admin=Q.get('admin')||'0';
  document.documentElement.lang=LANG;
  const app=document.getElementById('app');
  if(s){
    const fh=String(st).startsWith('fopen')?(w<560?(st==='fopen2'?980:720):1620):0;
    app.innerHTML=fh&&s==='list'?frame(w,listScreen(st,admin),false,fh):s==='dialogs'?frame(w,dialogsScreen(),true):s==='card'?frame(w,cardScreen(st),true):frame(w,s==='list'?listScreen(st,admin):sourcesScreen());
    return;
  }
  const sec=(t,c,items)=>`<section><h2>${t}</h2><div class="cap">${c}</div><div class="row-of">${items}</div></section>`;
  const fr=(w,html,label,raw,h)=>`<div><div class="cap">${label} · ${w}</div>${frame(w,html,raw,h)}</div>`;
  const W=[320,768,1024,1440];
  app.innerHTML=`<div class="board">
   <section><h2>Черга вакансій / Vacancy queue — design reference</h2><div class="cap">Hand-authored (design-gate: degraded). Dark theme only. Language: <a href="?lang=${LANG==='uk'?'en':'uk'}" style="color:var(--primary)">${LANG==='uk'?'switch to English':'перемкнути на українську'}</a>. Isolated frames: ?s=list|card|sources &amp; w= &amp; st= &amp; lang=</div></section>
   ${sec('List — default × 4 classes','HR, one team. Infinite scroll: quiet «Показати ще» button is the keyboard/AT path; the scroll sentinel auto-triggers the same action',W.map(w=>fr(w,listScreen('default','0'),'default')).join(''))}
   ${sec('List — infinite-scroll states','appending · end of list · error while appending (rows kept) · first load',['appending','end','appenderr','loading'].map(x=>fr(320,listScreen(x,'0'),x)).join(''))}
   ${sec('List — states at 320','empty · error · refresh prompt · partial sources · no team',['empty','error','refresh','partial','noteam'].map(x=>fr(320,listScreen(x,'0'),x)).join(''))}
   ${sec('List — states at 768 / 1024 / 1440','',['empty','loading','error'].map((x,i)=>fr([768,1024,1440][i],listScreen(x,'0'),x)).join(''))}
   ${sec('Filters — toolbar without / with filters applied','badge = number of applied filter groups; summary line + «Скинути»',[fr(320,listScreen('default','0'),'no filters'),fr(320,listScreen('filtered','0'),'applied'),fr(1440,listScreen('filtered','0'),'applied')].join(''))}
   ${sec('Filters — open panel (Sheet <560, Popover ≥560)','specified filters; the dashed blocks marked PROPOSAL are NOT specified yet',[fr(320,listScreen('fopen','0'),'sheet · specified',false,720),fr(320,listScreen('fopen2','0'),'sheet · scrolled to proposals',false,980),fr(1440,listScreen('fopen','0'),'popover',false,1620)].join(''))}
   ${sec('Filters — filtered to nothing','reads differently from an empty queue',[fr(320,listScreen('filterednone','0'),'filtered-none'),fr(1440,listScreen('filterednone','0'),'filtered-none')].join(''))}
   ${sec('List — appending / end / error at 1440','',['appending','end','appenderr'].map(x=>fr(1440,listScreen(x,'0'),x)).join(''))}
   ${sec('List — in progress / hidden / multi-team / ADMIN','',[fr(320,listScreen('wip','0'),'Подані tab (own team only)'),fr(320,listScreen('hidden','0'),'hidden'),fr(320,listScreen('multi','0'),'multi-team'),fr(768,listScreen('default','1'),'ADMIN (sources collapsed)')].join(''))}
   ${sec('Card — 320 full-screen','per-senior working surface; no vacancy-level state exists',['default','submitting','dup','dupconfirm','stopall','triage','zero','unknown','updated','stale','closed','long','hidemenu','adminmenu','toast','admin'].map(x=>fr(320,cardScreen(x),x,true)).join(''))}
   ${sec('Card — 768 / 1440 dialog','',[fr(768,cardScreen('default'),'default',true),fr(1440,cardScreen('default'),'default',true)].join(''))}
   ${sec('Dialogs, toasts and error texts','AlertDialogs (suppress, cancel submission), submit toast, submit failure, 409 conflict, no access, live-region sentence',[320,768].map(w=>fr(w,dialogsScreen(),'dialogs',true)).join(''))}
   ${sec('ADMIN sources block','',[320,768,1440].map(w=>fr(w,sourcesScreen(),'sources')).join(''))}
  </div>`;
}
render();
</script>
</body>
</html>
