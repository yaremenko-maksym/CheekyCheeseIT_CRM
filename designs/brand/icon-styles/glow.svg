<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT — glow</title>
  <defs>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="lit" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <!-- outer halo -->
  <path d="M 112 112 L 422 215 A 18 18 0 0 1 432 233 L 432 402 A 18 18 0 0 1 414 416 L 110 416 A 18 18 0 0 1 96 398 L 96 124 A 18 18 0 0 1 112 112 Z" fill="#FFC300" opacity="0.5" filter="url(#halo)"/>
  <!-- wedge -->
  <path d="M 112 112 L 422 215 A 18 18 0 0 1 432 233 L 432 402 A 18 18 0 0 1 414 416 L 110 416 A 18 18 0 0 1 96 398 L 96 124 A 18 18 0 0 1 112 112 Z" fill="#FFC300"/>

  <!-- dark holes with lit rims -->
  <g>
    <circle cx="192" cy="216" r="22" fill="#0d1117"/>
    <circle cx="240" cy="272" r="30" fill="#0d1117"/>
    <circle cx="192" cy="328" r="22" fill="#0d1117"/>
    <circle cx="320" cy="236" r="14" fill="#0d1117"/>
    <circle cx="388" cy="376" r="12" fill="#0d1117"/>
  </g>
  <g fill="none" stroke="#FFE07A" stroke-width="3" opacity="0.85" filter="url(#lit)">
    <circle cx="192" cy="216" r="22"/>
    <circle cx="240" cy="272" r="30"/>
    <circle cx="192" cy="328" r="22"/>
    <circle cx="320" cy="236" r="14"/>
    <circle cx="388" cy="376" r="12"/>
  </g>

  <!-- glowing active cursor -->
  <rect x="296" y="312" width="80" height="28" rx="10" fill="#FFE07A" filter="url(#halo)" opacity="0.7"/>
  <rect x="296" y="312" width="80" height="28" rx="10" fill="#FFF1B8"/>
</svg>
