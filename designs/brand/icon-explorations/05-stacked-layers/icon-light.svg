<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT — Stacked Layers (light)">
  <title>CheekyCheeseIT — Stacked Layers (light)</title>

  <defs>
    <linearGradient id="topSlabFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCE1F"/>
      <stop offset="1" stop-color="#FFC300"/>
    </linearGradient>
    <linearGradient id="midSlabFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2AC0A"/>
      <stop offset="1" stop-color="#D9A300"/>
    </linearGradient>
    <linearGradient id="lowSlabFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87E07"/>
      <stop offset="1" stop-color="#8E6A05"/>
    </linearGradient>
    <linearGradient id="baseSlabFillL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3D14"/>
      <stop offset="1" stop-color="#3A2F0E"/>
    </linearGradient>

    <radialGradient id="groundShadowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F1F1F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1F1F1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft grounding shadow tuned for light backgrounds -->
  <ellipse cx="256" cy="446" rx="180" ry="14" fill="url(#groundShadowL)"/>

  <!-- LAYER 4 — deepest. Strong outline reads well on light bg. -->
  <g>
    <rect x="68" y="362" width="376" height="56" rx="14" ry="14"
          fill="url(#baseSlabFillL)" stroke="#141414" stroke-width="2"/>
    <rect x="68" y="362" width="376" height="3" rx="1.5" ry="1.5"
          fill="#5A4A18" opacity="0.7"/>
  </g>

  <!-- LAYER 3 — stronger contour for crisp definition on white -->
  <g>
    <rect x="84" y="290" width="352" height="56" rx="14" ry="14"
          fill="url(#lowSlabFillL)" stroke="#141414" stroke-width="2"/>
    <rect x="84" y="290" width="352" height="3" rx="1.5" ry="1.5"
          fill="#C2911D" opacity="0.55"/>
  </g>

  <!-- LAYER 2 — muted yellow with dark stroke (critical on white) -->
  <g>
    <rect x="92" y="218" width="336" height="56" rx="14" ry="14"
          fill="url(#midSlabFillL)" stroke="#141414" stroke-width="2"/>
    <rect x="92" y="218" width="336" height="3" rx="1.5" ry="1.5"
          fill="#F2C235" opacity="0.6"/>
  </g>

  <!-- LAYER 1 — bright top. Without dark stroke it would blend into white. -->
  <g>
    <rect x="106" y="146" width="308" height="56" rx="14" ry="14"
          fill="url(#topSlabFillL)" stroke="#141414" stroke-width="2"/>
    <rect x="106" y="146" width="308" height="3" rx="1.5" ry="1.5"
          fill="#FFE07A" opacity="0.85"/>

    <!-- Signature hole -->
    <circle cx="362" cy="178" r="6" fill="#3A2F0E" opacity="0.85"/>
  </g>
</svg>
