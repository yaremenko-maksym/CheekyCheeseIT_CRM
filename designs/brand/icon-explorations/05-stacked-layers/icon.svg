<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT — Stacked Layers">
  <title>CheekyCheeseIT — Stacked Layers</title>

  <defs>
    <!-- Subtle highlight on the top face of each slab to suggest extruded depth -->
    <linearGradient id="topSlabFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCE1F"/>
      <stop offset="1" stop-color="#FFC300"/>
    </linearGradient>
    <linearGradient id="midSlabFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2AC0A"/>
      <stop offset="1" stop-color="#D9A300"/>
    </linearGradient>
    <linearGradient id="lowSlabFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A87E07"/>
      <stop offset="1" stop-color="#8E6A05"/>
    </linearGradient>
    <linearGradient id="baseSlabFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3D14"/>
      <stop offset="1" stop-color="#3A2F0E"/>
    </linearGradient>

    <!-- Soft shadow under the whole stack for grounding -->
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="446" rx="180" ry="14" fill="url(#groundShadow)"/>

  <!-- Stack: bottom-up, each slab slightly offset for a "deck of cards" feel.
       Side-elevation view, CAD-precise alignment.
       Slab height = 56, rounded corners 14 (proportional to 24-32 of 512 viewBox guidance,
       but tuned tighter for the architectural feel). -->

  <!-- LAYER 4 — deepest shadow / foundation. Widest. -->
  <g>
    <rect x="68" y="362" width="376" height="56" rx="14" ry="14"
          fill="url(#baseSlabFill)" stroke="#241D08" stroke-width="1.5"/>
    <!-- Thin top edge highlight to read as a 3D plane -->
    <rect x="68" y="362" width="376" height="3" rx="1.5" ry="1.5"
          fill="#5A4A18" opacity="0.7"/>
  </g>

  <!-- LAYER 3 — lower mid. Slight inset from base. -->
  <g>
    <rect x="84" y="290" width="352" height="56" rx="14" ry="14"
          fill="url(#lowSlabFill)" stroke="#6B5104" stroke-width="1.5"/>
    <rect x="84" y="290" width="352" height="3" rx="1.5" ry="1.5"
          fill="#C2911D" opacity="0.55"/>
  </g>

  <!-- LAYER 2 — upper mid. Muted yellow. -->
  <g>
    <rect x="92" y="218" width="336" height="56" rx="14" ry="14"
          fill="url(#midSlabFill)" stroke="#A87E07" stroke-width="1.5"/>
    <rect x="92" y="218" width="336" height="3" rx="1.5" ry="1.5"
          fill="#F2C235" opacity="0.6"/>
  </g>

  <!-- LAYER 1 — top slab, brightest. Narrowest. The "headline" yellow. -->
  <g>
    <rect x="106" y="146" width="308" height="56" rx="14" ry="14"
          fill="url(#topSlabFill)" stroke="#D9A300" stroke-width="1.5"/>
    <rect x="106" y="146" width="308" height="3" rx="1.5" ry="1.5"
          fill="#FFE07A" opacity="0.85"/>

    <!-- Signature: ONE small cheese hole on the top slab. Restraint. -->
    <circle cx="362" cy="178" r="6" fill="#B57F00" opacity="0.85"/>
    <circle cx="362" cy="177" r="6" fill="none" stroke="#7A5500" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>
