<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <!-- Favicon: 3 slabs only. No holes. Thicker proportions for legibility at 16-32px.
       Pure side-elevation. Slab height 6, rounded corners 2.
       Stack centered vertically with 1px gaps between slabs. -->

  <!-- LAYER 3 — deepest, widest base -->
  <rect x="3"  y="22" width="26" height="6" rx="2" ry="2" fill="#3A2F0E"/>

  <!-- LAYER 2 — muted yellow mid -->
  <rect x="4"  y="15" width="24" height="6" rx="2" ry="2" fill="#D9A300"/>

  <!-- LAYER 1 — bright top, narrowest -->
  <rect x="5"  y="8"  width="22" height="6" rx="2" ry="2" fill="#FFC300"/>
</svg>
