<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CheekyCheeseIT monogram (light)">
  <!-- Light surface — warm off-white with subtle rounded corners.
       For light backgrounds we use the darker amber as primary so the mark holds weight. -->
  <rect width="512" height="512" rx="96" fill="#F7F7F7"/>

  <g transform="rotate(-5 256 256)">

    <!-- OUTER C — darker amber as primary for contrast on light. -->
    <path
      d="M 396 142
         C 360 102 310 78 256 78
         C 158 78 78 158 78 256
         C 78 354 158 434 256 434
         C 310 434 360 410 396 370"
      stroke="#D9A300"
      stroke-width="64"
      stroke-linecap="butt"
      fill="none"/>

    <!-- SMIRK — lower terminal curling up. -->
    <path
      d="M 396 370
         C 392 386 396 408 408 422
         C 416 432 410 444 396 442
         C 372 438 348 422 326 396
         L 366 354
         C 376 360 388 366 396 370 Z"
      fill="#D9A300"/>

    <!-- UPPER terminal cap. -->
    <path
      d="M 364 110
         L 396 142
         L 380 174
         L 348 142 Z"
      fill="#D9A300"/>

    <!-- Warm dark-amber under-shadow — depth without going muddy on light. -->
    <path
      d="M 178 410
         C 218 428 248 434 274 434
         C 320 433 366 416 396 388
         L 396 370
         C 358 404 312 422 268 422
         C 232 422 200 416 178 410 Z"
      fill="#3A2F0E"
      opacity="0.35"/>

    <!-- INNER C — bright yellow now (inversion vs dark variant) so the two letters separate. -->
    <path
      d="M 326 220
         C 314 204 296 194 274 194
         C 240 194 212 222 212 256
         C 212 290 240 318 274 318
         C 296 318 314 308 326 292"
      stroke="#FFC300"
      stroke-width="38"
      stroke-linecap="butt"
      fill="none"/>

    <path
      d="M 308 196
         L 326 220
         L 312 240
         L 294 216 Z"
      fill="#FFC300"/>

    <path
      d="M 308 316
         L 326 292
         L 312 272
         L 294 296 Z"
      fill="#FFC300"/>

    <!-- WINK DOT — dark amber on light, sits above inner C. -->
    <ellipse
      cx="350"
      cy="184"
      rx="15"
      ry="11"
      fill="#3A2F0E"
      transform="rotate(-15 350 184)"/>

    <!-- Cheese-hole punch — light surface color so it reads as a true hole. -->
    <circle cx="108" cy="296" r="9" fill="#F7F7F7"/>

  </g>
</svg>
