<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CheekyCheeseIT monogram">
  <!-- Dark surface (production reference background). Rounded ~10px scaled to 512. -->
  <rect width="512" height="512" rx="96" fill="#141414"/>

  <!--
    Composition:
    - 5deg forward lean for "cheeky" attitude.
    - Outer C: heavy geometric arc with stroke ~64px. Lower terminal HOOKS UPWARD = smirk.
    - Inner C: smaller, nested, darker amber (#D9A300). Forms the second C of the CC monogram.
    - Wink dot: integrated above the inner C's upper terminal.
    - Single cheese-hole punch inside the outer C — restraint, not novelty-emoji.
  -->

  <g transform="rotate(-5 256 256)">

    <!-- OUTER C — heavy geometric stroke, opens right.
         Stroke approach lets the linecap give us crisp terminal control. -->
    <path
      d="M 396 142
         C 360 102 310 78 256 78
         C 158 78 78 158 78 256
         C 78 354 158 434 256 434
         C 310 434 360 410 396 370"
      stroke="#FFC300"
      stroke-width="64"
      stroke-linecap="butt"
      fill="none"/>

    <!-- SMIRK — the lower terminal of the outer C curls UP and forward.
         This is the moment-of-recognition gesture. -->
    <path
      d="M 396 370
         C 392 386 396 408 408 422
         C 416 432 410 444 396 442
         C 372 438 348 422 326 396
         L 366 354
         C 376 360 388 366 396 370 Z"
      fill="#FFC300"/>

    <!-- Cap the outer C's UPPER terminal flat-faced for geometric crispness
         (counterbalances the curling smirk below). -->
    <path
      d="M 364 110
         L 396 142
         L 380 174
         L 348 142 Z"
      fill="#FFC300"/>

    <!-- Soft warm shadow under the outer C base — depth at the cheese-y bottom. -->
    <path
      d="M 178 410
         C 218 428 248 434 274 434
         C 320 433 366 416 396 388
         L 396 370
         C 358 404 312 422 268 422
         C 232 422 200 416 178 410 Z"
      fill="#D9A300"
      opacity="0.7"/>

    <!-- INNER C — smaller, darker amber, opens right.
         Sits inside the mouth of the outer C. -->
    <path
      d="M 326 220
         C 314 204 296 194 274 194
         C 240 194 212 222 212 256
         C 212 290 240 318 274 318
         C 296 318 314 308 326 292"
      stroke="#D9A300"
      stroke-width="38"
      stroke-linecap="butt"
      fill="none"/>

    <!-- INNER C upper terminal — squared cap for geometric edge. -->
    <path
      d="M 308 196
         L 326 220
         L 312 240
         L 294 216 Z"
      fill="#D9A300"/>

    <!-- INNER C lower terminal — squared cap. -->
    <path
      d="M 308 316
         L 326 292
         L 312 272
         L 294 296 Z"
      fill="#D9A300"/>

    <!-- WINK DOT — the "eye".
         Sits above the inner C's upper terminal, tilted ~12deg for a half-closed wink feel. -->
    <ellipse
      cx="350"
      cy="184"
      rx="15"
      ry="11"
      fill="#FFC300"
      transform="rotate(-15 350 184)"/>

    <!-- Single cheese-hole punch on the outer C body — left side, restrained. -->
    <circle cx="108" cy="296" r="9" fill="#141414"/>

  </g>
</svg>
