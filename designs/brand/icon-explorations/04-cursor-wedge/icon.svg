<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT cursor-wedge mark">
  <title>CheekyCheeseIT</title>
  <desc>A terminal block-cursor sliced as a cheese wedge — three holes, split-tone blink afterimage.</desc>

  <defs>
    <!-- Split-tone fill: top half punchy yellow, bottom half muted (blink afterimage) -->
    <linearGradient id="wedgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFC300"/>
      <stop offset="0.52" stop-color="#FFC300"/>
      <stop offset="0.52" stop-color="#D9A300"/>
      <stop offset="1"    stop-color="#D9A300"/>
    </linearGradient>

    <!-- Subtle inner-rim warmth on the cut edge -->
    <linearGradient id="cutEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFC300" stop-opacity="0"/>
      <stop offset="1"    stop-color="#3A2F0E" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Outer glow halo: ~10% alpha radial -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFC300" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#FFC300" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#FFC300" stop-opacity="0"/>
    </radialGradient>

    <!-- Hole shadow: faint inset dot -->
    <radialGradient id="holeShade" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0"    stop-color="#141414" stop-opacity="1"/>
      <stop offset="0.7"  stop-color="#141414" stop-opacity="0.92"/>
      <stop offset="1"    stop-color="#3A2F0E" stop-opacity="0.65"/>
    </radialGradient>

    <!--
      Wedge silhouette: terminal block-cursor proportions (tall rectangle, ~10px rounded corners),
      sliced on the right edge with a 12-degree slant so it reads as a cheese wedge.
      Sits slightly off-center (left + up) to feel mid-blink.
    -->
    <clipPath id="wedgeClip">
      <path d="
        M 158 92
        Q 158 82 168 82
        L 332 82
        Q 342 82 344 92
        L 388 412
        Q 389.5 422 379.5 422
        L 168 422
        Q 158 422 158 412
        Z"/>
    </clipPath>
  </defs>

  <!-- Dark canvas reference (kept subtle — icon usable on transparent too) -->
  <rect width="512" height="512" rx="96" fill="#141414"/>

  <!-- Ambient halo behind the mark -->
  <circle cx="266" cy="252" r="220" fill="url(#halo)"/>

  <!-- Main wedge body -->
  <g clip-path="url(#wedgeClip)">
    <path d="
      M 158 92
      Q 158 82 168 82
      L 332 82
      Q 342 82 344 92
      L 388 412
      Q 389.5 422 379.5 422
      L 168 422
      Q 158 422 158 412
      Z"
      fill="url(#wedgeFill)">
      <!-- Optional cursor blink: gentle opacity pulse, terminal-cadence -->
      <animate attributeName="opacity"
               values="1;0.55;1"
               keyTimes="0;0.5;1"
               dur="1.1s"
               repeatCount="indefinite"/>
    </path>

    <!-- Inner warmth along the slanted cut edge (right side) -->
    <rect x="320" y="82" width="80" height="340" fill="url(#cutEdge)"/>

    <!-- Cheese holes — asymmetric scatter so the eye finds rhythm, not a grid -->
    <!-- Hole 1: large, upper-left quadrant -->
    <circle cx="220" cy="178" r="34" fill="url(#holeShade)"/>
    <!-- Hole 2: medium, lower-right, near the cut edge -->
    <circle cx="316" cy="320" r="26" fill="url(#holeShade)"/>
    <!-- Hole 3: small, middle, kissed with a domain accent (violet) — sparingly -->
    <circle cx="276" cy="246" r="14" fill="#141414"/>
    <circle cx="276" cy="246" r="14" fill="#a78bfa" opacity="0.18"/>
    <!-- Tiny hole 4: micro detail, bottom-left -->
    <circle cx="200" cy="356" r="9" fill="url(#holeShade)"/>
  </g>

  <!-- Top highlight band: 1px hairline of bright yellow along the top edge -->
  <path d="M 168 82 Q 158 82 158 92 L 158 106 L 344 106 L 344 92 Q 342 82 332 82 Z"
        fill="#FFC300" opacity="0.18"/>

  <!-- Bottom shadow band: deepens base, sells the cursor-block weight -->
  <path d="M 158 400 L 388.5 400 L 389.5 422 Q 389.5 422 379.5 422 L 168 422 Q 158 422 158 412 Z"
        fill="#3A2F0E" opacity="0.55"/>
</svg>
