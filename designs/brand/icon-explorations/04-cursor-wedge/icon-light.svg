<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT cursor-wedge mark (light)">
  <title>CheekyCheeseIT — light</title>
  <desc>Light-background variant: deeper, more saturated yellow with darker inset holes and an outlined wedge for contrast.</desc>

  <defs>
    <!-- On white, the bright #FFC300 vibrates; we anchor with the muted tone on top and rim the form. -->
    <linearGradient id="wedgeFillLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFC300"/>
      <stop offset="0.52" stop-color="#FFC300"/>
      <stop offset="0.52" stop-color="#D9A300"/>
      <stop offset="1"    stop-color="#D9A300"/>
    </linearGradient>

    <linearGradient id="cutEdgeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#3A2F0E" stop-opacity="0"/>
      <stop offset="1"    stop-color="#3A2F0E" stop-opacity="0.45"/>
    </linearGradient>

    <radialGradient id="holeShadeLight" cx="0.45" cy="0.4" r="0.75">
      <stop offset="0"    stop-color="#3A2F0E" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#3A2F0E" stop-opacity="0.95"/>
      <stop offset="1"    stop-color="#3A2F0E" stop-opacity="0.7"/>
    </radialGradient>

    <clipPath id="wedgeClipLight">
      <path d="
        M 158 92
        Q 158 82 168 82
        L 332 82
        Q 342 82 344 92
        L 388 412
        Q 389.5 422 379.5 422
        L 168 422
        Q 158 422 158 412
        Z"/>
    </clipPath>
  </defs>

  <!-- Light canvas reference -->
  <rect width="512" height="512" rx="96" fill="#F7F7F7"/>

  <!-- Wedge body -->
  <g clip-path="url(#wedgeClipLight)">
    <path d="
      M 158 92
      Q 158 82 168 82
      L 332 82
      Q 342 82 344 92
      L 388 412
      Q 389.5 422 379.5 422
      L 168 422
      Q 158 422 158 412
      Z"
      fill="url(#wedgeFillLight)">
      <animate attributeName="opacity"
               values="1;0.6;1"
               keyTimes="0;0.5;1"
               dur="1.1s"
               repeatCount="indefinite"/>
    </path>

    <!-- Cut-edge warmth -->
    <rect x="320" y="82" width="80" height="340" fill="url(#cutEdgeLight)"/>

    <!-- Holes — darker so they punch on yellow over white -->
    <circle cx="220" cy="178" r="34" fill="url(#holeShadeLight)"/>
    <circle cx="316" cy="320" r="26" fill="url(#holeShadeLight)"/>
    <circle cx="276" cy="246" r="14" fill="#3A2F0E"/>
    <circle cx="276" cy="246" r="14" fill="#a78bfa" opacity="0.22"/>
    <circle cx="200" cy="356" r="9" fill="url(#holeShadeLight)"/>
  </g>

  <!-- Outline rim: thin amber stroke gives the mark a printed-on-paper edge on light bg -->
  <path d="
    M 158 92
    Q 158 82 168 82
    L 332 82
    Q 342 82 344 92
    L 388 412
    Q 389.5 422 379.5 422
    L 168 422
    Q 158 422 158 412
    Z"
    fill="none" stroke="#3A2F0E" stroke-width="3" stroke-opacity="0.55"/>
</svg>
