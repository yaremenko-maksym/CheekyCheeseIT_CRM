<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <defs>
    <!-- Deeper amber for the light-bg variant: punchier on white/cream than #FFC300. -->
    <linearGradient id="wedgeFill" x1="80" y1="80" x2="448" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4B500"/>
      <stop offset="0.55" stop-color="#D9A300"/>
      <stop offset="1" stop-color="#B88800"/>
    </linearGradient>

    <linearGradient id="apexShine" x1="80" y1="80" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD75E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD75E" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="baseShadow" x1="256" y1="320" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2F0E" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2F0E" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <!-- Wedge silhouette + thin warm contour for legibility on light backgrounds. -->
  <path d="
    M 112 112
    L 422 215
    A 18 18 0 0 1 432 233
    L 432 402
    A 18 18 0 0 1 414 416
    L 110 416
    A 18 18 0 0 1 96 398
    L 96 124
    A 18 18 0 0 1 112 112
    Z
  " fill="url(#wedgeFill)" stroke="#3A2F0E" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>

  <!-- Apex highlight: warm shine, slightly more muted than the dark variant. -->
  <path d="
    M 112 112
    L 422 215
    A 18 18 0 0 1 430 226
    L 110 122
    A 18 18 0 0 1 112 112
    Z
  " fill="url(#apexShine)"/>

  <!-- Base shadow band -->
  <path d="
    M 96 398
    A 18 18 0 0 0 110 416
    L 414 416
    A 18 18 0 0 0 432 402
    L 432 233
    A 18 18 0 0 0 422 215
    L 96 398
    Z
  " fill="url(#baseShadow)" opacity="0.5"/>

  <!-- TERMINAL HOLES — same geometry as dark variant. -->

  <!-- Chevron top -->
  <g>
    <circle cx="192" cy="216" r="22" fill="#0d1117"/>
    <circle cx="192" cy="216" r="22" fill="none" stroke="#3A2F0E" stroke-opacity="0.7" stroke-width="2.5"/>
    <circle cx="185" cy="209" r="6" fill="#FFD75E" opacity="0.3"/>
  </g>

  <!-- Chevron vertex -->
  <g>
    <circle cx="240" cy="272" r="30" fill="#0d1117"/>
    <circle cx="240" cy="272" r="30" fill="none" stroke="#3A2F0E" stroke-opacity="0.7" stroke-width="2.5"/>
    <circle cx="232" cy="264" r="8" fill="#FFD75E" opacity="0.3"/>
  </g>

  <!-- Chevron bottom -->
  <g>
    <circle cx="192" cy="328" r="22" fill="#0d1117"/>
    <circle cx="192" cy="328" r="22" fill="none" stroke="#3A2F0E" stroke-opacity="0.7" stroke-width="2.5"/>
    <circle cx="185" cy="321" r="6" fill="#FFD75E" opacity="0.3"/>
  </g>

  <!-- Cursor block -->
  <g>
    <rect x="296" y="312" width="80" height="28" rx="10" ry="10" fill="#0d1117"/>
    <rect x="296" y="312" width="80" height="28" rx="10" ry="10" fill="none" stroke="#3A2F0E" stroke-opacity="0.7" stroke-width="2.5"/>
    <rect x="304" y="318" width="26" height="6" rx="3" fill="#FFD75E" opacity="0.28"/>
  </g>

  <!-- Ambient cheese holes -->
  <g>
    <circle cx="320" cy="236" r="14" fill="#0d1117"/>
    <circle cx="320" cy="236" r="14" fill="none" stroke="#3A2F0E" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="315" cy="231" r="4" fill="#FFD75E" opacity="0.26"/>
  </g>

  <g>
    <circle cx="388" cy="376" r="12" fill="#0d1117"/>
    <circle cx="388" cy="376" r="12" fill="none" stroke="#3A2F0E" stroke-opacity="0.65" stroke-width="2"/>
  </g>
</svg>
