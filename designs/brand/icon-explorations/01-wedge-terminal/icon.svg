<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <defs>
    <!-- Warm cheese gradient: top-left brighter, bottom-right slightly deeper. -->
    <linearGradient id="wedgeFill" x1="80" y1="80" x2="448" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD23A"/>
      <stop offset="0.5" stop-color="#FFC300"/>
      <stop offset="1" stop-color="#D9A300"/>
    </linearGradient>

    <!-- Inner highlight along apex / top edges. -->
    <linearGradient id="apexShine" x1="80" y1="80" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE685" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFE685" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner shadow along the base / right; gives the wedge weight. -->
    <linearGradient id="baseShadow" x1="256" y1="320" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2F0E" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2F0E" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!--
    WEDGE SILHOUETTE
    A confident triangular cheese slice. Apex top-left (the "tip" of the wedge),
    base spans bottom edge. The hypotenuse / top edge is the slanted "crust" of
    a slice cut from a wheel.

    Anchor points (designed on a 16px grid):
      Apex (top-left):        ( 96, 112)
      Top-right shoulder:     (432, 224)
      Bottom-right corner:    (432, 416)
      Bottom-left corner:     ( 96, 416)
    Corners rounded ~18px via tangent-line + arc construction.

    Path strategy: move just before each corner along the prior edge, then arc
    using "A" rx,ry 0 0 1 endX,endY to round the corner naturally.
  -->
  <path d="
    M 112 112
    L 422 215
    A 18 18 0 0 1 432 233
    L 432 402
    A 18 18 0 0 1 414 416
    L 110 416
    A 18 18 0 0 1 96 398
    L 96 124
    A 18 18 0 0 1 112 112
    Z
  " fill="url(#wedgeFill)"/>

  <!-- Apex highlight: warm shine along the upper-left edges. -->
  <path d="
    M 112 112
    L 422 215
    A 18 18 0 0 1 430 226
    L 110 122
    A 18 18 0 0 1 112 112
    Z
  " fill="url(#apexShine)"/>

  <!-- Base shadow: gives the wedge mass; subtle gradient on the lower-right. -->
  <path d="
    M 96 398
    A 18 18 0 0 0 110 416
    L 414 416
    A 18 18 0 0 0 432 402
    L 432 233
    A 18 18 0 0 0 422 215
    L 96 398
    Z
  " fill="url(#baseShadow)" opacity="0.55"/>

  <!--
    TERMINAL HOLES — `>` chevron + cursor block + 2 ambient cheese holes.
    Hole anatomy: dark fill (#0d1117 terminal black) + warm rim (#3A2F0E)
    + tiny inner highlight to suggest depth, not flatness.
  -->

  <!-- Chevron — the `>` of `>_` -->
  <!-- Top arm dot -->
  <g>
    <circle cx="192" cy="216" r="22" fill="#0d1117"/>
    <circle cx="192" cy="216" r="22" fill="none" stroke="#3A2F0E" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="185" cy="209" r="6" fill="#FFE685" opacity="0.32"/>
  </g>

  <!-- Vertex (largest) -->
  <g>
    <circle cx="240" cy="272" r="30" fill="#0d1117"/>
    <circle cx="240" cy="272" r="30" fill="none" stroke="#3A2F0E" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="232" cy="264" r="8" fill="#FFE685" opacity="0.32"/>
  </g>

  <!-- Bottom arm dot -->
  <g>
    <circle cx="192" cy="328" r="22" fill="#0d1117"/>
    <circle cx="192" cy="328" r="22" fill="none" stroke="#3A2F0E" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="185" cy="321" r="6" fill="#FFE685" opacity="0.32"/>
  </g>

  <!-- Cursor block — the `_` / blinking cursor sitting on the prompt baseline. -->
  <g>
    <rect x="296" y="312" width="80" height="28" rx="10" ry="10" fill="#0d1117"/>
    <rect x="296" y="312" width="80" height="28" rx="10" ry="10" fill="none" stroke="#3A2F0E" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="304" y="318" width="26" height="6" rx="3" fill="#FFE685" opacity="0.3"/>
  </g>

  <!-- Two ambient cheese holes — off the prompt axis, smaller. -->
  <g>
    <circle cx="320" cy="236" r="14" fill="#0d1117"/>
    <circle cx="320" cy="236" r="14" fill="none" stroke="#3A2F0E" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="315" cy="231" r="4" fill="#FFE685" opacity="0.28"/>
  </g>

  <g>
    <circle cx="388" cy="376" r="12" fill="#0d1117"/>
    <circle cx="388" cy="376" r="12" fill="none" stroke="#3A2F0E" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
