<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <!--
    Favicon variant. Designed pixel-aware on a 32px grid.
    Strategy:
      • Solid fill (no gradients) — gradients turn to muddy bands at 16-32px.
      • Outline removed; punchy yellow stands on its own.
      • Hole count reduced to 3: two chevron dots + one cursor block.
        At 32px the eye reads "wedge with terminal pixels" instantly,
        any more would visually clog.
      • Corner rounding scaled to ~1px (was 18px on 512).
      • Coordinates snap to whole pixels — no half-pixel blur.
  -->

  <!-- Wedge silhouette. Apex top-left, base spans bottom. -->
  <path d="
    M 8 7
    L 26 13
    A 1.5 1.5 0 0 1 27 14.5
    L 27 25
    A 1.5 1.5 0 0 1 25.5 26
    L 6.5 26
    A 1.5 1.5 0 0 1 5 24.5
    L 5 8.5
    A 1.5 1.5 0 0 1 6.5 7
    Z
  " fill="#FFC300"/>

  <!-- A tiny lower-right base shadow gives the wedge mass at this scale. -->
  <path d="
    M 5 24.5
    A 1.5 1.5 0 0 0 6.5 26
    L 25.5 26
    A 1.5 1.5 0 0 0 27 24.5
    L 27 14.5
    Z
  " fill="#D9A300" opacity="0.45"/>

  <!-- Chevron-of-two holes (suggests `>` prompt at small sizes). -->
  <circle cx="11" cy="14" r="1.8" fill="#0d1117"/>
  <circle cx="14" cy="18" r="2.2" fill="#0d1117"/>

  <!-- Cursor block — the `_` of the prompt. Rounded rect, the focal element. -->
  <rect x="18" y="20" width="6" height="2.6" rx="1" fill="#0d1117"/>
</svg>
