<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CheekyCheeseIT bracket cheese mark (light background)">
  <title>CheekyCheeseIT</title>

  <!-- Light stage: warm off-white so the yellow doesn't go murky next to pure #fff.
       Subtle inner shadow on a separate rect would distract; rely on the deep-amber
       hole color to do the work. -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#F7F7F7"/>

  <defs>
    <!-- On light bg, brackets stay #FFC300 → #D9A300 for depth. -->
    <linearGradient id="cheeseFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC300"/>
      <stop offset="1" stop-color="#D9A300"/>
    </linearGradient>

    <!-- Bevel layer: stronger on light bg so the bracket gets a chiseled feel
         against the warm-white field. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2F0E" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#3A2F0E" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Light-bg hole strategy: holes are filled with deep warm-amber #3A2F0E,
         NOT punched to background. Punching to #F7F7F7 would erase the cheese
         metaphor. Dark holes against yellow = unmistakable cheese. -->

    <path id="leftBracket"
          d="M 196 96
             L 84 256
             L 196 416
             L 240 416
             L 152 290
             L 240 290
             L 240 222
             L 152 222
             L 240 96
             Z"/>

    <path id="rightBracket"
          d="M 316 96
             L 428 256
             L 316 416
             L 272 416
             L 360 290
             L 272 290
             L 272 222
             L 360 222
             L 272 96
             Z"/>
  </defs>

  <!-- Brackets -->
  <use href="#leftBracket" fill="url(#cheeseFill)"/>
  <use href="#leftBracket" fill="url(#bevel)"/>

  <use href="#rightBracket" fill="url(#cheeseFill)"/>
  <use href="#rightBracket" fill="url(#bevel)"/>

  <!-- Cheese holes painted on top in deep warm-amber (consistent with the bevel),
       so they read as drilled pockets rather than punch-throughs. -->
  <g fill="#3A2F0E">
    <!-- Left bracket holes: 3-2-1 hierarchy along the bracket arm -->
    <circle cx="138" cy="196" r="22"/>
    <circle cx="118" cy="262" r="14"/>
    <circle cx="152" cy="320" r="9"/>

    <!-- Right bracket holes -->
    <circle cx="374" cy="208" r="18"/>
    <circle cx="394" cy="280" r="26"/>
    <circle cx="360" cy="338" r="11"/>
  </g>

  <!-- Center "I" cursor bar -->
  <rect x="248" y="176" width="16" height="160" rx="8" ry="8" fill="#FFC300"/>
  <circle cx="256" cy="256" r="4" fill="#3A2F0E"/>
</svg>
