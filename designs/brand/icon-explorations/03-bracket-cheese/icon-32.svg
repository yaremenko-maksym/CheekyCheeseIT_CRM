<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <!-- Tight rounded square, smaller radius to keep the silhouette tough at 32px -->
  <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="#141414"/>

  <defs>
    <!-- Mask for the two strategic cheese holes — one per bracket.
         At 32px, anything more than one hole per side turns to mud. -->
    <mask id="holes32" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="white"/>
      <circle cx="9.5" cy="13" r="1.6" fill="black"/>
      <circle cx="22.5" cy="19" r="1.9" fill="black"/>
    </mask>
  </defs>

  <!-- Brackets simplified: chunky chevrons without the inner notch detail,
       so at favicon scale the silhouette stays readable. -->
  <g fill="#FFC300" mask="url(#holes32)">
    <!-- Left "<" -->
    <path d="M 13 5
             L 5 16
             L 13 27
             L 16 27
             L 9 16
             L 16 5
             Z"/>
    <!-- Right ">" -->
    <path d="M 19 5
             L 27 16
             L 19 27
             L 16 27
             L 23 16
             L 16 5
             Z"/>
  </g>

  <!-- Center "I" cursor — kept as a single thin pill at 32px,
       no inner hole (would disappear or just look like noise) -->
  <rect x="15.25" y="10" width="1.5" height="12" rx="0.75" ry="0.75" fill="#FFC300"/>
</svg>
