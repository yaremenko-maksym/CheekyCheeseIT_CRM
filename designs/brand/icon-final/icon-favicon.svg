  <g transform="rotate(-6 236 222)">
    <path d="M 150 230 L 126 206" stroke="#232A34" stroke-width="15" stroke-linecap="round"/>
    <path d="M 322 230 L 346 206" stroke="#232A34" stroke-width="15" stroke-linecap="round"/>
    <rect x="222" y="210" width="30" height="17" rx="8" fill="#232A34"/>
    <rect x="148" y="196" width="80" height="60" rx="20" fill="#232A34"/>
    <rect x="246" y="196" width="80" height="60" rx="20" fill="#232A34"/>
    <rect x="162" y="208" width="24" height="11" rx="5" fill="#F7F7F7" opacity="0.92"/>
    <rect x="260" y="208" width="24" height="11" rx="5" fill="#F7F7F7" opacity="0.92"/>
  </g>
</svg>
