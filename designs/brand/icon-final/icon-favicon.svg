<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CheekyCheeseIT">
  <title>CheekyCheeseIT</title>

  <!-- ===== CHEESE CUBE (enlarged, no brackets — works on dark & light) ===== -->
  <path d="M 112 156 L 360 156 L 408 112 L 160 112 Z" fill="#FFD651"/>   <!-- top -->
  <path d="M 360 156 L 360 396 L 408 352 L 408 112 Z" fill="#E3A600"/>   <!-- side -->
  <rect x="112" y="156" width="248" height="240" rx="32" fill="#FFC300"/><!-- front -->

  <!-- holes -->
  <g fill="#E0A200">
    <ellipse cx="150" cy="350" rx="16" ry="13"/>
    <ellipse cx="328" cy="356" rx="15" ry="12"/>
  </g>
  <ellipse cx="384" cy="250" rx="8" ry="15" fill="#C98F00"/>

  <!-- smile -->
  <path d="M 168 296 Q 236 372 304 296" fill="none" stroke="#232A34" stroke-width="22" stroke-linecap="round"/>

