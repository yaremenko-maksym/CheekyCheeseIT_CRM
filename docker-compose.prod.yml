# ============================================================
# docker-compose.prod.yml — Production stack
#
# Usage:
#   cp .env.production.example .env.production
#   # Fill in all required values (see .env.production.example comments)
#   docker compose -f docker-compose.prod.yml up -d
#
# Services:
#   postgres  — PostgreSQL 16 database (persistent volume)
#   redis     — Redis 7 cache/session store
#   api       — NestJS 11 API (apps/api)
#   nginx     — Combined reverse-proxy + static server (Landing + CRM)
#
# Optional (self-hosted S3):
#   Start with: docker compose -f docker-compose.prod.yml --profile selfhosted-s3 up -d
#   Default:    uses external AWS S3 (configure AWS_* in .env.production)
# ============================================================

services:
  # ── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No ports exposed to host — API connects via internal Docker network.
    networks:
      - backend

  # ── Cache / Sessions ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Explicit overrides to ensure correct values regardless of .env content.
      NODE_ENV: production
      API_PORT: '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # No ports exposed to host — nginx connects via internal Docker network.
    networks:
      - backend
      - frontend

  # ── nginx (reverse-proxy + static SPA server) ─────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        # VITE_API_URL is baked into the CRM bundle at build time.
        # /api = same-origin proxy (no cross-origin cookie issues).
        VITE_API_URL: /api
        # Optional: pass git SHA for cache busting (set in CI/deploy script).
        # VITE_BUILD_VERSION: ${VITE_BUILD_VERSION:-}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # TLS certs: mount the directory containing your certificates.
    # Uncomment when TLS is active (certs provisioned via Let's Encrypt or CF):
    # volumes:
    #   - /etc/letsencrypt/live/cheekycheese.tech:/etc/nginx/certs/cheekycheese.tech:ro
    #   - /etc/letsencrypt/live/app.cheekycheese.tech:/etc/nginx/certs/app.cheekycheese.tech:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/index.html || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend

  # ── MinIO (optional — self-hosted S3 replacement) ─────────────────────────
  # Only started with: --profile selfhosted-s3
  # Default production setup uses AWS S3 (configure AWS_* in .env.production).
  minio:
    profiles:
      - selfhosted-s3
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Reuse the same IAM credentials as the API for simplicity.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    # Console port (optional, for admin access — do not expose publicly).
    # ports:
    #   - '9001:9001'

  minio-bootstrap:
    profiles:
      - selfhosted-s3
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-crm-documents}
    entrypoint: >
      /bin/sh -c "
        mc alias set local ${S3_ENDPOINT} ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
        mc mb --ignore-existing local/${S3_BUCKET:-crm-documents} &&
        echo 'MinIO bucket ${S3_BUCKET:-crm-documents} ready'
      "
    networks:
      - backend

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  # backend: api, postgres, redis, minio (not exposed to nginx directly except api).
  backend:
    driver: bridge
  # frontend: nginx + api (nginx proxies /api/ to api:3001).
  frontend:
    driver: bridge
