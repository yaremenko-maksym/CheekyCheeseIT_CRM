# ============================================================
# origin-gate.conf — server-level origin-IP enforcement.
#
# security review (PR #437 follow-up, HIGH-1 + LOW-3, 2026-07-27): this
# file lives OUTSIDE nginx/conf.d/ deliberately — nginx.conf's wildcard
# `include /etc/nginx/conf.d/*.conf;` runs at HTTP level, so ANY file
# placed under conf.d/ gets swept up there too, in ADDITION to wherever
# else it might be `include`d from. An `if {}` block is INVALID in http
# context (only server/location) — reviewer confirmed this crashes nginx
# outright the moment such a snippet is dropped in conf.d/:
#   nginx: [emerg] "if" directive is not allowed here in
#   /etc/nginx/conf.d/gate.conf:1
#   nginx: configuration file /etc/nginx/nginx.conf test failed
# This file is included ONLY by explicit, absolute-path `include` inside
# each real vhost's `server {}` block (crm.conf x2, landing.conf x2) —
# never by the wildcard, never at http level.
#
# ── Why $realip_remote_addr, not $remote_addr (the reverted bug) ──────────
# The FIRST version of this gate (origin-access.conf, REVERTED after
# security review) used plain `allow`/`deny` on `$remote_addr`.
# ngx_http_realip_module registers its handlers in the POST_READ/PREACCESS
# phases; ngx_http_access_module (`allow`/`deny`) runs in the ACCESS
# phase — strictly AFTER. Every real vhost here also has `set_real_ip_from
# <cloudflare ranges>; real_ip_header CF-Connecting-IP;` (needed so the API
# logs/rate-limits/records the VISITOR's real IP, not Cloudflare's edge
# IP — see crm.conf's own comment on that block). By the time `allow`/
# `deny` evaluates $remote_addr, realip has ALREADY overwritten it with
# the value of the client-SUPPLIED `CF-Connecting-IP` header — an
# attacker-controlled value, not the actual TCP peer. Verified live
# (security review): a simulated real visitor (CF-Connecting-IP set to a
# real-looking public IP) got 403 — the gate was filtering on THAT forged
# header, meaning it would have rejected essentially every real Cloudflare
# visitor in production. Simultaneously, an attacker connecting directly
# from an IP inside Cloudflare's own published range while sending NO
# CF-Connecting-IP header at all got 200 — realip had nothing to
# substitute, so $remote_addr stayed the (in-range) real peer address.
# i.e. the gate blocked legitimate traffic and passed the traffic it was
# meant to stop.
#
# `$realip_remote_addr` is ALSO set by ngx_http_realip_module — but to the
# ORIGINAL, PRE-substitution peer address, immune to header spoofing (it
# reflects the actual TCP connection, which cannot be forged over TCP).
# nginx/conf.d/origin-gate-geo.conf's `geo $realip_remote_addr
# $origin_gate_allowed { ... }` block (Dockerfile-generated from
# nginx/cloudflare-ips.txt) is keyed on exactly this variable — verified
# live this time: real visitor via Cloudflare -> $origin_gate_allowed=1 on
# both static content AND `return`-based locations (see below); direct
# peer outside every allowed range, even WITH a forged
# `CF-Connecting-IP: 1.1.1.1` header -> $origin_gate_allowed=0. Spoofing
# the header cannot help an attacker here — $realip_remote_addr never
# reads it.
#
# ── Why `if` here, not `allow`/`deny` (LOW-1) ──────────────────────────────
# `allow`/`deny` (ACCESS phase) never sees a request whose location uses a
# bare `return` (`return` executes in the REWRITE phase, which comes
# BEFORE ACCESS) — verified against the reverted gate: /robots.txt (an
# exact-match `return 200 ...` location) and landing's locale-redirect
# `return 302 ...` both served normally EVEN FROM A DENIED source IP. A
# SERVER-LEVEL `if` (this file) is itself part of the SERVER rewrite
# phase, which runs BEFORE nginx even selects which location will handle
# the request — so it applies uniformly to every location in the vhost,
# `return`-based or not. Verified live: 403 on both a static asset path
# and a `return`-based location from a denied source.
#
# ── observe vs enforce (nginx/conf.d/origin-gate-mode.conf) ────────────────
# `$origin_gate_enforce` is 0 (observe, default) or 1 (enforce) — see that
# file's header comment for the full soft-launch rationale (MED-2). In
# observe mode this `if` never fires (the string-concat pattern below only
# matches "01" — denied AND enforcing); the PASSIVE observability comes
# from nginx.conf's `log_format main` (origin_gate=$origin_gate_allowed on
# every request, in both modes) — see that file's comment. Flip
# ORIGIN_GATE_MODE to "enforce" only after confirming zero
# ` origin_gate=0 ` lines from real traffic over a clean observation
# window.
#
# nginx `if` has no `&&` and does NOT accept an inline concatenation
# expression as its left operand (tried both `if
# ($origin_gate_allowed$origin_gate_enforce = "01")` — unquoted: nginx
# reads it as one literal, always-undefined variable NAME containing a
# `$` character, "unknown ... variable"; and quoted —
# `if ("$a$b" = "01")` — nginx's `if` parser rejects a quoted-string
# literal as the left operand outright, "invalid condition". Both
# failures verified empirically via the build-time `nginx -t` gate.).
# The standard, working idiom `set`s the concatenation into an ordinary
# variable FIRST (a plain `set` DOES correctly interpolate multiple `$var`
# references inside a quoted string — same mechanism `set
# $locale_guard_path ...` relies on elsewhere in this repo, e.g.
# landing.conf), then `if` compares that single variable normally — no
# ambiguity left for the `if` parser to reject.
set $origin_gate_decision "${origin_gate_allowed}${origin_gate_enforce}";
if ($origin_gate_decision = "01") {
    return 403;
}
