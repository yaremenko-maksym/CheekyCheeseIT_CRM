# ============================================================
# Per-domain Content-Security-Policy — $csp_value / $csp_enforcing / $csp_report_only
#
# security-headers.conf sets the CSP add_header lines and is `include`d
# verbatim inside MANY server/location blocks in both landing.conf and
# crm.conf (see that file's header comment). `map` is only valid in the
# `http {}` context, NOT inside a `location` block, so it cannot live in
# security-headers.conf itself (nginx -t would fail with "map directive is
# not allowed here" the moment that file is included inside a location).
# This file is loaded exactly once, at http level, via the wildcard
# `include /etc/nginx/conf.d/*.conf;` in nginx.conf — same pattern already
# used for the locale-detection maps in locale-detect.conf (`$locale_prefix`
# etc.) — so `map` here is safe and the resulting variables are then normal
# nginx variables, usable from anywhere.
#
# Keyed on `$server_name` (the FIRST name in the matched server block's
# `server_name` directive), NOT `$host` (the client-supplied Host header).
# `$host` is attacker-influenceable (see landing.conf's `absolute_redirect
# off` comment, PR #423 MED-1, for the same class of "don't trust the
# client's Host header" reasoning) — using `$server_name` means the CSP
# actually sent is fully determined by WHICH server block matched, never by
# what the request claims. Fixes a real prod regression (2026-07):
# `https://challenges.cloudflare.com` (Cloudflare Turnstile — script +
# widget iframe + verification XHR, see apps/landing/app/lib/use-turnstile.ts)
# was missing from every CSP directive that matters for it. Before PR #423,
# the CSP header was silently DROPPED entirely on HTML responses (nginx
# add_header inheritance bug — see landing.conf's MED-3/MED-4 comments), so
# Turnstile loaded unrestricted; #423 fixed the header-drop bug, which
# turned ACTUAL enforcement on for the first time and exposed this
# always-incomplete CSP value, breaking the vacancy-apply form's Turnstile
# widget (and — verified live — the form itself, since the API rejects
# submissions with no valid Turnstile token).
#
# Each per-host CSP below is the shared baseline (`default`, below) plus
# ONLY the extra external origins that domain's ACTUAL frontend code
# fetches/loads — never a blanket union across domains:
#   - cheekycheese.tech (landing): Cloudflare Turnstile needs
#     `https://challenges.cloudflare.com` in script-src (loads
#     `turnstile/v0/api.js`), frame-src (the widget renders in an iframe on
#     that origin), and connect-src (the widget's own verification XHR).
#     `unsafe-inline`/wildcards are NOT used — exact origin only.
#   - app.cheekycheese.tech (CRM): apps/web/index.html loads Inter from the
#     Google Fonts CDN directly (`<link rel="stylesheet"
#     href="https://fonts.googleapis.com/...">` + the actual `.woff2` files
#     from `https://fonts.gstatic.com`) — style-src needs the former,
#     font-src the latter. (Landing does NOT need this: it self-hosts its
#     fonts under `/fonts/*.woff2`, see apps/landing/index.html's comment.)
#     ALSO needs Cloudflare R2 for documents/invoices/receipts (security
#     review round 1, PR #429, HIGH-1 + MED-1) — see the dedicated comment
#     block above the map below for the full rationale.
# ============================================================

map $server_name $csp_value {
    # Baseline — used for anything that is not one of the two configured
    # domains below (defence-in-depth default; the two `server_name`s in
    # landing.conf/crm.conf are the only ones nginx.conf's upstream/conf.d
    # wiring ever routes to in practice).
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self';";

    # Landing — cheekycheese.tech (www.cheekycheese.tech shares this block's
    # `server_name cheekycheese.tech www.cheekycheese.tech;` — `$server_name`
    # is always the FIRST token, "cheekycheese.tech", for both host headers).
    cheekycheese.tech "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self';";

    # CRM — app.cheekycheese.tech. Turnstile is NOT used here — do not add
    # challenges.cloudflare.com to this policy without a real caller.
    #
    # security review round 1 (PR #429, HIGH-1 + MED-1): prod serves
    # documents/invoices/receipts via presigned Cloudflare R2 URLs
    # (`https://<account_id>.r2.cloudflarestorage.com/...` — cross-origin for
    # app.cheekycheese.tech, see docs/runbooks/s3-storage.md), consumed THREE
    # different ways that each need their own directive:
    #   - `fetch(presignedUrl, { mode: 'cors' })` in
    #     apps/web/app/hooks/use-document-blob.ts (document preview/download,
    #     also reused by the sw.js `media-cache` runtimeCaching entry in
    #     apps/web/vite.config.ts — a service worker's fetches are governed
    #     by the SAME connect-src as the page that registered it) -> connect-src.
    #   - `<iframe src={presignedUrl}>` in
    #     apps/web/app/components/invoices/invoice-detail-dialog.tsx
    #     (InvoicePdfPreview) -> frame-src.
    #   - `<object data={presignedUrl} type="application/pdf">` in
    #     apps/web/.../finance/components/dialogs/receipt-panel.tsx
    #     -> object-src.
    # `img-src` already covers presigned-URL `<img>` tags (blanket `https:`,
    # unchanged) — the ONLY img-src gap was `blob:` (MED-1): ReceiptInput.tsx
    # renders `URL.createObjectURL(file)` into an `<img src="blob:...">`
    # during upload, before the file has an R2 URL at all.
    #
    # Wildcard (`https://*.r2.cloudflarestorage.com`), not the exact
    # `<account_id>` host: the account id is not itself secret (it is
    # already visible to every browser in the presigned URL), but it lives
    # in the `S3_ENDPOINT` GHA secret / prod `.env`, not in this repo, and
    # nginx has no build-time or runtime templating wired to inject it into
    # conf.d/*.conf today (docker-compose.prod.yml's `nginx` service gets no
    # S3_ENDPOINT env at all — only the one-shot migrate/seed helper does).
    # Wiring that through would mean converting these static confs into
    # envsubst templates (a real, separate infra change) purely to shave an
    # already-narrow wildcard down to one more level of specificity — not
    # justified for a P0 fix. The wildcard is still scoped to R2 specifically
    # (not `https:` broadly): it only ever matches Cloudflare-operated R2
    # bucket endpoints, on OTHER Cloudflare accounts too, which is a
    # meaningfully narrower risk than the existing blanket `https:` already
    # in img-src (inherited from the API's helmet CSP, apps/api/src/main.ts,
    # same presigned-R2 rationale) — tracked as LOW-2 (security review round
    # 1) to revisit once the exact host IS available to nginx.
    #
    # Shipped as Content-Security-Policy-Report-Only on first rollout (see
    # $csp_mode / $csp_enforcing / $csp_report_only maps + security-
    # headers.conf) — CRM has never served ANY CSP before this PR (crm.conf's
    # add_header-inheritance bug dropped it entirely, see crm.conf's header
    # comment), so this specific value has zero production track record.
    # Report-only lets real traffic surface anything this review + the
    # manual/Playwright verification in PR #429 missed, with zero risk of a
    # fresh functional break, before it ever blocks a real request. See
    # scripts/devops/csp-report-only-rollout-runbook.md for the switch-to-
    # enforcing procedure.
    #
    # task-csp-reports-and-flip (Part B, security review round 2 follow-up):
    # `report-uri`/`report-to` — CRM's ONLY (landing untouched, no collector
    # wired for it and no request to add one). `report-uri` is the legacy
    # directive (still the only one older/some current browsers honour);
    # `report-to` is the modern Reporting API directive, pointing at the
    # `csp-endpoint` name declared by the `Reporting-Endpoints` response
    # header (see security-headers.conf) — both target the SAME collector,
    # `POST /api/public/csp-report` (apps/api/src/csp-reports/, Part A of the
    # same task, contract fixed in the task file's "КОНТРАКТ" section: same-
    # origin, public, always 204). Both directives work identically whether
    # this policy ships as Content-Security-Policy or -Report-Only — the
    # browser reports violations either way, it just doesn't BLOCK anything
    # while report-only. Safe regardless of Part A's merge order relative to
    # this PR: CSP referencing an endpoint that doesn't exist yet simply
    # means the browser's report POST 404s (silently dropped by the browser,
    # no functional impact on the page) until Part A merges.
    app.cheekycheese.tech "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.r2.cloudflarestorage.com; frame-src 'self' blob: https://*.r2.cloudflarestorage.com; object-src 'self' blob: https://*.r2.cloudflarestorage.com; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/public/csp-report; report-to csp-endpoint;";
}

# ── Report-Only rollout switch (security review round 1, PR #429; ─────────
# ── consolidated to ONE variable in task-csp-reports-and-flip Part B ────────
# $csp_value above is ALWAYS the real, intended policy text for both
# domains — everything below ONLY decides which HEADER NAME carries it for a
# given domain, not what it says. nginx's add_header omits a header
# entirely when its value is the empty string (documented behaviour of
# ngx_http_headers_module) — security-headers.conf uses that to emit
# EITHER `Content-Security-Policy: $csp_value` (enforcing) OR
# `Content-Security-Policy-Report-Only: $csp_value` (observe-only, browser
# still loads everything, only logs violations to devtools/report-uri), per
# domain, never both.
#
# security review round 2 (LOW fix, task-csp-reports-and-flip Part B): the
# ORIGINAL version of this switch was two independent `map $server_name`
# blocks, each separately hardcoding `app.cheekycheese.tech` into the
# report-only branch — flipping CRM to enforcing meant editing BOTH maps
# (and, separately, a same-named-but-independent constant in
# scripts/devops/check-security-headers.sh) — a footgun: miss one edit and
# the guard silently starts checking a header CRM no longer sends, or nginx
# and the guard disagree about what mode CRM is actually in. Refactored to
# ONE indirection variable, $csp_mode, holding the literal string
# "report-only" or "enforcing" for app.cheekycheese.tech — $csp_enforcing/
# $csp_report_only below are now plain, mechanical derivations FROM
# $csp_mode (map on $csp_mode, not on $server_name), so there is exactly one
# place left to change the CRM's actual value: the placeholder below.
#
# The placeholder itself, `__CRM_CSP_MODE__`, is substituted at Docker BUILD
# time (nginx/Dockerfile, `ARG CRM_CSP_MODE`) — see that file's RUN step for
# the validation (fails the build loudly on anything other than exactly
# "report-only" or "enforcing", no silent fallback). deploy.yml threads the
# single source-of-truth value in from ONE `env: CRM_CSP_MODE:` entry at the
# top of that workflow file (same pattern already used there for
# REGISTRY/IMAGE_OWNER/REPO_SLUG) — to flip CRM's mode in production, change
# THAT one value and follow scripts/devops/csp-report-only-rollout-
# runbook.md §4. This file itself never needs editing to flip modes.
#
#   - landing (cheekycheese.tech): always enforcing — $csp_mode's `default`
#     branch, not driven by CRM_CSP_MODE at all (landing's CSP has been
#     genuinely live in prod since PR #423, out of scope for this switch).
#   - CRM (app.cheekycheese.tech): driven by $csp_mode / CRM_CSP_MODE,
#     "report-only" by default (current rollout state — CRM has never served
#     a CSP before PR #429, see the header comment above, so this specific
#     policy text still needs a clean observation period before it can
#     safely block real requests).
map $server_name $csp_mode {
    default enforcing;
    app.cheekycheese.tech "__CRM_CSP_MODE__";
}

map $csp_mode $csp_enforcing {
    default "";
    enforcing $csp_value;
}
map $csp_mode $csp_report_only {
    default "";
    report-only $csp_value;
}

# ── Reporting-Endpoints (task-csp-reports-and-flip Part B) ─────────────────
# Declares the `csp-endpoint` name CRM's CSP `report-to` directive
# references (see $csp_value's app.cheekycheese.tech entry above). CRM-only
# — keyed on $server_name (not $csp_mode: sent in BOTH report-only and
# enforcing modes, see security-headers.conf's comment). MUST be an absolute
# HTTPS URL — the Reporting API spec requires it (relative URLs / non-HTTPS
# origins are silently ignored by the browser, verified against the spec:
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Reporting-Endpoints)
# — unlike `report-uri` above, which DOES accept (and uses) a same-origin
# relative path.
map $server_name $reporting_endpoints_header {
    default "";
    app.cheekycheese.tech "csp-endpoint=\"https://app.cheekycheese.tech/api/public/csp-report\"";
}
