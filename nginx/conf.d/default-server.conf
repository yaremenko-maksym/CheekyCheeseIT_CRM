# ============================================================
# default-server.conf — catch-all for unmatched Host headers on 80/443
#
# security audit MED-5 (2026-07-27): before this file existed, nginx had NO
# explicit `default_server` for either port — per nginx's own fallback
# rule ("the first server block for that address:port wins"), that meant
# crm.conf's `listen 80`/`listen 443 ssl` blocks (alphabetically first in
# conf.d/*.conf) silently served as the catch-all. Verified: a request with
# NO Host header, or a Host that matches neither app.cheekycheese.tech nor
# cheekycheese.tech/www.cheekycheese.tech (e.g. `curl http://<origin-ip>/`,
# or any Host the client makes up), landed on the real CRM SPA and got a
# normal 200 response — nginx location matching is by URI, not by Host;
# Host only selects WHICH server block handles the request.
#
# `return 444;` is nginx-specific (non-standard HTTP status): closes the
# connection immediately with NO response at all, not even a status line.
# Correct behaviour here — this block matches ONLY traffic that named
# neither of our two real domains, i.e. has no legitimate reason to reach
# this origin at all.
#
# Does NOT replace nginx/conf.d/origin-access.conf's Cloudflare-only
# allow/deny gate: a request that presents the CORRECT Host (the real
# domain) still reaches crm.conf/landing.conf directly and is judged by
# THAT gate instead — Host-based routing and source-IP filtering are
# orthogonal defences for two different bypass techniques. See that file's
# header comment and the MED-5 PR body for the full picture.
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # TLS termination (SNI or not) happens BEFORE nginx can see the HTTP
    # Host header, so this block still needs a real certificate on disk to
    # complete the handshake for a client that connects with no SNI, or an
    # SNI value matching neither real vhost. Reusing the CRM origin cert
    # here carries no trust implication — every request that reaches this
    # block gets `return 444;` below, nothing is ever served under this
    # certificate's identity.
    ssl_certificate     /etc/nginx/certs/app.cheekycheese.tech.crt;
    ssl_certificate_key /etc/nginx/certs/app.cheekycheese.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 444;
}
