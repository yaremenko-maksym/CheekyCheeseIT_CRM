# ============================================================
# default-server.conf — catch-all for unmatched Host headers on 80/443
#
# security audit MED-5 (2026-07-27): before this file existed, nginx had NO
# explicit `default_server` for either port — per nginx's own fallback
# rule ("the first server block for that address:port wins"), that meant
# crm.conf's `listen 80`/`listen 443 ssl` blocks (alphabetically first in
# conf.d/*.conf) silently served as the catch-all. Verified: a request with
# NO Host header, or a Host that matches neither app.cheekycheese.tech nor
# cheekycheese.tech/www.cheekycheese.tech (e.g. `curl http://<origin-ip>/`,
# or any Host the client makes up), landed on the real CRM SPA and got a
# normal 200 response — nginx location matching is by URI, not by Host;
# Host only selects WHICH server block handles the request.
#
# `return 444;` is nginx-specific (non-standard HTTP status): closes the
# connection immediately with NO response at all, not even a status line.
# Correct behaviour here — this block matches ONLY traffic that named
# neither of our two real domains, i.e. has no legitimate reason to reach
# this origin at all.
#
# Does NOT, on its own, stop a direct-to-origin request that presents the
# CORRECT Host (the real domain) — that request still reaches
# crm.conf/landing.conf normally; this file only closes the "unmatched
# Host" subset of the direct-access problem. A source-IP-based gate
# (Cloudflare-only allow/deny) was attempted alongside this file in the
# same PR and reverted after security review: nginx's realip module
# rewrites `$remote_addr` to the value of the client-supplied
# `CF-Connecting-IP` header BEFORE the access-control phase runs, so a
# naive `allow <cloudflare ranges>; deny all;` gate ends up comparing the
# ATTACKER-CONTROLLED header value against the allow-list, not the actual
# TCP peer — it blocks real visitors (whose forwarded IP is essentially
# never inside Cloudflare's own ranges) and passes anyone who simply
# omits that header while connecting from an IP inside Cloudflare's
# published range. See the follow-up PR (source-IP gate, done correctly
# via `$realip_remote_addr`) for that piece.
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # TLS termination (SNI or not) happens BEFORE nginx can see the HTTP
    # Host header, so this block still needs a real certificate on disk to
    # complete the handshake for a client that connects with no SNI, or an
    # SNI value matching neither real vhost. Reusing the CRM origin cert
    # here carries no trust implication — every request that reaches this
    # block gets `return 444;` below, nothing is ever served under this
    # certificate's identity.
    ssl_certificate     /etc/nginx/certs/app.cheekycheese.tech.crt;
    ssl_certificate_key /etc/nginx/certs/app.cheekycheese.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # task-infra-aop-observation (docs/runbooks/origin-mtls-and-firewall.md
    # §2а): Authenticated Origin Pulls, OBSERVATION phase — mirrors
    # crm.conf's :443 block, see its comment for the full rationale. Added
    # purely so no TLS connection reaching this origin skips verification,
    # keeping the observation window's log coverage complete across every
    # vhost (this block matches on Host, not on the cert — an unmatched
    # Host still gets `return 444;` below for NONE/SUCCESS, same as today).
    #
    # Corrected after security review (PR #555) — a claim previously made
    # here was WRONG and worth recording precisely instead of just
    # deleting: `return 444;` does NOT unconditionally run "regardless of
    # the verify result". A presented-but-unverifiable cert gets nginx's
    # own automatic HTTP 400 (with a body) — the ssl module intercepts
    # BEFORE this server block's own content phase (the bare `return 444;`
    # below) ever runs, same mechanism documented in nginx.conf's
    # log_format comment for crm.conf/landing.conf. Verified live against
    # this exact block. NONE (no cert) and SUCCESS (valid cert) are the
    # only two cases that still reach `return 444;` unmodified.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional;

    return 444;
}
