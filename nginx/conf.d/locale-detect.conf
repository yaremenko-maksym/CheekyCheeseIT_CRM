# ============================================================
# Locale auto-detection — edge-only, redirect-based (task-infra-locale-edge)
#
# Implements the "no-flash" locale rule from
# .claude/tasks/plan-landing-i18n-seo.md §2: the client NEVER decides the
# language after first paint — locale is resolved on the EDGE (here) via a
# single 302 redirect BEFORE any HTML is served, for the small set of
# non-prefixed landing routes (`/`, `/careers/`, `/careers/<slug>/`).
# Locale-PREFIXED routes (`/uk/...`, `/ru/...`, `/es/...`, `/pt/...`) are
# never touched by any of this — they always resolve to $locale_prefix = ""
# (see the final map below) and therefore never redirect.
#
# Detection order (cookie > Accept-Language best-match > CF-IPCountry >
# "en"): the cookie/CF-IPCountry priority tiers and the whole redirect
# decision (this file + `location /` in nginx/conf.d/landing.conf) are
# plain nginx `map`/`if`. The Accept-Language tier specifically ($target_locale
# below) is delegated to njs (nginx/njs/locale.js) — real q-value descending
# sort + exact-then-base-language matching across an arbitrary number of
# comma-separated tags needs arithmetic/loops that nginx `map` (regex-only)
# cannot express. Full design + emergency kill-switch + bot-safety
# verification steps: scripts/devops/locale-routing-runbook.md.
# ============================================================

# ── njs import — see nginx/njs/locale.js + the `load_module` comment in
# nginx/nginx.conf for why. $target_locale is ALWAYS one of:
# "en" | "uk" | "ru" | "es" | "pt" (cookie > Accept-Language > CF-IPCountry >
# "en" — the full chain lives in the JS module, not here).
# Absolute path (not relative "njs/locale.js"): a relative path resolves
# against nginx's `-p` prefix, which defaults to the directory of whatever
# `-c` config file is in use — fine for the normal runtime invocation
# (/etc/nginx/nginx.conf), but breaks when nginx/Dockerfile's build-time
# `nginx -t -c /tmp/.../nginx.conf` test (HIGH-2 fix) uses a DIFFERENT
# config path while conf.d/ (and njs/) stay in their real /etc/nginx/
# location. Absolute here removes that ambiguity entirely regardless of
# how/where nginx is invoked from.
js_import locale from /etc/nginx/njs/locale.js;
js_set $target_locale locale.targetLocale;

# ── Emergency kill-switch ────────────────────────────────────────────────
# Set the literal `default` value below to 1 to force-disable ALL locale
# auto-redirects instantly (rollback / incident lever) without touching any
# other directive in this file, landing.conf, or the njs module. Redeploy
# after flipping. See scripts/devops/locale-routing-runbook.md "Emergency
# kill-switch".
map "" $locale_redirect_kill_switch {
    default 0;
}

# ── Is the CURRENT request URI already locale-prefixed? ─────────────────
# Crawler-safety (plan §2 / AC B3): `/uk/...`, `/ru/...`, `/es/...`,
# `/pt/...` must NEVER redirect, regardless of $target_locale. Anchored at
# the start of the path.
map $uri $uri_is_prefixed {
    default 0;
    "~^/(uk|ru|es|pt)(/|$)" 1;
}

# ── Final redirect target prefix (empty string = no redirect) ───────────
# Folds the kill-switch (above) directly into this map: when the switch is
# 1, NONE of the "0:0:..." patterns can match (they all require the literal
# "0:" kill-switch segment), so the result is always "" — no redirect, full
# stop — without any extra `if` needed in landing.conf. Also folds
# crawler-safety: uri_is_prefixed=1 never matches either. "0:0:en" is
# intentionally absent -> falls to `default ""` -> no redirect for EN.
map "$locale_redirect_kill_switch:$uri_is_prefixed:$target_locale" $locale_prefix {
    default "";
    "0:0:uk" "/uk";
    "0:0:ru" "/ru";
    "0:0:es" "/es";
    "0:0:pt" "/pt";
}
