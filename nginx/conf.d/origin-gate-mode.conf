# ============================================================
# origin-gate-mode.conf — observe/enforce switch for the origin-IP gate
# (nginx/snippets/origin-gate.conf), keyed off a single build-time value —
# SAME pattern as csp-map.conf's `$csp_mode` / `__CRM_CSP_MODE__` (see that
# file's header comment for the full "why one indirection variable"
# rationale; not repeated here).
#
# security review (PR #437 follow-up, MED-2 "soft-launch" ask): the first
# version of the origin gate (origin-access.conf, REVERTED) shipped
# straight to enforcing and blocked 100% of real visitors — root cause was
# a genuine bug (gating on the wrong variable, see origin-gate.conf), but
# reviewer's broader point stands independent of that specific bug: this
# gate's allow-list is FIVE hand-maintained... now ONE generated file
# (nginx/cloudflare-ips.txt) but still externally-sourced data that can go
# stale. security review (PR #439 follow-up, MED-4): staleness bites TODAY
# via set_real_ip_from too, not just the gate — see that file's own header
# comment. scripts/devops/check-cloudflare-ips-freshness.sh checks it
# on-demand (deliberately NOT a scheduled CI job — see origin-gate-rollout-
# runbook.md §7 for why) and is a MANDATORY precondition of the flip
# procedure below, not optional. A staleness-driven false-positive would have the
# exact same blast radius as the reverted bug (every real visitor gets a
# 403) if shipped straight to enforcing. `observe` mode (this file's
# default) logs the gate's decision on every request WITHOUT ever
# returning 403 — see origin-gate.conf for what that means in practice —
# so a staleness/config mistake surfaces as log lines to review, not a
# down site. Flip to `enforce` only after a clean observation window (see
# scripts/devops/origin-gate-rollout-runbook.md for the exact procedure,
# preconditions, and how to read the observation window) finds zero
# ` origin_gate=0 ` lines from real traffic.
#
# The placeholder itself, `__ORIGIN_GATE_MODE__`, is substituted at Docker
# BUILD time (nginx/Dockerfile, `ARG ORIGIN_GATE_MODE`) — same validation
# style as `ARG CRM_CSP_MODE` (fails the build loudly on anything other
# than exactly "observe" or "enforce", no silent fallback). deploy.yml
# threads the value in from ONE `env: ORIGIN_GATE_MODE:` entry, same
# pattern as CRM_CSP_MODE — that is the ONE place a flip actually happens.
map "1" $origin_gate_mode {
    default "__ORIGIN_GATE_MODE__";
}

# Derived boolean nginx's `if` can combine with $origin_gate_allowed via
# string concatenation (nginx `if` has no `&&` — the "$a$b" pattern-match
# idiom is the standard workaround, used the same way csp-map.conf derives
# $csp_enforcing/$csp_report_only from $csp_mode).
map $origin_gate_mode $origin_gate_enforce {
    default 0;
    enforce 1;
}
