# ============================================================
# CRM — app.cheekycheese.tech
# Serves the CRM Vite SPA and reverse-proxies /api → api:3001.
#
# Cookie auth note: VITE_API_URL=/api is baked into the CRM bundle at
# build time (see apps/web/Dockerfile ARG). All API calls go same-origin
# through this nginx, so HttpOnly JWT cookies work without cross-domain
# config or SameSite relaxation.
# ============================================================

# ── HTTP (port 80) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.cheekycheese.tech;

    root /usr/share/nginx/html/crm;
    index index.html;

    # Security headers for static pages.
    include /etc/nginx/conf.d/security-headers.conf;

    # Deny access to dotfiles (.env, .git, etc.) — defense-in-depth even though
    # the static root (dist/) should never contain them.
    location ~ /\. {
        deny all;
    }

    # ── Cache strategy ─────────────────────────────────────────────
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore ────────────────────────────────
    # When Cloudflare is the edge proxy, $remote_addr is a Cloudflare IP,
    # NOT the real client IP. The block below instructs nginx to trust
    # CF-Connecting-IP (set by Cloudflare, un-spoofable from clients because
    # only proxied-through-CF traffic reaches this nginx).
    #
    # CF IPv4 CIDR list — update periodically from:
    #   https://www.cloudflare.com/ips-v4
    # CF IPv6 CIDR list — update from:
    #   https://www.cloudflare.com/ips-v6
    #
    # IMPORTANT: if Cloudflare is NOT in front (direct VPS / Let's Encrypt only
    # with Cloudflare DNS-only mode), comment out this block and switch
    # X-Forwarded-For back to $remote_addr (see note below).
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # CF IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Use CF-Connecting-IP header as the authoritative real client IP.
    real_ip_header CF-Connecting-IP;
    # Recursive: strip the CF IPs from the XFF chain, leaving the real client.
    real_ip_recursive on;

    # ── API reverse-proxy ─────────────────────────────────────────
    # Do NOT strip /api prefix — NestJS globalPrefix = 'api'.
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # After set_real_ip_from above, $remote_addr is now the real client IP
        # (Cloudflare has been stripped from the chain). We OVERWRITE XFF so
        # the API sees exactly the real client IP — not any CF intermediary.
        # The API reads req.ip from X-Forwarded-For with TRUST_PROXY=true.
        # That IP is recorded as legal proof on contract/ToS signatures and
        # used by rate-limiting — it must be un-spoofable.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Fastify cookie auth (JWT HttpOnly cookie).
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

