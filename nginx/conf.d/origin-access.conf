# ============================================================
# origin-access.conf — "who may connect to this origin directly" allow-list
#
# security audit MED-5 (2026-07-27): included at the TOP of every real
# server block (crm.conf, landing.conf — both :80 and :443) so the whole
# vhost (static assets AND /api/) is gated, not just the API surface. Any
# source NOT covered below gets nginx's own 403 (ngx_http_access_module
# `deny all;` — evaluated per-connection, independent of TLS/SNI).
#
# Closes: "I know the origin's real IP (DNS history, Certificate
# Transparency logs) — curl it directly with the right Host header and I
# bypass Cloudflare's WAF/bot-management/rate-limiting entirely." Verified
# finding: application-level limits still applied in that scenario (real
# client IP is not spoofable over TCP), but the EDGE protections
# (Cloudflare WAF, bot challenge, DDoS scrubbing) are skipped outright.
#
# Does NOT close: a request that presents the CORRECT Host/SNI AND
# originates from an IP within one of the ranges below — Cloudflare's own
# edge IPs are (by design) reachable from anywhere, so this alone cannot
# distinguish "Cloudflare proxying a real visitor" from "someone who
# rented/compromised an IP inside Cloudflare's published range" (extremely
# unlikely, but not cryptographically impossible). Cloudflare's
# "Authenticated Origin Pulls" (client-cert mTLS between edge and origin)
# closes that residual gap — that piece is OWNER-side config (Cloudflare
# dashboard + nginx `ssl_client_certificate`), not implemented here. See
# the MED-5 PR body for the full picture and the host-firewall
# (ufw/iptables on the Hetzner VPS) piece, both explicitly out of this
# file's scope.
#
# ── Cloudflare IPv4/IPv6 ranges ─────────────────────────────────────────
# SAME list already used for `set_real_ip_from` in crm.conf / landing.conf
# (both :80 and :443 blocks) — nginx has no mechanism to derive `allow`
# values FROM `set_real_ip_from` values (different directives/modules), so
# this is the one extra place the list is spelled out. Keep BOTH in sync
# when Cloudflare rotates their published ranges:
#   IPv4: https://www.cloudflare.com/ips-v4
#   IPv6: https://www.cloudflare.com/ips-v6
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 108.162.192.0/18;
allow 131.0.72.0/22;
allow 141.101.64.0/18;
allow 162.158.0.0/15;
allow 172.64.0.0/13;
allow 173.245.48.0/20;
allow 188.114.96.0/20;
allow 190.93.240.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;

# ── Local / intra-host — required so our OWN health checks keep working ──
# 1. `docker-compose.prod.yml`'s nginx `healthcheck:` runs INSIDE the
#    container's own network namespace (`wget http://127.0.0.1/...`) — a
#    genuine loopback-to-self connection, sees 127.0.0.1/::1 exactly.
# 2. `deploy.yml`'s post-deploy smoke-test step curls the HOST-published
#    port (`curl http://127.0.0.1/...`) from the VPS's own shell (over
#    SSH), NOT from inside the container. Docker's userland-proxy (the
#    default `docker-proxy` path for published ports) terminates that
#    connection on the host and opens a NEW one into the container's
#    namespace SOURCED FROM THE BRIDGE GATEWAY (e.g. 172.19.0.1) — NOT
#    127.0.0.1 — so the literal-loopback allow above is NOT sufficient for
#    this path. 172.16.0.0/12 is Docker's default bridge/custom-network
#    allocation range (covers whatever subnet compose auto-assigns to the
#    `frontend`/`backend` networks in docker-compose.prod.yml). Safe to
#    allow broadly: RFC 1918 space is never routable from the public
#    internet, so a real external attacker cannot complete a TCP handshake
#    while spoofing a source address in this range — the only traffic that
#    can ever actually reach nginx claiming one of these source IPs is
#    traffic that originated on this same host/Docker network.
allow 127.0.0.1;
allow ::1;
allow 172.16.0.0/12;

deny all;
