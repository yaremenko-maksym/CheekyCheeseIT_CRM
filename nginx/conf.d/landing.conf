# ============================================================
# Landing — cheekycheese.tech
# Serves the static Vite SPA and reverse-proxies /api → api:3001.
#
# task-infra-seo-gates: robots.txt / sitemap.xml are served straight from
# apps/landing/dist (Vite copies apps/landing/public/* to the dist root at
# build time — task-landing-seo-prerender adds those files there). There is
# INTENTIONALLY no dedicated `location = /robots.txt` / `location = /sitemap.xml`
# block here — no location in this file matches the `.txt` / `.xml` extensions
# (the cache-control regex below only covers js/css/fonts/images), so both
# fall through to the SPA-fallback `location /` and try_files finds and serves
# the real static file before ever reaching the `=404` fallback (task-soft-404-
# and-noindex.md — see `@locale_fallback` below). Do NOT
# add a location for these paths unless you also need to change their caching
# behaviour — an empty/misrouted robots.txt here would accidentally block ALL
# crawlers from the landing page it is supposed to keep indexable. This same
# fall-through mechanism is what will serve `sitemap-jobs.xml` (AC B8, task-
# infra-locale-edge) once it exists in the dist — nginx's stock mime.types
# already maps `.xml` -> `text/xml` and `.txt` -> `text/plain`, verified
# against the `nginx:1.27-alpine` base image, so no extra location/content-
# type config is needed here for that file either. The SAME mechanism (no
# dedicated location, plain files under the dist root) is also how
# nginx/Dockerfile now writes the IndexNow key file and Bing/Yandex
# verification files (AC B6/B7) — see that file's HIGH-2 comment for why
# (security-review round 1, PR #423: generating nginx `location` blocks from
# build-arg content was an injection vector; static files sidestep it
# entirely, and this fall-through is what serves them).
#
# task-infra-locale-edge: edge locale auto-redirect (plan-landing-i18n-seo.md
# §2, AC B1-B5) is implemented via `map`/njs in nginx/conf.d/locale-detect.conf
# ($locale_prefix) plus the `if`/`return 302` block inside `location /` below.
# Full design + emergency kill-switch + bot-safety verification steps:
# scripts/devops/locale-routing-runbook.md.
# ============================================================

# ── HTTP (port 80) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cheekycheese.tech www.cheekycheese.tech;

    root /usr/share/nginx/html/landing;
    index index.html;

    # security-review round 1 (PR #423, MED-1): nginx's default
    # `absolute_redirect on` builds the `Location:` header on OUR 302s from
    # `$host` — i.e. whatever Host header the CLIENT sent, not a fixed,
    # trusted value. Verified: `Host: evil.com` + `Accept-Language: ru` on
    # this server produced `Location: http://evil.com/ru/`. Low exploitable
    # impact on its own (a victim's browser will not send a forged Host;
    # Cloudflare normalises Host for this zone; 302s are not cached), but
    # this PR is what introduces meaningful 302 traffic on landing in the
    # first place, so closing it here rather than deferring. `off` makes
    # nginx emit a relative `Location: /ru/...` instead — browsers resolve
    # relative Location headers against the ORIGINAL request URL per RFC
    # 9110/7231, so this is functionally identical for every legitimate
    # client and removes the client-controlled-Host class entirely.
    absolute_redirect off;

    # Security headers for static pages.
    include /etc/nginx/conf.d/security-headers.conf;

    # Deny access to dotfiles (.env, .git, etc.) — defense-in-depth even though
    # the static root (dist/) should never contain them.
    location ~ /\. {
        deny all;
    }

    # task-infra-webmanifest-mime: honest 404 instead of a fake manifest.
    # Landing never had a Web App Manifest — apps/landing/index.html carries
    # NO `<link rel="manifest">` at all (verified: `grep manifest
    # apps/landing/index.html` returns nothing), and apps/landing/public/ has
    # no maskable/512 icon set (compare apps/web/public/, which has both) —
    # nothing on this domain declares intent to be installable. There is
    # therefore also no `site.webmanifest` file under apps/landing/public/
    # for try_files to find, so a request for it was falling all the way
    # through this file's SPA `location /` catch-all (see that location's
    # own comments) and getting served the prerendered HOME PAGE — 200 OK,
    # 80+ KB of HTML markup, Content-Type text/html, for a path a client
    # explicitly asked for as JSON. This exact-match `location =` beats the
    # prefix `location /` below regardless of file order (nginx location
    # matching: exact match always wins over prefix), so it intercepts the
    # request before it reaches the SPA fallback/locale logic and returns a
    # real 404 instead.
    #
    # Deliberately NOT "give landing its own manifest": nothing here
    # currently points at one (no `<link rel="manifest">`), so shipping one
    # would be an artifact nothing references rather than a fix for anything
    # a user or browser actually does today — and it would need its own
    # icon set (missing in apps/landing/public/) plus a product decision on
    # name/short_name (the CRM manifest's own name/short_name are being
    # revisited in a parallel PR, precisely because they were indistinguishable
    # from a hypothetical landing one). If landing ever wants PWA
    # installability, that is a dedicated follow-up task, not a side effect
    # of this MIME-type bugfix.
    #
    # No `add_header` inside this location — server-level security headers
    # (HSTS/CSP/X-Content-Type-Options/...) still apply via normal nginx
    # inheritance, same as the bare `location ^~ /en/` / `location = /en`
    # blocks further down in this file (see the header comment on `location
    # /` below for why a location that DOES declare its own add_header needs
    # to re-`include security-headers.conf` and this one does not).
    location = /site.webmanifest {
        return 404;
    }

    # ── Cache strategy ─────────────────────────────────────────────
    # Hashed assets (JS/CSS with content hash in filename) are immutable.
    # index.html must always be revalidated so users get the latest SW/app.
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        # security-review round 1 (PR #423, MED-4): this location defines
        # its own add_header (Cache-Control below), which per nginx's
        # inheritance rule drops ALL server-level add_header — including
        # every header from security-headers.conf (HSTS/CSP/X-Frame-Options/
        # etc.), most notably X-Content-Type-Options on JS. Pre-existing gap
        # (predates this PR), fixed here since the file is already open for
        # the same class of fix elsewhere (`location /`, the index.html
        # location below). See nginx/conf.d/crm.conf for the canonical
        # writeup of this same nginx gotcha.
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # security-review round 1 (PR #423, MED-3): broadened from the original
    # exact-match `location = /index.html` to also cover the locale-prefixed
    # HTML that the SAME index-module internal-redirect serves for
    # `/uk/`, `/ru/`, `/es/`, `/pt/` (and their `/careers/...` subpaths) —
    # verified empirically that the exact-match version left
    # `/uk/index.html` etc. with NO explicit Cache-Control at all (falls
    # through to nginx's un-set default instead of the no-store policy EN
    # gets), which would let a stale SPA shell (dangling hashed-chunk
    # references) linger indefinitely once feature/landing-i18n ships real
    # locale content.
    #
    # security-review round 2 (PR #423, MED-6): the FIRST version of this
    # broadening — `^/(?:(?:uk|ru|es|pt)/)?index\.html$` — only matched
    # locale ROOTS (0 or 1 path segments before `index.html`), so it still
    # missed every NESTED index.html: `/careers/index.html`,
    # `/uk/careers/index.html`, `/uk/careers/<slug>/index.html`. Those fall
    # to `@locale_fallback` (no explicit Cache-Control there — see that
    # location below) instead of this one. Latent today (main has no nested
    # prerendered index.html files), but `feature/landing-i18n` prerenders
    # exactly this shape, and once it merges MOST pages would silently lose
    # the no-store policy. Fixed by matching the SUFFIX only — any nesting
    # depth. `location ~` (not `~*`) is intentional — every path this
    # config ever produces is lowercase by construction (SUPPORTED in
    # nginx/njs/locale.js), no need for case-insensitivity here. Anchored
    # with a leading `/` (not bare `index\.html$`) so a hypothetical file
    # literally named e.g. `myindex.html` would NOT match — verified
    # against a fixture tree with nested index.html files at every depth
    # this plan's URL scheme produces (root / one level / two levels).
    location ~ /index\.html$ {
        # task-infra-locale-edge (AC B4): the final response for the EN
        # root AND every locale root varies by Accept-Language/Cookie
        # (a locale redirect may or may not have fired
        # upstream in `location /` before nginx's index-module
        # internal-redirects here) — declared explicitly since this
        # location defines its own add_header set (see the inheritance
        # note on the asset location above / `location /` below for why
        # that matters). While here: this location ALREADY defined its own
        # add_header (Cache-Control / Pragma) before this PR, so it was
        # ALREADY silently dropping the server-level security-headers.conf
        # include (same inheritance rule) — a pre-existing gap this PR's
        # Vary work happens to touch; re-including it fixes that too
        # (verified empirically: curl against this exact block was missing
        # HSTS/CSP/X-Frame-Options before this line was added).
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore ────────────────────────────────
    # Same CF CIDR block as in crm.conf — required in every server block.
    # security review (PR #437 follow-up, MED-2): generated at Docker
    # build time from the ONE canonical nginx/cloudflare-ips.txt — see
    # that file's header comment (used to be hand-typed in 4 server
    # blocks + the reverted origin-access.conf, 5 copies total).
    include /etc/nginx/conf.d/cloudflare-real-ip-from.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # security review (PR #437 follow-up, HIGH-1): origin-IP gate, done
    # correctly this time (keyed on $realip_remote_addr — see
    # nginx/snippets/origin-gate.conf for the full writeup and why it MUST
    # live outside conf.d/).
    include /etc/nginx/snippets/origin-gate.conf;

    # ── API reverse-proxy ─────────────────────────────────────────
    # IMPORTANT: do NOT strip /api prefix — NestJS uses setGlobalPrefix('api')
    # and expects the full /api/... URI. proxy_pass without a trailing slash
    # preserves the original URI.
    location /api/ {
        # MED-1 (security audit 2026-07-27): nginx defaults to 1m here — far
        # below what the vacancy-apply endpoint accepts (RESUME_MAX_BYTES =
        # 5 MB, apps/api/src/vacancies/applications.service.ts /
        # PublicVacanciesController's per-route multipart `fileSize`). A
        # legitimate ≤5 MB PDF resume got nginx's own HTML 413 error page
        # before ever reaching the API — the candidate-facing apply form
        # then tried to JSON.parse() that HTML and broke silently (no trace
        # in API logs/telemetry — the request never got there). 7m =
        # RESUME_MAX_BYTES + ~2 MB margin, same rationale as crm.conf's
        # client_max_body_size (see that file) — kept tighter than CRM's
        # authenticated document upload since this is a public,
        # unauthenticated surface (see scripts/devops/check-nginx-
        # perimeter.sh for the live before/after proof).
        client_max_body_size 7m;

        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # After set_real_ip_from above, $remote_addr is the real client IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Fastify cookie auth (JWT HttpOnly cookie).
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── /en/ — collapse the accidental duplicate of the English pages ──
    # English is published WITHOUT a prefix (`/`, `/careers/`,
    # `/careers/<slug>/`) — `localePrefix('en') === ''`, see
    # apps/landing/app/i18n/locale.ts. So `/en/…` is not a route: no route
    # file matches it, nothing links to it, sitemap.xml does not list it.
    # It was nevertheless answering 200 in production, because the SPA
    # fallback below (`try_files … /index.html`) hands the prerendered HOME
    # markup to every unmatched path. The result was a second URL serving
    # the home page's content while pointing `rel=canonical` at `/` —
    # a duplicate that can only dilute the very pages this change is trying
    # to get indexed.
    #
    # 301 rather than "leave it up with a canonical tag": `rel=canonical` is
    # a hint a search engine may decline to follow, and leaving the address
    # alive preserves exactly the ambiguity being fixed here. A permanent
    # redirect states it once, unambiguously, and costs one hop on a URL
    # nothing links to. Redirecting here is safe precisely because the
    # target now answers 200 to a client with no language preference (see
    # nginx/njs/locale.js) — a 301 into a 302 would have been the same bug
    # wearing a different status code.
    #
    # `^~` (not a bare prefix) so this also beats the `\.(js|css|…)$` regex
    # location above for a path like `/en/app.js`. `rewrite` preserves any
    # deeper path AND the query string: `/en/` -> `/`, `/en/careers/` ->
    # `/careers/`, `/en/careers/x/?utm=1` -> `/careers/x/?utm=1`.
    location ^~ /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    # `$is_args$args` is NOT optional here, and is the one asymmetry between
    # these two blocks worth stating: `rewrite` re-appends the original query
    # string automatically (when the replacement contains no `?`), `return`
    # does not. Without it `/en?a=1` would 301 to a bare `/` and drop the
    # query — review round 1 caught exactly that.
    location = /en {
        return 301 /$is_args$args;
    }

    # ── SPA fallback + locale auto-redirect ─────────────────────────
    # task-infra-locale-edge: $locale_prefix / $locale_redirect_kill_switch /
    # $uri_is_prefixed come from the `map`/njs in nginx/conf.d/locale-detect.conf
    # (loaded http-wide via the wildcard `include` in nginx.conf). Full
    # design: scripts/devops/locale-routing-runbook.md.
    location / {
        # This location defines its own add_header (Vary below), which per
        # nginx's inheritance rule means it stops inheriting add_header from
        # the server level entirely — NOT just Vary, ALL of them (same
        # gotcha documented in conf.d/crm.conf). Re-include the security
        # headers explicitly so they are still genuinely present here.
        include /etc/nginx/conf.d/security-headers.conf;

        # AC B4 + security-review round 1 (MED-2): the response here
        # (redirect-or-passthrough) varies by Accept-Language and Cookie —
        # exactly the two request headers that participate in the locale
        # decision (see nginx/njs/locale.js) — declared unconditionally on
        # this whole location (not just the redirect branch) so caches never
        # serve a cross-locale response to the wrong visitor.
        # `CF-IPCountry` was listed here until the 2026-08-08 indexability
        # fix, when the geo tier it described was removed from the decision
        # (see nginx/njs/locale.js for the incident). A `Vary` naming a
        # header the response does NOT actually depend on is not harmless
        # padding: it tells every shared cache to key on a value that varies
        # per visitor, and it leaves the next reader believing geo still
        # decides something here. Vary lists what varies — nothing more.
        # Asset/extension locations above are unaffected (locale-independent,
        # long-cached).
        # CAVEAT (documented, not "fixed" — there is nothing more to fix on
        # the origin side): Cloudflare only honours `Vary: Accept-Encoding`
        # for cache-key purposes; if a CF cache rule is ever added for HTML
        # on this zone, `Vary` here will NOT stop CF from serving one
        # locale's response to everyone — see
        # scripts/devops/locale-routing-runbook.md "Vary / Cloudflare
        # caching caveat" for the operational mitigation (zone-level cache
        # bypass), which is the only real control for that scenario.
        add_header Vary "Accept-Language, Cookie" always;

        # code-review round (PR #423) + a confirmed nginx landmine found
        # while fixing it: `try_files` living in the SAME location as an
        # EXECUTED `if` (one whose condition is true, running a `set`)
        # loses correct directory-index fallback resolution for any
        # NON-root URI — verified empirically (isolated minimal repro):
        # `/` falls back to `/index.html` fine, but `/careers/` or any
        # nested path returns a bare 404 instead of reaching try_files'
        # final `/index.html` fallback, EVEN THOUGH the exact same `if`
        # body ran successfully for `/`. This is a long-documented nginx
        # "if is evil" interaction (gixy.org "if is evil" guide), not
        # specific to this file. Fix: move `try_files` OUT of this
        # location into the named location below, reached via the
        # `error_page 418 = @locale_fallback;` + `return 418;` idiom
        # (418 is an arbitrary internal-only marker, never sent to a
        # client — recognised and intercepted by `error_page` before
        # that happens). `recursive_error_pages on;` is REQUIRED for this
        # to work (without it, the internal redirect silently doesn't
        # re-enter location matching).
        error_page 418 = @locale_fallback;
        recursive_error_pages on;

        # Merge-order guard: only ever redirect if the SPECIFIC requested
        # page (not just the locale's root) actually has prerendered static
        # content in THIS image — checks
        # `$document_root$locale_prefix$request_path/index.html` (via `$uri`,
        # which per plan §1's `trailingSlash: 'always'` always ends in `/`
        # for every route this config ever redirects). Safe regardless of
        # merge order with feature/landing-i18n (the branch that adds the
        # real /uk//ru//es//pt/ static dirs) — until those directories land,
        # this `-f` check always fails and every request behaves exactly as
        # before (EN-only, no redirect, no 404). Two separate (non-nested)
        # `if` blocks — nginx does not support nested `if`.
        #
        # code-review round (PR #423): the ORIGINAL guard checked ONLY the
        # locale ROOT's index.html, not the specific deep path being
        # requested. Under a partial prerender (locale root exists, a
        # specific `/careers/<slug>/` does not yet), that guard would still
        # redirect — landing the visitor on a RU-prefixed URL that silently
        # serves EN content (no 404, no loop, just a language mismatch).
        # Checking the exact requested path — `${uri}index.html`, not a
        # fixed `/index.html` — closes this precisely rather than only
        # documenting a "locales must ship 1:1" assumption: it turned out to
        # be the same complexity as the root-only check (nginx's `$uri`
        # already carries the trailing-slash-normalised path), so there was
        # no reason to settle for the cheaper, less correct option.
        set $locale_guard_path "";
        if ($locale_prefix != "") {
            set $locale_guard_path $document_root$locale_prefix${uri}index.html;
        }
        if (-f $locale_guard_path) {
            # Repeats security-headers.conf + Vary explicitly: an `if`
            # block that defines its OWN add_header (Cache-Control below)
            # is subject to the SAME inheritance rule as a location —
            # verified empirically (the 302 response was missing Vary
            # entirely once Cache-Control was added here without this).
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Vary "Accept-Language, Cookie" always;
            # security-review round 1 (MED-2): 302s here previously carried
            # no explicit Cache-Control at all. RFC 9111 does not
            # heuristically cache a 302 without validators, so this was not
            # exploitable in practice, but relying on that as the ONLY
            # barrier (rather than stating the policy explicitly) was the
            # actual finding — make it explicit.
            add_header Cache-Control "private, no-store" always;
            return 302 $locale_prefix$request_uri;
        }

        return 418;
    }

    # Named location — see the `error_page 418` comment in `location /`
    # above for why `try_files` lives HERE instead of inline there. Not
    # directly reachable by any client request (named locations only match
    # via internal redirects), so repeating the headers here is required
    # for them to be genuinely present on the responses this serves — they
    # are NOT inherited from `location /` (sibling locations, not
    # parent/child).
    #
    # task-soft-404-and-noindex.md — `=404` (not `/index.html`) is the fix.
    # The THIRD fallback candidate used to be the prerendered HOME page:
    # for a path with no matching static file, nginx served `index.html`'s
    # bytes — 200 OK, home's own `<title>`/`rel=canonical` — under a URL
    # that is not home. Google Search Console's "запрещено тегом noindex"
    # report traces to exactly this: after that mis-served 200, the SPA
    # hydrates, `__root.tsx`'s `notFoundComponent` renders (correctly) and
    # sets `noindex, nofollow` — so ONE URL told Googlebot three different
    # things in sequence (home / indexable / not indexable), and Googlebot,
    # which executes JS, recorded the LAST one against a URL it had already
    # fetched with a 200. `curl` (no JS) only ever saw the first two, which
    # is why the initial investigation of this defect found nothing.
    # `noindex` was never wrong for the 404 page itself — the defect was
    # that a real 200 preceded it. `=404` here makes the HTTP status honest
    # BEFORE any markup is even considered, closing the gap `noindex` alone
    # cannot: a 200 removes a URL from indexing candidacy by asserting it
    # exists; a 404 does the same by asserting it does not — no crawler
    # needs to run JS to draw the right conclusion either way.
    location @locale_fallback {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        try_files $uri $uri/ =404;
    }

    # task-soft-404-and-noindex.md — `dist/404.html` (scripts/prerender.mjs)
    # is ALREADY the fully-hydrated, correctly-`noindex`d "Page not found"
    # document (routes/__root.tsx `notFoundComponent`), captured with real
    # browser JS execution at build time — see that script's module doc.
    # `error_page` reroutes any 404 generated inside this server block
    # (the `=404` above, and `/site.webmanifest`'s own `return 404`) to
    # serve ITS content while PRESERVING the 404 status (no `=200`
    # override) — a crawler gets the honest status AND honest markup in
    # the SAME response, nothing left for a later hydration pass to
    # contradict. Cache-Control mirrors the `~ /index\.html$` location
    # above (no-store): an error response is exactly the wrong thing for
    # an intermediate cache to hold onto past the next deploy (this task's
    # own stated risk — a stale 404 must never be able to outlive a page
    # that starts existing again).
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

# ── HTTPS (port 443) — Cloudflare Origin cert (SSL mode: Full strict) ──────
server {
    listen 443 ssl;
    http2 on;
    server_name cheekycheese.tech www.cheekycheese.tech;

    ssl_certificate     /etc/nginx/certs/cheekycheese.tech.crt;
    ssl_certificate_key /etc/nginx/certs/cheekycheese.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # task-infra-aop-observation (docs/runbooks/origin-mtls-and-firewall.md
    # §2а): Authenticated Origin Pulls, OBSERVATION phase — mirrors
    # crm.conf's :443 block, see its comment for the full rationale
    # (no-cert and valid-cert both pass through normally; a presented-but-
    # invalid cert does not, see the caveat there; the CA file is
    # runtime-mounted, not image-baked, and is stripped from
    # nginx/Dockerfile's build-time `nginx -t` test copy for that reason).
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional;

    root /usr/share/nginx/html/landing;
    index index.html;

    # security-review round 1 (PR #423, MED-1) — mirrors the :80 block above.
    absolute_redirect off;

    include /etc/nginx/conf.d/security-headers.conf;

    location ~ /\. {
        deny all;
    }

    # task-infra-webmanifest-mime: honest 404 instead of a fake manifest —
    # mirrors the :80 block above (nginx server blocks do not inherit
    # locations from each other, see this file's other duplicated blocks/
    # comments for the same reason). See the :80 block's comment for the
    # full rationale.
    location = /site.webmanifest {
        return 404;
    }

    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        # security-review round 1 (PR #423, MED-4) — mirrors the :80 block above.
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # security-review round 1 (PR #423, MED-3) + round 2 (MED-6) — mirrors
    # the :80 block above.
    location ~ /index\.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore (duplicated — not inherited per server). ──
    # security review (PR #437 follow-up, MED-2): generated from the
    # canonical nginx/cloudflare-ips.txt — see the :80 block's comment.
    include /etc/nginx/conf.d/cloudflare-real-ip-from.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # security review (PR #437 follow-up, HIGH-1) — mirrors the :80 block
    # above, see its comment for the full rationale.
    include /etc/nginx/snippets/origin-gate.conf;

    location /api/ {
        # MED-1 (security audit 2026-07-27) — mirrors the :80 block above,
        # see its comment for the full rationale.
        client_max_body_size 7m;

        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── /en/ — collapse the accidental duplicate (mirrors :80, see there,
    # including why `return` needs an explicit `$is_args$args` and `rewrite`
    # does not) ──
    location ^~ /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    location = /en {
        return 301 /$is_args$args;
    }

    # ── SPA fallback + locale auto-redirect ─────────────────────────
    # Mirrors the :80 server block above — see its comments for the full
    # rationale (task-infra-locale-edge / scripts/devops/locale-routing-
    # runbook.md). nginx server blocks do not inherit directives from each
    # other, so this is duplicated deliberately, same as everything else in
    # this file (real-IP restore, security headers, etc.).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;

        error_page 418 = @locale_fallback;
        recursive_error_pages on;

        set $locale_guard_path "";
        if ($locale_prefix != "") {
            set $locale_guard_path $document_root$locale_prefix${uri}index.html;
        }
        if (-f $locale_guard_path) {
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Vary "Accept-Language, Cookie" always;
            add_header Cache-Control "private, no-store" always;
            return 302 $locale_prefix$request_uri;
        }

        return 418;
    }

    # task-soft-404-and-noindex.md — see the :80 block's `@locale_fallback`
    # comment for the full rationale (mirrored here, not repeated).
    location @locale_fallback {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        try_files $uri $uri/ =404;
    }

    # task-soft-404-and-noindex.md — see the :80 block's comment above
    # `error_page 404` for the full rationale (mirrored here, not
    # repeated — nginx server blocks do not inherit from each other).
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
