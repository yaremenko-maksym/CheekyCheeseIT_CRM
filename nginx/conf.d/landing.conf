# ============================================================
# Landing — cheekycheese.tech
# Serves the static Vite SPA and reverse-proxies /api → api:3001.
# ============================================================

# ── HTTP (port 80) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cheekycheese.tech www.cheekycheese.tech;

    root /usr/share/nginx/html/landing;
    index index.html;

    # Security headers for static pages.
    include /etc/nginx/conf.d/security-headers.conf;

    # Deny access to dotfiles (.env, .git, etc.) — defense-in-depth even though
    # the static root (dist/) should never contain them.
    location ~ /\. {
        deny all;
    }

    # ── Cache strategy ─────────────────────────────────────────────
    # Hashed assets (JS/CSS with content hash in filename) are immutable.
    # index.html must always be revalidated so users get the latest SW/app.
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore ────────────────────────────────
    # Same CF CIDR block as in crm.conf — required in every server block.
    # CF IPv4 (update from https://www.cloudflare.com/ips-v4):
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # CF IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── API reverse-proxy ─────────────────────────────────────────
    # IMPORTANT: do NOT strip /api prefix — NestJS uses setGlobalPrefix('api')
    # and expects the full /api/... URI. proxy_pass without a trailing slash
    # preserves the original URI.
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # After set_real_ip_from above, $remote_addr is the real client IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Fastify cookie auth (JWT HttpOnly cookie).
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # All non-file routes serve index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS (port 443) — Cloudflare Origin cert (SSL mode: Full strict) ──────
server {
    listen 443 ssl;
    http2 on;
    server_name cheekycheese.tech www.cheekycheese.tech;

    ssl_certificate     /etc/nginx/certs/cheekycheese.tech.crt;
    ssl_certificate_key /etc/nginx/certs/cheekycheese.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html/landing;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore (duplicated — not inherited per server). ──
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
