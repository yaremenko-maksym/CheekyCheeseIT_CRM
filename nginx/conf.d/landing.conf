# ============================================================
# Landing — cheekycheese.tech
# Serves the static Vite SPA and reverse-proxies /api → api:3001.
# ============================================================

# ── HTTP (port 80) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cheekycheese.tech www.cheekycheese.tech;

    root /usr/share/nginx/html/landing;
    index index.html;

    # Security headers for static pages.
    include /etc/nginx/conf.d/security-headers.conf;

    # Deny access to dotfiles (.env, .git, etc.) — defense-in-depth even though
    # the static root (dist/) should never contain them.
    location ~ /\. {
        deny all;
    }

    # ── Cache strategy ─────────────────────────────────────────────
    # Hashed assets (JS/CSS with content hash in filename) are immutable.
    # index.html must always be revalidated so users get the latest SW/app.
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── API reverse-proxy ─────────────────────────────────────────
    # IMPORTANT: do NOT strip /api prefix — NestJS uses setGlobalPrefix('api')
    # and expects the full /api/... URI. proxy_pass without a trailing slash
    # preserves the original URI.
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE (not append) X-Forwarded-For with the real connection IP.
        # The api runs with TRUST_PROXY=true and reads req.ip from XFF; that IP
        # is recorded as legal proof on contract/ToS signatures. nginx is the
        # only ingress (api has no published port), so overwriting here makes
        # the value un-spoofable by clients.
        # NOTE: if you add an edge CDN/proxy (e.g. Cloudflare) IN FRONT of this
        # nginx, switch this back to $proxy_add_x_forwarded_for and configure
        # `set_real_ip_from <edge-cidr>;` so the real client IP is preserved.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Fastify cookie auth (JWT HttpOnly cookie).
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback ──────────────────────────────────────────────
    # All non-file routes serve index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

