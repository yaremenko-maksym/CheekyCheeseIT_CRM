# ============================================================
# Landing — cheekycheese.tech
# Serves the static Vite SPA and reverse-proxies /api → api:3001.
#
# task-infra-seo-gates: robots.txt / sitemap.xml are served straight from
# apps/landing/dist (Vite copies apps/landing/public/* to the dist root at
# build time — task-landing-seo-prerender adds those files there). There is
# INTENTIONALLY no dedicated `location = /robots.txt` / `location = /sitemap.xml`
# block here — no location in this file matches the `.txt` / `.xml` extensions
# (the cache-control regex below only covers js/css/fonts/images), so both
# fall through to the SPA-fallback `location /` and try_files finds and serves
# the real static file before ever reaching the `/index.html` fallback. Do NOT
# add a location for these paths unless you also need to change their caching
# behaviour — an empty/misrouted robots.txt here would accidentally block ALL
# crawlers from the landing page it is supposed to keep indexable. This same
# fall-through mechanism is what will serve `sitemap-jobs.xml` (AC B8, task-
# infra-locale-edge) once it exists in the dist — nginx's stock mime.types
# already maps `.xml` -> `text/xml` and `.txt` -> `text/plain`, verified
# against the `nginx:1.27-alpine` base image, so no extra location/content-
# type config is needed here for that file either.
#
# task-infra-locale-edge: edge locale auto-redirect (plan-landing-i18n-seo.md
# §2, AC B1-B5) is implemented via `map` directives in
# nginx/conf.d/locale-detect.conf ($locale_prefix) plus the `if`/`return 302`
# block inside `location /` below. Full design + emergency kill-switch +
# bot-safety verification steps: scripts/devops/locale-routing-runbook.md.
# ============================================================

# ── HTTP (port 80) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cheekycheese.tech www.cheekycheese.tech;

    root /usr/share/nginx/html/landing;
    index index.html;

    # Security headers for static pages.
    include /etc/nginx/conf.d/security-headers.conf;

    # task-infra-locale-edge (AC B6/B7): IndexNow key file + Bing/Yandex
    # verification files — generated (or left a no-op empty file) at image
    # build time by nginx/Dockerfile from optional build-args. `location =`
    # blocks match by exact request URI regardless of where the `include`
    # appears in the server block, so placement here vs elsewhere makes no
    # functional difference. See scripts/devops/locale-routing-runbook.md.
    include /etc/nginx/snippets/verification-files.conf;

    # Deny access to dotfiles (.env, .git, etc.) — defense-in-depth even though
    # the static root (dist/) should never contain them.
    location ~ /\. {
        deny all;
    }

    # ── Cache strategy ─────────────────────────────────────────────
    # Hashed assets (JS/CSS with content hash in filename) are immutable.
    # index.html must always be revalidated so users get the latest SW/app.
    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        # task-infra-locale-edge (AC B4): the final response for the true
        # "/" root varies by Accept-Language/Cookie (a locale redirect may
        # or may not have fired upstream in `location /` before nginx's
        # index-module internal-redirects here) — declared explicitly since
        # this location defines its own add_header set (see the inheritance
        # note on `location /` below for why that matters). While here:
        # this location ALREADY defined its own add_header (Cache-Control /
        # Pragma) before this change, so it was ALREADY silently dropping
        # the server-level security-headers.conf include (same inheritance
        # rule) — a pre-existing gap this PR's Vary work happens to touch;
        # re-including it fixes that too (verified empirically: curl
        # against this exact block was missing HSTS/CSP/X-Frame-Options
        # before this line was added). NOT re-auditing the rest of this
        # file for the same class of bug — out of scope for task-infra-
        # locale-edge (B1-B8); flagged separately for the owner.
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore ────────────────────────────────
    # Same CF CIDR block as in crm.conf — required in every server block.
    # CF IPv4 (update from https://www.cloudflare.com/ips-v4):
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # CF IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── API reverse-proxy ─────────────────────────────────────────
    # IMPORTANT: do NOT strip /api prefix — NestJS uses setGlobalPrefix('api')
    # and expects the full /api/... URI. proxy_pass without a trailing slash
    # preserves the original URI.
    location /api/ {
        proxy_pass http://api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # After set_real_ip_from above, $remote_addr is the real client IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Fastify cookie auth (JWT HttpOnly cookie).
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback + locale auto-redirect ─────────────────────────
    # task-infra-locale-edge: $locale_prefix / $locale_redirect_kill_switch /
    # $uri_is_prefixed come from the `map` directives in
    # nginx/conf.d/locale-detect.conf (loaded http-wide via the wildcard
    # `include` in nginx.conf). Full design: scripts/devops/locale-routing-
    # runbook.md.
    location / {
        # This location defines its own add_header (Vary below), which per
        # nginx's inheritance rule means it stops inheriting add_header from
        # the server level entirely — NOT just Vary, ALL of them (same
        # gotcha documented in conf.d/crm.conf). Re-include the security
        # headers explicitly so they are still genuinely present here.
        include /etc/nginx/conf.d/security-headers.conf;

        # AC B4: the response here (redirect-or-passthrough) varies by
        # Accept-Language/Cookie — declare unconditionally on this whole
        # location (not just the redirect branch) so caches never serve a
        # cross-locale response to the wrong visitor. Asset/extension
        # locations above are unaffected (locale-independent, long-cached).
        add_header Vary "Accept-Language, Cookie" always;

        # Merge-order guard: only ever redirect if the target locale's
        # prerendered index actually exists in THIS image. Safe regardless
        # of merge order with feature/landing-i18n (the branch that adds the
        # real /uk//ru//es//pt/ static dirs) — until those directories land,
        # this `-f` check always fails and every request behaves exactly as
        # before (EN-only, no redirect, no 404). Two separate (non-nested)
        # `if` blocks — nginx does not support nested `if`.
        set $locale_guard_path "";
        if ($locale_prefix != "") {
            set $locale_guard_path $document_root$locale_prefix/index.html;
        }
        if (-f $locale_guard_path) {
            return 302 $locale_prefix$request_uri;
        }

        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS (port 443) — Cloudflare Origin cert (SSL mode: Full strict) ──────
server {
    listen 443 ssl;
    http2 on;
    server_name cheekycheese.tech www.cheekycheese.tech;

    ssl_certificate     /etc/nginx/certs/cheekycheese.tech.crt;
    ssl_certificate_key /etc/nginx/certs/cheekycheese.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html/landing;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # task-infra-locale-edge (AC B6/B7) — mirrors the :80 block above.
    include /etc/nginx/snippets/verification-files.conf;

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|woff2?|png|svg|ico|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        # task-infra-locale-edge (AC B4): the final response for the true
        # "/" root varies by Accept-Language/Cookie (a locale redirect may
        # or may not have fired upstream in `location /` before nginx's
        # index-module internal-redirects here) — declared explicitly since
        # this location defines its own add_header set (see the inheritance
        # note on `location /` below for why that matters). While here:
        # this location ALREADY defined its own add_header (Cache-Control /
        # Pragma) before this change, so it was ALREADY silently dropping
        # the server-level security-headers.conf include (same inheritance
        # rule) — a pre-existing gap this PR's Vary work happens to touch;
        # re-including it fixes that too (verified empirically: curl
        # against this exact block was missing HSTS/CSP/X-Frame-Options
        # before this line was added). NOT re-auditing the rest of this
        # file for the same class of bug — out of scope for task-infra-
        # locale-edge (B1-B8); flagged separately for the owner.
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Cloudflare real-IP restore (duplicated — not inherited per server). ──
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback + locale auto-redirect ─────────────────────────
    # Mirrors the :80 server block above — see its comments for the full
    # rationale (task-infra-locale-edge / scripts/devops/locale-routing-
    # runbook.md). nginx server blocks do not inherit directives from each
    # other, so this is duplicated deliberately, same as everything else in
    # this file (real-IP restore, security headers, etc.).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Vary "Accept-Language, Cookie" always;

        set $locale_guard_path "";
        if ($locale_prefix != "") {
            set $locale_guard_path $document_root$locale_prefix/index.html;
        }
        if (-f $locale_guard_path) {
            return 302 $locale_prefix$request_uri;
        }

        try_files $uri $uri/ /index.html;
    }
}
