# ============================================================
# Security headers — included by each server block via:
#   include /etc/nginx/conf.d/security-headers.conf;
#
# CSP note: the API (NestJS + @fastify/helmet) sets its own CSP on API
# responses. This block covers only static HTML/CSS/JS served by nginx.
# We set a baseline CSP here; helmet's CSP takes precedence for /api/*
# responses (nginx proxy_pass passes helmet headers through).
# ============================================================

# HSTS: 1 year, include subdomains. Uncomment when TLS is active.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options   "nosniff"                          always;
add_header X-Frame-Options          "DENY"                             always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

# Baseline CSP for static pages served by nginx.
# The CRM SPA uses Vite PWA (registerSW.js = script-src 'self') and
# @fastify/helmet sets the full production CSP on /api/* responses.
# blob: is needed for PDF viewer iframe (see main.ts frameSrc).
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self';"
    always;
