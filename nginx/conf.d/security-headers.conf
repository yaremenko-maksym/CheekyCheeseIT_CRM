# ============================================================
# Security headers — included by each server block via:
#   include /etc/nginx/conf.d/security-headers.conf;
#
# CSP note: the API (NestJS + @fastify/helmet) sets its own CSP on API
# responses. This block covers only static HTML/CSS/JS served by nginx.
# We set a baseline CSP here; helmet's CSP takes precedence for /api/*
# responses (nginx proxy_pass passes helmet headers through).
# ============================================================

# HSTS: 1 year, include subdomains. Active now that TLS (CF Origin cert) is live.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options   "nosniff"                          always;
add_header X-Frame-Options          "DENY"                             always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

# CSP for static pages served by nginx — value is PER-DOMAIN ($csp_value),
# resolved by the `map $server_name $csp_value { ... }` block in
# nginx/conf.d/csp-map.conf (see that file for the full rationale: `map`
# cannot live in this file because this file is `include`d inside
# `location` blocks, where `map` is not a valid context).
# The CRM SPA uses Vite PWA (registerSW.js = script-src 'self') and
# @fastify/helmet sets the full production CSP on /api/* responses.
# blob: is needed for PDF viewer iframe (see main.ts frameSrc).
#
# Report-Only rollout (security review round 1, PR #429; single-variable
# switch, task-csp-reports-and-flip Part B): $csp_enforcing / $csp_report_only
# (from csp-map.conf, both derived from ONE $csp_mode/CRM_CSP_MODE source of
# truth) route $csp_value to ONE of the two header names below, per domain —
# never both. `add_header` silently omits a header whose value is the empty
# string (documented ngx_http_headers_module behaviour, verified empirically
# against this exact config), so exactly one of these two actually reaches
# the client for any given domain. See csp-map.conf's "Report-Only rollout
# switch" comment for which domain is in which mode today and how to flip it.
add_header Content-Security-Policy $csp_enforcing always;
add_header Content-Security-Policy-Report-Only $csp_report_only always;

# task-csp-reports-and-flip (Part B): Reporting-Endpoints — declares the
# `csp-endpoint` name that CRM's CSP `report-to` directive (csp-map.conf)
# references. `$reporting_endpoints_header` (csp-map.conf) is CRM-only —
# empty for every other domain (landing has no collector wired), and
# `add_header` omits the header entirely on empty, same mechanism as the CSP
# switch above. Sent regardless of CRM_CSP_MODE (report-only AND enforcing
# both support violation reporting — only the CSP header's NAME differs
# between the two modes, not whether reports are collected).
add_header Reporting-Endpoints $reporting_endpoints_header always;
