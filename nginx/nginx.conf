# ============================================================
# nginx.conf — main configuration
# Production reverse-proxy for CheekyCheeseIT CRM
#
# Topology:
#   cheekycheese.tech        → Landing SPA (static)  + /api → api:3001
#   app.cheekycheese.tech    → CRM SPA    (static)  + /api → api:3001
#
# TLS: blocks with listen 443 ssl are commented out.
# To enable TLS: uncomment the 443 server blocks in conf.d/*.conf,
# populate /etc/nginx/certs/ with your certificates (Let's Encrypt via
# certbot or Cloudflare-issued), then reload nginx.
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not leak the nginx version in responses / error pages (fingerprinting).
    server_tokens off;

    # Access log with combined format.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security defaults (applied in server blocks below) ─────────
    # X-Content-Type-Options, X-Frame-Options, etc. are set per-server
    # to allow fine-grained control (e.g. CRM vs Landing may differ).

    # ── Upstream ───────────────────────────────────────────────────
    # "api" resolves to the Docker Compose service name.
    upstream api_upstream {
        server api:3001;
        keepalive 16;
    }

    # ── Include per-domain server blocks ───────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
