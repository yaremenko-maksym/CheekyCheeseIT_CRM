# ============================================================
# nginx.conf — main configuration
# Production reverse-proxy for CheekyCheeseIT CRM
#
# Topology:
#   cheekycheese.tech        → Landing SPA (static)  + /api → api:3001
#   app.cheekycheese.tech    → CRM SPA    (static)  + /api → api:3001
#
# TLS: blocks with listen 443 ssl are commented out.
# To enable TLS: uncomment the 443 server blocks in conf.d/*.conf,
# populate /etc/nginx/certs/ with your certificates (Let's Encrypt via
# certbot or Cloudflare-issued), then reload nginx.
# ============================================================

# task-infra-locale-edge: njs (nginx JavaScript module) — dynamic module
# bundled in the stock `nginx:1.27-alpine` image (no extra install/compile,
# verified: /usr/lib/nginx/modules/ngx_http_js_module.so ships in the base
# image, njs 0.8.10). Used ONLY for Accept-Language best-match parsing
# (nginx/njs/locale.js) — real q-value descending sort + exact-then-base-
# language matching per plan-landing-i18n-seo.md §2 is not expressible in
# nginx `map` (regex-only, no arithmetic/loops across an arbitrary number of
# comma-separated tags). Everything else (redirect target composition, the
# merge-order guard, the kill-switch) stays plain nginx `map`/`if` — see
# nginx/conf.d/locale-detect.conf and scripts/devops/locale-routing-runbook.md.
# `load_module` MUST be in the main context, before `events {}`.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not leak the nginx version in responses / error pages (fingerprinting).
    server_tokens off;

    # Access log with combined format.
    #
    # security review (PR #437 follow-up, MED-2 "soft-launch" ask,
    # 2026-07-27): appended origin_gate=/mode= as trailing fields —
    # additive only (existing log consumers that don't care about them are
    # unaffected; grepping ` origin_gate=0 ` finds exactly the requests
    # nginx/snippets/origin-gate.conf's origin gate WOULD reject once
    # flipped to enforce mode — origin_gate=0 means $origin_gate_allowed
    # (the geo lookup) came back false — without a separate log
    # file/stream that Docker's json-file driver wouldn't capture — see
    # that file's header comment for the full soft-launch rationale).
    # $origin_gate_allowed / $origin_gate_mode come from
    # nginx/conf.d/origin-gate-geo.conf (Dockerfile-generated) /
    # origin-gate-mode.conf — both loaded via the wildcard `include`
    # below; nginx resolves variables per-request regardless of which
    # file declared them relative to this line.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'origin_gate=$origin_gate_allowed mode=$origin_gate_mode';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security defaults (applied in server blocks below) ─────────
    # X-Content-Type-Options, X-Frame-Options, etc. are set per-server
    # to allow fine-grained control (e.g. CRM vs Landing may differ).

    # ── Upstream ───────────────────────────────────────────────────
    # "api" resolves to the Docker Compose service name.
    upstream api_upstream {
        server api:3001;
        keepalive 16;
    }

    # ── Include per-domain server blocks ───────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
