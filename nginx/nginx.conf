# ============================================================
# nginx.conf — main configuration
# Production reverse-proxy for CheekyCheeseIT CRM
#
# Topology:
#   cheekycheese.tech        → Landing SPA (static)  + /api → api:3001
#   app.cheekycheese.tech    → CRM SPA    (static)  + /api → api:3001
#
# TLS: blocks with listen 443 ssl are commented out.
# To enable TLS: uncomment the 443 server blocks in conf.d/*.conf,
# populate /etc/nginx/certs/ with your certificates (Let's Encrypt via
# certbot or Cloudflare-issued), then reload nginx.
# ============================================================

# task-infra-locale-edge: njs (nginx JavaScript module) — dynamic module
# bundled in the stock `nginx:1.27-alpine` image (no extra install/compile,
# verified: /usr/lib/nginx/modules/ngx_http_js_module.so ships in the base
# image, njs 0.8.10). Used ONLY for Accept-Language best-match parsing
# (nginx/njs/locale.js) — real q-value descending sort + exact-then-base-
# language matching per plan-landing-i18n-seo.md §2 is not expressible in
# nginx `map` (regex-only, no arithmetic/loops across an arbitrary number of
# comma-separated tags). Everything else (redirect target composition, the
# merge-order guard, the kill-switch) stays plain nginx `map`/`if` — see
# nginx/conf.d/locale-detect.conf and scripts/devops/locale-routing-runbook.md.
# `load_module` MUST be in the main context, before `events {}`.
load_module modules/ngx_http_js_module.so;

# task-infra-brotli-static: out-of-tree dynamic module (google/ngx_brotli,
# built in nginx/Dockerfile's `brotli-builder` stage — stock nginx ships gzip
# only, no brotli support at all). STATIC module only (serves the `.br`
# siblings `nginx/Dockerfile`'s `static-compress` stage pre-compresses at
# `docker build` time) — mirrors the built-in `gzip_static` module below;
# deliberately NOT the on-the-fly filter module — see brotli-builder's
# comment in nginx/Dockerfile for the measured reasoning (best compression
# ratio needs brotli quality 11, which is far too slow to run synchronously
# per request; this project's static assets are 100% build-time artifacts,
# so paying that cost once at build time and serving the fixed result on
# every request is strictly better here).
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;

    # task-infra-webmanifest-mime: extend the stock mime.types table with
    # `.webmanifest` -> `application/manifest+json` (the type the Web App
    # Manifest spec requires — https://www.w3.org/TR/appmanifest/#media-type-
    # registration). Verified against this exact base image
    # (`nginx:1.27-alpine`'s bundled /etc/nginx/mime.types) that `.webmanifest`
    # is NOT one of its entries — every request for `/site.webmanifest`
    # (apps/web/public/site.webmanifest, served via crm.conf's SPA
    # `location /` -> try_files, since it is not one of the extensions the
    # cache-control regex location matches either) was falling through to
    # `default_type` below, i.e. `application/octet-stream`. Browsers may
    # silently reject a manifest served with the wrong Content-Type — on
    # mobile this is what supplies the tab/PWA icon and the "Add to Home
    # Screen" name, so this was traced as the root cause of
    # app.cheekycheese.tech/site.webmanifest losing its icon in production
    # (curl -I showed `200 application/octet-stream` before this change).
    #
    # MUST stay in the SAME context (this http{} block) as the `include`
    # directly above, with nothing but this block in between — a `types {}`
    # block APPENDS to the types table already built in its OWN context when
    # declared right after `include mime.types;` in that same context
    # (confirmed: nginx trac #738 — "the correct way to extend mime.types
    # with types is to include it in the same section"). A `types {}` block
    # declared in a DIFFERENT context (e.g. one added per server{} block in
    # crm.conf/landing.conf instead of here) would instead REPLACE the
    # inherited table wholesale for that context, silently reverting every
    # other extension (js/css/svg/png/...) served by that server block back
    # to octet-stream — this single http-level block, applied once to every
    # server block below via normal inheritance, avoids that trap entirely.
    types {
        application/manifest+json webmanifest;
    }

    default_type  application/octet-stream;

    # Do not leak the nginx version in responses / error pages (fingerprinting).
    server_tokens off;

    # Access log with combined format.
    #
    # security review (PR #437 follow-up, MED-2 "soft-launch" ask,
    # 2026-07-27): appended origin_gate=/mode= as trailing fields —
    # additive only (existing log consumers that don't care about them are
    # unaffected; grepping ` origin_gate=0 ` finds exactly the requests
    # nginx/snippets/origin-gate.conf's origin gate WOULD reject once
    # flipped to enforce mode — origin_gate=0 means $origin_gate_allowed
    # (the geo lookup) came back false — without a separate log
    # file/stream that Docker's json-file driver wouldn't capture — see
    # that file's header comment for the full soft-launch rationale).
    # $origin_gate_allowed / $origin_gate_mode come from
    # nginx/conf.d/origin-gate-geo.conf (Dockerfile-generated) /
    # origin-gate-mode.conf — both loaded via the wildcard `include`
    # below; nginx resolves variables per-request regardless of which
    # file declared them relative to this line.
    #
    # security review (PR #439 follow-up, MED-2, 2026-07-31): added
    # peer=$realip_remote_addr. $remote_addr at the start of this line is
    # the POST-realip-substitution address (the visitor's own real IP once
    # Cloudflare's CF-Connecting-IP header has been applied — see
    # nginx/snippets/origin-gate.conf) — useful on its own, but it is NOT
    # the address the origin gate's decision (origin_gate=) was actually
    # made against. Without peer=, an observation-window line reading
    # `origin_gate=0` gives no way to tell "Cloudflare published a new
    # range our nginx/cloudflare-ips.txt doesn't have yet" (peer would be a
    # CF-looking address once cross-referenced against Cloudflare's
    # published ranges) apart from "someone is hitting the origin directly,
    # bypassing Cloudflare entirely" (peer would be an arbitrary public
    # IP) — exactly the distinction the observe window exists to make
    # before flipping ORIGIN_GATE_MODE to enforce (see
    # nginx/conf.d/origin-gate-mode.conf's header comment).
    #
    # task-infra-aop-observation (docs/runbooks/origin-mtls-and-firewall.md
    # §2а): added client_verify=$ssl_client_verify — nginx's built-in
    # variable holding the Authenticated-Origin-Pulls verification result
    # for THIS request ("SUCCESS", "NONE" — no cert presented, "FAILED:
    # <reason>", or "NONE" on a plaintext :80 request, where TLS/client
    # certs do not apply at all). `ssl_verify_client optional` (see
    # crm.conf/landing.conf/default-server.conf's :443 blocks) never
    # rejects on this value during the observation phase — this field is
    # what the owner reads to decide when it is safe to flip to `on` (see
    # the runbook's log-reading command).
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'origin_gate=$origin_gate_allowed mode=$origin_gate_mode peer=$realip_remote_addr '
                      'client_verify=$ssl_client_verify';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ── Compression ────────────────────────────────────────────────
    # On-the-fly gzip — unchanged, still the fallback for anything without a
    # pre-compressed sibling (proxied /api/ responses, the CRM's inline
    # `return 200` robots.txt, any static file outside the extension list
    # nginx/Dockerfile's `static-compress` stage covers).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # task-infra-brotli-static: serve the pre-compressed `.gz`/`.br` siblings
    # nginx/Dockerfile's `static-compress` stage writes alongside every JS/
    # CSS/HTML/SVG/XML/JSON/TXT file in both SPA dists — zero added
    # per-request CPU (unlike the `gzip on;` filter above, which re-compresses
    # from scratch on every response). Both are BUILT-IN to this exact
    # sibling-file mechanism: `gzip_static` ships in stock nginx
    # (`--with-http_gzip_static_module`, verified via `nginx -V` on this
    # base image); `brotli_static` is the out-of-tree module loaded above.
    # Falls through cleanly to `gzip on;`/uncompressed when no sibling exists
    # (e.g. a file type this task's precompression step doesn't cover, or the
    # IndexNow/Bing/Yandex verification files nginx/Dockerfile writes AFTER
    # the static-compress copy) — no location-level changes needed in
    # conf.d/crm.conf or landing.conf: `gzip_static`/`brotli_static` are
    # ordinary directives that inherit into every location exactly like any
    # other directive (NOT subject to the `add_header`-only inheritance-reset
    # gotcha documented throughout crm.conf/landing.conf — that rule is
    # specific to `add_header`).
    gzip_static on;
    brotli_static on;

    # ── Security defaults (applied in server blocks below) ─────────
    # X-Content-Type-Options, X-Frame-Options, etc. are set per-server
    # to allow fine-grained control (e.g. CRM vs Landing may differ).

    # ── Upstream ───────────────────────────────────────────────────
    # "api" resolves to the Docker Compose service name.
    upstream api_upstream {
        server api:3001;
        keepalive 16;
    }

    # ── Include per-domain server blocks ───────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
