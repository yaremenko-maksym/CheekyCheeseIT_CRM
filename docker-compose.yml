services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5432:5432' # loopback only — dev DB creds are in the repo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_user -d crm_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379' # loopback only
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object storage for documents (PHASE 6).
  # Dev only. Prod uses Cloudflare R2 (docs/runbooks/s3-storage.md).
  # RustFS is the S3 stand for CI/dev (owner decision 2026-09-24): the
  # previous stand's images became unpullable everywhere (quay.io 401,
  # dl.min.io 410, Docker Hub 404) and broke E2E on every PR. RustFS —
  # Apache-2.0, active, S3-compatible, Rust — https://github.com/rustfs/rustfs.
  # Pinned by multi-arch index digest (amd64+arm64), tag 1.0.0, verified
  # 2026-09-24 against https://hub.docker.com/r/rustfs/rustfs.
  # Console: http://localhost:9001. Credentials below are dev-only, NOT the
  # well-known `rustfsadmin` default (RustFS docs explicitly warn against it).
  s3:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    ports:
      - '127.0.0.1:9000:9000' # S3 API — loopback only, dev creds are in the repo
      - '127.0.0.1:9001:9001' # Web console — loopback only
    environment:
      RUSTFS_ACCESS_KEY: crmdevaccesskey
      RUSTFS_SECRET_KEY: crmdevsecretkey
      # Browser CORS for presigned-URL fetches from the web dev server —
      # apps/web/app/hooks/use-document-blob.ts does window.fetch(presignedUrl).
      # Verified locally: curl -H "Origin: http://localhost:3000" against a
      # presigned GET returns Access-Control-Allow-Origin (2026-09-24).
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - s3_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot bootstrap: creates bucket `crm-documents` on first compose-up.
  # `aws s3 mb` against RustFS is idempotent by itself (verified locally,
  # re-run exits 0) — no `--ignore-existing`-style flag needed.
  s3-bootstrap:
    image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: crmdevaccesskey
      AWS_SECRET_ACCESS_KEY: crmdevsecretkey
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['aws']
    command:
      - --endpoint-url
      - http://s3:9000
      - s3
      - mb
      - s3://crm-documents

volumes:
  postgres_data:
  s3_data:
