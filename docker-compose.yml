services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm_user -d crm_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object storage for documents (PHASE 6).
  # Dev only. Prod uses AWS S3 in eu-central-1.
  # Console: http://localhost:9001 (login: minioadmin / minioadmin).
  # Pinned quay.io images went unreachable ~2026-09-24 13:09 UTC
  # (quay.io/api/v1/repository/minio/minio -> 401, manifest pulls -> 401;
  # other quay.io repos still 200 — not a quay.io-wide outage). Docker Hub's
  # `minio/minio` / `minio/mc` repos 404 anonymous pulls, and dl.min.io's
  # binary archive returns 410 Gone for every past release — upstream MinIO
  # has no anonymously-pullable source left. `bitnamilegacy/minio` is the
  # last Bitnami build before the 2025-08-19 image freeze — same MinIO
  # engine, still pullable anonymously, multi-arch (amd64+arm64). Pinned by
  # digest (the manifest-list index, not a single-arch layer); tag
  # 2025.7.23-debian-12-r5, verified 2026-09-24.
  #
  # No `command:` override here (unlike the previous image): the Bitnami
  # entrypoint only runs its init step (root user/password + default bucket)
  # when invoked via its own bundled run.sh, so overriding the command with
  # e.g. `server /data ...` would silently skip bucket creation. Also note
  # the data dir moved from `/data` (old image) to the Bitnami default
  # `/bitnami/minio/data` — the volume mount below follows that; mounting a
  # fresh Docker-managed volume at `/data` instead fails with
  # "Permission denied" because that path isn't owned by the image's
  # non-root user (confirmed locally).
  minio:
    image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: crm-documents
      # Bitnami defaults the web console to off (upstream MinIO defaults it
      # on) — set explicitly to keep the console usable, per the comment above.
      MINIO_BROWSER: 'on'
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
