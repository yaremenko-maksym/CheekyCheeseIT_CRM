name: Check Skill Registry

# Аддитивный процессный гейт: каталог project-local скиллов в
# .claude/rules/common/skills-invocation.md обязан совпадать с содержимым
# .claude/skills/.
#
# Зачем именно CI. 2026-07-28 mandatory-триггер ссылался на скилл, которого нет
# на диске. Отказ был молчаливым — `Skill` падал в рантайме живого диспатча, на
# тех самых finance/auth PR, которые триггер и должен защищать. Расхождение
# должно краснеть здесь, а не всплывать в проде пайплайна.
#
# Ссылки вида `<pack>:<skill>` НЕ проверяются: у раннера нет ~/.claude/plugins
# оператора. Для них остаётся процедурная сверка (skills-invocation.md).

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/rules/common/skills-invocation.md'
      - 'scripts/architect/check-skill-registry.mjs'
      - '.github/workflows/check-skill-registry.yml'

jobs:
  check:
    name: Skill registry matches disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registry vs disk
        run: node scripts/architect/check-skill-registry.mjs
