name: AutoTest (Docs/PM Task → Tests)

# Triggered by PM with task_file, or manually for docs/business updates.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Path to task file from PM (e.g. docs/specs/tasks/task-e2e-auth.md) — optional'
        required: false
        type: string
      module:
        description: 'Module to update tests for (e.g. finance, team, interviews) — empty = full scan'
        required: false
        type: string
      target_branch:
        description: 'Existing branch to commit tests into (optional). If empty — create new test/ branch.'
        required: false
        type: string
        default: ''

concurrency:
  group: autotest-${{ inputs.task_file || inputs.module || github.ref }}
  cancel-in-progress: true

jobs:
  generate-tests:
    name: Generate/Update Tests from Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify task file exists
        if: inputs.task_file != ''
        env:
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          if [ ! -f "$TASK_FILE" ]; then
            echo "::error::Task file '$TASK_FILE' not found in repo HEAD"
            echo "::error::PM must commit and push the task file before running the workflow"
            exit 1
          fi
          echo "Task file verified: $TASK_FILE"

      - name: Resolve changed docs
        id: changed
        env:
          TASK_FILE: ${{ inputs.task_file }}
          MODULE_INPUT: ${{ inputs.module }}
        run: |
          if [ -n "$TASK_FILE" ]; then
            echo "files=$TASK_FILE" >> $GITHUB_OUTPUT
            echo "hint=pm-task" >> $GITHUB_OUTPUT
          elif [ -n "$MODULE_INPUT" ]; then
            echo "files=docs/business/modules/${MODULE_INPUT}.md" >> $GITHUB_OUTPUT
            echo "hint=${MODULE_INPUT}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff HEAD~1 --name-only -- docs/business/ | tr '\n' ' ')
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
            FIRST=$(git diff HEAD~1 --name-only -- docs/business/ | head -1 | xargs basename -s .md)
            echo "hint=${FIRST:-docs-update}" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.email "autotest-agent@github-actions"
          git config user.name "AutoTest Agent"

      - name: Setup branch (Режим 3 only)
        if: ${{ inputs.task_file != '' }}
        run: |
          if [ -n "$TARGET_BRANCH" ]; then
            git fetch origin
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
          else
            BRANCH=$(grep -m1 "^## Ветка:" "$TASK_FILE" 2>/dev/null | sed 's/## Ветка:[[:space:]]*//' | tr -d "[:space:]")
            if [ -z "$BRANCH" ]; then
              BRANCH="test/${TASK_HINT}"
            fi
            git checkout main && git pull origin main
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git checkout -b "$BRANCH" --track "origin/$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
          fi
          echo "Working on branch: $(git branch --show-current)"
        env:
          TASK_FILE: ${{ inputs.task_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TASK_HINT: ${{ inputs.module }}

      - name: Claude AutoTest Agent
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-autotest.md — структура тестов, паттерны, seed.

            TASK_FILE: "${{ inputs.task_file }}"
            TARGET_BRANCH: "${{ inputs.target_branch }}"
            MODULE: "${{ inputs.module }}"

            Если TASK_FILE не пустой — прочитай его и работай по описанной задаче (Режим 3: PM task-driven).
            В Режиме 3: ветка уже настроена workflow-ом. Проверь: git branch --show-current
            Если TASK_FILE пустой — работай в Режиме 2: docs/business Push.

            Изменились следующие бизнес-документы (для Режима 2):
            ${{ steps.changed.outputs.files }}
            hint для ветки: ${{ steps.changed.outputs.hint }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__playwright__browser_navigate
            mcp__playwright__browser_snapshot
            mcp__playwright__browser_take_screenshot
            mcp__github__create_pull_request
            mcp__github__create_branch
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__add_issue_comment
