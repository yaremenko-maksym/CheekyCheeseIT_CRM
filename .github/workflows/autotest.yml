name: AutoTest

on:
  push:
    paths:
      - 'docs/business/**'
    branches-ignore:
      - main  # only from feature branches (via PR merge triggers docs changes)
  workflow_dispatch:

concurrency:
  group: autotest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-tests:
    name: Generate/Update Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Get changed business docs
        id: changed
        run: |
          CHANGED=$(git diff HEAD~1 --name-only -- docs/business/ | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Claude AutoTest Agent
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — это твой полный системный промпт.

            Изменились следующие бизнес-документы:
            ${{ steps.changed.outputs.files }}

            Сгенерируй или обнови тесты согласно промпту в docs/agents/autotest.md.
            Создай PR с изменёнными тестами.

            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__postgres__query
            mcp__github__create_pull_request
            mcp__github__create_branch
