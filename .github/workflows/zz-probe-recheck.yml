name: ZZ Probe Recheck (throwaway, never merged)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run Flow Gate with github.token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/architect/flow-gate-recheck.mjs
