name: Lighthouse CI (landing)

# task-infra-seo-gates: SEO/perf regression gate for the public landing page
# (cheekycheese.tech). Only runs when a PR touches apps/landing/** — the CRM
# (apps/web) is intentionally deindexed (see nginx/conf.d/crm.conf) and is
# not a candidate for a Lighthouse/SEO score gate.
#
# Config: scripts/devops/lighthouserc.json (mobile + desktop share the same
# assertion thresholds; the `preset: desktop` override is applied per matrix
# leg via the --collect.settings.preset CLI flag, which deep-merges into the
# JSON config's `collect.settings`).
#
# @lhci/cli is invoked via `npx --yes` — intentionally NOT added to
# apps/landing/package.json or root package.json (see
# .claude/rules/common/version-pins.md — CI-only tooling stays out of the
# workspace dependency graph so it can't accidentally shift local dev/build
# behaviour). Version pinned in the `npx` command below; bump there only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/landing/**'
  workflow_dispatch: {}

concurrency:
  group: lighthouse-${{ github.event.pull_request.number || 'dispatch' }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # prerender.mjs (build:prerender) launches headless chromium via the
      # workspace `playwright` package — the CI runner has no browser binaries
      # by default, so install exactly the one browser the script needs.
      # Without this, chromium.launch() throws in CI (PR #398 review HIGH).
      - name: Install Playwright chromium
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @crm/shared build

      # Forward-compatible guard: task-landing-seo-prerender (Coder, parallel
      # branch feature/landing-seo-prerender) adds a `build:prerender` script
      # to apps/landing/package.json. Until that PR merges the script does not
      # exist — fall back to the plain `vite build` so this job stays green
      # and gates the CSR bundle's Lighthouse score regardless of merge order.
      # Mirrors the identical guard in nginx/Dockerfile — keep both in sync if
      # the contract (script name / env var) ever changes.
      - name: Build landing (prerender if available)
        env:
          PRERENDER_API_ORIGIN: https://cheekycheese.tech
        run: |
          if grep -q '"build:prerender"' apps/landing/package.json; then
            echo "==> build:prerender script found — building with SEO prerender"
            pnpm --filter @crm/landing build:prerender
          else
            echo "::warning::apps/landing/package.json has no build:prerender script yet — plain vite build (task-landing-seo-prerender not merged)"
            pnpm --filter @crm/landing build
          fi

      # lhci's built-in static server serves apps/landing/dist directly — no
      # separate `http-server`/`wait-on` install needed. `staticDistDir`
      # auto-discovers up to 5 HTML files in the dist root (covers both the
      # single-index CSR fallback above and multi-route prerendered output
      # once task-landing-seo-prerender lands).
      #
      # --collect.settings.preset=desktop is applied ONLY on the desktop leg
      # of the matrix; the mobile leg uses Lighthouse's default mobile
      # emulation (unset preset), matching the config file's base settings.
      - name: Run Lighthouse CI (${{ matrix.profile }})
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.profile }}" = "desktop" ]; then
            EXTRA_FLAGS="--collect.settings.preset=desktop"
          fi
          npx --yes @lhci/cli@0.15.1 autorun \
            --config=scripts/devops/lighthouserc.json \
            --upload.outputDir=".lighthouseci/${{ matrix.profile }}" \
            $EXTRA_FLAGS

      - name: Upload Lighthouse report (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ matrix.profile }}-${{ github.sha }}
          path: .lighthouseci/${{ matrix.profile }}
          retention-days: 7
