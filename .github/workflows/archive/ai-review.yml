name: AI Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 8)'
        required: true
        type: string

concurrency:
  group: ai-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 0: Re-dispatch — workflow_run → workflow_dispatch
  # claude-code-action@beta не поддерживает workflow_run event.
  # ─────────────────────────────────────────────
  redispatch:
    name: Re-dispatch as workflow_dispatch
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    permissions:
      actions: write
    steps:
      - name: Trigger workflow_dispatch with PR number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Re-dispatching ai-review.yml for PR #${PR}"
          gh workflow run ai-review.yml \
            --repo "$REPO" \
            -f pr_number="$PR"

  # ─────────────────────────────────────────────
  # Job 1: AutoTest — writes E2E tests FIRST
  # ─────────────────────────────────────────────
  autotest:
    name: AutoTest
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      checks: write

    env:
      # S3 / MinIO (PHASE 6) — dummy creds, чтобы AutoTest мог запускать pnpm test/typecheck.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Resolve PR number
        id: pr_ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            PR="$INPUT_PR"
          else
            PR="$WR_PR"
          fi
          if [ -z "$PR" ]; then
            echo "No PR associated with this CI run — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          HAS_LABEL=$(gh pr view "$PR" \
            --repo "$REPO" \
            --json labels --jq '[.labels[].name] | contains(["ai-review-ready"])')
          echo "pr=$PR" >> $GITHUB_OUTPUT
          echo "has_label=$HAS_LABEL" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Create Check Run — in_progress
        id: check_run
        if: steps.pr_ctx.outputs.skip != 'true' && steps.pr_ctx.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          CHECK_ID=$(gh api "repos/$REPO/check-runs" \
            --method POST \
            -f name="CI / AutoTest" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            --jq '.id')
          echo "check_id=$CHECK_ID" >> $GITHUB_OUTPUT

      - name: Get PR head ref
        id: pr_head
        if: steps.pr_ctx.outputs.skip != 'true' && steps.pr_ctx.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          REF=$(gh pr view "$PR" \
            --repo "$REPO" \
            --json headRefName --jq '.headRefName')
          echo "ref=${REF}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.pr_ctx.outputs.skip != 'true' && steps.pr_ctx.outputs.has_label == 'true'
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Configure git for AutoTest commits
        if: steps.pr_ctx.outputs.skip != 'true' && steps.pr_ctx.outputs.has_label == 'true'
        run: |
          git config user.email "autotest-agent@github-actions"
          git config user.name "AutoTest Agent"

      - name: Claude AutoTest
        if: steps.pr_ctx.outputs.skip != 'true' && steps.pr_ctx.outputs.has_label == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — полный системный промпт.
            Прочитай docs/agents/CLAUDE-autotest.md — структура тестов, паттерны, anti-patterns.
            Работай в РЕЖИМЕ 1: PR Post-Approval.

            Ты запускаешься ДО Code Review. Reviewer проверит и твои тесты тоже.

            ## ШАГ 1 — AC-first (ОБЯЗАТЕЛЬНО, до любого чтения кода)

            Получи список файлов PR: mcp__github__get_pull_request_files.
            Найди в теле PR ссылку на task-файл (формат: docs/specs/tasks/task-*.md).
            Если найден — прочитай раздел "Acceptance criteria".
            Каждый AC пункт = один обязательный тест-сценарий.

            ## ШАГ 2 — Разведка существующих тестов

            - mcp__ast-grep__find_code: найди тесты в apps/e2e/tests/ по модулю из PR
            - mcp__ast-grep__find_code_by_rule: найди все data-testid в изменённых компонентах
              (data-testid — единственные правильные селекторы)

            ## ШАГ 3 — Структура DOM (ОБЯЗАТЕЛЬНО для новых страниц/компонентов)

            Если PR содержит новые UI страницы или компоненты:
            - mcp__playwright__browser_navigate: открой страницу на localhost:3000
            - mcp__playwright__browser_snapshot: получи accessibility tree для правильных селекторов
            Не пиши тесты вслепую — снапшот даёт реальную DOM структуру.

            ## ШАГ 4 — Написание тестов

            ЗАПРЕЩЕНО: route.continue() (только route.fulfill()), page.getByText() без scope.
            ОБЯЗАТЕЛЬНО: scope getByText к page.locator('main'), data-testid для навигации.

            ## ШАГ 5 — No-op guard

            Перед коммитом: git diff --stat apps/e2e/tests/
            Если вывод пустой — тесты не созданы. Это ошибка, не коммить.

            ЕСЛИ тесты написаны успешно: закоммить и запушь их в ветку PR.

            ЕСЛИ найдена логическая ошибка в коде:
            1. Оставь REQUEST_CHANGES review через mcp__github__create_pull_request_review
            2. Создай пустой файл autotest-logic-error.flag (Write инструмент)
            НЕ коммить тесты при логической ошибке.

            PR: ${{ steps.pr_ctx.outputs.pr }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

      - name: Check AutoTest result
        id: check_result
        if: always()
        run: |
          if [ -f autotest-logic-error.flag ]; then
            echo "logic_error=true" >> $GITHUB_OUTPUT
            echo "AutoTest found logical error — signaling failure"
            exit 1
          fi
          echo "logic_error=false" >> $GITHUB_OUTPUT
          echo "AutoTest completed successfully"

      - name: Update Check Run — result
        if: always() && steps.check_run.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check_run.outputs.check_id }}
          REPO: ${{ github.repository }}
        run: |
          CONCLUSION="success"
          if [ -f autotest-logic-error.flag ]; then CONCLUSION="failure"; fi
          gh api "repos/$REPO/check-runs/$CHECK_ID" \
            --method PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION"

  # ─────────────────────────────────────────────
  # Job 2: Code Review — reviews code + AutoTest's tests
  # APPROVE → adds awaiting-pm-review label → PM picks up
  # REQUEST_CHANGES → trigger_coder job runs
  # ─────────────────────────────────────────────
  reviewer:
    name: Code Review
    runs-on: ubuntu-latest
    needs: [autotest]
    if: |
      always() &&
      needs.autotest.result == 'success'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write

    outputs:
      approved: ${{ steps.check_approved.outputs.approved }}
      review_state: ${{ steps.check_approved.outputs.review_state }}

    env:
      # S3 / MinIO (PHASE 6) — dummy creds, чтобы Reviewer мог запускать typecheck/lint.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Resolve PR number
        id: pr_ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            PR="$INPUT_PR"
          else
            PR="$WR_PR"
          fi
          echo "pr=$PR" >> $GITHUB_OUTPUT

      - name: Create Check Run — in_progress
        id: check_run
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          CHECK_ID=$(gh api "repos/$REPO/check-runs" \
            --method POST \
            -f name="AI Code Review" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            --jq '.id')
          echo "check_id=$CHECK_ID" >> $GITHUB_OUTPUT

      - name: Get PR head ref (latest — includes AutoTest commits)
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          REF=$(gh pr view "$PR" \
            --repo "$REPO" \
            --json headRefName --jq '.headRefName')
          echo "ref=${REF}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Check E2E health on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          BROKEN=$(gh issue list --repo "$REPO" \
            --label "e2e-broken" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$BROKEN" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "E2E на main сломаны (issue #${BROKEN}). AI Review не запущен — сначала исправьте E2E."
            exit 1
          fi

      - name: Dismiss stale CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Starting fresh review cycle" \
              2>/dev/null || true
          done

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: '*'
          mode: agent
          direct_prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/reviewer.md — полный системный промпт и чек-лист.
            Прочитай docs/agents/CLAUDE-reviewer.md — архитектурные решения и ограничения.

            ## ШАГ 1 — Контекст PR (ОБЯЗАТЕЛЬНО)

            Прочитай PR через mcp__github__get_pull_request.
            Получи список файлов: mcp__github__get_pull_request_files.
            Найди в body ссылку на task-файл (формат: docs/specs/tasks/task-*.md).
            Прочитай task-файл — раздел "Acceptance criteria".
            Каждый AC пункт = обязательная проверка.

            ## ШАГ 2 — Структурный анализ (ast-grep)

            - mcp__ast-grep__find_code: проверь что новые компоненты/сервисы следуют паттернам проекта
            - mcp__ast-grep__find_code_by_rule: найди все вхождения изменённых типов/функций (нет ли регрессий)

            ## ШАГ 3 — Линтинг (ОБЯЗАТЕЛЬНО через MCP)

            Запусти eslint MCP на все изменённые файлы:
            mcp__eslint__lint-files: { "filePaths": ["apps/api/src/...", "apps/web/app/..."] }
            Severity error = критичное нарушение → обязательный REQUEST_CHANGES.

            ## ШАГ 4 — Review

            ВАЖНО: AutoTest уже написал E2E тесты — проверь apps/e2e/tests/.
            Если тесты некорректны или не покрывают AC — укажи в review.

            Для каждого AC пункта явно укажи: ✅ реализован / ❌ не реализован.
            AC отсутствующие в коде → обязательно REQUEST_CHANGES.

            Inline комментарии ОБЯЗАТЕЛЬНЫ: для каждой проблемы передай path + position в
            mcp__github__create_pull_request_review — не только summary body.

            ОБЯЗАТЕЛЬНЫЙ финальный шаг — вызови mcp__github__create_pull_request_review:
            - event: "APPROVE" если нет критичных нарушений (включая тесты)
            - event: "REQUEST_CHANGES" если есть хотя бы одно критичное нарушение
            - body: полный текст review со всеми найденными проблемами

            После review, при APPROVE: создай пустой файл autotest-approved.flag (Write инструмент)

            PR: ${{ steps.pr_ctx.outputs.pr }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
            mcp__eslint__lint-files

      - name: Check reviewer decision
        id: check_approved
        if: always()
        run: |
          if [ -f autotest-approved.flag ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "review_state=APPROVED" >> $GITHUB_OUTPUT
            echo "Reviewer APPROVED — PM will pick up via awaiting-pm-review label"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "review_state=CHANGES_REQUESTED" >> $GITHUB_OUTPUT
            echo "Reviewer REQUEST_CHANGES — Coder will be triggered"
          fi

      - name: Add awaiting-pm-review label on APPROVE
        if: steps.check_approved.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr_ctx.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" --repo "$REPO" \
            --add-label "awaiting-pm-review"

      - name: Update Check Run — result
        if: always() && steps.check_run.outputs.check_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check_run.outputs.check_id }}
          REPO: ${{ github.repository }}
        run: |
          CONCLUSION="failure"
          if [ -f autotest-approved.flag ]; then CONCLUSION="success"; fi
          gh api "repos/$REPO/check-runs/$CHECK_ID" \
            --method PATCH \
            -f status="completed" \
            -f conclusion="$CONCLUSION"

  # ─────────────────────────────────────────────
  # Job 3: Trigger Coder on Reviewer REQUEST_CHANGES
  # Writes task-fix-pr-N.md to docs/specs/tasks/, passes task_file to coder.yml
  # ─────────────────────────────────────────────
  trigger_coder:
    name: Trigger Coder
    runs-on: ubuntu-latest
    needs: [autotest, reviewer]
    if: |
      always() &&
      needs.autotest.result == 'success' &&
      needs.reviewer.outputs.approved != 'true'
    permissions:
      contents: write
      actions: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "ci-pipeline@github-actions"
          git config user.name "AI Review Pipeline"

      - name: Verify actual CHANGES_REQUESTED review exists
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr_number }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            PR="$INPUT_PR"
          else
            PR="$WR_PR"
          fi
          echo "pr=$PR" >> $GITHUB_OUTPUT

          COUNT=$(gh api "repos/$REPO/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')

          if [ "$COUNT" = "0" ]; then
            echo "No CHANGES_REQUESTED review found — skipping Coder trigger."
            echo "has_review=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          REVIEW_BODY=$(gh api "repos/$REPO/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body')
          echo "has_review=true" >> $GITHUB_OUTPUT
          {
            echo "body<<REVIEW_EOF"
            echo "$REVIEW_BODY"
            echo "REVIEW_EOF"
          } >> $GITHUB_OUTPUT

      - name: Write and commit fix-task file
        if: steps.review.outputs.has_review == 'true'
        id: write_task
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BODY: ${{ steps.review.outputs.body }}
          PR: ${{ steps.review.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')
          git fetch origin "${BRANCH}"
          git checkout "${BRANCH}"

          TASK_FILE="docs/specs/tasks/task-fix-pr-${PR}.md"

          printf '# Fix PR #%s — Review REQUEST_CHANGES\n\n## Агент: coder\n## Приоритет: high\n## Ветка: %s\n## НЕ створювати нову гілку — пушити в існуючу: `%s`\n\n## Findings від Reviewer\n\n%s\n\n## Алгоритм\n1. git fetch origin %s && git checkout %s\n2. Виправити всі знайдені проблеми\n3. pnpm typecheck && pnpm lint && pnpm test\n4. git add <конкретні файли> && git commit -m "fix: ..."\n5. git push origin %s\n' \
            "$PR" "$BRANCH" "$BRANCH" "$REVIEW_BODY" "$BRANCH" "$BRANCH" "$BRANCH" \
            > "${TASK_FILE}"

          git add "${TASK_FILE}"
          git commit -m "task: fix PR #${PR} — reviewer changes requested"
          git push origin "${BRANCH}"
          echo "task_file=${TASK_FILE}" >> $GITHUB_OUTPUT

      - name: Trigger Coder
        if: steps.review.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.review.outputs.pr }}
          TASK_FILE: ${{ steps.write_task.outputs.task_file }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run coder.yml \
            --repo "$REPO" \
            -f task_file="$TASK_FILE" \
            -f task_hint="fix-pr-${PR}"
