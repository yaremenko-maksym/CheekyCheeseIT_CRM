name: Flow Gate

# The project's development flow is the default for EVERY PR into main — owner, collaborator, any
# harness (Claude, Codex, a person at a keyboard). Each step (Task, Plan, Tests, Review,
# Security-Review, Spec-Review, Copy-Review, QA, Design-Review, AC) is either satisfied by evidence
# or skipped by a PR-body line `Skip-<Step>: <reason>` (>= 10 chars), echoed into the job summary.
# A docs-only diff (every changed path, rename sources included, ends in `.md`) is exempt — the
# light-track rule. Non-markdown `.claude/` files (hooks, settings, scripts) are process config and
# go through the steps; `.claude/hooks/**` and `.claude/settings*.json` are critical paths.
#
# WHY (audit 2026-10-21): every PR merged by the second collaborator reached `main` with zero
# reviews, although each touched a critical-path zone. The flow existed only as procedure inside
# the owner's Master pipeline, which another harness never runs.
#
# DECISION: scripts/architect/flow-gate.mjs (pure function — the step table is STEPS there; unit
# tests in flow-gate.test.mjs, run on PRs by architect-scripts.yml). Contract and the per-step
# evidence table: .claude/agents/contracts.md §4.1.
#
# THREAT MODEL (short): this enforces an intentional, recorded choice — a skipped step becomes a
# visible, attributable line instead of silence. It is NOT a defence against a malicious write-role
# user (anyone with write access can post a review saying `Verdict: APPROVE`, or write a skip
# line). Verdicts count only from OWNER / MEMBER / COLLABORATOR associations — the repo is public,
# so any GitHub user can comment.
#
# A verdict IS bound to the commit it was given on (since 2026-10-24): a positive verdict on a
# commit that is not the head reads STALE unless everything that landed since is markdown, or
# belongs to files the PR does not own (a merge from the base branch). The judgement needs one
# `compare` per reviewed commit, which is why the fetch happens in two passes — the gate names the
# shas, this workflow measures them. The reasoning is in flow-gate.mjs, "Verdict freshness".
#
# TRIGGERS: `pull_request_target` only — it runs the BASE branch's copy of this file, so a PR cannot
# edit the gate that judges it. There is deliberately no `pull_request_review` trigger: that event
# runs the PR's OWN copy of the workflow. So after a review lands, the check is re-run by a PR-body
# edit or a label change (`edited` / `labeled` / `unlabeled` are triggers for exactly that).
#
# NEVER check out or run the PR's code: the job checks out `main` only (sparse, no credentials) and
# reads the PR through the REST API as data. No `${{ }}` expression carrying PR-controlled text is
# interpolated into a `run:` script.
#
# No `paths:` filter (a required check must report on every PR, or PRs sit "waiting for status")
# and no `concurrency:` block (a cancelled run leaves a `cancelled` conclusion that auto-merge reads
# as a hard failure). A run takes seconds and is idempotent.
#
# REQUIRED-CHECK NOTE for whoever adds this context to branch protection: bind it to the GitHub
# Actions app (app_id 15368, like the four existing contexts) — an unbound context can be satisfied
# by a commit status any write-role user may post through the statuses API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gate:
    name: Flow Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main (gate logic only — never the PR's code)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/architect

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every list is fetched fresh (not from the event payload) and COUNTED in the log: an
      # instrument that did not look must not report a negative
      # (.claude/rules/common/verification-integrity.md). Empty file or commit lists are rejected
      # by the script itself — a PR always has both — and the listed counts are compared with the
      # PR's own `changed_files` / `commits`: a PR the API could not list in full FAILS.
      - name: Fetch PR data (REST API, read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          D: ${{ runner.temp }}/flow-gate
        run: |
          set -euo pipefail
          mkdir -p "$D"
          # Rename sources are kept (`previous_filename`): the script classifies both names.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | {filename, previous_filename, status}' | jq -s . >"$D/files.json"
          # `commit_id` is the commit the review was submitted against — the whole basis of the
          # freshness check. A PR comment has no equivalent field, so it keeps only `created_at`.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | {author: .user.login, association: .author_association, state: .state, body: (.body // ""), at: .submitted_at, commit_id: .commit_id}' \
            | jq -s . >"$D/reviews.json"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | {author: .user.login, association: .author_association, body: (.body // ""), at: .created_at}' \
            | jq -s . >"$D/comments.json"
          # Deliberately NO commit date: a committer date is set by whoever makes the commit, so
          # nothing the gate decides may key on one (SEC-1 — see flow-gate.mjs `referenceSha`).
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | {sha: .sha, message: .commit.message, parents: (.parents | length)}' \
            | jq -s . >"$D/commits.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '{body: (.body // ""), headSha: .head.sha, baseRef: .base.ref, counts: {changedFiles: .changed_files, commits: .commits}}' >"$D/pr.json"
          jq -n \
            --slurpfile files "$D/files.json" --slurpfile reviews "$D/reviews.json" \
            --slurpfile comments "$D/comments.json" --slurpfile commits "$D/commits.json" \
            --slurpfile pr "$D/pr.json" \
            '{files: $files[0], body: $pr[0].body, headSha: $pr[0].headSha, baseRef: $pr[0].baseRef, counts: $pr[0].counts, reviews: $reviews[0], comments: $comments[0], commits: $commits[0]}' \
            >"$D/pr-data.json"
          f="$D/pr-data.json"
          echo "fetched: files=$(jq '.files | length' "$f")/$(jq '.counts.changedFiles' "$f")" \
            "commits=$(jq '.commits | length' "$f")/$(jq '.counts.commits' "$f")" \
            "reviews=$(jq '.reviews | length' "$f") comments=$(jq '.comments | length' "$f")" \
            "body-chars=$(jq '.body | length' "$f") head=$(jq -r '.headSha' "$f")" \
            "base=$(jq -r '.baseRef' "$f")"

      # Second pass of the fetch. The gate names the commits whose drift to the head decides
      # whether a verdict still stands (`--compare-plan`, unit-tested, and it hex-validates every
      # sha before this loop puts one into an API path); this step only measures them. A
      # measurement that could not be taken is recorded as `unavailable` rather than omitted — the
      # gate reads absent, unavailable and truncated alike as STALE, never as "nothing drifted".
      - name: Measure verdict drift (one compare per reviewed commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          D: ${{ runner.temp }}/flow-gate
        run: |
          set -euo pipefail
          f="$D/pr-data.json"
          head_sha=$(jq -r '.headSha' "$f")
          base_ref=$(jq -r '.baseRef' "$f")
          node scripts/architect/flow-gate.mjs --compare-plan --input "$f" >"$D/plan.txt"
          echo "drift measurements planned: $(wc -l <"$D/plan.txt")"
          : >"$D/compares.ndjson"
          while read -r sha; do
            [ -n "$sha" ] || continue
            # TWO reads per reviewed commit V, and both are needed:
            #   drift    = compare V...HEAD  — what moved since the verdict
            #   ownedAt  = compare base...V  — the PR's own changed-file set AS OF V, so a file the
            #              PR has since reverted still counts as its own (SEC-2). The base is the
            #              branch ref, which makes this the same net-diff shape as pulls/files.
            if gh api "repos/$REPO/compare/${sha}...${head_sha}" >"$D/drift.json" 2>"$D/c.err" \
              && gh api "repos/$REPO/compare/${base_ref}...${sha}" >"$D/owned.json" 2>>"$D/c.err"
            then
              # The compare endpoint returns at most 300 files and reports no total, so a list AT
              # the limit is treated as truncated rather than as a complete answer.
              jq -n --arg base "$sha" \
                --slurpfile drift "$D/drift.json" --slurpfile owned "$D/owned.json" '
                def paths: ([.files[]? | .filename] + [.files[]? | .previous_filename // empty]);
                {
                  base: $base,
                  truncated: (((($drift[0].files // []) | length) >= 300)
                              or ((($owned[0].files // []) | length) >= 300)),
                  paths: ($drift[0] | paths),
                  ownedAt: ($owned[0] | paths)
                }'
            else
              cat "$D/c.err" >&2
              jq -n --arg base "$sha" '{base: $base, unavailable: true}'
            fi >>"$D/compares.ndjson"
          done <"$D/plan.txt"
          jq -s . "$D/compares.ndjson" >"$D/compares.json"
          jq --slurpfile cmp "$D/compares.json" '. + {compares: $cmp[0]}' "$f" >"$D/pr-data.next.json"
          mv "$D/pr-data.next.json" "$f"
          echo "drift measured: compares=$(jq '.compares | length' "$f")" \
            "drift-paths=$(jq '[.compares[] | (.paths // []) | length] | add // 0' "$f")" \
            "owned-paths=$(jq '[.compares[] | (.ownedAt // []) | length] | add // 0' "$f")" \
            "unavailable=$(jq '[.compares[] | select(.unavailable)] | length' "$f")"

      - name: Evaluate
        env:
          IN: ${{ runner.temp }}/flow-gate/pr-data.json
        run: node scripts/architect/flow-gate.mjs --input "$IN" --summary "$GITHUB_STEP_SUMMARY"
