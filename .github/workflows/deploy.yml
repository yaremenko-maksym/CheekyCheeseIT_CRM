            else
              echo "==> Re-applying non_deleted_transactions view DDL to pick up company_name_snapshot (idempotent) — user=${PGUSER} db=${PGDB}"
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.ghcr.yml \
                --env-file .env.production \
