name: Deploy

# ── Trigger model (auto-deploy ENABLED 2026-07-12, weekly rebuild ADDED 2026-07-24) ─
# Three complementary channels — no PAT required, no double-trigger:
#
# 1. `push: branches: [main]`
#    Fires on human pushes to main: owner UI-merge, revert, hotfix.
#    Does NOT fire on GITHUB_TOKEN-authored pushes (GitHub anti-recursion
#    protection) — auto-merge squashes from auto-merge-on-label.yml are
#    therefore NOT covered here.
#
# 2. `workflow_dispatch`
#    Used for:
#      a) Manual one-off runs (e.g. rollback, re-deploy a specific image_tag).
#      b) Explicit dispatch from auto-merge-on-label.yml after a squash-merge,
#         because GITHUB_TOKEN-pushes do not create push events for workflows
#         (workflow_dispatch is the documented exception to this rule).
#
# 3. `schedule` (weekly rebuild — task-infra-weekly-rebuild)
#    Rebuilds and redeploys `main` every Sunday even with zero merges that
#    week. Why: JobPosting `validThrough` on each published vacancy is set to
#    build-time + 60 days (sliding window, not a fixed date) — see
#    apps/landing prerender step. Without a periodic rebuild, that window
#    would only ever refresh on a merge, and JobPosting/sitemap freshness
#    would silently drift stale between merges. A scheduled run walks the
#    exact same build+DDL+restart pipeline as a normal deploy (image_tag
#    defaults to the git SHA of `main` HEAD at trigger time, same as `push`)
#    — cheap (~15 min/week) and side-effect-free (all DDL is idempotent).
#    See docs/runbooks/deployment.md "Google Indexing API" for the related
#    weekly JobPosting refresh on the API side.
#
# Result: every merge to main triggers exactly one deploy run, plus one
# unconditional run every week regardless of merge activity.
# Double-trigger impossible: auto-merge squash -> push-trigger silent
# (GITHUB_TOKEN), dispatch fires; human merge -> push fires, no dispatch.
# Race condition handled by concurrency group `deploy-production` below —
# if the weekly run happens to overlap a push/dispatch-triggered deploy,
# `cancel-in-progress` cancels whichever started first (last-trigger-wins,
# same behavior as any other overlapping deploy; the weekly run is cheap
# enough to simply fire again next Sunday if it ever gets cancelled).
#
# Emergency: to disable auto-deploy, comment out `push:` below AND remove
# the dispatch step in auto-merge-on-label.yml. To disable ONLY the weekly
# rebuild, comment out `schedule:` below (push/workflow_dispatch unaffected).
# See docs/runbooks/deployment.md for full details.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: git SHA of HEAD)'
        required: false
        default: ''
  push:
    branches: [main]
  schedule:
    # Sunday ~03:00 UTC — low-traffic window, mirrors the pg-backup.sh cron
    # (also 03:00 UTC daily, see docs/runbooks/deployment.md §8) so the two
    # never compete for VPS resources during the same minute.
    - cron: '0 3 * * 0'

concurrency:
  # One deploy at a time. If a new push arrives while deploying, cancel the
  # in-progress run so the latest image lands (not an intermediate one).
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Repository owner must be lowercase for GHCR image names.
  IMAGE_OWNER: yaremenko-maksym
  REPO_SLUG: cheekycheeseit-crm

# Default-deny: every job inherits read-only `contents` and nothing else.
# Jobs that need more (build → packages:write, deploy → packages:read) override
# this explicitly. Least-privilege for the GITHUB_TOKEN across the whole deploy.
permissions:
  contents: read

jobs:
  # ── 1. Build & push images to GHCR ───────────────────────────────────────
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          # Use explicit input tag if provided; otherwise git SHA (short).
          INPUT_TAG="${{ inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "image_tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(git rev-parse --short HEAD)
            echo "image_tag=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build API image ─────────────────────────────────────────────────
      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Landing Turnstile site key — warn (do not fail) if unset ────────
      # task-vacancies-api (PR #390) adds a Cloudflare Turnstile widget to the
      # public vacancy-apply form on the landing page. That PR has not merged
      # yet at the time this infra-PR lands, so the form/widget do not exist
      # in the bundle either — an empty build-arg here is expected and safe
      # until #390 merges and the VITE_TURNSTILE_SITE_KEY secret is created
      # (see docs/runbooks/deployment.md "Turnstile secrets").
      - name: Warn if VITE_TURNSTILE_SITE_KEY is unset
        env:
          # Read via env: (not interpolated into the run: script string) —
          # consistent with the secrets-handling pattern used in the
          # write-env / deploy jobs below.
          SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$SITE_KEY" ]; then
            echo "::warning::VITE_TURNSTILE_SITE_KEY secret is not set — landing bundle will build WITHOUT a Turnstile site key. Expected until PR #390 (vacancy-apply form) merges; see docs/runbooks/deployment.md 'Turnstile secrets'."
          fi

      # ── Build nginx image (includes Landing + CRM SPA) ──────────────────
      # task-infra-seo-gates: PRERENDER_API_ORIGIN is consumed by the SEO
      # prerender step in nginx/Dockerfile's landing-builder stage (no-op
      # until task-landing-seo-prerender adds the `build:prerender` script —
      # see the guard comment there). Points at the LIVE prod API — the old
      # containers are still serving during this build, see the Dockerfile
      # comment for why that is safe.
      #
      # task-telemetry-web (PR #415) / task-infra-telemetry-web-buildarg:
      # VITE_TELEMETRY=on is a plain build-time CONSTANT (not a GH secret —
      # it carries no sensitive value, just a feature switch) that flips the
      # CRM telemetry SDK from its default-DENY no-op to active. See
      # nginx/Dockerfile's crm-builder stage comment for the full
      # isTelemetryEnabled() contract. Safe regardless of merge order with
      # #415: before #415 merges the telemetry/ module doesn't exist yet, so
      # this arg is simply unused by the build.
      #
      # task-infra-locale-edge: four MORE optional build-args, same no-op-
      # when-unset pattern as VITE_TURNSTILE_SITE_KEY above — the IndexNow
      # key file + Bing/Yandex verification files (AC B6/B7). None of these
      # secrets exist yet at the time this PR lands (the owner sets them up
      # per scripts/devops/locale-routing-runbook.md §7/§8) — an empty value
      # here is expected and safe: nginx/Dockerfile's generation step prints
      # an explicit ::warning:: and leaves the corresponding endpoint absent
      # (404) rather than serving anything broken.
      #
      # task-infra-contact-email-env (this infra-PR) / feature/landing-contact-form
      # (parallel branch, not yet merged at the time this PR lands): the
      # public contact-email address shown on the landing page as a fallback
      # channel. This is a plain build-time CONSTANT, not a GitHub secret —
      # it carries no sensitive value (see scripts/devops/contact-email-runbook.md).
      # An unused build-arg is harmless if the parallel branch ends up wiring
      # this differently (e.g. hardcoding the address instead of reading a
      # Vite env var) — see nginx/Dockerfile's landing-builder stage comment.
      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_BUILD_VERSION=${{ steps.meta.outputs.image_tag }}
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            PRERENDER_API_ORIGIN=https://cheekycheese.tech
            VITE_TELEMETRY=on
            INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}
            BING_SITE_VERIFICATION_ID=${{ secrets.BING_SITE_VERIFICATION_ID }}
            YANDEX_VERIFICATION_FILENAME=${{ secrets.YANDEX_VERIFICATION_FILENAME }}
            YANDEX_VERIFICATION_CONTENT=${{ secrets.YANDEX_VERIFICATION_CONTENT }}
            VITE_CONTACT_PUBLIC_EMAIL=hr@cheekycheese.tech
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-nginx:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-nginx:main
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ── 2. Write env file on VPS ──────────────────────────────────────────────
  # Separate step: secrets are passed as SSH envs (encrypted channel), never
  # interpolated into the YAML run: script string (injection prevention).
  write-env:
    name: Write .env.production on VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # No repo/package access needed — only SSHes to the VPS.
    permissions:
      contents: read
    # UNTESTED: requires a real VPS with all secrets set.
    # See docs/runbooks/deployment.md §3 for provisioning checklist.

    steps:
      - name: Write .env.production via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # All values are passed as SSH environment variables — they travel
          # over the encrypted SSH channel, never substituted into the YAML string.
          # On the VPS they arrive as $VAR_NAME and are written by the script.
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CREDENTIALS_ENC_KEY: ${{ secrets.CREDENTIALS_ENC_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # task-vacancies-api (PR #390): apps/api/src/config/env.ts fail-fast
          # refine()s on this in production — the API crash-loops on boot if
          # it's unset/still the Cloudflare "always passes" dev default. The
          # explicit empty-check below fails the deploy fast (before wasting
          # time on the build/pull/health-check steps) instead of surfacing
          # as an opaque container crash-loop later. See
          # docs/runbooks/deployment.md "Turnstile secrets".
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          # task-infra-telemetry-digest (T3) / task-telemetry-api (T1, PR #412,
          # NOT yet merged to main at the time this infra-PR lands): same
          # fail-fast refine() pattern as TURNSTILE_SECRET_KEY above —
          # apps/api/src/config/env.ts crash-loops in production without
          # real values for these two. Both GH secrets already exist (created
          # ahead of #412 on purpose), so the fail-loud check below passes
          # today and simply keeps passing once #412 merges. See
          # scripts/devops/telemetry-digest-runbook.md.
          TELEMETRY_DIGEST_TOKEN: ${{ secrets.TELEMETRY_DIGEST_TOKEN }}
          TELEMETRY_SESSION_SALT: ${{ secrets.TELEMETRY_SESSION_SALT }}
          # task-google-indexing-api: all three OPTIONAL, unlike TURNSTILE_SECRET_KEY
          # above — apps/api reads them via the existing (optional) env schema and
          # runs the indexing service in no-op mode (one boot warning, no crash) if
          # unset. No fail-loud check here on purpose. See
          # docs/runbooks/deployment.md "Google Indexing API".
          GOOGLE_INDEXING_SA_EMAIL: ${{ secrets.GOOGLE_INDEXING_SA_EMAIL }}
          GOOGLE_INDEXING_SA_KEY_B64: ${{ secrets.GOOGLE_INDEXING_SA_KEY_B64 }}
          PUBLIC_LANDING_ORIGIN: ${{ secrets.PUBLIC_LANDING_ORIGIN }}
          # task-infra-contact-email-env (this infra-PR) / feature/landing-contact-form
          # (parallel branch, not yet merged at the time this PR lands): the
          # public contact-form endpoint (POST /api/public/contact) sends
          # email via the Resend HTTP API. OPTIONAL like GOOGLE_INDEXING_SA_*
          # above (NOT fail-loud like TURNSTILE_SECRET_KEY) — per the task
          # brief the API is expected to boot fine and answer 503 on that one
          # endpoint if this is unset, rather than crash-looping. Unlike
          # GOOGLE_INDEXING_SA_* though, the owner already created this
          # secret ahead of time (see scripts/devops/contact-email-runbook.md),
          # so an empty value here would be an unexpected drift worth a
          # visible ::warning:: in the deploy log — see the explicit check
          # below (still non-fatal).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pass env vars declared above into the remote shell.
          envs: IMAGE_TAG,POSTGRES_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,JWT_SECRET,SESSION_SECRET,CREDENTIALS_ENC_KEY,S3_ENDPOINT,S3_FORCE_PATH_STYLE,S3_REGION,S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TURNSTILE_SECRET_KEY,TELEMETRY_DIGEST_TOKEN,TELEMETRY_SESSION_SALT,GOOGLE_INDEXING_SA_EMAIL,GOOGLE_INDEXING_SA_KEY_B64,PUBLIC_LANDING_ORIGIN,RESEND_API_KEY,GH_ACTOR
          script: |
            set -euo pipefail

            # Fail-loud: without this, the API boots into a crash-loop in
            # production (env.ts refine) with no clear signal at the deploy
            # step where the misconfiguration actually is.
            if [ -z "$TURNSTILE_SECRET_KEY" ]; then
              echo "ERROR: TURNSTILE_SECRET_KEY secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine)."
              echo "Create the secret before merging/deploying — see docs/runbooks/deployment.md 'Turnstile secrets'."
              exit 1
            fi

            # task-infra-telemetry-digest (T3) / task-telemetry-api (T1, PR #412):
            # same fail-loud pattern as TURNSTILE_SECRET_KEY above. Both secrets
            # already exist in GitHub Actions (created ahead of #412 on purpose),
            # so this check passes today and keeps passing once #412 merges.
            if [ -z "$TELEMETRY_DIGEST_TOKEN" ]; then
              echo "ERROR: TELEMETRY_DIGEST_TOKEN secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine, task-telemetry-api PR #412)."
              echo "Create the secret — see scripts/devops/telemetry-digest-runbook.md."
              exit 1
            fi
            if [ -z "$TELEMETRY_SESSION_SALT" ]; then
              echo "ERROR: TELEMETRY_SESSION_SALT secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine, task-telemetry-api PR #412)."
              echo "Create the secret — see scripts/devops/telemetry-digest-runbook.md."
              exit 1
            fi

            # task-infra-contact-email-env: NOT fail-loud (unlike the two
            # checks above) — the public contact-form endpoint is expected to
            # degrade to a 503 no-op if this is unset, not crash-loop the
            # whole API. Still worth a loud ::warning:: because (unlike
            # GOOGLE_INDEXING_SA_* which may genuinely never be configured)
            # the owner already created this secret ahead of time — an empty
            # value here means it got cleared/renamed, which is unexpected.
            if [ -z "$RESEND_API_KEY" ]; then
              echo "::warning::RESEND_API_KEY secret is empty/unset. POST /api/public/contact will boot in no-op mode and answer 503 instead of sending email — see scripts/devops/contact-email-runbook.md."
            fi

            mkdir -p /opt/crm
            # All variables below come from the envs: list above (SSH env channel).
            # No ${{ secrets.* }} interpolation happens here — safe from injection.
            cat > /opt/crm/.env.production << 'ENVEOF'
            NODE_ENV=production
            API_PORT=3001
            ENVEOF
            # task-infra-contact-email-env: plain build-time CONSTANTS, not
            # secrets (no sensitive value — same class as GOOGLE_CALLBACK_URL/
            # FRONTEND_URL/CORS_ORIGINS below, written literally rather than
            # threaded through the SSH envs: list). CONTACT_FROM_EMAIL is the
            # Resend "from" address (domain verified in Resend; no mailbox
            # needed — replies go to the submitter's reply-to address).
            # CONTACT_PUBLIC_EMAIL is the fallback contact channel shown on
            # the landing page. See scripts/devops/contact-email-runbook.md.
            printf 'CONTACT_FROM_EMAIL=noreply@cheekycheese.tech\n'   >> /opt/crm/.env.production
            printf 'CONTACT_PUBLIC_EMAIL=hr@cheekycheese.tech\n'      >> /opt/crm/.env.production
            # Append secret values safely via printf (no heredoc variable expansion issue).
            printf 'DATABASE_URL=postgresql://crm_user:%s@postgres:5432/crm_db\n' "$POSTGRES_PASSWORD" >> /opt/crm/.env.production
            printf 'POSTGRES_DB=crm_db\n'                              >> /opt/crm/.env.production
            printf 'POSTGRES_USER=crm_user\n'                          >> /opt/crm/.env.production
            printf 'POSTGRES_PASSWORD=%s\n'       "$POSTGRES_PASSWORD" >> /opt/crm/.env.production
            printf 'REDIS_URL=redis://redis:6379\n'                    >> /opt/crm/.env.production
            printf 'GOOGLE_CLIENT_ID=%s\n'        "$GOOGLE_CLIENT_ID"  >> /opt/crm/.env.production
            printf 'GOOGLE_CLIENT_SECRET=%s\n'    "$GOOGLE_CLIENT_SECRET" >> /opt/crm/.env.production
            printf 'GOOGLE_CALLBACK_URL=https://app.cheekycheese.tech/api/auth/google/callback\n' >> /opt/crm/.env.production
            printf 'JWT_SECRET=%s\n'              "$JWT_SECRET"        >> /opt/crm/.env.production
            printf 'SESSION_SECRET=%s\n'          "$SESSION_SECRET"    >> /opt/crm/.env.production
            printf 'CREDENTIALS_ENC_KEY=%s\n'     "$CREDENTIALS_ENC_KEY" >> /opt/crm/.env.production
            printf 'FRONTEND_URL=https://app.cheekycheese.tech\n'     >> /opt/crm/.env.production
            printf 'CORS_ORIGINS=https://app.cheekycheese.tech,https://cheekycheese.tech\n' >> /opt/crm/.env.production
            printf 'TRUST_PROXY=true\n'                                >> /opt/crm/.env.production
            printf 'S3_ENDPOINT=%s\n'             "$S3_ENDPOINT"       >> /opt/crm/.env.production
            printf 'S3_FORCE_PATH_STYLE=%s\n'     "$S3_FORCE_PATH_STYLE" >> /opt/crm/.env.production
            printf 'S3_REGION=%s\n'               "$S3_REGION"         >> /opt/crm/.env.production
            printf 'S3_BUCKET=%s\n'               "$S3_BUCKET"         >> /opt/crm/.env.production
            # S3_USE_SSE=false — Cloudflare R2 (our prod provider) does NOT support
            # the SSE-S3 protocol header and rejects PutObject when it is present.
            # R2 encrypts all data at rest by default, so omitting the header is
            # both required for R2 and safe. Set to true ONLY if migrating to AWS S3.
            printf 'S3_USE_SSE=false\n'                                >> /opt/crm/.env.production
            printf 'AWS_ACCESS_KEY_ID=%s\n'       "$AWS_ACCESS_KEY_ID" >> /opt/crm/.env.production
            printf 'AWS_SECRET_ACCESS_KEY=%s\n'   "$AWS_SECRET_ACCESS_KEY" >> /opt/crm/.env.production
            printf 'TURNSTILE_SECRET_KEY=%s\n'    "$TURNSTILE_SECRET_KEY" >> /opt/crm/.env.production
            printf 'TELEMETRY_DIGEST_TOKEN=%s\n'  "$TELEMETRY_DIGEST_TOKEN" >> /opt/crm/.env.production
            printf 'TELEMETRY_SESSION_SALT=%s\n'  "$TELEMETRY_SESSION_SALT" >> /opt/crm/.env.production

            # task-google-indexing-api: all three OPTIONAL — the API's env schema
            # treats them as optional and the indexing service no-ops (one boot
            # warning) if unset, so unlike TURNSTILE_SECRET_KEY above there is no
            # fail-loud check here. Deliberately do NOT write empty lines: an
            # empty `GOOGLE_INDEXING_SA_EMAIL=` (vs the key being absent) could
            # trip a stricter `.string().optional()` vs `.string().email().optional()`
            # Zod check depending on how the schema is written on the API side —
            # skipping the line entirely when the secret is unset sidesteps that
            # ambiguity and behaves identically to "not configured".
            # See docs/runbooks/deployment.md "Google Indexing API".
            if [ -n "$GOOGLE_INDEXING_SA_EMAIL" ]; then
              printf 'GOOGLE_INDEXING_SA_EMAIL=%s\n' "$GOOGLE_INDEXING_SA_EMAIL" >> /opt/crm/.env.production
            fi
            if [ -n "$GOOGLE_INDEXING_SA_KEY_B64" ]; then
              printf 'GOOGLE_INDEXING_SA_KEY_B64=%s\n' "$GOOGLE_INDEXING_SA_KEY_B64" >> /opt/crm/.env.production
            fi
            if [ -n "$PUBLIC_LANDING_ORIGIN" ]; then
              printf 'PUBLIC_LANDING_ORIGIN=%s\n' "$PUBLIC_LANDING_ORIGIN" >> /opt/crm/.env.production
            fi

            # task-infra-contact-email-env: same conditional-write pattern as
            # GOOGLE_INDEXING_SA_* above — skip the line entirely when unset
            # rather than writing an empty `RESEND_API_KEY=`, so a strict
            # Zod optional-string validator on the API side can't trip on the
            # difference between "not configured" and "configured as empty
            # string". The ::warning:: above already surfaced the unset case.
            if [ -n "$RESEND_API_KEY" ]; then
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> /opt/crm/.env.production
            fi

            printf 'IMAGE_TAG=%s\n'               "$IMAGE_TAG"         >> /opt/crm/.env.production
            chmod 600 /opt/crm/.env.production
            echo "==> .env.production written (mode 600)"

  # ── 3. Copy compose files to VPS ─────────────────────────────────────────
  copy-compose:
    name: Copy compose files to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Checks out the repo (compose files) then SCPs them — read-only on contents.
    permissions:
      contents: read

    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4

      - name: Copy compose files and DDL via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yml,docker-compose.ghcr.yml,apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql,apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql,apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql,apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql,apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql,apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql,apps/api/drizzle/manual/2026-07-22_vacancies.sql,apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql,scripts/devops/check-security-headers.sh'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target.
          # docker-compose.prod.yml → /opt/crm/docker-compose.prod.yml
          # docker-compose.ghcr.yml → /opt/crm/docker-compose.ghcr.yml
          # apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql
          # apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
          # apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
          # apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
          # apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
          # apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql
          # apps/api/drizzle/manual/2026-07-22_vacancies.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-22_vacancies.sql
          # apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql
          # scripts/devops/check-security-headers.sh → /opt/crm/scripts/devops/check-security-headers.sh
          #   (security review round 1, PR #429, MED-3: the post-deploy smoke
          #   test below runs this ON THE VPS via SSH — same 127.0.0.1-through-
          #   nginx-directly pattern as the "landing origin health check" a few
          #   steps below it, not the VPS filesystem's normal state, which is
          #   compose files + DDL only. This is the ONLY reason a script file
          #   is in this SCP list at all.)
          # The deploy step reads from those full paths via /opt/crm.
          #
          # incident (task-infra-vacancy-i18n-ddl, 2026-07-25): PR #422 shipped
          # 2026-07-25_vacancy_i18n_seo.sql but this source: list was never updated to
          # include it — the file never reached the VPS, so the "vacancy_i18n module DDL"
          # apply step below always no-op'd via the "not found" guard... except THAT step
          # didn't exist either, so prod's `vacancies` table never got the new columns the
          # already-deployed API code queries, and GET /api/public/vacancies started 500ing.
          # 2026-06-29_company_account_requisites_markdown.sql was found in the SAME audit
          # (predates this deploy.yml's DDL-wiring convention entirely — its own header
          # comment describes a pre-automation "owner applies manually" workflow) and is
          # wired in now too, defense-in-depth (idempotent `ADD COLUMN IF NOT EXISTS`, so
          # this is a safe no-op if the owner already applied it by hand). See
          # scripts/devops/check-prod-ddl-wiring.py for the guard that now fails CI if this
          # class of gap reappears — every file in apps/api/drizzle/manual/ must either be
          # referenced somewhere in this workflow or be explicitly allow-listed there with a
          # reason.

      # ── Telemetry DDL — GUARDED, NOT in the fixed source: list above ────
      # task-infra-telemetry-digest (T3, this infra-PR) merges BEFORE
      # task-telemetry-api (T1, PR #412, feature/telemetry-api) — unlike the
      # vacancies DDL above (whose infra-PR shipped a byte-identical copy of
      # the .sql file itself), this DevOps PR's zone-of-write excludes
      # apps/api/** so it CANNOT carry its own copy of
      # apps/api/drizzle/manual/2026-07-24_telemetry.sql — that file only
      # exists in the checkout once #412 merges. Adding it to the fixed
      # comma-separated `source:` list above would make scp-action fail
      # outright (no such file) on every run until then. So: check for the
      # file first, and only scp it when present. The deploy job's Step 2f
      # has the matching ::notice-skip guard for the "not present yet" case.
      - name: Check for telemetry DDL file (guard until PR #412 merges)
        id: telemetry-ddl-check
        run: |
          if [ -f apps/api/drizzle/manual/2026-07-24_telemetry.sql ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/api/drizzle/manual/2026-07-24_telemetry.sql not found in checkout — task-telemetry-api (PR #412) has not merged to main yet. Skipping copy; deploy job Step 2f also notice-skips applying it. See scripts/devops/telemetry-digest-runbook.md."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy telemetry DDL via SCP (only if present)
        if: steps.telemetry-ddl-check.outputs.exists == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'apps/api/drizzle/manual/2026-07-24_telemetry.sql'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target:
          # apps/api/drizzle/manual/2026-07-24_telemetry.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-24_telemetry.sql

  # ── 4. Pull images + up + migrate + health-check ─────────────────────────
  deploy:
    name: Deploy Stack on VPS
    runs-on: ubuntu-latest
    needs: [build, write-env, copy-compose]
    environment: production
    # Pulls images from GHCR on the VPS → needs packages:read (not write).
    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull, up, migrate, health-check via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          # GITHUB_TOKEN for `docker login ghcr.io`. The job-level `permissions:`
          # block above scopes it to packages:read (pull only) + contents:read.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GH_ACTOR,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/crm

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "==> Pulling new images (IMAGE_TAG=${IMAGE_TAG})"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              pull api nginx

            # ── Step 1: ensure postgres + redis are up (persistent — usually already running) ──
            # api and nginx are started AFTER DDL is applied (see Step 3).
            echo "==> Ensuring postgres and redis are up"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              up -d postgres redis

            echo "==> Waiting for postgres to be healthy"
            for i in $(seq 1 30); do
              if docker compose \
                   -f docker-compose.prod.yml \
                   -f docker-compose.ghcr.yml \
                   --env-file .env.production \
                   exec -T postgres \
                   pg_isready -U crm_user -d crm_db 2>/dev/null; then
                echo "Postgres healthy after ${i}x checks"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: postgres did not become healthy in 60s"
                docker compose \
                  -f docker-compose.prod.yml \
                  -f docker-compose.ghcr.yml \
                  --env-file .env.production \
                  logs --tail=30 postgres
                exit 1
              fi
              sleep 2
            done

            # ── Step 2: apply audit-hardening DDL (idempotent) ───────────────────────────────
            # The SQL file was copied by the copy-compose job to:
            #   /opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
            # [prod-verify] path matches scp-action tree layout (source dir preserved under target).
            #
            # Credentials come from .env.production (POSTGRES_USER / POSTGRES_DB written by
            # write-env job). psql reads them as plain env vars via --env-file equivalent
            # (passed through `docker compose exec -T` which inherits the compose env-file).
            # We parse POSTGRES_USER and POSTGRES_DB directly from .env.production to be
            # explicit and avoid relying on exec env inheritance.
            #
            # ON_ERROR_STOP=1 — any SQL error exits psql with non-zero status, which
            # propagates through `exec -T`, causing the whole script to fail (set -e).
            # The DDL is fully idempotent (IF NOT EXISTS) — safe on repeated deploys.
            DDL_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql"
            PGUSER=$(grep '^POSTGRES_USER=' /opt/crm/.env.production | cut -d= -f2)
            PGDB=$(grep '^POSTGRES_DB='   /opt/crm/.env.production | cut -d= -f2)

            # Guard: explicit error if scp-action flattened the tree instead of preserving it.
            if [ ! -f "$DDL_FILE" ]; then
              echo "ERROR: DDL file not found at $DDL_FILE — scp-action may have flattened the tree."
              echo "Check copy-compose scp layout; expected /opt/crm/apps/api/drizzle/manual/<file>."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying audit-hardening DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            # -f inside the container would require the file to be mounted there.
            # Pipe the host-side file to psql stdin via `exec -T` (no TTY → stdin passthrough).
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$DDL_FILE"
            echo "==> DDL applied successfully"

            # ── Step 2b: drop unused users.usr_record column (idempotent) ────────────────────
            # PR #345 removed the usrRecord field from all code; this drops the now-unused
            # physical column. DROP COLUMN IF EXISTS → safe no-op once the column is gone.
            # Source: apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
            DROP_USR_RECORD_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql"
            if [ ! -f "$DROP_USR_RECORD_FILE" ]; then
              echo "ERROR: DDL file not found at $DROP_USR_RECORD_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Dropping unused users.usr_record column (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$DROP_USR_RECORD_FILE"
            echo "==> usr_record column drop applied successfully"

            # ── Step 2c: payment_type enum + drop-share override + USDT-income idempotency ───
            # PR #367 (task-drop-share-override-and-receiver, ADR
            # docs/architecture/2026-07-13-payment-type-income-routing.md):
            #   1. apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
            #      — transaction_type += DROP_PENDING_PAYOUT, projects.payment_type
            #      varchar → project_payment_type enum, drop-share override + snapshot
            #      columns. Contains a FAIL-LOUD C13 guard: it RAISEs and aborts the
            #      deploy if a non-GamingTec project carries a payment_type value that
            #      looks like USDT/GIG_CONTRACT rather than the blanket FOP default —
            #      that is expected, intentional behavior (a human must classify the
            #      value explicitly), NOT a flake to retry or suppress.
            #   2. apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
            #      — security-review MED-1 backstop: partial unique index on
            #      transactions(idempotency_key) scoped to type = 'ADMIN_INCOME'.
            # Both scripts are idempotent (IF NOT EXISTS / guarded DO blocks) — safe to
            # re-run on repeated deploys. Source files were copied by copy-compose to
            # /opt/crm/apps/api/drizzle/manual/<file>.
            PAYMENT_TYPE_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql"
            USDT_IDEMPOTENCY_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql"

            if [ ! -f "$PAYMENT_TYPE_FILE" ]; then
              echo "ERROR: DDL file not found at $PAYMENT_TYPE_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi
            if [ ! -f "$USDT_IDEMPOTENCY_FILE" ]; then
              echo "ERROR: DDL file not found at $USDT_IDEMPOTENCY_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying payment_type enum + drop-share override DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$PAYMENT_TYPE_FILE"
            echo "==> payment_type enum + drop-share override DDL applied successfully"

            echo "==> Applying USDT-income idempotency index DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$USDT_IDEMPOTENCY_FILE"
            echo "==> USDT-income idempotency index DDL applied successfully"

            echo "==> Verifying payment_type distribution and idempotency index"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              <<< "SELECT payment_type, COUNT(*) FROM projects GROUP BY payment_type;"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              <<< "SELECT indexname FROM pg_indexes WHERE tablename='transactions' AND indexname='uq_transactions_admin_income_idempotency_key';"

            # ── Step 2d: transaction_audit_log table (idempotent) ────────────────────────────
            # task-receipts-backend (PR #374): the generic PATCH /api/transactions/:id/receipt
            # attach/replace endpoint records every receipt mutation (ATTACH | REPLACE) into a
            # new audit table. Mirrors the existing *_audit_log tables (user/team/project) but
            # target_id has NO FK (audit must outlive the transaction it describes) and carries
            # a jsonb metadata column instead of changes.
            # Source: apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql
            # Idempotent: CREATE TABLE / INDEX IF NOT EXISTS — safe to re-run on repeated deploys.
            TRANSACTION_AUDIT_LOG_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql"

            if [ ! -f "$TRANSACTION_AUDIT_LOG_FILE" ]; then
              echo "ERROR: DDL file not found at $TRANSACTION_AUDIT_LOG_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying transaction_audit_log DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$TRANSACTION_AUDIT_LOG_FILE"
            echo "==> transaction_audit_log DDL applied successfully"

            # ── Step 2e: vacancies module tables + enums (idempotent) ────────────────────────
            # task-vacancies-api (PR #390): public vacancies (landing) + admin CRUD (CRM).
            # Two brand-new tables (vacancies, vacancy_applications) + 5 new enums — fully
            # additive, no existing table/column touched. Ships in this infra-PR (merged
            # BEFORE or alongside #390) so the SQL is guaranteed to run before any api image
            # that references the new tables — and is idempotent, so it is also safe to
            # re-run on every subsequent deploy once #390 is live.
            # Source: apps/api/drizzle/manual/2026-07-22_vacancies.sql
            VACANCIES_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-22_vacancies.sql"

            if [ ! -f "$VACANCIES_FILE" ]; then
              echo "ERROR: DDL file not found at $VACANCIES_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying vacancies module DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$VACANCIES_FILE"
            echo "==> vacancies module DDL applied successfully"

            # ── Step 2f: telemetry module tables + enums (idempotent, GUARDED) ───────────────
            # task-infra-telemetry-digest (T3, this infra-PR): prod-error tracking +
            # UX-event analytics (docs/superpowers/specs/2026-07-24-crm-telemetry-design.md).
            # UNLIKE Step 2e above, this infra-PR merges BEFORE task-telemetry-api (T1, PR
            # #412, feature/telemetry-api) and does NOT carry its own copy of the SQL file
            # (DevOps zone-of-write excludes apps/api/** — that file is Coder's to add in
            # #412). So this step SOFT-SKIPS via ::notice when the file isn't present yet,
            # instead of the fail-loud "scp-action flattened the tree" check every other DDL
            # step uses — a missing file here is the EXPECTED steady state until #412 merges,
            # not an error. copy-compose's "Check for telemetry DDL file" step mirrors this
            # same guard on the scp side. Once #412 merges, the file exists on every
            # subsequent deploy and this step applies it exactly like the others (idempotent:
            # guarded CREATE TYPE + CREATE TABLE/INDEX IF NOT EXISTS).
            # Source: apps/api/drizzle/manual/2026-07-24_telemetry.sql
            TELEMETRY_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-24_telemetry.sql"

            if [ ! -f "$TELEMETRY_FILE" ]; then
              echo "::notice::Telemetry DDL file not found at $TELEMETRY_FILE — task-telemetry-api (PR #412) has not merged to main yet. Skipping this step; it applies automatically on the next deploy once #412 is in main. See scripts/devops/telemetry-digest-runbook.md."
            else
              echo "==> Applying telemetry module DDL (idempotent) — user=${PGUSER} db=${PGDB}"
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.ghcr.yml \
                --env-file .env.production \
                exec -T postgres \
                psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
                < "$TELEMETRY_FILE"
              echo "==> telemetry module DDL applied successfully"
            fi

            # ── Step 2g: vacancy i18n + JobPosting SEO enrichment columns (idempotent) ────────
            # INCIDENT FIX (task-infra-vacancy-i18n-ddl, 2026-07-25): PR #422
            # (task-vacancy-i18n-jobposting) shipped this file BEFORE this apply step (and the
            # copy-compose source: entry) existed — the already-deployed API code queries these
            # columns, so GET /api/public/vacancies started 500ing on prod the moment #422's
            # image went live. See the copy-compose job's comment above and
            # scripts/devops/check-prod-ddl-wiring.py (new CI guard preventing a repeat of this
            # exact gap class: DDL file merged but never wired into this workflow).
            # Idempotent: `ADD COLUMN IF NOT EXISTS` on all 7 columns — safe to re-run.
            # Source: apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql
            VACANCY_I18N_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql"

            if [ ! -f "$VACANCY_I18N_FILE" ]; then
              echo "ERROR: DDL file not found at $VACANCY_I18N_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying vacancy i18n + JobPosting SEO DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$VACANCY_I18N_FILE"
            echo "==> vacancy i18n + JobPosting SEO DDL applied successfully"

            # ── Step 2h: company_account.requisites_markdown column (idempotent) ─────────────
            # Found unwired in the SAME audit that uncovered the Step 2g incident above. This
            # file predates this workflow's DDL-wiring convention entirely (its own header
            # comment describes a pre-automation "owner applies manually on prod" workflow, from
            # before auto-deploy existed — see docs/runbooks/deployment.md). Wiring it in now,
            # defense-in-depth: `ADD COLUMN IF NOT EXISTS` is a safe no-op if the owner already
            # applied it by hand at the time, and closes the gap either way if not.
            # Source: apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql
            REQUISITES_MARKDOWN_FILE="/opt/crm/apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql"

            if [ ! -f "$REQUISITES_MARKDOWN_FILE" ]; then
              echo "ERROR: DDL file not found at $REQUISITES_MARKDOWN_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying company_account.requisites_markdown DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$REQUISITES_MARKDOWN_FILE"
            echo "==> company_account.requisites_markdown DDL applied successfully"

            # ── Step 3: start / update api + nginx with new GHCR images ──────────────────────
            # DDL is already applied — new api image will see the columns and indexes.
            # --remove-orphans cleans up any containers from old service names.
            echo "==> Starting / updating api and nginx (no-rebuild — GHCR images)"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              up -d --remove-orphans

            echo "==> Health check — waiting for API container"
            for i in $(seq 1 20); do
              if docker compose \
                   -f docker-compose.prod.yml \
                   -f docker-compose.ghcr.yml \
                   --env-file .env.production \
                   exec -T api \
                   wget -qO- http://127.0.0.1:3001/api/health 2>/dev/null; then
                echo ""
                echo "API healthy after ${i}x checks"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "ERROR: API did not become healthy within 40s"
                docker compose \
                  -f docker-compose.prod.yml \
                  -f docker-compose.ghcr.yml \
                  --env-file .env.production \
                  logs --tail=50 api
                exit 1
              fi
              sleep 2
            done

            echo "==> Smoke test — external HTTP check (CRM API, non-fatal)"
            if curl -sf --max-time 15 https://app.cheekycheese.tech/api/health; then
              echo "External health check PASSED"
            else
              echo "WARNING: external check failed (Cloudflare/TLS may not be configured yet)"
              echo "Internal API is healthy — stack is running correctly"
            fi

            # task-infra-locale-edge (security-review round 1, HIGH-2 follow-up;
            # hardened in round 2, LOW-3): unlike the CRM API check above (kept
            # non-fatal, tolerates the DNS/TLS-not-configured-yet state a
            # brand-new deployment can be in), this checks nginx's LANDING
            # server block and is FATAL — nginx/Dockerfile's HIGH-2 fix (see
            # scripts/devops/locale-routing-runbook.md §11) closes the
            # config-injection vector that could make nginx fail to start, but
            # this is the last line of defence against ANY OTHER future config
            # mistake (not just build-arg injection) that produces the same
            # failure mode: image builds fine, container crash-loops on boot,
            # `docker compose up -d` still reports success, and without this
            # check the deploy step would too — silently taking down the whole
            # public site (landing AND, since nginx is shared, CRM) with a
            # green pipeline.
            #
            # round 2 (LOW-3): the FIRST version of this check hit the public
            # hostname (`https://cheekycheese.tech/`), meaning the VPS made an
            # outbound request through Cloudflare and back to itself (a
            # hairpin round-trip) — a transient CF blip or DNS hiccup unrelated
            # to nginx's own health would fail the deploy. Fixed by hitting
            # nginx's PUBLISHED PORT directly on loopback
            # (`docker-compose.prod.yml` maps `80:80`/`443:443` to the host)
            # with an explicit Host header, so the request still goes THROUGH
            # nginx (exercises the real landing.conf server block, the
            # locale-detect njs module, the merge-order guard — everything
            # this PR added) but never leaves the VPS or depends on Cloudflare/
            # DNS being reachable. Port 80 (not 443): no TLS handshake/cert
            # complexity to add here, and the :80 server block runs the exact
            # same locale-redirect logic as :443 (see nginx/conf.d/landing.conf
            # — both blocks are kept in sync deliberately). Checks `/` (root)
            # AND one locale-prefixed URL (`/uk/`) — the latter is safe to
            # check regardless of feature/landing-i18n merge state: unmerged,
            # the locale-edge guard (see runbook §4) makes `/uk/` fall back to
            # a plain EN 200, not a 404 — still passes this check either way.
            echo "==> Smoke test — landing origin through local nginx, Host header (FATAL)"
            if curl -sf --max-time 15 -H 'Host: cheekycheese.tech' http://127.0.0.1/ > /dev/null \
               && curl -sf --max-time 15 -H 'Host: cheekycheese.tech' http://127.0.0.1/uk/ > /dev/null; then
              echo "Landing origin health check PASSED (/ and /uk/ both 200)"
            else
              echo "ERROR: nginx is not returning 200 on / and/or /uk/ for the landing Host header."
              echo "This means nginx failed to start or is misconfigured — the deploy is NOT healthy"
              echo "even though earlier internal checks passed. See scripts/devops/locale-routing-runbook.md"
              echo "§11 for the config-injection class this guards against, and §6 for the general"
              echo "check-locale-routing.sh dry-run workflow to diagnose locally."
              exit 1
            fi

            # security review round 1 (PR #429, MED-3): scripts/devops/check-
            # security-headers.sh was written to catch the HSTS/CSP/X-Frame-
            # Options-loss class of regression (crm.conf's add_header-
            # inheritance bug, and the Turnstile/R2 CSP-content gaps) but was
            # never actually wired into anything — a repeat of exactly this
            # bug class would ship silently through a green pipeline, same
            # failure mode the landing check above already guards against for
            # locale-routing. FATAL for the same reason: this is a "did nginx
            # end up serving the config we think it did" class of check, not
            # a soft warning. Hits 127.0.0.1 (not the public hostnames) for
            # the SAME reason as the landing check immediately above (round 2,
            # LOW-3 there) — avoids a Cloudflare/DNS hairpin dependency on
            # what is fundamentally a "is nginx's OWN config correct" check.
            # The script itself was scp'd to /opt/crm/scripts/devops/ in the
            # copy-compose job above (see that step's comment) — it is not
            # part of the VPS's normal file set otherwise.
            echo "==> Smoke test — security headers (HSTS/CSP), both domains via local nginx (FATAL)"
            if bash /opt/crm/scripts/devops/check-security-headers.sh http://127.0.0.1; then
              echo "Security headers check PASSED"
            else
              echo "ERROR: nginx is not serving the expected security headers (HSTS/CSP/etc.) on one"
              echo "or both domains. This means a regression of the class fixed in PR #429 (nginx's"
              echo "add_header inheritance gotcha, or an incomplete/missing CSP directive) shipped —"
              echo "see scripts/devops/check-security-headers.sh's own header comment and"
              echo "scripts/devops/csp-report-only-rollout-runbook.md for how to diagnose locally."
              exit 1
            fi

            echo "==> Cleaning dangling images"
            docker image prune -f || true

            echo "==> Deploy complete. IMAGE_TAG=${IMAGE_TAG}"

      # ── 5. IndexNow ping (AC B6) ─────────────────────────────────────────
      # task-infra-locale-edge: runs on the RUNNER, not via SSH — it only
      # needs outbound HTTPS to api.indexnow.org, no VPS access. Added as a
      # step in this EXISTING job rather than a new job (extra jobs cost more
      # CI minutes for no benefit here — this step is a ~1s HTTP call).
      # Non-blocking by design: a missing secret or a non-2xx IndexNow
      # response never fails the deploy (see
      # scripts/devops/indexnow-ping.sh and locale-routing-runbook.md
      # "IndexNow" for the fail-soft rationale, matching the Google Indexing
      # API convention already established in docs/runbooks/deployment.md).
      # Pings a fixed set of known static URLs (all 5 locale home pages +
      # careers indexes) — safe regardless of merge order with
      # feature/landing-i18n: a locale URL that doesn't have its own
      # prerendered content yet simply serves the EN fallback (still a valid
      # 200), so notifying it early is harmless, not incorrect.
      - name: Checkout (for IndexNow ping script)
        uses: actions/checkout@v4

      - name: Ping IndexNow (Bing + Yandex)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY secret not set — skipping IndexNow ping. This is optional and expected until the owner generates a key (see scripts/devops/locale-routing-runbook.md 'IndexNow')."
            exit 0
          fi
          scripts/devops/indexnow-ping.sh "$INDEXNOW_KEY" cheekycheese.tech \
            https://cheekycheese.tech/ \
            https://cheekycheese.tech/careers/ \
            https://cheekycheese.tech/uk/ \
            https://cheekycheese.tech/uk/careers/ \
            https://cheekycheese.tech/ru/ \
            https://cheekycheese.tech/ru/careers/ \
            https://cheekycheese.tech/es/ \
            https://cheekycheese.tech/es/careers/ \
            https://cheekycheese.tech/pt/ \
            https://cheekycheese.tech/pt/careers/
