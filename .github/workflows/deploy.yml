name: Deploy

# ── Trigger model (auto-deploy ENABLED 2026-07-12, weekly rebuild ADDED 2026-07-24) ─
# Three complementary channels — no PAT required, no double-trigger:
#
# 1. `push: branches: [main]`
#    Fires on human pushes to main: owner UI-merge, revert, hotfix.
#    Does NOT fire on GITHUB_TOKEN-authored pushes (GitHub anti-recursion
#    protection) — auto-merge squashes from auto-merge-on-label.yml are
#    therefore NOT covered here.
#
# 2. `workflow_dispatch`
#    Used for:
#      a) Manual one-off runs with `image_tag` LEFT EMPTY — builds and
#         publishes fresh images from whatever ref triggered this run (main
#         by default), exactly like the automatic `push`/`schedule` paths.
#      b) Rollback — `image_tag` set to an EXISTING git SHA already published
#         in GHCR (task-infra-rollback-deploys-not-rebuilds). This SKIPS the
#         build/publish steps entirely (`build` job's `if: inputs.image_tag
#         == ''` guards) and deploys that already-built image as-is — it
#         does NOT rebuild and does NOT overwrite the tag. See the "Verify
#         rollback image exists in GHCR" step and docs/runbooks/deployment.md §9.
#      c) Explicit dispatch from auto-merge-on-label.yml after a squash-merge
#         — always case (a), an empty image_tag — because GITHUB_TOKEN-pushes
#         do not create push events for workflows (workflow_dispatch is the
#         documented exception to this rule).
#
# 3. `schedule` (weekly rebuild — task-infra-weekly-rebuild)
#    Rebuilds and redeploys `main` every Sunday even with zero merges that
#    week. Why: JobPosting `validThrough` on each published vacancy is set to
#    build-time + 60 days (sliding window, not a fixed date) — see
#    apps/landing prerender step. Without a periodic rebuild, that window
#    would only ever refresh on a merge, and JobPosting/sitemap freshness
#    would silently drift stale between merges. A scheduled run walks the
#    exact same build+DDL+restart pipeline as a normal deploy (image_tag
#    defaults to the git SHA of `main` HEAD at trigger time, same as `push`)
#    — cheap (~15 min/week) and side-effect-free (all DDL is idempotent).
#    See docs/runbooks/deployment.md "Google Indexing API" for the related
#    weekly JobPosting refresh on the API side.
#
# Result: every merge to main triggers exactly one deploy run, plus one
# unconditional run every week regardless of merge activity.
# Double-trigger impossible: auto-merge squash -> push-trigger silent
# (GITHUB_TOKEN), dispatch fires; human merge -> push fires, no dispatch.
# Race condition handled by concurrency group `deploy-production` below —
# if the weekly run happens to overlap a push/dispatch-triggered deploy,
# `cancel-in-progress` cancels whichever started first (last-trigger-wins,
# same behavior as any other overlapping deploy; the weekly run is cheap
# enough to simply fire again next Sunday if it ever gets cancelled).
#
# Emergency: to disable auto-deploy, comment out `push:` below AND remove
# the dispatch step in auto-merge-on-label.yml. To disable ONLY the weekly
# rebuild, comment out `schedule:` below (push/workflow_dispatch unaffected).
# See docs/runbooks/deployment.md for full details.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: git SHA of HEAD)'
        required: false
        default: ''
  push:
    branches: [main]
  schedule:
    # Sunday ~03:00 UTC — low-traffic window, chosen to match the
    # pg-backup.sh cron's recommended schedule (docs/runbooks/deployment.md
    # §8 — daily 03:00 UTC) so the two would never compete for VPS resources
    # during the same minute IF that cron is installed. NOTE (found
    # 2026-08-03, task-infra-prod-backup-safety-net): that cron is a MANUAL,
    # owner-installed step (§8) — this pipeline does not install it and, until
    # this PR, never verified it was actually running either; prod had been
    # deploying with zero DB backups since the very first deploy. Whether a
    # fresh backup is actually landing is now checked on every `deploy` job
    # run (see the "Check backup freshness on VPS (SSH)" step near the end
    # of that job) — see docs/runbooks/deployment.md §8.1.
    - cron: '0 3 * * 0'

concurrency:
  # One deploy at a time. If a new push arrives while deploying, cancel the
  # in-progress run so the latest image lands (not an intermediate one).
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Repository owner must be lowercase for GHCR image names.
  IMAGE_OWNER: yaremenko-maksym
  REPO_SLUG: cheekycheeseit-crm
  # task-csp-reports-and-flip (Part B, security review round 2 LOW fix):
  # CRM_CSP_MODE — the SINGLE source of truth for whether CRM's CSP ships
  # Content-Security-Policy-Report-Only (observe, current rollout state) or
  # Content-Security-Policy (enforcing). Threaded into TWO places below —
  # the nginx build-arg (bakes the mode into the image, see nginx/Dockerfile
  # ARG CRM_CSP_MODE) and the post-deploy smoke-test invocation (so the
  # guard checks whichever header name is actually live) — both read
  # `${{ env.CRM_CSP_MODE }}`, so they cannot drift apart the way the old
  # two-independent-constants setup could (nginx/conf.d/csp-map.conf's two
  # maps + scripts/devops/check-security-headers.sh's own constant, fixed
  # separately before this consolidation). To flip CRM to enforcing: change
  # THIS one value and follow
  # scripts/devops/csp-report-only-rollout-runbook.md §4.
  #
  # Flipped to enforcing 2026-08-03 (task-csp-reports-and-flip): first real
  # 7-day csp_reports haul (cheekycheese-telemetry issue #10) found nothing
  # of ours left to fix — see csp-map.conf's app.cheekycheese.tech comment
  # block and the runbook §1 for the two violation classes found and why
  # only one needed a policy change.
  CRM_CSP_MODE: enforcing
  # security review (PR #437 follow-up, MED-2 "soft-launch" ask,
  # 2026-07-27): ORIGIN_GATE_MODE — SAME pattern as CRM_CSP_MODE directly
  # above, one value threaded into the nginx build-arg (bakes the mode
  # into the image, see nginx/Dockerfile ARG ORIGIN_GATE_MODE). "observe"
  # (current rollout state) means nginx/snippets/origin-gate.conf's
  # origin-IP gate logs its decision on every request (see nginx.conf's
  # `log_format main` — grep for ` origin_gate=0 `) but never blocks;
  # "enforce" actually returns 403. Flip only after a clean observation
  # window finds zero `origin_gate=0` lines from real traffic — see
  # nginx/conf.d/origin-gate-mode.conf's header comment for the full
  # rationale and nginx/snippets/origin-gate.conf for why a naive gate is
  # dangerous enough to warrant this staged rollout in the first place.
  ORIGIN_GATE_MODE: observe

# Default-deny: every job inherits read-only `contents` and nothing else.
# Jobs that need more (build → packages:write, deploy → packages:read +
# issues:write) override this explicitly. Least-privilege for the
# GITHUB_TOKEN across the whole deploy.
permissions:
  contents: read

jobs:
  # ── 1. Build & push images to GHCR ───────────────────────────────────────
  # security review (PR #613 round 2, SR-M-3) — INVARIANT for anyone adding a
  # new `build-args:` line to either build step below, written down here
  # because it existed only as an unstated assumption before this review:
  #
  #   Security confirmed BY FACT (not by reading this comment) that these
  #   images are pulled ANONYMOUSLY — the GHCR manifest is served with no
  #   pull-side auth check. A build-arg is not a build-time-only value: it is
  #   baked into a layer of a manifest anyone can `docker pull` without
  #   credentials. There is no private-build/public-runtime boundary to lean
  #   on here — public the moment it's pushed.
  #
  #   Several build-args below already read `${{ secrets.* }}`
  #   (VITE_TURNSTILE_SITE_KEY, INDEXNOW_KEY, BING_SITE_VERIFICATION_ID,
  #   YANDEX_VERIFICATION_FILENAME, YANDEX_VERIFICATION_CONTENT). That is
  #   correct AS IS: GitHub Secrets is where these are stored for
  #   provisioning convenience, not because the values are confidential — a
  #   Turnstile *site* key and a search-engine verification file are meant to
  #   be public. The invariant is about actual confidentiality, never about
  #   which GitHub Actions store a value happened to come from.
  #
  #   Anything that carries real authority if someone else reads it —
  #   credentials, private keys, write-scoped API tokens, any of the values
  #   the `write-env` job below pipes over SSH into /opt/crm/.env.production —
  #   must NEVER become a build-arg. That job's SSH-env pattern is precisely
  #   the mechanism that exists so those values reach the VPS without ever
  #   touching an image layer; use it, don't route around it via build-args.
  #
  #   No mechanical gate enforces this (a text-scan of `build-args:` blocks
  #   would have to distinguish "public value we store as a GH secret" from
  #   "real secret" — a distinction that lives in what the value IS, not in
  #   its syntax — so it would either miss real leaks or flag the four
  #   legitimate ones above on every run; a gate that cries wolf on known-safe
  #   lines teaches the next author to route around it, not to read it). This
  #   comment is the check.
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        env:
          # security review (PR #613 round 2, SR-M-1): passed as an env var,
          # NEVER interpolated into the run: script body. `${{ inputs.image_tag }}`
          # substituted directly into a shell string (the old
          # `INPUT_TAG="${{ inputs.image_tag }}"` line) is GitHub Actions'
          # canonical script-injection shape — a workflow_dispatch caller
          # controls that string verbatim, so it becomes attacker-controlled
          # shell source, not just an attacker-controlled value. Routing it
          # through `env:` first turns it into an opaque environment variable
          # instead — the shell below only ever reads `$INPUT_TAG`, never
          # re-parses the literal input text as code.
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          # actual_commit — the git SHA of the commit THIS RUN actually
          # checked out and is about to build, computed by command
          # UNCONDITIONALLY (both branches below run this line first).
          # Deliberately kept separate from image_tag below:
          #
          #   image_tag    = WHERE the built image gets published — a label.
          #                  On a manual workflow_dispatch run the operator
          #                  chooses it freely (any existing git SHA).
          #   actual_commit = WHAT was really checked out and compiled — a
          #                  FACT. The checkout step above has no `ref:`, so
          #                  it always builds from whatever ref triggered
          #                  this run (main HEAD for push/schedule, or the
          #                  branch picked in the dispatch UI — main by
          #                  default) REGARDLESS of what image_tag says.
          #
          # security review (PR #613 round 3, SR-H-2): a prior version of
          # this workflow fed GIT_COMMIT from image_tag, which conflated the
          # two above. On a manual dispatch naming an OLD sha as image_tag
          # ("redeploy this build"), the checkout step still builds from main
          # HEAD — so that run would rebuild from main, publish the result
          # under the OLD tag (overwriting whatever image previously lived
          # there), and bake the OLD sha into GIT_COMMIT even though main's
          # code is what actually shipped. See the "Build & push API image"
          # step below for where actual_commit closed that GIT_COMMIT-honesty
          # gap. The SEPARATE rebuild/overwrite defect this paragraph also
          # describes — a manual dispatch naming an old tag still rebuilding
          # and republishing under it — is fixed by
          # task-infra-rollback-deploys-not-rebuilds (this PR): see the
          # `if: inputs.image_tag == ''` guards on the build/push steps below,
          # which now skip both entirely whenever INPUT_TAG is set, so this
          # ACTUAL_COMMIT value (still computed unconditionally, for the
          # automatic-path case) goes unused on that branch. See the "Verify
          # rollback image exists in GHCR" step below and
          # docs/runbooks/deployment.md §9 for the resulting rollback flow.
          ACTUAL_COMMIT=$(git rev-parse --short HEAD)
          echo "actual_commit=${ACTUAL_COMMIT}" >> "$GITHUB_OUTPUT"

          # image_tag: explicit input if provided (destination label, see
          # above); otherwise the actual_commit just computed.
          #
          # Per docs/runbooks/deployment.md §9 an explicit image_tag input is
          # ALWAYS expected to be a git SHA — same invariant
          # apps/api/src/config/env.ts's GIT_COMMIT validator already
          # assumes: `^[0-9a-f]{7,40}$`, case-insensitive. Enforcing that
          # invariant HERE, before the value goes anywhere, closes a second
          # injection class on top of the env: fix above: $GITHUB_OUTPUT is a
          # newline-delimited `key=value` file, so an input containing an
          # embedded newline could otherwise smuggle an extra `key=value`
          # line into it — and from there an extra docker build-arg or tag,
          # since this output flows straight into the multi-line
          # `build-args: |` / `tags: |` blocks below. A hex SHA cannot
          # contain a newline or any shell/YAML metacharacter, so a passing
          # regex match makes that structurally impossible rather than
          # merely escaped — a malformed value fails the run outright
          # instead of being sanitized-and-continued.
          #
          # Match with bash's own `[[ =~ ]]` against the WHOLE variable, not
          # `grep -E '^...$'` piped from `printf` — `^`/`$` in POSIX grep
          # anchor to each LINE of the input, not to the buffer as a whole, so
          # a value like $'abc1234\nextra_key=extra_value' would satisfy
          # `grep -qE '^[0-9a-fA-F]{7,40}$'` on its first line and let the
          # smuggled second line straight through — verified locally with a
          # throwaway harness before landing this fix. `[[ "$var" =~ ^...$ ]]`
          # has no such per-line splitting: the anchors bind to the start and
          # end of the actual string, so an embedded newline fails the match.
          if [ -n "$INPUT_TAG" ]; then
            if [[ ! "$INPUT_TAG" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::image_tag input is not a valid git SHA (expected 7-40 hex chars, see docs/runbooks/deployment.md §9). Refusing to use it as a Docker tag / build-arg."
              exit 1
            fi
            # task-infra-rollback-deploys-not-rebuilds (this PR): a non-empty
            # INPUT_TAG now means "redeploy the already-published image with
            # this tag" — the build/push steps below carry
            # `if: inputs.image_tag == ''` and are skipped entirely on this
            # branch, and the "Verify rollback image exists in GHCR" step
            # confirms both images are actually present in GHCR before this
            # job can succeed. Before this PR, this exact branch silently did
            # the OPPOSITE of a rollback: it rebuilt from whatever the
            # checkout step happened to have (main HEAD, regardless of
            # $INPUT_TAG) and republished the result under $INPUT_TAG,
            # OVERWRITING the very image a rollback needed to fall back to
            # next. Say so, only here (manual input present) — never on the
            # automatic push/schedule path, where no such input exists to
            # notify about.
            # security review (PR #615 round 2, SR-H-1): this run does not touch
            # `main` — it only redeploys an already-built image. That makes the
            # rollback TEMPORARY by construction: the next merge to `main`
            # (auto-deploy) or the next scheduled Sunday 03:00 UTC rebuild
            # rebuilds and redeploys `main` HEAD regardless, silently undoing
            # this run — possibly with nobody watching. Before this PR there was
            # nothing to undo (a rollback dispatch didn't actually roll back
            # anything, see the SR-H-2 history note above); this self-reverting
            # behavior is a direct, new consequence of THIS fix, so it is said
            # here, not assumed obvious. Said again, more visibly, in the
            # `deploy` job's job-summary reminder (only reachable after a
            # successful deploy) — this early notice is the one an operator
            # sees immediately on dispatch, before waiting for the rest of the
            # run.
            echo "::notice::Rollback run — deploying the image already published under tag '${INPUT_TAG}' in GHCR. Build & publish are skipped for this run (see the build job's step conditions). If no image exists under that tag, the 'Verify rollback image exists in GHCR' step below fails this run before anything is sent to the VPS. THIS IS TEMPORARY: 'main' is unchanged by this run — the next merge or the next scheduled Sunday 03:00 UTC rebuild redeploys 'main' HEAD and undoes this rollback. To make it permanent, revert the offending commit(s) in 'main' (e.g. 'git revert <bad-sha>', open a PR, merge it) so the next automatic deploy IS the state you want running. See docs/runbooks/deployment.md §9."
            echo "image_tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${ACTUAL_COMMIT}" >> "$GITHUB_OUTPUT"
          fi
          # backlog 113 — GET /api/health's build fingerprint
          # (apps/api/src/health/health.controller.ts). Plain UTC ISO-8601
          # timestamp of THIS CI run, always computed (never blank) — consumed
          # below as the API image's BUILD_TIME build-arg.
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Used by the two `docker/build-push-action` steps below on the
      # automatic path AND by `docker buildx imagetools inspect` in the
      # "Verify rollback image exists in GHCR" step right after it on the
      # rollback path — kept unconditional (cheap, no build cost by itself)
      # so both paths get a consistent, known-working buildx rather than
      # relying on whatever the runner image happens to ship by default.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Rollback path: verify the requested tag actually exists ─────────
      # task-infra-rollback-deploys-not-rebuilds: when INPUT_TAG is set (see
      # the "Resolve image tag" step above), this run is a ROLLBACK — deploy
      # the already-published image under that tag, do not rebuild it. Both
      # `docker/build-push-action` steps below are skipped entirely on this
      # path (`if: inputs.image_tag == ''`), so without this check nothing
      # would notice a typo'd or never-published tag until the `deploy` job
      # SSHes to the VPS and runs `docker compose pull` there — an opaque
      # "manifest unknown" failure on the VPS, AFTER write-env/copy-compose
      # have already run against a target that cannot actually deploy.
      # Checking HERE, on the runner, before write-env/copy-compose even
      # start (this job — `build` — is a dependency of both; a failed job
      # skips everything that `needs:` it) turns that into one clear failure
      # in the very first job, before anything reaches the VPS.
      #
      # `docker buildx imagetools inspect` queries the registry manifest
      # directly — it does not pull image layers, so this is cheap (a couple
      # of HTTP calls) regardless of image size. Checks BOTH images (api AND
      # nginx), because the `deploy` job's pull step further down pulls both;
      # the two are always built and published together on the automatic
      # path below, but a partial/failed prior run is exactly the kind of gap
      # this check exists to catch — refused here, not discovered on the VPS.
      - name: Verify rollback image exists in GHCR
        if: ${{ inputs.image_tag != '' }}
        env:
          TAG: ${{ steps.meta.outputs.image_tag }}
          # security review (PR #615 round 2, LOW-2): the three values below
          # are plain repo-owned constants (registry host / owner / repo
          # slug), not secrets and not attacker-controlled — but this file's
          # OWN stated convention (see e.g. the "Resolve image tag" step's
          # SR-M-1 comment, and the write-env job's header comment) is that
          # nothing gets interpolated directly into a `run:` script string;
          # everything travels through `env:` first. This step, being new in
          # this PR, is where that convention was first missed. No injection
          # risk either way (these three never vary per-run), fixed purely
          # so the convention stays true without an asterisk for the next
          # person reading it as a pattern to copy.
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          REPO_SLUG: ${{ env.REPO_SLUG }}
        run: |
          set -euo pipefail
          API_REF="${REGISTRY}/${IMAGE_OWNER}/${REPO_SLUG}-api:${TAG}"
          NGINX_REF="${REGISTRY}/${IMAGE_OWNER}/${REPO_SLUG}-nginx:${TAG}"

          MISSING=0
          for REF in "$API_REF" "$NGINX_REF"; do
            echo "==> Checking ${REF}"
            if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
              echo "    found"
            else
              echo "::error::No image found in GHCR at ${REF}"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Rollback requested tag '${TAG}', but at least one image above does not exist in GHCR. Nothing was sent to the VPS. Pick a tag that GitHub → Packages actually lists (docs/runbooks/deployment.md §9), or leave image_tag empty to build and publish a fresh image instead."
            exit 1
          fi

          echo "==> Both images exist for tag '${TAG}'. Skipping build/publish — the deploy job will pull these as-is."

      # ── Rollback path: verify the found tag is not a POISONED tag ───────
      # security review (PR #615 round 2, SR-M-1): the check above confirms a
      # manifest EXISTS under the requested tag — it does not confirm that
      # manifest actually came from the commit its own name claims. Before
      # THIS PR (task-infra-rollback-deploys-not-rebuilds) merged, a rollback
      # dispatch rebuilt from `main` HEAD and republished the result UNDER
      # THE OLD TAG (see the "Resolve image tag" step's SR-H-2 history note
      # above) — any tag published by that bug now points at a commit that is
      # NOT what its name says. A future rollback naming that tag would
      # silently deploy the wrong build, which is exactly the failure mode
      # this whole PR exists to close, just moved one layer down.
      #
      # apps/api/Dockerfile bakes its ACTUAL build commit into a `GIT_COMMIT`
      # env var (`ARG GIT_COMMIT=` / `ENV GIT_COMMIT=$GIT_COMMIT`), fed
      # `steps.meta.outputs.actual_commit` — a git-derived FACT, independent
      # of whatever tag the image later gets published under (see the
      # "Build & push API image" step below). The nginx image has no
      # equivalent: its own `VITE_BUILD_VERSION` build-arg is fed
      # `steps.meta.outputs.image_tag` — the SAME operator-chosen label the
      # tag itself is, so a poisoned tag poisons that value identically and
      # it proves nothing. Checking the API image only is deliberate, not an
      # oversight — see docs/runbooks/deployment.md §9 "Проверка после
      # отката" for the operator-facing version of this same caveat.
      #
      # `docker buildx imagetools inspect --format '{{json .Image.Config.Env}}'`
      # reads the image CONFIG blob (Env vars), not layers — confirmed live
      # against a real single-platform manifest before landing this fix: no
      # layer download, same cheap manifest-only cost as the existence check
      # above.
      #
      # THREE-VALUED on purpose, not a plain pass/fail — see the `if`/`elif`/
      # `else` below:
      #   - MISMATCH  → refuse (`exit 1`) — the strong signal, a poisoned tag.
      #   - MATCH     → proceed, log the confirmation.
      #   - ABSENT    → proceed with a `::notice::`, NOT a failure. GIT_COMMIT
      #     was only added to this image's build-args by PR #613 — every
      #     image published BEFORE that PR (i.e. every legitimate rollback
      #     target an owner could realistically name on the day this PR
      #     lands) carries no GIT_COMMIT at all. Treating "absent" as
      #     "mismatch" would refuse every rollback target that predates the
      #     very fix meant to protect it — the opposite of this step's job.
      #
      # Prefix-match (`==` on either direction), not exact string equality:
      # `image_tag` is validated as 7-40 hex chars (see the "Resolve image
      # tag" step) and the baked GIT_COMMIT is `git rev-parse --short HEAD`
      # (commonly 7-8 chars, auto-lengthened by git as the repo grows) — two
      # abbreviations of the SAME commit are not always the same LENGTH, but
      # one is always a prefix of the other (or of the full 40-char sha both
      # abbreviate). A brittle exact-length comparison would false-positive
      # a MISMATCH on a perfectly legitimate rollback the moment the two
      # abbreviation lengths happened to differ.
      - name: Verify rollback image fingerprint (API + nginx images)
        if: ${{ inputs.image_tag != '' }}
        env:
          TAG: ${{ steps.meta.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          REPO_SLUG: ${{ env.REPO_SLUG }}
        run: |
          set -euo pipefail

          # security review (PR #615 round 3, SR-M-4): a prior version of
          # this step piped `docker buildx imagetools inspect --format
          # '{{json .Image.Config.Env}}'` straight into jq and treated an
          # EMPTY result as "this image predates GIT_COMMIT (PR #613)" —
          # the same code path as the genuinely benign case. Reproduced
          # against a real MULTI-PLATFORM manifest before landing this fix:
          # `.Image` is not a top-level field on a manifest LIST/index (the
          # per-platform configs live under separate child manifests), so
          # the command exits 0 and prints nothing — indistinguishable from
          # "read fine, field just isn't there" by exit code alone. This
          # workflow does not build multi-platform images today (no
          # `platforms:` on either `docker/build-push-action` step below),
          # so this is not live yet — but the day someone adds one, this
          # check would silently stop verifying ANYTHING, with a log line
          # that looks identical to the harmless case, and nobody would
          # know. `read_env_fingerprint` below separates that outcome
          # (STRUCTURAL failure — could not read a Config.Env array at all)
          # from the genuine "read it fine, GIT_COMMIT just isn't set"
          # case, and reports the former as a loud, distinct
          # `::warning::` rather than folding it into the same `::notice::`
          # the latter gets. "Could not read" and "field absent" are not
          # the same claim — the first means this check did not run, and
          # that must never be silent.
          read_env_fingerprint() {
            local ref="$1" label="$2" out_var="$3"
            local env_json
            set +e
            env_json=$(docker buildx imagetools inspect "$ref" --format '{{json .Image.Config.Env}}' 2>&1)
            local status=$?
            set -e

            if [ "$status" -ne 0 ] || [ -z "$env_json" ] || ! printf '%s' "$env_json" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "::warning::Could not read a Config.Env array from ${ref} (exit ${status}, output: '${env_json}'). This is DIFFERENT from '${label} predates the GIT_COMMIT build-arg' — the check below did NOT run at all for this image, most likely because its manifest is multi-platform (this workflow builds single-platform today; if that ever changes, this is what the regression looks like). Proceeding WITHOUT fingerprint verification for ${label} — the existence check above is still in force, but a poisoned tag would not be caught here for it."
              printf -v "$out_var" '%s' ""
              return 0
            fi

            printf -v "$out_var" '%s' "$(printf '%s' "$env_json" | jq -r '.[]? | select(startswith("GIT_COMMIT=")) | ltrimstr("GIT_COMMIT=")' | head -n1)"
          }

          check_fingerprint() {
            local ref="$1" label="$2" baked_commit="$3"
            if [ -z "$baked_commit" ]; then
              echo "::notice::Cannot verify — the ${label} image at tag '${TAG}' carries no GIT_COMMIT fingerprint (built before that build-arg existed, or the manifest could not be read — see the warning above if so). Proceeding without this check; the existence check above is still in force."
            elif [[ "$baked_commit" == "$TAG"* || "$TAG" == "$baked_commit"* ]]; then
              echo "==> Fingerprint matches: the ${label} image published under tag '${TAG}' was actually built from commit ${baked_commit}."
            else
              echo "::error::The ${label} image published under tag '${TAG}' was actually built from commit '${baked_commit}' — NOT '${TAG}'. This tag was almost certainly poisoned by the pre-task-infra-rollback-deploys-not-rebuilds rebuild-and-overwrite bug (see docs/runbooks/deployment.md §9). Refusing to deploy a tag whose contents do not match its name. If you actually want the commit that got baked in, re-run naming it '${baked_commit}' instead."
              exit 1
            fi
          }

          API_REF="${REGISTRY}/${IMAGE_OWNER}/${REPO_SLUG}-api:${TAG}"
          read_env_fingerprint "$API_REF" "API" API_BAKED_COMMIT
          check_fingerprint "$API_REF" "API" "$API_BAKED_COMMIT"

          # security review (PR #615 round 3, LOW): the nginx image now
          # carries the same GIT_COMMIT ENV as the API image (nginx/
          # Dockerfile's `runtime` stage, added this round — previously
          # VITE_BUILD_VERSION was the only build-time label threaded into
          # it, and that one lives purely in the crm-builder stage's Vite
          # env and never becomes a Docker image ENV, so it was never
          # visible to `imagetools inspect` at all — "no fingerprint",
          # not "fingerprint absent"). Checking both images, not just API,
          # is what makes this a verification of the PAIR the rollback
          # actually deploys, not half of it.
          NGINX_REF="${REGISTRY}/${IMAGE_OWNER}/${REPO_SLUG}-nginx:${TAG}"
          read_env_fingerprint "$NGINX_REF" "nginx" NGINX_BAKED_COMMIT
          check_fingerprint "$NGINX_REF" "nginx" "$NGINX_BAKED_COMMIT"

      # ── Rollback path: verify the target commit has every file the
      # deploy pipeline treats as unconditionally present ─────────────────
      # security review (PR #615 round 3, SR-H-3): the two checks above
      # only ask "does GHCR have an image under this tag, and does it claim
      # to be built from this commit". Neither asks whether the FILES this
      # rollback is about to copy to the VPS — the two compose files, and
      # every DDL/script the `deploy` job's SSH script treats as
      # UNCONDITIONALLY present (its own "Step 2/2b/2c/2d/2e/2g/2h/2ab/2ac/
      # 2ad/2af" — see that job for the per-file "why unconditional"
      # reasoning) — actually EXIST in the git tree at the rollback target
      # commit. Before this step, a rollback target older than one of those
      # files' introducing commit was refused too late to make the comments
      # elsewhere in this workflow (and docs/runbooks/deployment.md §9)
      # honest about "before anything reaches the VPS":
      #
      #   - `write-env` is a SIBLING of `copy-compose` (both `needs: build`
      #     ONLY — no dependency on each other), not its successor. It ran
      #     in PARALLEL and had already SSHed the rollback tag into
      #     /opt/crm/.env.production well before anything else could fail.
      #   - WITHIN `copy-compose` itself, the four newest such files
      #     (2026-08-19 through 2026-08-22 — task-senior-drop-income-
      #     idempotency / task-settle-payout-link / task-settled-amount-
      #     snapshot / task-invoice-signature-integrity) are copied by
      #     unconditional `scp` steps with NO `if:` guard, placed at the
      #     very END of that job's ~25 steps — AFTER the big first "Copy
      #     compose files and DDL via SCP" step had already copied both
      #     compose files and eight earlier DDL files, and after ~17 more
      #     guarded steps had already run. A rollback target older than
      #     2026-08-19 would fail one of those last four `scp` steps
      #     (source file does not exist in the pinned checkout) — by which
      #     point plenty was already on the VPS.
      #
      # Checking HERE instead — in `build`, the ONE job both `write-env`
      # and `copy-compose` `needs:` — is what actually makes "fails before
      # anything reaches the VPS" true: a failed `build` job means NEITHER
      # dependent job ever starts. Do NOT "fix" this by adding `if:` guards
      # to the four unconditional `scp` steps in `copy-compose` instead —
      # that would make them silently SKIP a file the `deploy` job's own
      # script still hard-requires, moving the failure to the VPS itself,
      # after the containers are already mid-restart. Refusing here is
      # strictly better than either.
      #
      # This file list is a PARALLEL, MANUALLY-MAINTAINED mirror of the
      # paths already hardcoded as unconditional in `copy-compose`'s fixed
      # `source:` list + its four single-file unconditional `scp` steps,
      # and in the `deploy` job's own `_FILE=` variables for the same
      # steps — not derived from them. There is no cheaper way to ask git
      # "which files does a workflow script consider mandatory" than naming
      # them; a text-scan of this very file was already rejected for the
      # analogous build-args question earlier in this job, for the same
      # reason (it cannot tell "legitimately optional" from "actually
      # missing" without knowing the author's intent). Whoever adds a new
      # UNCONDITIONAL, same-PR DDL/script wiring step to `copy-compose`/
      # `deploy` MUST add its path here too — and to
      # docs/runbooks/deployment.md §9's rollback-depth-limit command,
      # which mirrors this same list for the same reason. That second half
      # is no longer just a comment asking for a synchronized edit: PR #615
      # round 4 taught scripts/devops/check-prod-ddl-wiring.py's own
      # "HARD-REQUIRED FILE LIST MIRROR INVARIANT" to compare this list
      # against the runbook's command by set difference and fail the CI
      # "Prod DDL wiring guard" step by name (which file, which side) the
      # moment either one is edited without the other — the exact class of
      # drift this guard already existed to catch for the scp/psql pair
      # above (module docstring, PR #422), extended rather than duplicated.
      #
      # security review (PR #615 round 4, SR-M-5): a mirror-vs-mirror check
      # cannot catch BOTH copies silently omitting the SAME file — which is
      # exactly what happened here (scripts/devops/pg-backup.sh and
      # scripts/devops/check-backup-freshness.sh sat in copy-compose's fixed
      # `source:` list, unlisted here and in the runbook, invisible to the
      # round-4 guard because both sides agreed on the wrong thing). Round 5
      # taught check-prod-ddl-wiring.py to additionally require this list to
      # COVER every path named by an scp-action step in copy-compose that
      # carries no `if:` at all — the actual source of truth, not a second
      # hand-maintained copy of it.
      #
      # `fetch-depth: 0` (full history), same reasoning and same proven
      # pattern as `copy-compose`'s own "Checkout (for compose files) —
      # rollback, full history" step: `steps.meta.outputs.image_tag` is
      # commonly a SHORT sha (7-8 hex chars) and `actions/checkout`'s `ref:`
      # input requires the FULL 40-char form, so pinning via `ref:` directly
      # would break the common case. A second, unconditional-ref checkout
      # here just re-fetches the SAME ref this job already has (harmless —
      # the build/push steps below are all skipped on this path anyway) but
      # WITH full history, so plain `git` commands can resolve the
      # (possibly abbreviated) rollback target locally.
      - name: Checkout (rollback target file verification) — full history
        if: ${{ inputs.image_tag != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify rollback target commit has all hard-required files
        if: ${{ inputs.image_tag != '' }}
        env:
          TARGET: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail

          # No working-tree checkout of TARGET needed — `git cat-file -e`
          # reads a commit's tree straight from the (now-complete) object
          # database; this job's own working tree stays on the ref that
          # triggered the run, which is fine, since nothing else in this
          # job depends on it after this point on the rollback path.
          if ! git rev-parse --quiet --verify "${TARGET}^{commit}" > /dev/null; then
            echo "::error::Rollback target '${TARGET}' does not resolve to a commit reachable from this fetch. Nothing was sent to the VPS."
            exit 1
          fi

          MISSING=0
          for FILE in \
            docker-compose.prod.yml \
            docker-compose.ghcr.yml \
            apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql \
            apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql \
            apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql \
            apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql \
            apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql \
            apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql \
            apps/api/drizzle/manual/2026-07-22_vacancies.sql \
            apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql \
            apps/api/drizzle/manual/2026-08-19_senior_drop_income_idempotency_index.sql \
            apps/api/drizzle/manual/2026-08-21_pending_obligations_payout_request_id.sql \
            apps/api/drizzle/manual/2026-08-22_settled_amount_snapshot.sql \
            apps/api/drizzle/manual/2026-08-22_invoice_signature_void_and_snapshot.sql \
            apps/api/drizzle/manual/2026-09-01_approvals.sql \
            apps/api/drizzle/manual/2026-09-01_user_emails.sql \
            apps/api/drizzle/manual/2026-09-02_project_status.sql \
            apps/api/drizzle/manual/2026-09-02_user_email_invites.sql \
            apps/api/drizzle/manual/2026-09-03_pending_senior_share.sql \
            apps/api/drizzle/manual/2026-09-04_approval_status_cancelled.sql \
            apps/api/drizzle/manual/2026-09-07_notification_subjects.sql \
            apps/api/drizzle/manual/2026-09-12_notification_emails.sql \
            apps/api/drizzle/manual/2026-09-12_notification_preferences.sql \
            apps/api/drizzle/manual/2026-09-19_notification_email_skip_stale.sql \
            apps/api/drizzle/manual/2026-09-20_user_locale.sql \
            apps/api/drizzle/manual/2026-10-03_company_account_label_code.sql \
            apps/api/drizzle/manual/2026-10-04_multiple_salary_transactions_prepare.sql \
            apps/api/drizzle/manual/2026-10-04_multiple_salary_transactions_activate.sql \
            apps/api/drizzle/manual/2026-10-05_vacancy_sourcing_schema.sql \
            apps/api/drizzle/manual/2026-10-05_vacancy_sources_seed.sql \
            apps/api/drizzle/manual/2026-10-07_meeting_recorder_integration.sql \
            apps/api/drizzle/manual/2026-10-17_job_opportunities_store.sql \
            apps/api/drizzle/manual/2026-10-17_job_opportunities_store_indexes.sql \
            apps/api/drizzle/manual/2026-10-18_db_roles.sql \
            apps/api/drizzle/manual/2026-10-18_db_grants.sql \
            apps/api/drizzle/manual/2026-10-18_db_privileges_check.sql \
            scripts/devops/check-security-headers.sh \
            scripts/devops/check-nginx-perimeter.sh \
            scripts/devops/pg-backup.sh \
            scripts/devops/check-backup-freshness.sh \
          ; do
            if git cat-file -e "${TARGET}:${FILE}" 2>/dev/null; then
              echo "    found ${FILE}"
            else
              echo "::error::Rollback target '${TARGET}' is missing '${FILE}' — the deploy pipeline treats this file as unconditionally present (it was added to main by a commit newer than the rollback target). Deploying this target as-is would have write-env and copy-compose reach the VPS successfully, then have the deploy job's SSH script hard-fail on this exact file deep into a ~25-step script, after write-env already renamed .env.production's IMAGE_TAG and copy-compose already copied everything that DOES exist at this commit."
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Rollback target '${TARGET}' is missing one or more hard-required files (see above). Nothing was sent to the VPS. See docs/runbooks/deployment.md §9 for a command to compute today's actual rollback-depth floor, or pick a newer tag."
            exit 1
          fi

          echo "==> All hard-required files present at rollback target '${TARGET}'."

      # ── Build API image ─────────────────────────────────────────────────
      # backlog 113: GIT_COMMIT/BUILD_TIME feed GET /api/health's build
      # fingerprint (apps/api/src/health/health.controller.ts + config/env.ts),
      # whose entire job is answering "did prod actually redeploy" — see
      # config/env.ts's GIT_COMMIT comment: "REFERENCE DATA ... never
      # something the running process needs in order to work". That is why
      # GIT_COMMIT is fed steps.meta.outputs.ACTUAL_COMMIT below, not
      # steps.meta.outputs.image_tag.
      #
      # security review (PR #613 round 3, SR-H-2): a prior version of this
      # step fed GIT_COMMIT from image_tag, on the stated reasoning that both
      # images should "agree on which build this is". That reasoning was
      # wrong: image_tag is WHERE the image gets published (an operator-
      # chosen label on a manual workflow_dispatch run), actual_commit is
      # WHAT was actually checked out and compiled (see the "Resolve image
      # tag" step's comment for the full mechanism and why they can diverge).
      # SR-H-2 fixed GIT_COMMIT to read actual_commit instead of image_tag.
      #
      # HISTORICAL NOTE, no longer reachable: at the time, the divergence
      # happened because a manual dispatch naming an OLD sha as image_tag
      # ("redeploy this build") still ran THIS step, which still checked out
      # and built main HEAD (no `ref:` keyed off image_tag) and republished
      # the result under the old tag — overwriting the very image a rollback
      # needed. SR-H-2 only made the resulting GIT_COMMIT fingerprint honest
      # about that; it did not stop the overwrite. task-infra-rollback-
      # deploys-not-rebuilds (this PR) closed the actual gap: this step now
      # carries `if: inputs.image_tag == ''` (see below), so a manual
      # dispatch naming an existing tag never reaches this step at all — see
      # the "Verify rollback image exists in GHCR" step above and
      # docs/runbooks/deployment.md §9. The divergence this paragraph
      # describes cannot happen anymore; kept here because the reasoning for
      # why actual_commit and image_tag must stay conceptually separate (see
      # the "Resolve image tag" step) still holds, and the next divergence
      # bug will look exactly like this one if that separation is lost.
      #
      # VITE_BUILD_VERSION on the nginx image below still uses image_tag, not
      # actual_commit — it is a client-side cache-buster / telemetry label
      # (apps/web/vite.config.ts), not a "did prod redeploy" claim anything
      # relies on for correctness, so there is no honesty property to
      # preserve there the way there is for GIT_COMMIT. UNRELATED to and
      # unchanged by the point below: the nginx image ALSO now gets its own
      # GIT_COMMIT build-arg (security review PR #615 round 3, LOW), fed
      # actual_commit — same honesty property, same reasoning, as the API
      # image's GIT_COMMIT. Before this, the nginx image carried no
      # manifest-readable fingerprint at all: VITE_BUILD_VERSION only ever
      # lives in the crm-builder stage's Vite build env, never becomes a
      # Docker image ENV in the final `runtime` stage, and so was invisible
      # to `docker buildx imagetools inspect` — see the "Verify rollback
      # image fingerprint" step above, which now checks both images because
      # of this.
      #
      # BUILD_TIME is a plain UTC timestamp of this CI run, not git-derived —
      # always computed by the step above, never blank. Neither build-arg is
      # blank here (actual_commit and build_time are both unconditional) —
      # but even if one were, the Dockerfile's `ARG ...=` empty default +
      # env.ts's blank-to-undefined preprocess degrade to the honest
      # 'unknown' response, never a boot crash or an empty string (see
      # health.controller.ts + env.ts comments).
      # security review (PR #613 round 2, SR-M-3): this image is pulled
      # anonymously — no secrets here. See the invariant at the top of this
      # job (above `build:`) before adding a new build-arg.
      - name: Build & push API image
        if: ${{ inputs.image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.actual_commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Landing Turnstile site key — warn (do not fail) if unset ────────
      # task-vacancies-api (PR #390) adds a Cloudflare Turnstile widget to the
      # public vacancy-apply form on the landing page. That PR has not merged
      # yet at the time this infra-PR lands, so the form/widget do not exist
      # in the bundle either — an empty build-arg here is expected and safe
      # until #390 merges and the VITE_TURNSTILE_SITE_KEY secret is created
      # (see docs/runbooks/deployment.md "Turnstile secrets").
      #
      # task-infra-rollback-deploys-not-rebuilds: gated the same as the two
      # `docker/build-push-action` steps around it — this warning is about a
      # build-arg that only matters when a build is actually about to happen.
      - name: Warn if VITE_TURNSTILE_SITE_KEY is unset
        if: ${{ inputs.image_tag == '' }}
        env:
          # Read via env: (not interpolated into the run: script string) —
          # consistent with the secrets-handling pattern used in the
          # write-env / deploy jobs below.
          SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$SITE_KEY" ]; then
            echo "::warning::VITE_TURNSTILE_SITE_KEY secret is not set — landing bundle will build WITHOUT a Turnstile site key. Expected until PR #390 (vacancy-apply form) merges; see docs/runbooks/deployment.md 'Turnstile secrets'."
          fi

      # ── Build nginx image (includes Landing + CRM SPA) ──────────────────
      # task-infra-seo-gates: PRERENDER_API_ORIGIN is consumed by the SEO
      # prerender step in nginx/Dockerfile's landing-builder stage (no-op
      # until task-landing-seo-prerender adds the `build:prerender` script —
      # see the guard comment there). Points at the LIVE prod API — the old
      # containers are still serving during this build, see the Dockerfile
      # comment for why that is safe.
      #
      # task-telemetry-web (PR #415) / task-infra-telemetry-web-buildarg:
      # VITE_TELEMETRY=on is a plain build-time CONSTANT (not a GH secret —
      # it carries no sensitive value, just a feature switch) that flips the
      # CRM telemetry SDK from its default-DENY no-op to active. See
      # nginx/Dockerfile's crm-builder stage comment for the full
      # isTelemetryEnabled() contract. Safe regardless of merge order with
      # #415: before #415 merges the telemetry/ module doesn't exist yet, so
      # this arg is simply unused by the build.
      #
      # task-infra-locale-edge: four MORE optional build-args, same no-op-
      # when-unset pattern as VITE_TURNSTILE_SITE_KEY above — the IndexNow
      # key file + Bing/Yandex verification files (AC B6/B7). None of these
      # secrets exist yet at the time this PR lands (the owner sets them up
      # per scripts/devops/locale-routing-runbook.md §7/§8) — an empty value
      # here is expected and safe: nginx/Dockerfile's generation step prints
      # an explicit ::warning:: and leaves the corresponding endpoint absent
      # (404) rather than serving anything broken.
      #
      # task-infra-contact-email-env (this infra-PR) / feature/landing-contact-form
      # (parallel branch, not yet merged at the time this PR lands): the
      # public contact-email address shown on the landing page as a fallback
      # channel. This is a plain build-time CONSTANT, not a GitHub secret —
      # it carries no sensitive value (see scripts/devops/contact-email-runbook.md).
      # An unused build-arg is harmless if the parallel branch ends up wiring
      # this differently (e.g. hardcoding the address instead of reading a
      # Vite env var) — see nginx/Dockerfile's landing-builder stage comment.
      #
      # task-csp-reports-and-flip (Part B): CRM_CSP_MODE reads from THIS
      # workflow's own top-level `env:` block (see comment there) — the
      # single source of truth for CRM's CSP delivery mode, also passed to
      # the post-deploy smoke-test step below. See nginx/Dockerfile's own
      # `ARG CRM_CSP_MODE` comment for how it's consumed at build time.
      #
      # security review (PR #437 follow-up, MED-2): ORIGIN_GATE_MODE — SAME
      # pattern, this workflow's top-level `env:` block, single source of
      # truth for the origin-IP gate's observe/enforce mode. See
      # nginx/Dockerfile's own `ARG ORIGIN_GATE_MODE` comment.
      #
      # security review (PR #613 round 2, SR-M-3): this image is pulled
      # anonymously — no secrets here. The four `secrets.*` values already in
      # the block below (VITE_TURNSTILE_SITE_KEY / INDEXNOW_KEY /
      # BING_SITE_VERIFICATION_ID / YANDEX_VERIFICATION_*) are intentionally
      # public values stored via GH Secrets for provisioning, not confidential
      # ones — see the invariant at the top of this job (above `build:`)
      # before adding a new build-arg.
      - name: Build & push nginx image
        if: ${{ inputs.image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_BUILD_VERSION=${{ steps.meta.outputs.image_tag }}
            GIT_COMMIT=${{ steps.meta.outputs.actual_commit }}
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            PRERENDER_API_ORIGIN=https://cheekycheese.tech
            VITE_TELEMETRY=on
            INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}
            BING_SITE_VERIFICATION_ID=${{ secrets.BING_SITE_VERIFICATION_ID }}
            YANDEX_VERIFICATION_FILENAME=${{ secrets.YANDEX_VERIFICATION_FILENAME }}
            YANDEX_VERIFICATION_CONTENT=${{ secrets.YANDEX_VERIFICATION_CONTENT }}
            VITE_CONTACT_PUBLIC_EMAIL=hr@cheekycheese.tech
            CRM_CSP_MODE=${{ env.CRM_CSP_MODE }}
            ORIGIN_GATE_MODE=${{ env.ORIGIN_GATE_MODE }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-nginx:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.REPO_SLUG }}-nginx:main
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ── 2. Write env file on VPS ──────────────────────────────────────────────
  # Separate step: secrets are passed as SSH envs (encrypted channel), never
  # interpolated into the YAML run: script string (injection prevention).
  write-env:
    name: Write .env.production on VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # No repo/package access needed — only SSHes to the VPS.
    permissions:
      contents: read
    # UNTESTED: requires a real VPS with all secrets set.
    # See docs/runbooks/deployment.md §3 for provisioning checklist.

    steps:
      - name: Write .env.production via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # All values are passed as SSH environment variables — they travel
          # over the encrypted SSH channel, never substituted into the YAML string.
          # On the VPS they arrive as $VAR_NAME and are written by the script.
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CREDENTIALS_ENC_KEY: ${{ secrets.CREDENTIALS_ENC_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # task-vacancies-api (PR #390): apps/api/src/config/env.ts fail-fast
          # refine()s on this in production — the API crash-loops on boot if
          # it's unset/still the Cloudflare "always passes" dev default. The
          # explicit empty-check below fails the deploy fast (before wasting
          # time on the build/pull/health-check steps) instead of surfacing
          # as an opaque container crash-loop later. See
          # docs/runbooks/deployment.md "Turnstile secrets".
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          # task-infra-telemetry-digest (T3) / task-telemetry-api (T1, PR #412,
          # NOT yet merged to main at the time this infra-PR lands): same
          # fail-fast refine() pattern as TURNSTILE_SECRET_KEY above —
          # apps/api/src/config/env.ts crash-loops in production without
          # real values for these two. Both GH secrets already exist (created
          # ahead of #412 on purpose), so the fail-loud check below passes
          # today and simply keeps passing once #412 merges. See
          # scripts/devops/telemetry-digest-runbook.md.
          TELEMETRY_DIGEST_TOKEN: ${{ secrets.TELEMETRY_DIGEST_TOKEN }}
          TELEMETRY_SESSION_SALT: ${{ secrets.TELEMETRY_SESSION_SALT }}
          # task-google-indexing-api: all three OPTIONAL, unlike TURNSTILE_SECRET_KEY
          # above — apps/api reads them via the existing (optional) env schema and
          # runs the indexing service in no-op mode (one boot warning, no crash) if
          # unset. No fail-loud check here on purpose. See
          # docs/runbooks/deployment.md "Google Indexing API".
          GOOGLE_INDEXING_SA_EMAIL: ${{ secrets.GOOGLE_INDEXING_SA_EMAIL }}
          GOOGLE_INDEXING_SA_KEY_B64: ${{ secrets.GOOGLE_INDEXING_SA_KEY_B64 }}
          PUBLIC_LANDING_ORIGIN: ${{ secrets.PUBLIC_LANDING_ORIGIN }}
          # task-infra-contact-email-env (this infra-PR) / feature/landing-contact-form
          # (parallel branch, not yet merged at the time this PR lands): the
          # public contact-form endpoint (POST /api/public/contact) sends
          # email via the Resend HTTP API. OPTIONAL like GOOGLE_INDEXING_SA_*
          # above (NOT fail-loud like TURNSTILE_SECRET_KEY) — per the task
          # brief the API is expected to boot fine and answer 503 on that one
          # endpoint if this is unset, rather than crash-looping. Unlike
          # GOOGLE_INDEXING_SA_* though, the owner already created this
          # secret ahead of time (see scripts/devops/contact-email-runbook.md),
          # so an empty value here would be an unexpected drift worth a
          # visible ::warning:: in the deploy log — see the explicit check
          # below (still non-fatal).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # task-infra-wire-cloudflare-ai: both OPTIONAL, same class as
          # GOOGLE_INDEXING_SA_*/PUBLIC_LANDING_ORIGIN above — the resume-
          # generation layer that will actually call Cloudflare Workers AI
          # (POST .../ai/run/<model>) has not merged yet, so apps/api does not
          # read either var today; a future deploy simply starts picking them
          # up once that layer lands. No fail-loud check here on purpose. The
          # `deploy` job's own "Verify Cloudflare Workers AI token" step (runs
          # on the runner, before this job even starts pulling images) is the
          # only place these two are checked for validity — see that step's
          # own header comment and docs/runbooks/deployment.md "Cloudflare
          # Workers AI".
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # shared-inference-layer (@crm/inference): provider keys + optional
          # self-hosted model. Omitted from .env.production when unset.
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LOCAL_MODEL_URL: ${{ secrets.LOCAL_MODEL_URL }}
          LOCAL_MODEL_KEY: ${{ secrets.LOCAL_MODEL_KEY }}
          LOCAL_MODEL_NAME: ${{ secrets.LOCAL_MODEL_NAME }}
          INFERENCE_EXTRACTION_PROVIDER: ${{ secrets.INFERENCE_EXTRACTION_PROVIDER }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pass env vars declared above into the remote shell.
          envs: IMAGE_TAG,POSTGRES_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,JWT_SECRET,SESSION_SECRET,CREDENTIALS_ENC_KEY,S3_ENDPOINT,S3_FORCE_PATH_STYLE,S3_REGION,S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TURNSTILE_SECRET_KEY,TELEMETRY_DIGEST_TOKEN,TELEMETRY_SESSION_SALT,GOOGLE_INDEXING_SA_EMAIL,GOOGLE_INDEXING_SA_KEY_B64,PUBLIC_LANDING_ORIGIN,RESEND_API_KEY,CLOUDFLARE_AI_TOKEN,CLOUDFLARE_ACCOUNT_ID,JEV_API_KEY,OPENROUTER_API_KEY,LOCAL_MODEL_URL,LOCAL_MODEL_KEY,LOCAL_MODEL_NAME,INFERENCE_EXTRACTION_PROVIDER,GH_ACTOR
          script: |
            set -euo pipefail

            # Fail-loud: without this, the API boots into a crash-loop in
            # production (env.ts refine) with no clear signal at the deploy
            # step where the misconfiguration actually is.
            if [ -z "$TURNSTILE_SECRET_KEY" ]; then
              echo "ERROR: TURNSTILE_SECRET_KEY secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine)."
              echo "Create the secret before merging/deploying — see docs/runbooks/deployment.md 'Turnstile secrets'."
              exit 1
            fi

            # task-infra-telemetry-digest (T3) / task-telemetry-api (T1, PR #412):
            # same fail-loud pattern as TURNSTILE_SECRET_KEY above. Both secrets
            # already exist in GitHub Actions (created ahead of #412 on purpose),
            # so this check passes today and keeps passing once #412 merges.
            if [ -z "$TELEMETRY_DIGEST_TOKEN" ]; then
              echo "ERROR: TELEMETRY_DIGEST_TOKEN secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine, task-telemetry-api PR #412)."
              echo "Create the secret — see scripts/devops/telemetry-digest-runbook.md."
              exit 1
            fi
            if [ -z "$TELEMETRY_SESSION_SALT" ]; then
              echo "ERROR: TELEMETRY_SESSION_SALT secret is not set in GitHub Actions."
              echo "The production API fails fast on boot without it (apps/api/src/config/env.ts refine, task-telemetry-api PR #412)."
              echo "Create the secret — see scripts/devops/telemetry-digest-runbook.md."
              exit 1
            fi

            # task-infra-contact-email-env: NOT fail-loud (unlike the two
            # checks above) — the public contact-form endpoint is expected to
            # degrade to a 503 no-op if this is unset, not crash-loop the
            # whole API. Still worth a loud ::warning:: because (unlike
            # GOOGLE_INDEXING_SA_* which may genuinely never be configured)
            # the owner already created this secret ahead of time — an empty
            # value here means it got cleared/renamed, which is unexpected.
            if [ -z "$RESEND_API_KEY" ]; then
              echo "::warning::RESEND_API_KEY secret is empty/unset. POST /api/public/contact will boot in no-op mode and answer 503 instead of sending email — see scripts/devops/contact-email-runbook.md."
            fi

            mkdir -p /opt/crm
            # All variables below come from the envs: list above (SSH env channel).
            # No ${{ secrets.* }} interpolation happens here — safe from injection.
            cat > /opt/crm/.env.production << 'ENVEOF'
            NODE_ENV=production
            API_PORT=3001
            ENVEOF
            # task-infra-contact-email-env: plain build-time CONSTANTS, not
            # secrets (no sensitive value — same class as GOOGLE_CALLBACK_URL/
            # FRONTEND_URL/CORS_ORIGINS below, written literally rather than
            # threaded through the SSH envs: list). CONTACT_FROM_EMAIL is the
            # Resend "from" address (domain verified in Resend; no mailbox
            # needed — replies go to the submitter's reply-to address).
            # CONTACT_PUBLIC_EMAIL is the fallback contact channel shown on
            # the landing page. See scripts/devops/contact-email-runbook.md.
            printf 'CONTACT_FROM_EMAIL=noreply@cheekycheese.tech\n'   >> /opt/crm/.env.production
            printf 'CONTACT_PUBLIC_EMAIL=hr@cheekycheese.tech\n'      >> /opt/crm/.env.production
            # Append secret values safely via printf (no heredoc variable expansion issue).
            printf 'DATABASE_URL=postgresql://crm_user:%s@postgres:5432/crm_db\n' "$POSTGRES_PASSWORD" >> /opt/crm/.env.production
            printf 'POSTGRES_DB=crm_db\n'                              >> /opt/crm/.env.production
            printf 'POSTGRES_USER=crm_user\n'                          >> /opt/crm/.env.production
            printf 'POSTGRES_PASSWORD=%s\n'       "$POSTGRES_PASSWORD" >> /opt/crm/.env.production
            printf 'REDIS_URL=redis://redis:6379\n'                    >> /opt/crm/.env.production
            printf 'GOOGLE_CLIENT_ID=%s\n'        "$GOOGLE_CLIENT_ID"  >> /opt/crm/.env.production
            printf 'GOOGLE_CLIENT_SECRET=%s\n'    "$GOOGLE_CLIENT_SECRET" >> /opt/crm/.env.production
            printf 'GOOGLE_CALLBACK_URL=https://app.cheekycheese.tech/api/auth/google/callback\n' >> /opt/crm/.env.production
            printf 'JWT_SECRET=%s\n'              "$JWT_SECRET"        >> /opt/crm/.env.production
            printf 'SESSION_SECRET=%s\n'          "$SESSION_SECRET"    >> /opt/crm/.env.production
            printf 'CREDENTIALS_ENC_KEY=%s\n'     "$CREDENTIALS_ENC_KEY" >> /opt/crm/.env.production
            printf 'FRONTEND_URL=https://app.cheekycheese.tech\n'     >> /opt/crm/.env.production
            printf 'CORS_ORIGINS=https://app.cheekycheese.tech,https://cheekycheese.tech\n' >> /opt/crm/.env.production
            printf 'TRUST_PROXY=true\n'                                >> /opt/crm/.env.production
            printf 'S3_ENDPOINT=%s\n'             "$S3_ENDPOINT"       >> /opt/crm/.env.production
            printf 'S3_FORCE_PATH_STYLE=%s\n'     "$S3_FORCE_PATH_STYLE" >> /opt/crm/.env.production
            printf 'S3_REGION=%s\n'               "$S3_REGION"         >> /opt/crm/.env.production
            printf 'S3_BUCKET=%s\n'               "$S3_BUCKET"         >> /opt/crm/.env.production
            # S3_USE_SSE=false — Cloudflare R2 (our prod provider) does NOT support
            # the SSE-S3 protocol header and rejects PutObject when it is present.
            # R2 encrypts all data at rest by default, so omitting the header is
            # both required for R2 and safe. Set to true ONLY if migrating to AWS S3.
            printf 'S3_USE_SSE=false\n'                                >> /opt/crm/.env.production
            printf 'AWS_ACCESS_KEY_ID=%s\n'       "$AWS_ACCESS_KEY_ID" >> /opt/crm/.env.production
            printf 'AWS_SECRET_ACCESS_KEY=%s\n'   "$AWS_SECRET_ACCESS_KEY" >> /opt/crm/.env.production
            printf 'TURNSTILE_SECRET_KEY=%s\n'    "$TURNSTILE_SECRET_KEY" >> /opt/crm/.env.production
            printf 'TELEMETRY_DIGEST_TOKEN=%s\n'  "$TELEMETRY_DIGEST_TOKEN" >> /opt/crm/.env.production
            printf 'TELEMETRY_SESSION_SALT=%s\n'  "$TELEMETRY_SESSION_SALT" >> /opt/crm/.env.production

            # task-google-indexing-api: all three OPTIONAL — the API's env schema
            # treats them as optional and the indexing service no-ops (one boot
            # warning) if unset, so unlike TURNSTILE_SECRET_KEY above there is no
            # fail-loud check here. Deliberately do NOT write empty lines: an
            # empty `GOOGLE_INDEXING_SA_EMAIL=` (vs the key being absent) could
            # trip a stricter `.string().optional()` vs `.string().email().optional()`
            # Zod check depending on how the schema is written on the API side —
            # skipping the line entirely when the secret is unset sidesteps that
            # ambiguity and behaves identically to "not configured".
            # See docs/runbooks/deployment.md "Google Indexing API".
            if [ -n "$GOOGLE_INDEXING_SA_EMAIL" ]; then
              printf 'GOOGLE_INDEXING_SA_EMAIL=%s\n' "$GOOGLE_INDEXING_SA_EMAIL" >> /opt/crm/.env.production
            fi
            if [ -n "$GOOGLE_INDEXING_SA_KEY_B64" ]; then
              printf 'GOOGLE_INDEXING_SA_KEY_B64=%s\n' "$GOOGLE_INDEXING_SA_KEY_B64" >> /opt/crm/.env.production
            fi
            if [ -n "$PUBLIC_LANDING_ORIGIN" ]; then
              printf 'PUBLIC_LANDING_ORIGIN=%s\n' "$PUBLIC_LANDING_ORIGIN" >> /opt/crm/.env.production
            fi

            # task-infra-contact-email-env: same conditional-write pattern as
            # GOOGLE_INDEXING_SA_* above — skip the line entirely when unset
            # rather than writing an empty `RESEND_API_KEY=`, so a strict
            # Zod optional-string validator on the API side can't trip on the
            # difference between "not configured" and "configured as empty
            # string". The ::warning:: above already surfaced the unset case.
            if [ -n "$RESEND_API_KEY" ]; then
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> /opt/crm/.env.production
            fi

            # task-infra-wire-cloudflare-ai: same conditional-write pattern as
            # GOOGLE_INDEXING_SA_*/RESEND_API_KEY above — skip the line entirely
            # when unset rather than writing an empty `CLOUDFLARE_AI_TOKEN=`. The
            # resume-generation layer that reads these has not merged yet, so an
            # unset value here is today's expected steady state, not drift (no
            # ::warning:: needed, unlike RESEND_API_KEY which the owner had
            # already provisioned ahead of its consumer). The `deploy` job's
            # "Verify Cloudflare Workers AI token" step is where these two are
            # actually validated — see that step's header comment.
            if [ -n "$CLOUDFLARE_AI_TOKEN" ]; then
              printf 'CLOUDFLARE_AI_TOKEN=%s\n' "$CLOUDFLARE_AI_TOKEN" >> /opt/crm/.env.production
            fi
            if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
              printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> /opt/crm/.env.production
            fi

            # shared-inference-layer: same conditional-write pattern — a key that
            # is unset is skipped entirely, never written blank.
            if [ -n "$JEV_API_KEY" ]; then
              printf 'JEV_API_KEY=%s\n' "$JEV_API_KEY" >> /opt/crm/.env.production
            fi
            if [ -n "$OPENROUTER_API_KEY" ]; then
              printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" >> /opt/crm/.env.production
            fi
            if [ -n "$LOCAL_MODEL_URL" ]; then
              printf 'LOCAL_MODEL_URL=%s\n' "$LOCAL_MODEL_URL" >> /opt/crm/.env.production
            fi
            if [ -n "$LOCAL_MODEL_KEY" ]; then
              printf 'LOCAL_MODEL_KEY=%s\n' "$LOCAL_MODEL_KEY" >> /opt/crm/.env.production
            fi
            if [ -n "$LOCAL_MODEL_NAME" ]; then
              printf 'LOCAL_MODEL_NAME=%s\n' "$LOCAL_MODEL_NAME" >> /opt/crm/.env.production
            fi
            if [ -n "$INFERENCE_EXTRACTION_PROVIDER" ]; then
              printf 'INFERENCE_EXTRACTION_PROVIDER=%s\n' "$INFERENCE_EXTRACTION_PROVIDER" >> /opt/crm/.env.production
            fi

            printf 'IMAGE_TAG=%s\n'               "$IMAGE_TAG"         >> /opt/crm/.env.production
            chmod 600 /opt/crm/.env.production
            echo "==> .env.production written (mode 600)"

  # ── 3. Copy compose files to VPS ─────────────────────────────────────────
  copy-compose:
    name: Copy compose files to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Checks out the repo (compose files) then SCPs them — read-only on contents.
    permissions:
      contents: read

    steps:
      # ── Automatic path (image_tag empty): unchanged — shallow checkout of
      # whatever ref triggered this run, same as before this PR. ───────────
      - name: Checkout (for compose files)
        if: ${{ inputs.image_tag == '' }}
        uses: actions/checkout@v4

      # ── Rollback path: pin the checkout to the ACTUAL commit being
      # redeployed, not whatever `main` happens to be right now ───────────
      # security review (PR #615 round 2, SR-H-2): before this fix, this
      # job's ONLY checkout carried no `ref:` at all, so on a rollback
      # dispatch it silently checked out CURRENT `main` HEAD — meaning every
      # DDL file merged to `main` AFTER the commit being rolled back to
      # (including non-additive ones — a view redefinition, a column drop)
      # got copied to the VPS and applied by the `deploy` job's "Pull, up,
      # migrate, health-check" step, on top of the OLD code the rollback was
      # trying to restore. Result: old code running against a schema newer
      # than that code was ever tested against — silently, on the one path
      # that exists specifically to recover from an incident.
      #
      # `fetch-depth: 0` (full history) ONLY on this branch — the automatic
      # path above stays a shallow depth-1 checkout, same cost as before this
      # PR. Needed here because `needs.build.outputs.image_tag` is commonly a
      # SHORT sha (`git rev-parse --short HEAD`, 7-8 chars): `actions/
      # checkout`'s own `ref:` input requires a FULL 40-char sha (confirmed —
      # a short sha makes it try to resolve the value as a branch/tag pattern
      # instead and fail), so pinning via `ref:` directly would break the
      # common case. Fetching full history and letting plain `git checkout`
      # resolve the (possibly abbreviated) sha locally sidesteps that limit.
      - name: Checkout (for compose files) — rollback, full history
        if: ${{ inputs.image_tag != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every DDL-guard step further down in this job (and in the `deploy`
      # job's SSH script) already checks `[ -f <file> ]` before applying —
      # pinning the checkout here means a file that did not exist yet AT the
      # target commit simply is not present, and those guards soft-skip it
      # exactly the way they already soft-skip a DDL file whose owning PR
      # "has not merged to main yet" — same code path, no new logic needed
      # for the common case.
      #
      # ASYMMETRY, not a bug: a HANDFUL of DDL-apply steps in the `deploy`
      # job's SSH script (Step 2/2b-2e, 2ab-2af — see their own
      # "UNCONDITIONAL" / legacy comments) hard-`exit 1` if their file is
      # missing, on the stated assumption that "the migration file lands in
      # the SAME PR as this wiring, so it is unconditionally present in the
      # checkout by construction". Pinning to a commit OLDER than one of
      # those wiring commits breaks that assumption — the SCP step for that
      # specific file below has nothing to copy and this job fails LOUD,
      # before anything reaches the VPS. That is the correct outcome:
      # refusing a rollback this script cannot honestly represent is
      # strictly better than the silent old-code/new-schema state this fix
      # exists to prevent. In practice this only bites a rollback target
      # OLDER than the most recent such commit on `main` — see
      # docs/runbooks/deployment.md §9 for what to do if that happens.
      #
      # Schema itself is NOT rolled back by this step, and generally cannot
      # be: a migration that already ran against the LIVE database before
      # the rollback decision was made (e.g. a dropped column) stays
      # dropped — pinning the checkout only stops THIS run from applying
      # anything FURTHER, it does not undo what an earlier, bad deploy
      # already did to the schema. Name that state, do not hide it — see
      # docs/runbooks/deployment.md §9 "Проверка после отката".
      - name: Check out rollback target commit
        if: ${{ inputs.image_tag != '' }}
        env:
          TARGET: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          git checkout "$TARGET"
          echo "==> Compose files + DDL will be taken from commit $(git rev-parse HEAD) (rollback target '${TARGET}')"

      - name: Copy compose files and DDL via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yml,docker-compose.ghcr.yml,apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql,apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql,apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql,apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql,apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql,apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql,apps/api/drizzle/manual/2026-07-22_vacancies.sql,apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql,scripts/devops/check-security-headers.sh,scripts/devops/check-nginx-perimeter.sh,scripts/devops/pg-backup.sh,scripts/devops/check-backup-freshness.sh'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target.
          # docker-compose.prod.yml → /opt/crm/docker-compose.prod.yml
          # docker-compose.ghcr.yml → /opt/crm/docker-compose.ghcr.yml
          # apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-06-29_company_account_requisites_markdown.sql
          # apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
          # apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
          # apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
          # apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
          # apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-14_transaction_audit_log.sql
          # apps/api/drizzle/manual/2026-07-22_vacancies.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-22_vacancies.sql
          # apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql
          # scripts/devops/check-security-headers.sh → /opt/crm/scripts/devops/check-security-headers.sh
          #   (security review round 1, PR #429, MED-3: the post-deploy smoke
          #   test below runs this ON THE VPS via SSH — same 127.0.0.1-through-
          #   nginx-directly pattern as the "landing origin health check" a few
          #   steps below it, not the VPS filesystem's normal state, which is
          #   compose files + DDL only.)
          # scripts/devops/check-nginx-perimeter.sh → /opt/crm/scripts/devops/check-nginx-perimeter.sh
          #   (security audit 2026-07-27, MED-1/MED-5: same rationale/pattern as
          #   check-security-headers.sh immediately above — verifies nginx's
          #   client_max_body_size + default_server catch-all on every deploy,
          #   so a future config edit that silently reintroduces the 1 MB
          #   default (or drops the unmatched-Host catch-all) fails the deploy
          #   instead of shipping unnoticed.)
          # scripts/devops/pg-backup.sh → /opt/crm/scripts/devops/pg-backup.sh
          #   (task-infra-prod-backup-safety-net, 2026-08-03: the owner found this
          #   file had NEVER been copied to the live VPS — combined with no cron
          #   entry and no /etc/crm-backup.env, prod had zero DB backups since the
          #   first deploy. This script is NOT invoked by this workflow itself —
          #   it only needs to LAND on the VPS so the owner's manually-installed
          #   cron (docs/runbooks/deployment.md §8) has something to run. The
          #   `deploy` job re-asserts its execute bit on every run (see the
          #   "Ensuring pg-backup.sh is executable" step) as a defense-in-depth
          #   belt to scp-action's own mode-preservation.)
          # scripts/devops/check-backup-freshness.sh → /opt/crm/scripts/devops/check-backup-freshness.sh
          #   (task-infra-prod-backup-safety-net round 2, 2026-08-03: unlike
