      - name: Copy drop-obligation company-name snapshot DDL via SCP (only if present)
        if: steps.drop-obligation-company-name-snapshot-ddl-check.outputs.exists == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'apps/api/drizzle/manual/2026-08-12_drop_obligation_company_name_snapshot.sql'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target:
          # apps/api/drizzle/manual/2026-08-12_drop_obligation_company_name_snapshot.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-08-12_drop_obligation_company_name_snapshot.sql

      # ── sender/receiver invariant DDL — GUARDED, same reason as the blocks above ──
      # backlog A-2 (PR #568, fix/sender-receiver-invariant): adds
      # `ck_transactions_sender_ne_receiver CHECK (sender_id <> receiver_id)` on
      # `transactions` — no invariant anywhere previously forbade a row that pays a
      # user to themselves. Owner confirmed zero existing `sender_id = receiver_id`
      # rows on prod (checked twice, 2026-08-17) before this migration was written —
      # see the DDL file's own header for the full reasoning, including why `<>` and
      # not `IS DISTINCT FROM` (the latter would reject the common both-NULL row).
      # Fully additive (one new CHECK constraint, no existing column touched), same
      # shape as the job-sourcing/senior-resume/job-source-budgets/admin-income-
      # backfill/drop-obligation-snapshot module DDL above, not order-critical the
      # way an enum-VALUE addition to an already-live enum is (Step 2r) — the app-
      # layer guard (`selfPayError`, added in the same PR) already rejects a
      # self-pay write before it reaches the DB, so this constraint is defense-in-
      # depth regardless of whether the old or new api image is running when it
      # lands. DevOps zone-of-write excludes apps/api/**, so this wiring lands
      # separately from the Coder branch that creates the file — same guarded copy +
      # notice-skip pattern as every block above. PR #568 has not merged at the time
      # this infra-PR lands — a missing file here is the expected steady state until
      # it does, not an error (same precedent as 2026-08-01_transaction_soft_delete.sql:
      # this wiring PR merges FIRST, the DDL file merges second).
      - name: Check for sender/receiver invariant DDL file (guard until PR #568 merges)
        id: sender-receiver-invariant-ddl-check
        run: |
          if [ -f apps/api/drizzle/manual/2026-08-18_sender_receiver_invariant.sql ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/api/drizzle/manual/2026-08-18_sender_receiver_invariant.sql not found in checkout — task-sender-receiver-invariant (PR #568) has not merged to main yet. Skipping copy; deploy job's matching step also notice-skips applying it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy sender/receiver invariant DDL via SCP (only if present)
        if: steps.sender-receiver-invariant-ddl-check.outputs.exists == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'apps/api/drizzle/manual/2026-08-18_sender_receiver_invariant.sql'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target:
          # apps/api/drizzle/manual/2026-08-18_sender_receiver_invariant.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-08-18_sender_receiver_invariant.sql

      # backlog 73/A-3 (fix/senior-drop-income-idempotency): UNCONDITIONAL —
      # unlike the guarded blocks above (which wire a Coder-branch migration
      # from a SEPARATE, uncertain-merge-order PR), this migration file lands
      # in THIS SAME PR/branch, so it is unconditionally present in the
      # checkout by construction. This mirrors PR #367's own Step 2c, whose
      # squash commit (2f6c53e8) carries both the migration file AND this
      # exact deploy.yml wiring together (`--stat` shows `deploy.yml | 73 +`
      # in that one commit) — the correct precedent, not a follow-up DevOps
      # PR (security-review PR #587 round 1 corrected an earlier, wrong
      # claim in this PR's own body/migration-file header that attributed
      # #367's wiring to a separate commit).
      - name: Copy senior/drop income idempotency DDL via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'apps/api/drizzle/manual/2026-08-19_senior_drop_income_idempotency_index.sql'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target:
          # apps/api/drizzle/manual/2026-08-19_senior_drop_income_idempotency_index.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-08-19_senior_drop_income_idempotency_index.sql

      # backlog 74/B-1 (fix/settle-payout-link): UNCONDITIONAL — same shape as
      # the senior/drop income idempotency step directly above and PR #367's
      # own Step 2c (squash commit 2f6c53e8, `deploy.yml | 73 +` in that ONE
      # commit) — this migration file lands in THIS SAME PR/branch, so it is
      # unconditionally present in the checkout by construction, no cross-PR
      # merge-order race to guard against. `.github/workflows/**` is normally
      # DevOps's zone (not Coder's) — this edit is a deliberate, coordinator-
      # sanctioned exception for this one file, the same exception #587
      # round 1 granted for the step directly above, not an unreviewed
      # zone-of-write violation.
      - name: Copy pending_obligations payout-link DDL via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'apps/api/drizzle/manual/2026-08-21_pending_obligations_payout_request_id.sql'
          target: '/opt/crm'
          # scp-action preserves the source directory tree under target:
          # apps/api/drizzle/manual/2026-08-21_pending_obligations_payout_request_id.sql
          #   → /opt/crm/apps/api/drizzle/manual/2026-08-21_pending_obligations_payout_request_id.sql

  # ── 4. Pull images + up + migrate + health-check ─────────────────────────
  deploy:
    name: Deploy Stack on VPS
    runs-on: ubuntu-latest
    needs: [build, write-env, copy-compose]
    environment: production
    # Pulls images from GHCR on the VPS → needs packages:read (not write).
    # issues:write (task-infra-prod-backup-safety-net, 2026-08-03) is for the
    # backup-freshness alert steps near the end of this job — added HERE
    # rather than as a new job (golden rule: no extra jobs) because this job
    # already holds VPS SSH + prod DB access via `secrets.VPS_SSH_KEY`, a far
    # higher privilege than opening a GitHub issue; widening this job's scope
    # by issues:write costs nothing extra from a blast-radius standpoint.
    permissions:
      contents: read
      packages: read
      issues: write

    steps:
      # ── 0. Cloudflare Workers AI token check (task-infra-wire-cloudflare-ai) ──
      # The resume-generation layer of "подача на вакансии" will call the Workers
      # AI REST API directly from apps/api (POST .../ai/run/<model> — no Worker to
      # deploy, see the task file) once it merges. This step verifies the two
      # GitHub Secrets it will need (CLOUDFLARE_AI_TOKEN, CLOUDFLARE_ACCOUNT_ID)
      # are actually usable, catching a bad paste/insufficient scope at deploy
      # time instead of as a mystery 401/403 the first time that future code path
      # runs in prod.
      #
      # RUNS ON THE RUNNER, not via SSH — unlike the backup-freshness check further
      # down this job, there is no VPS-locality constraint here (nothing analogous
      # to the deliberately-VPS-only /etc/crm-backup.env split): both values are
      # plain GitHub Secrets, equally reachable from the runner as from the VPS.
      # Same shape as the "Ping IndexNow" step in this job (runner-side HTTPS call
      # gated on an optional secret), not the SSH-only backup-freshness check.
      #
      # Hits GET .../ai/models/search?per_page=1 — deliberately NOT
      # .../ai/run/<model> (which would run real inference and burn neurons off the
      # free tier's 10,000/day budget on every single deploy). models/search only
      # lists catalog metadata, so this step costs nothing per run.
      #
      # SOFT-SKIP when unset: the resume-generation layer has not merged yet, so
      # today both secrets may legitimately be absent — same ::notice:: + skip
      # convention as the guarded DDL-file checks earlier in this workflow, not a
      # fail-loud check like TURNSTILE_SECRET_KEY in the write-env job.
      #
      # NON-BLOCKING once the secrets ARE set: `continue-on-error: true` — same
      # principle as the backup-freshness check below (a bad/under-scoped token is
      # a CONFIGURATION signal, not evidence this deploy's actual application code
      # is broken, so it must never turn the whole rollout red). Both this step and
      # every step after it stay on the job's default `if:` (nothing upstream can
      # fail it — this is the very first step) so a failure here can never skip the
      # real deploy steps that follow (the exact class of incident from
      # 2026-08-05, where a `continue-on-error` present on one step but missing on
      # its neighbor cascaded into two lost deploys — checked here: this is a
      # single step, so there is no neighbor for the flag to drift out of sync
      # with).
      #
      # LOG SECRECY: the token only ever appears as a shell env var populated via
      # this step's own `env:` block (never interpolated into the `run:` script
      # string — same injection-prevention convention as every secret-handling
      # step in this file, see the write-env job's header comment) — GitHub Actions
      # only echoes the literal YAML script text for `run:` steps, which contains
      # `$CLOUDFLARE_AI_TOKEN` as a variable NAME, never its value. `curl -s`
      # (silent — no progress meter) discards the response body entirely
      # (`-o /dev/null`); only the 3-digit `%{http_code}` is captured and logged.
      # No `set -x`. Verified by inspecting this step's own log on a real run —
      # same verification discipline as check-backup-freshness.sh's log-secrecy
      # guarantee.
      - name: Verify Cloudflare Workers AI token
        id: cloudflare_ai_token_check
        continue-on-error: true
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          if [ -z "$CLOUDFLARE_AI_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_AI_TOKEN/CLOUDFLARE_ACCOUNT_ID secret(s) not set — skipping the Workers AI token check. Expected until the resume-generation layer merges; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 0
          fi

          set +e
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer ${CLOUDFLARE_AI_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=1")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
            echo "==> Cloudflare Workers AI token verified (HTTP 200)."
            exit 0
          fi

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "401" ]; then
            echo "::warning::Cloudflare Workers AI token check got HTTP 401 (unauthorized) — CLOUDFLARE_AI_TOKEN is invalid or was not copied in full. Re-generate/re-paste the secret; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 1
          fi

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "403" ]; then
            echo "::warning::Cloudflare Workers AI token check got HTTP 403 (forbidden) — the token is missing the 'Workers AI — Read'/'Workers AI — Edit' permissions. Re-create it with those scopes; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 1
          fi

          echo "::warning::Cloudflare Workers AI token check got an unexpected result (curl exit ${CURL_EXIT}, HTTP ${HTTP_CODE:-none}; expected 200) — not one of the two known auth-failure codes (401/403), most likely a transient network issue or a Cloudflare-side outage, not our configuration. See docs/runbooks/deployment.md 'Cloudflare Workers AI'."
          exit 1

      - name: Pull, up, migrate, health-check via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          # GITHUB_TOKEN for `docker login ghcr.io`. The job-level `permissions:`
          # block above scopes it to packages:read (pull only) + contents:read.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # task-csp-reports-and-flip (Part B): not a secret, but threaded
          # through the same SSH env-passthrough mechanism as everything
          # else in this script (consistent with this job's own convention —
          # values are never interpolated directly into the `script:` YAML
          # string, see the write-env job's header comment). Single source
          # of truth: this workflow's top-level `env:` block.
          CRM_CSP_MODE: ${{ env.CRM_CSP_MODE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GH_ACTOR,GHCR_TOKEN,CRM_CSP_MODE
          script: |
            set -euo pipefail
            cd /opt/crm

            # security-review PR #443 (this infra-PR's task): fresh per-run scratch file that
            # accumulates the RAISE NOTICE output of the drop-share-pending-parity marker +
            # precount DDL steps below, so the "Fetch
            # drop-share-pending-parity DDL summary" step further down in this job (a
            # SEPARATE, small ssh-action step with capture_stdout: true) can surface it in the
            # job's $GITHUB_STEP_SUMMARY instead of it being buried in this step's (very long)
            # live log — these are real money numbers, see
            # scripts/devops/drop-share-pending-parity-backfill-runbook.md. Truncated as early
            # as possible in this script (before ANY step that could fail) so a partial/failed
            # run still leaves a fresh, not-stale, file for the summary step (which runs with
            # `if: always()`) to read — never a leftover from a PREVIOUS run's numbers
            # misattributed to this one.
            : > /opt/crm/.last-ddl-summary.txt

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "==> Pulling new images (IMAGE_TAG=${IMAGE_TAG})"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              pull api nginx

            # task-infra-prod-backup-safety-net (2026-08-03): re-assert the execute bit on
            # every deploy — belt-and-braces to scp-action's own mode-preservation (git
            # already tracks this file as 100755, and scp-action's copy in the copy-compose
            # job above should carry that through, but this makes it explicit and self-
            # healing rather than relying on that assumption silently holding forever). Only
            # a ::warning (not fatal): the owner's cron install (docs/runbooks/deployment.md
            # §8) is what actually matters, and a missing file here is caught loudly anyway
            # by the "Check backup freshness" step near the end of this job.
            echo "==> Ensuring pg-backup.sh is executable"
            if [ -f /opt/crm/scripts/devops/pg-backup.sh ]; then
              chmod +x /opt/crm/scripts/devops/pg-backup.sh
            else
              echo "::warning::pg-backup.sh not found at /opt/crm/scripts/devops/pg-backup.sh — copy-compose job's scp step should have placed it there."
            fi

            # ── Step 1: ensure postgres + redis are up (persistent — usually already running) ──
            # api and nginx are started AFTER DDL is applied (see Step 3).
            #
            # Инцидент 2026-07-31: этот шаг положил прод. Когда compose решает
            # ПЕРЕСОЗДАТЬ postgres/redis (менялись compose-файлы или
            # .env.production — а они переписываются каждым деплоем), он гасит
            # их и пересоздаёт сеть `crm_backend`. Но `api` этой командой не
            # управляется (стартует позже, на Step 3) и остаётся подключённым к
            # сети → `network crm_backend has active endpoints (crm-api-1)` →
            # шаг падает, ОСТАВИВ postgres и redis лежать. `/api/health` при
            # этом отвечает 200 (в базу не ходит), а всё остальное — 500.
            # Следующий прогон падал уже иначе (`container ... is not connected
            # to the network`), потому что состояние стека рассогласовано.
            #
            # Поэтому: пробуем как раньше (инкрементально, без простоя), а при
            # неудаче — сбрасываем стек целиком и поднимаем заново.
            #
            # !!! `down` — БЕЗ `-v` / `--volumes`. Это не стилистика: том
            # `postgres_data` (и `redis_data`/`minio_data`) объявлен именованным
            # в `docker-compose.prod.yml`, поэтому `down` сносит только
            # контейнеры и сети, а данные переживают. Добавление `-v` сюда
            # УНИЧТОЖИТ БОЕВУЮ БАЗУ. Никогда не добавлять.
            echo "==> Ensuring postgres and redis are up"
            if ! docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              up -d postgres redis; then
              echo "::warning::compose up failed — вероятно рассогласованная сеть crm_backend (см. инцидент 2026-07-31). Сбрасываю стек: контейнеры и сети пересоздаются, именованные тома НЕ трогаются."
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.ghcr.yml \
                --env-file .env.production \
                down --remove-orphans
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.ghcr.yml \
                --env-file .env.production \
                up -d postgres redis
            fi

            echo "==> Waiting for postgres to be healthy"
            for i in $(seq 1 30); do
              if docker compose \
                   -f docker-compose.prod.yml \
                   -f docker-compose.ghcr.yml \
                   --env-file .env.production \
                   exec -T postgres \
                   pg_isready -U crm_user -d crm_db 2>/dev/null; then
                echo "Postgres healthy after ${i}x checks"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: postgres did not become healthy in 60s"
                docker compose \
                  -f docker-compose.prod.yml \
                  -f docker-compose.ghcr.yml \
                  --env-file .env.production \
                  logs --tail=30 postgres
                exit 1
              fi
              sleep 2
            done

            # ── Step 2: apply audit-hardening DDL (idempotent) ───────────────────────────────
            # The SQL file was copied by the copy-compose job to:
            #   /opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql
            # [prod-verify] path matches scp-action tree layout (source dir preserved under target).
            #
            # Credentials come from .env.production (POSTGRES_USER / POSTGRES_DB written by
            # write-env job). psql reads them as plain env vars via --env-file equivalent
            # (passed through `docker compose exec -T` which inherits the compose env-file).
            # We parse POSTGRES_USER and POSTGRES_DB directly from .env.production to be
            # explicit and avoid relying on exec env inheritance.
            #
            # ON_ERROR_STOP=1 — any SQL error exits psql with non-zero status, which
            # propagates through `exec -T`, causing the whole script to fail (set -e).
            # The DDL is fully idempotent (IF NOT EXISTS) — safe on repeated deploys.
            DDL_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-04_audit_hardening_constraints.sql"
            PGUSER=$(grep '^POSTGRES_USER=' /opt/crm/.env.production | cut -d= -f2)
            PGDB=$(grep '^POSTGRES_DB='   /opt/crm/.env.production | cut -d= -f2)

            # Guard: explicit error if scp-action flattened the tree instead of preserving it.
            if [ ! -f "$DDL_FILE" ]; then
              echo "ERROR: DDL file not found at $DDL_FILE — scp-action may have flattened the tree."
              echo "Check copy-compose scp layout; expected /opt/crm/apps/api/drizzle/manual/<file>."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying audit-hardening DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            # -f inside the container would require the file to be mounted there.
            # Pipe the host-side file to psql stdin via `exec -T` (no TTY → stdin passthrough).
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$DDL_FILE"
            echo "==> DDL applied successfully"

            # ── Step 2b: drop unused users.usr_record column (idempotent) ────────────────────
            # PR #345 removed the usrRecord field from all code; this drops the now-unused
            # physical column. DROP COLUMN IF EXISTS → safe no-op once the column is gone.
            # Source: apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql
            DROP_USR_RECORD_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-11_drop_usr_record.sql"
            if [ ! -f "$DROP_USR_RECORD_FILE" ]; then
              echo "ERROR: DDL file not found at $DROP_USR_RECORD_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Dropping unused users.usr_record column (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
              --env-file .env.production \
              exec -T postgres \
              psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 \
              < "$DROP_USR_RECORD_FILE"
            echo "==> usr_record column drop applied successfully"

            # ── Step 2c: payment_type enum + drop-share override + USDT-income idempotency ───
            # PR #367 (task-drop-share-override-and-receiver, ADR
            # docs/architecture/2026-07-13-payment-type-income-routing.md):
            #   1. apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql
            #      — transaction_type += DROP_PENDING_PAYOUT, projects.payment_type
            #      varchar → project_payment_type enum, drop-share override + snapshot
            #      columns. Contains a FAIL-LOUD C13 guard: it RAISEs and aborts the
            #      deploy if a non-GamingTec project carries a payment_type value that
            #      looks like USDT/GIG_CONTRACT rather than the blanket FOP default —
            #      that is expected, intentional behavior (a human must classify the
            #      value explicitly), NOT a flake to retry or suppress.
            #   2. apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql
            #      — security-review MED-1 backstop: partial unique index on
            #      transactions(idempotency_key) scoped to type = 'ADMIN_INCOME'.
            # Both scripts are idempotent (IF NOT EXISTS / guarded DO blocks) — safe to
            # re-run on repeated deploys. Source files were copied by copy-compose to
            # /opt/crm/apps/api/drizzle/manual/<file>.
            PAYMENT_TYPE_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-13_payment_type_and_drop_pending_payout.sql"
            USDT_IDEMPOTENCY_FILE="/opt/crm/apps/api/drizzle/manual/2026-07-14_usdt_income_idempotency_index.sql"

            if [ ! -f "$PAYMENT_TYPE_FILE" ]; then
              echo "ERROR: DDL file not found at $PAYMENT_TYPE_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi
            if [ ! -f "$USDT_IDEMPOTENCY_FILE" ]; then
              echo "ERROR: DDL file not found at $USDT_IDEMPOTENCY_FILE — scp-action may have flattened the tree."
              ls -la /opt/crm/ /opt/crm/apps/api/drizzle/manual/ 2>/dev/null || true
              exit 1
            fi

            echo "==> Applying payment_type enum + drop-share override DDL (idempotent) — user=${PGUSER} db=${PGDB}"
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ghcr.yml \
