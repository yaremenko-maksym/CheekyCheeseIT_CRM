  # ── 4. Pull images + up + migrate + health-check ─────────────────────────
  deploy:
    name: Deploy Stack on VPS
    runs-on: ubuntu-latest
    needs: [build, write-env, copy-compose]
    environment: production
    # Pulls images from GHCR on the VPS → needs packages:read (not write).
    # issues:write (task-infra-prod-backup-safety-net, 2026-08-03) is for the
    # backup-freshness alert steps near the end of this job — added HERE
    # rather than as a new job (golden rule: no extra jobs) because this job
    # already holds VPS SSH + prod DB access via `secrets.VPS_SSH_KEY`, a far
    # higher privilege than opening a GitHub issue; widening this job's scope
    # by issues:write costs nothing extra from a blast-radius standpoint.
    permissions:
      contents: read
      packages: read
      issues: write

    steps:
      # ── 0. Cloudflare Workers AI token check (task-infra-wire-cloudflare-ai) ──
      # The resume-generation layer of "подача на вакансии" will call the Workers
      # AI REST API directly from apps/api (POST .../ai/run/<model> — no Worker to
      # deploy, see the task file) once it merges. This step verifies the two
      # GitHub Secrets it will need (CLOUDFLARE_AI_TOKEN, CLOUDFLARE_ACCOUNT_ID)
      # are actually usable, catching a bad paste/insufficient scope at deploy
      # time instead of as a mystery 401/403 the first time that future code path
      # runs in prod.
      #
      # RUNS ON THE RUNNER, not via SSH — unlike the backup-freshness check further
      # down this job, there is no VPS-locality constraint here (nothing analogous
      # to the deliberately-VPS-only /etc/crm-backup.env split): both values are
      # plain GitHub Secrets, equally reachable from the runner as from the VPS.
      # Same shape as the "Ping IndexNow" step in this job (runner-side HTTPS call
      # gated on an optional secret), not the SSH-only backup-freshness check.
      #
      # Hits GET .../ai/models/search?per_page=1 — deliberately NOT
      # .../ai/run/<model> (which would run real inference and burn neurons off the
      # free tier's 10,000/day budget on every single deploy). models/search only
      # lists catalog metadata, so this step costs nothing per run.
      #
      # SOFT-SKIP when unset: the resume-generation layer has not merged yet, so
      # today both secrets may legitimately be absent — same ::notice:: + skip
      # convention as the guarded DDL-file checks earlier in this workflow, not a
      # fail-loud check like TURNSTILE_SECRET_KEY in the write-env job.
      #
      # NON-BLOCKING once the secrets ARE set: `continue-on-error: true` — same
      # principle as the backup-freshness check below (a bad/under-scoped token is
      # a CONFIGURATION signal, not evidence this deploy's actual application code
      # is broken, so it must never turn the whole rollout red). Both this step and
      # every step after it stay on the job's default `if:` (nothing upstream can
      # fail it — this is the very first step) so a failure here can never skip the
      # real deploy steps that follow (the exact class of incident from
      # 2026-08-05, where a `continue-on-error` present on one step but missing on
      # its neighbor cascaded into two lost deploys — checked here: this is a
      # single step, so there is no neighbor for the flag to drift out of sync
      # with).
      #
      # LOG SECRECY: the token only ever appears as a shell env var populated via
      # this step's own `env:` block (never interpolated into the `run:` script
      # string — same injection-prevention convention as every secret-handling
      # step in this file, see the write-env job's header comment) — GitHub Actions
      # only echoes the literal YAML script text for `run:` steps, which contains
      # `$CLOUDFLARE_AI_TOKEN` as a variable NAME, never its value. `curl -s`
      # (silent — no progress meter) discards the response body entirely
      # (`-o /dev/null`); only the 3-digit `%{http_code}` is captured and logged.
      # No `set -x`. Verified by inspecting this step's own log on a real run —
      # same verification discipline as check-backup-freshness.sh's log-secrecy
      # guarantee.
      - name: Verify Cloudflare Workers AI token
        id: cloudflare_ai_token_check
        continue-on-error: true
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          if [ -z "$CLOUDFLARE_AI_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_AI_TOKEN/CLOUDFLARE_ACCOUNT_ID secret(s) not set — skipping the Workers AI token check. Expected until the resume-generation layer merges; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 0
          fi

          set +e
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer ${CLOUDFLARE_AI_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?per_page=1")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then
            echo "==> Cloudflare Workers AI token verified (HTTP 200)."
            exit 0
          fi

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "401" ]; then
            echo "::warning::Cloudflare Workers AI token check got HTTP 401 (unauthorized) — CLOUDFLARE_AI_TOKEN is invalid or was not copied in full. Re-generate/re-paste the secret; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 1
          fi

          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "403" ]; then
            echo "::warning::Cloudflare Workers AI token check got HTTP 403 (forbidden) — the token is missing the 'Workers AI — Read'/'Workers AI — Edit' permissions. Re-create it with those scopes; see docs/runbooks/deployment.md 'Cloudflare Workers AI'."
            exit 1
          fi

          echo "::warning::Cloudflare Workers AI token check got an unexpected result (curl exit ${CURL_EXIT}, HTTP ${HTTP_CODE:-none}; expected 200) — not one of the two known auth-failure codes (401/403), most likely a transient network issue or a Cloudflare-side outage, not our configuration. See docs/runbooks/deployment.md 'Cloudflare Workers AI'."
          exit 1

      # Needed because the deploy script is a FILE now, scp'd to the VPS by the
      # step below and then run there (see that step's comment for the two
      # argument-limit incidents that led here). Default ref on purpose — that
      # resolves to the very commit this workflow file came from, which is
      # exactly the deploy.yml-and-its-script-move-together coupling the inline
      # block used to get for free, and the reason this scp lives HERE rather
      # than in the copy-compose job: that job deliberately pins its checkout to
      # the ROLLBACK TARGET (see its SR-H-2 comment), so copying the script
      # there would silently take it from the rolled-back-to commit. The script
      # must track deploy.yml, which is this job's unpinned checkout. No `if:`
      # and no `fetch-depth:`: this is a hard prerequisite of the deploy itself,
      # unlike the two deliberately `if: always()` checkouts later in this job
      # that exist so their post-mortem steps survive a failed deploy.
      - name: Checkout (for the deploy script)
        uses: actions/checkout@v4

      # Same scp-action pattern as scripts/devops/check-backup-freshness.sh and
      # check-security-headers.sh in the copy-compose job: the file lands under
      # /opt/crm preserving its source tree, so
      # scripts/devops/deploy-stack-on-vps.sh →
      # /opt/crm/scripts/devops/deploy-stack-on-vps.sh, which is what the SSH
      # step below executes. Copying it is the whole fix — as a FILE it is not
      # subject to any argument limit, whereas every route that ships the body
      # as a command string is (twice proven, see below).
      - name: Copy the deploy script to the VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'scripts/devops/deploy-stack-on-vps.sh'
          target: '/opt/crm'

      - name: Pull, up, migrate, health-check via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          # GITHUB_TOKEN for `docker login ghcr.io`. The job-level `permissions:`
          # block above scopes it to packages:read (pull only) + contents:read.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # task-csp-reports-and-flip (Part B): not a secret, but threaded
          # through the same SSH env-passthrough mechanism as everything
          # else in this script (consistent with this job's own convention —
          # values are never interpolated directly into the `script:` YAML
          # string, see the write-env job's header comment). Single source
          # of truth: this workflow's top-level `env:` block.
          CRM_CSP_MODE: ${{ env.CRM_CSP_MODE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GH_ACTOR,GHCR_TOKEN,CRM_CSP_MODE
          # A DISPATCH, deliberately tens of bytes long. The 137 KB it runs
          # travelled as a file via the scp step above. Full story in the header
          # of scripts/devops/deploy-stack-on-vps.sh; the part that matters here
          # is that this file hit the SAME limit TWICE, in two different places,
          # and only the second fix was real:
          #
          #   1. Inline `script:` (until 2026-10-19). ssh-action hands `script:`
          #      to its own composite entrypoint step as the single env string
          #      `INPUT_SCRIPT=<whole script>`, and Linux execve refuses with
          #      E2BIG when any single argv/envp string exceeds MAX_ARG_STRLEN
          #      (32 * 4096 = 131072). At 133905 bytes the RUNNER could not spawn
          #      bash: "Argument list too long" before the step started.
          #   2. `script_path:` (PR #1035, lasted one deploy). It is wired fine —
          #      the run log shows `INPUT_SCRIPT:` empty and `INPUT_SCRIPT_FILE:`
          #      set. But drone-ssh `os.ReadFile`s that file into the SAME
          #      `scripts` slice `INPUT_SCRIPT` feeds and then sends
          #      `strings.Join(script, "\n")` as ONE command string to
          #      `ssh.Stream` (plugin.go). So the body still arrived as a single
          #      argument and `/bin/bash` ON THE VPS refused it instead:
          #      "/bin/bash: Argument list too long". The research was right that
          #      execution was "unchanged" — being unchanged is precisely why it
          #      still failed. Reading the mechanism is not the same as testing
          #      the outcome, and nothing in CI exercises a real deploy.
          #
          # Hence the only shape that actually removes the ceiling: the content
          # moves as a FILE (scp), and what crosses as a command is a path. Same
          # pattern the backup-freshness step at the end of this job already
          # used. `bash <file>` and not `./<file>`: no dependence on scp-action
          # preserving the execute bit.
          #
          # The four `envs:` above still reach the script: drone-ssh prepends
          # real `export NAME=value` lines (its default envs_format), and an
          # exported variable is inherited by this `bash` child. Verified in
          # drone-ssh v1.8.0's plugin.go, not assumed — a plain assignment
          # instead of `export` would have broken every variable here the moment
          # the body stopped running in the login shell itself.
          script: bash /opt/crm/scripts/devops/deploy-stack-on-vps.sh

      # ── Rollback reminder → job summary (this state is TEMPORARY) ───────
      # security review (PR #615 round 2, SR-H-1): a rollback dispatch does
      # not touch `main` — it only redeploys an already-built image (see the
      # "Resolve image tag" step's notice, emitted earlier in the `build`
      # job's log). That makes the result TEMPORARY by construction: the
      # next merge to `main` (auto-deploy) or the next scheduled Sunday
      # 03:00 UTC rebuild redeploys `main` HEAD regardless, silently undoing
      # this run — possibly with nobody watching, hours or days later. This
      # step says so a SECOND time, here, in the run's $GITHUB_STEP_SUMMARY
      # — the one place on the run's GitHub page an operator sees without
      # scrolling a several-hundred-line SSH log, and the one that is still
      # visible after the run itself has scrolled out of view. Runs only
      # after the deploy step above SUCCEEDED (no `if: always()` here,
      # unlike the DDL-summary steps below — a failed rollback deployed
      # nothing, so there is nothing temporary to warn about).
      - name: Rollback reminder (job summary) — this state is temporary
        if: ${{ inputs.image_tag != '' }}
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          {
            echo "## ⚠️ Rollback deployed — this state is TEMPORARY"
            echo ""
            echo "Prod is now running the image published under tag \`${TAG}\`."
            echo "\`main\` was **not** changed by this run."
            echo ""
            echo "Without further action, prod reverts to \`main\` HEAD:"
            echo "- at the **next merge** to \`main\` (auto-deploy), or"
            echo "- at the **next scheduled Sunday 03:00 UTC** rebuild —"
            echo "  possibly with nobody watching."
            echo ""
            echo "**To make this rollback permanent:** revert the offending"
            echo "commit(s) in \`main\` (e.g. \`git revert <bad-sha>\`, open a"
            echo "PR, merge it) so the next automatic deploy IS the state you"
            echo "want running. See docs/runbooks/deployment.md §9."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Drop-share pending-parity DDL summary → job summary (money numbers, not buried) ──
      # security-review PR #443 (this infra-PR's task): the marker/precount RAISE NOTICE
      # output above was captured into /opt/crm/.last-ddl-summary.txt (reset near the top of
      # the previous step's script, appended to by each DDL block) — these are real numbers
      # about the owner's money and must not be left to scroll off in a several-hundred-line
      # deploy log. Two small steps, not folded into the giant SSH step above: `capture_stdout`
      # only exists as a per-step ssh-action option, and enabling it on the whole "Pull, up,
      # migrate, health-check" step would buffer (rather than live-stream) its entire
      # multi-minute output, hiding progress during the health-check retry loops — an
      # unrelated regression for a summary-only feature. `if: always()` on both — even a
      # failed main deploy step should still surface whatever was captured before the failure.
      #
      # VERSION PIN: v1.2.3, NOT v1.2.0 — found via fix/backup-freshness-wiring's
      # check-ssh-action-capture-stdout-version.py guard (see the "Backup freshness signal"
      # block's own version-pin comment for the full v1.2.0-lacks-capture_stdout story). This
      # step ALSO sets `capture_stdout: true` and reads `outputs.stdout` below, so it had the
      # EXACT SAME latent bug — `DDL_SUMMARY` in the job summary has been silently empty
      # since PR #443, just with no alert wired to it to notice (the money-numbers header
      # prints, the code block is blank). Bumping this one step's pin is low-risk: its script
      # only `cat`s an already-written file and always exits 0, unlike the actual rollout
      # steps this file deliberately leaves on v1.2.0 (see that same comment for why those
      # stay put).
      - name: Fetch drop-share-pending-parity DDL summary via SSH
        id: dspp_ddl_summary
        if: always()
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          capture_stdout: true
          script: |
            if [ -f /opt/crm/.last-ddl-summary.txt ]; then
              cat /opt/crm/.last-ddl-summary.txt
            else
              echo "(no output captured — the main deploy step likely failed before reaching its scratch-file reset; see the 'Pull, up, migrate, health-check via SSH' step's own log for the actual failure)"
            fi

      - name: Publish drop-share-pending-parity DDL summary to job summary
        if: always()
        env:
          # Passed via `env:` (never interpolated directly into the `run:` script string) —
          # same injection-prevention convention as every secret-handling step in this
          # workflow (see the write-env job's header comment) — even though this content is
          # our own DB engine's NOTICE output, not attacker-controlled.
          DDL_SUMMARY: ${{ steps.dspp_ddl_summary.outputs.stdout }}
        run: |
          {
            echo "## Drop-share pending-parity — DDL output (money-affecting, PR #443)"
            echo ""
            echo "Marker (both passes, permanent) + pre-count run on every deploy once PR #443"
            echo "is merged (unconditional). The pre-count doubles as a standing tripwire — see"
            echo "\`scripts/devops/drop-share-pending-parity-backfill-runbook.md\` for why the"
            echo "one-time historical backfill step was de-wired 2026-08-01."
            echo ""
            echo '```'
            printf '%s\n' "$DDL_SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 5. IndexNow ping (AC B6) ─────────────────────────────────────────
      # task-infra-locale-edge: runs on the RUNNER, not via SSH — it only
      # needs outbound HTTPS to api.indexnow.org, no VPS access. Added as a
      # step in this EXISTING job rather than a new job (extra jobs cost more
      # CI minutes for no benefit here — this step is a ~1s HTTP call).
      # Non-blocking by design: a missing secret or a non-2xx IndexNow
      # response never fails the deploy (see
      # scripts/devops/indexnow-ping.sh and locale-routing-runbook.md
      # "IndexNow" for the fail-soft rationale, matching the Google Indexing
      # API convention already established in docs/runbooks/deployment.md).
      # Pings a fixed set of known static URLs (all 5 locale home pages +
      # careers indexes) — safe regardless of merge order with
      # feature/landing-i18n: a locale URL that doesn't have its own
      # prerendered content yet simply serves the EN fallback (still a valid
      # 200), so notifying it early is harmless, not incorrect.
      - name: Checkout (for IndexNow ping script)
        uses: actions/checkout@v4

      - name: Ping IndexNow (Bing + Yandex)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY secret not set — skipping IndexNow ping. This is optional and expected until the owner generates a key (see scripts/devops/locale-routing-runbook.md 'IndexNow')."
            exit 0
          fi
          scripts/devops/indexnow-ping.sh "$INDEXNOW_KEY" cheekycheese.tech \
            https://cheekycheese.tech/ \
            https://cheekycheese.tech/careers/ \
            https://cheekycheese.tech/uk/ \
            https://cheekycheese.tech/uk/careers/ \
            https://cheekycheese.tech/ru/ \
            https://cheekycheese.tech/ru/careers/ \
            https://cheekycheese.tech/es/ \
            https://cheekycheese.tech/es/careers/ \
            https://cheekycheese.tech/pt/ \
            https://cheekycheese.tech/pt/careers/

      # ── 6. Backup freshness signal (task-infra-prod-backup-safety-net, 2026-08-03) ──
      # The owner found on the LIVE VPS that none of the three prerequisites for
      # automated backups existed — no /etc/crm-backup.env, no crontab entry, and (before
      # this same PR's copy-compose change, Step 2 above the "pg-backup.sh" comment) not
      # even the script file itself had ever reached the server. Prod had been running with
      # ZERO backups since the very first deploy, and nothing in the pipeline ever noticed.
      # These steps close the "nobody would know" half of that gap.
      #
      # ROUND 2 (2026-08-03): round 1 ran the freshness check on THIS runner using the
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY GitHub Secrets already granted to the
      # documents bucket. That design is now WRONG on purpose: the owner is splitting the
      # previously-shared R2 API token specifically so a compromised API container (whose
      # only R2 credentials, via those same GitHub Secrets, are scoped to `crm-documents`)
      # cannot read or delete 30 days of DB dumps. After the split, `crm-backups`-scoped
      # credentials live ONLY in /etc/crm-backup.env on the VPS and are deliberately NEVER a
      # GitHub secret — a runner-side check would Access-Denied on every run, and the only
      # ways to make it green again would be to disable the check or hand the app's token
      # access back, i.e. undo the split. So this now runs OVER SSH, on the VPS itself,
      # where the backups-scoped credentials legitimately already live — same
      # `secrets.VPS_HOST`/`VPS_SSH_KEY` pattern (and `appleboy/ssh-action`) as every other
      # SSH step in this job, not a second connection method.
      #
      # VERSION PIN — DELIBERATELY DIFFERENT from the other appleboy/ssh-action steps in
      # this file (v1.2.0): this incident's root cause. This step relies on
      # `capture_stdout`/`outputs.stdout`, which DO NOT EXIST in v1.2.0 — its `action.yml`
      # has no `capture_stdout` input and no `outputs:` section at all (verified against the
      # tag directly). That means SSH_OUTCOME=success + SSH_STDOUT="" on EVERY run, always —
      # not a flake, a permanent no-op. `capture_stdout`/`outputs.stdout` were added in
      # v1.2.1 (verified against v1.2.1/v1.2.2/v1.2.3's `action.yml`); this step is pinned to
      # v1.2.3, the newest tag verified to still carry them, one patch ahead of the minimum.
      # scripts/devops/check-ssh-action-capture-stdout-version.py (wired into ci.yml) now
      # fails CI if any appleboy/ssh-action step sets `capture_stdout: true` while pinned
      # below v1.2.1, so this class of drift can't recur silently — see that script's header.
      # The OTHER appleboy/ssh-action steps in this file (".env" write, main deploy, IndexNow
      # is a plain runner step not SSH) stay on v1.2.0 on purpose: they don't use
      # `capture_stdout`, and bumping them is pure unforced regression risk on the actual
      # rollout path for zero benefit — see the guard script's header for why it only
      # requires the newer version where the feature is actually used, not repo-wide.
      #
      # LOG SECRECY: `capture_stdout: true` captures scripts/devops/check-backup-
      # freshness.sh's stdout instead of streaming it live, but that script's OWN secrecy
      # guarantee (see its header) does not depend on that buffering — it never emits
      # secrets/endpoint/bucket/object-names on ANY stream, stdout or stderr, so nothing
      # leaks into this job's log even if ssh-action's behavior around stderr differs.
      #
      # THREE OUTCOMES, not one bit: scripts/devops/interpret-backup-freshness.sh turns the
      # SSH step's raw success/failure + captured stdout into exactly one of `ok` (fresh —
      # close any open alert) / `alert` (a DETERMINATE problem: not configured, or
      # stale/missing objects — open one) / `inconclusive` (SSH failed or the remote script
      # hit an unexpected error — touch NOTHING; this project does not assert "backups are
      # missing" when it genuinely could not check, see that script's own header).
      #
      # Deliberately NOT a deploy-failing check either way: whether the nightly cron on the
      # VPS produced a fresh backup is completely independent of whether THIS deploy run
      # succeeded — `continue-on-error: true` on the SSH step keeps this job green
      # regardless of STATUS. Failing the job here would misreport "Deploy is broken" to
      # deploy-alert.yml's separate red-Deploy alert and blur two signals the owner
      # explicitly wants to stay distinct. The GitHub issue opened/updated/closed below
      # (reusing the EXACT SAME post-merge-alert.sh / resolve-alert-channel.sh mechanic
      # already built for a red `Deploy` — KIND switch extended with `backup`, see that
      # script's header — not a second alert path) is the actual, separate signal.
      #
      # `if: always()` on this checkout (and on every step below it) — same independence
      # argument: the earlier "Checkout (for IndexNow ping script)" step above has NO
      # `if:`, so it (and everything after it, including backup-freshness) would be SKIPPED
      # if the main "Pull, up, migrate, health-check via SSH" step failed. A failed deploy
      # is exactly a moment the owner would still want to know whether backups are healthy,
      # so this block gets its own always-run checkout rather than depending on that one.
      - name: Checkout (for backup-freshness + alert scripts)
        if: always()
        uses: actions/checkout@v4

      - name: Check backup freshness on VPS (SSH)
        id: backup_freshness_ssh
        if: always()
        continue-on-error: true
        # v1.2.3, NOT v1.2.0 like the other ssh-action steps in this file — see the
        # "VERSION PIN" comment in the block above for why this one step must differ.
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          capture_stdout: true
          script: bash /opt/crm/scripts/devops/check-backup-freshness.sh

      - name: Interpret backup freshness result
        id: backup_status
        if: always()
        # Non-fatal, same as the SSH probe above. This script exits non-zero BY
        # DESIGN when backups are missing or stale — that is the signal, not a
        # deploy failure. Without this line the signal turns the whole deploy
        # job red (it did, on 7ba3f386 and dd1b0026, while every actual deploy
        # step was green), which is precisely the failure-signal pollution that
        # let a broken deploy sit unnoticed for four days on 2026-07-27. The
        # alert issue below is where "no backups" is supposed to show up.
        continue-on-error: true
        env:
          SSH_OUTCOME: ${{ steps.backup_freshness_ssh.outcome }}
          SSH_STDOUT: ${{ steps.backup_freshness_ssh.outputs.stdout }}
        run: scripts/devops/interpret-backup-freshness.sh

      # Only touches the alert issue when the check actually reached a DETERMINATE
      # verdict — an explicit allow-list (`== 'ok' || == 'alert'`), not a deny-list of
      # `!= 'inconclusive'`. That distinction is itself the fix for a real incident: when
      # the "Interpret backup freshness result" step above dies before `write_output
      # verdict` ever runs (e.g. plumbing bug — see that script's own header), its
      # `outputs.verdict` is the EMPTY STRING, not the literal text `inconclusive`. A
      # deny-list condition treats "" as "not inconclusive" and proceeds to open a false
      # alert on every single run regardless of actual backup health (exactly what
      # happened — see interpret-backup-freshness.sh's `|| true` fix and its comment). An
      # allow-list treats anything other than the two verdicts this block knows how to
      # act on — including "", including `inconclusive`, including any future third value
      # — as "don't touch the alert issue".
      - name: Resolve alert channel (backup)
        id: backup_channel
        if: always() && (steps.backup_status.outputs.verdict == 'ok' || steps.backup_status.outputs.verdict == 'alert')
        env:
          PAT: ${{ secrets.TELEMETRY_ISSUES_PAT }}
          PUBLIC_REPO: ${{ github.repository }}
          PRIVATE_REPO: yaremenko-maksym/cheekycheese-telemetry
        run: scripts/devops/resolve-alert-channel.sh

      - name: Open / update / close the backup-staleness alert issue
        if: always() && (steps.backup_status.outputs.verdict == 'ok' || steps.backup_status.outputs.verdict == 'alert')
        env:
          GH_TOKEN: ${{ steps.backup_channel.outputs.use_pat == 'true' && secrets.TELEMETRY_ISSUES_PAT || github.token }}
          ALERT_REPO: ${{ steps.backup_channel.outputs.repo }}
          RESULT: ${{ steps.backup_status.outputs.verdict == 'ok' && 'success' || 'failure' }}
          FAILED_LEGS: ${{ steps.backup_status.outputs.detail }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: backup
        run: scripts/devops/post-merge-alert.sh
