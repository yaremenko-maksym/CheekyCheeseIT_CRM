name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint-test:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @crm/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck-lint-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      # Google OAuth — not real credentials, E2E uses mock auth
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Apply migrations
        run: pnpm --filter @crm/api db:migrate

      - name: Seed database
        run: pnpm --filter @crm/api db:seed

      - name: Start API
        run: pnpm --filter @crm/api start &
        env:
          PORT: 3001

      - name: Start Web (preview)
        run: pnpm --filter @crm/web preview --port 3000 &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/api/health http://localhost:3000 --timeout 60000

      - name: Install Playwright browsers
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @crm/e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 7
