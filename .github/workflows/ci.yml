name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/CODEOWNERS'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/CODEOWNERS'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Full build needed so vite generates routeTree.gen.ts before tsc runs.
      # Turbo cache makes this a no-op on subsequent runs for unchanged packages.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm --filter @crm/shared --filter @crm/api --filter @crm/web test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    # Skip E2E on main push (already tested in PR); only run on PRs
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Turbo cache: hits on unchanged source, skips rebuild
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Cache Playwright binaries — saves ~60s on warm runs
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - run: pnpm install --frozen-lockfile

      # turbo build: shared→api→web; cached layers skip rebuild
      - run: pnpm build

      - run: pnpm --filter @crm/api db:push

      - run: pnpm --filter @crm/api db:seed

      - name: Start API
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        run: nohup pnpm --filter @crm/web start -- --port 3000 > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - run: pnpm --filter @crm/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/e2e/playwright-report/
          retention-days: 5
