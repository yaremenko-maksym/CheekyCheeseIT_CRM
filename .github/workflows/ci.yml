name: CI
# re-index: force GitHub to register workflow_dispatch trigger

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to run CI on'
        required: false
        default: 'main'
  pull_request:
    # Default types [opened, synchronize, reopened] — no `labeled` here.
    # Label-triggered fast merge lives in .github/workflows/auto-merge-on-label.yml
    # which does NOT re-run CI (just waits for green checks, then squash-merges).
    #
    # NOTE: paths-ignore intentionally NOT used here. Branch protection requires
    # `Typecheck · Lint · Unit Tests` and `E2E Tests` contexts; if the workflow
    # is skipped entirely (via paths-ignore), required checks never appear and
    # docs-only PRs are permanently BLOCKED. Instead we always-run skeleton jobs
    # and gate work via `dorny/paths-filter` early-exit (see jobs below).
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest
    # DB-free: unit tests use dbAvailable-guard and skip integration specs when
    # DATABASE_URL is absent. Integration specs run in the dedicated `integration`
    # job below, which has a Postgres service and full seed+fixture setup.
    # S3 dummy creds are still needed so env-schema validation passes at import time.
    env:
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # Always-run skeleton: detect whether any non-docs file changed. If only
      # docs/markdown/CODEOWNERS were touched, every work-step below is skipped
      # and the job short-circuits to success — satisfying the required status
      # check without doing wasted work.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.filter.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Full build needed so vite generates routeTree.gen.ts before tsc runs.
      # Turbo cache makes this a no-op on subsequent runs for unchanged packages.
      - if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - if: steps.filter.outputs.code == 'true'
        run: pnpm typecheck

      - if: steps.filter.outputs.code == 'true'
        run: pnpm lint

      # Run unit tests only — no DATABASE_URL means dbAvailable=false and
      # integration specs skip themselves via their guard. No DB service needed.
      - name: Run unit tests (no DB)
        if: steps.filter.outputs.code == 'true'
        run: pnpm --filter @crm/shared --filter @crm/api --filter @crm/web test

      - name: Docs-only short-circuit
        if: steps.filter.outputs.code != 'true'
        run: echo "Docs-only PR — skipping quality work, satisfying required status."

      - name: Remove ci-failed label on success
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "ci-failed" 2>/dev/null || true

      - name: Label PR on CI failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "ci-failed" --repo "$REPO" \
            --color "d73a4a" --description "CI checks failed" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "ci-failed"

  integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    # Runs DB-backed *.integration.spec.ts against a real Postgres instance.
    # Separated from the unit-test `quality` job so unit tests stay fast and
    # DB-free, while integration specs get migrate + seed + fixture data.
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.filter.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.filter.outputs.code == 'true'
        run: pnpm build

      # Apply all Drizzle migrations (0000→latest) against the fresh CI Postgres.
      # Migration 0002 was fixed (commit a195fbf) — no duplicate DDL, runs clean.
      - name: Run DB migrations
        if: steps.filter.outputs.code == 'true'
        run: pnpm --filter @crm/api db:migrate

      # Seed canonical users (stable UUIDs) so integration specs can satisfy FK
      # constraints without per-test inserts of baseline data.
      - name: Seed DB
        if: steps.filter.outputs.code == 'true'
        run: pnpm --filter @crm/api db:seed

      # Insert QA fixtures required by two integration specs:
      #
      # 1) documents-unified.integration.spec.ts test #11:
      #      ADMIN must see DRAFT contracts. Seed creates SIGNED + READY_TO_SIGN only.
      #      Adds QA SENIOR (27b9524e-...) + DRAFT employee_contract.
      #
      # 2) onboarding-contract.integration.spec.ts tests 1b + 3:
      #      DRAFT-only user (QA_FIX3, 354d26e9-...) must exist with DRAFT contract.
      #
      # source_template_id is resolved at runtime (seed assigns random UUIDs via
      # .returning()), so we SELECT the active SENIOR template inserted by db:seed.
      #
      # employee_contracts has partial unique index WHERE status != 'CANCELLED' —
      # ON CONFLICT DO NOTHING is safe on a fresh CI DB.
      - name: Insert integration test fixtures (QA SENIORs + DRAFT contracts)
        if: steps.filter.outputs.code == 'true'
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U crm_user -d crm_db <<'SQL'
            -- ── Fixture 1: qa-ac6-7x9k2m (documents-unified test #11) ──────────
            INSERT INTO users (
              id, email, display_name, legal_full_name,
              role, senior_share_percent, created_at, updated_at
            ) VALUES (
              '27b9524e-0b48-4226-8f90-65b4662c1250',
              'qa-ac6-7x9k2m@cheekycheese.dev',
              'QA Senior Draft',
              'QA Тестовий Сеньйор',
              'SENIOR', 26, NOW(), NOW()
            ) ON CONFLICT (id) DO NOTHING;

            INSERT INTO employee_contracts (
              user_id, source_template_id, body_markdown,
              status, signed_contract_id, created_by_user_id, created_at, updated_at
            )
            SELECT
              '27b9524e-0b48-4226-8f90-65b4662c1250',
              id,
              'QA DRAFT contract fixture — documents-unified integration test',
              'DRAFT', NULL,
              'a8f4d3b1-c2e5-4a1f-9b3d-8c7e6f5a4b21',
              NOW(), NOW()
            FROM contract_templates
            WHERE target_role = 'SENIOR' AND is_active = true
            LIMIT 1
            ON CONFLICT DO NOTHING;

            -- ── Fixture 2: qa-fix3-uuid (onboarding-contract tests 1b + 3) ─────
            INSERT INTO users (
              id, email, display_name, legal_full_name,
              role, senior_share_percent, created_at, updated_at
            ) VALUES (
              '354d26e9-0234-4e09-bcc9-dea5770cbdf4',
              'qa-fix3-uuid@cheekycheese.dev',
              'QA Fix3',
              'QA Fix3 Seed UUID Testovyi',
              'SENIOR', 26, NOW(), NOW()
            ) ON CONFLICT (id) DO NOTHING;

            INSERT INTO employee_contracts (
              user_id, source_template_id, body_markdown,
              status, signed_contract_id, created_by_user_id, created_at, updated_at
            )
            SELECT
              '354d26e9-0234-4e09-bcc9-dea5770cbdf4',
              id,
              'QA DRAFT contract fixture — onboarding-contract integration test',
              'DRAFT', NULL,
              'a8f4d3b1-c2e5-4a1f-9b3d-8c7e6f5a4b21',
              NOW(), NOW()
            FROM contract_templates
            WHERE target_role = 'SENIOR' AND is_active = true
            LIMIT 1
            ON CONFLICT DO NOTHING;
          SQL

      # Run only *.integration.spec.ts — unit specs are covered by the `quality` job.
      # Vitest 3.x positional arg is a PATH SUBSTRING filter, not a shell glob.
      # "**/*.integration.spec.ts" contains no real path chars → 0 matches.
      # "integration.spec" is a substring present in every integration spec path
      # and absent from all unit specs (verified against 7 files in apps/api/src/).
      # --reporter=verbose shows each test name so CI logs confirm real execution
      # (not silent skip via dbAvailable guard).
      - name: Run integration tests
        if: steps.filter.outputs.code == 'true'
        run: |
          pnpm --filter @crm/api exec vitest run \
            --reporter=verbose \
            integration.spec

      - name: Docs-only short-circuit
        if: steps.filter.outputs.code != 'true'
        run: echo "Docs-only PR — skipping integration tests, satisfying required status."

      - name: Label PR on integration failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "ci-failed" --repo "$REPO" \
            --color "d73a4a" --description "CI checks failed" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "ci-failed"

  auto_merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e_summary]
    # PM must explicitly add `merge-approved` label after user-testing approval.
    # `awaiting-pm-review` blocks merge until PM reviews. All three jobs must be
    # `success` (not just non-failure — `skipped` no longer counts as pass).
    if: |
      github.event_name == 'pull_request' &&
      needs.quality.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e_summary.result == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'merge-approved') &&
      !contains(github.event.pull_request.labels.*.name, 'awaiting-pm-review') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch

  e2e:
    name: E2E (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: auth-nav
            files: tests/auth.spec.ts tests/navigation.spec.ts tests/debug.spec.ts tests/mock_test.spec.ts
          - name: team-users
            files: tests/team.spec.ts tests/users.spec.ts tests/rbac-hr-on-senior.spec.ts tests/rbac-junior-on-other.spec.ts
          - name: projects
            files: tests/projects.spec.ts tests/projects-senior-share-override.spec.ts
          - name: finance
            files: tests/finance.spec.ts tests/finance-senior-flow.spec.ts
          - name: misc
            files: tests/interviews.spec.ts tests/profile-self-edit.spec.ts tests/requisites-warning.spec.ts tests/admin-actions.spec.ts tests/crm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # MinIO нельзя запустить через `services:` — GHA service container schema
      # не поддерживает `command:`/`args:`, а MinIO image без команды exit'ит.
      # Поднимаем через `docker run` ниже (см. step "Start MinIO + bucket").

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api
      # S3 / MinIO (PHASE 6) — dev dummy creds, MinIO service started above.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Always-run skeleton: detect whether any non-docs file changed. If only
      # docs were touched, all work-steps skip and the shard short-circuits to
      # success — `e2e_summary` aggregator sees success and propagates to the
      # required `E2E Tests` status check.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.filter.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - uses: actions/cache@v4
        id: pw-cache
        if: steps.filter.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - if: steps.filter.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start MinIO + bucket
        if: steps.filter.outputs.code == 'true'
        run: |
          docker run -d --name minio \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          # Wait for healthy
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then echo "MinIO ready"; break; fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          # Bootstrap bucket (mc image entrypoint is `mc`, override with /bin/sh).
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/crm-documents &&
            echo 'MinIO bucket crm-documents ready (CI)'
          "

      - if: steps.filter.outputs.code == 'true'
        run: pnpm build

      - if: steps.filter.outputs.code == 'true'
        run: pnpm --filter @crm/api db:push

      - if: steps.filter.outputs.code == 'true'
        run: pnpm --filter @crm/api db:seed

      - name: Start API
        if: steps.filter.outputs.code == 'true'
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        if: steps.filter.outputs.code == 'true'
        run: nohup pnpm --filter @crm/web start > /tmp/web.log 2>&1 &

      - name: Wait for services
        if: steps.filter.outputs.code == 'true'
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        if: steps.filter.outputs.code == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.filter.outputs.code == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard.name }})
        if: steps.filter.outputs.code == 'true'
        env:
          SHARD_FILES: ${{ matrix.shard.files }}
        run: pnpm --filter @crm/e2e exec playwright test $SHARD_FILES

      - name: Docs-only short-circuit
        if: steps.filter.outputs.code != 'true'
        run: echo "Docs-only PR — skipping E2E shard ${{ matrix.shard.name }}, satisfying required status."

      - name: Upload Playwright report
        if: failure() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard.name }}-${{ github.sha }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Print logs on failure
        if: failure() && steps.filter.outputs.code == 'true'
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true

      - name: Stop MinIO
        if: always() && steps.filter.outputs.code == 'true'
        run: docker rm -f minio || true

  # Aggregate status of all 5 E2E shards into one PR-level check.
  # Branch protection / auto-merge depend on this single job rather than
  # юзинг 5 separate matrix-instance checks.
  e2e_summary:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    steps:
      - name: Aggregate shard results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "All 5 shards aggregate result: $E2E_RESULT"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::E2E shards failed (result=$E2E_RESULT). See individual shard logs above."
            exit 1
          fi
          echo "All E2E shards passed ✓"

  # When E2E fails on main — open a blocking issue.
  # When E2E recovers — close it automatically.
  # Only runs on push to main (not PRs).
  notify_e2e:
    name: E2E Health Gate
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      issues: write

    steps:
      - name: Open or close e2e-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          E2E_RESULT="${{ needs.e2e.result }}"

          gh label create "e2e-broken" --repo "$REPO" \
            --color "d73a4a" --description "E2E failing on main — team on hold" \
            2>/dev/null || true

          OPEN=$(gh issue list --repo "$REPO" \
            --label "e2e-broken" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$E2E_RESULT" = "failure" ] && [ -z "$OPEN" ]; then
            BODY=$(printf "## E2E сломаны на \`main\`\n\n**Commit:** \`${{ github.sha }}\`\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n## Правило\n\nВсе текущие задачи ставятся на **паузу**. Coder, Reviewer и AutoTest не принимают новые задачи пока E2E на main не восстановлены.\n\nAI Review автоматически отклоняет новые PR пока этот issue открыт.\n\n## Как исправить\n\n1. Открыть Playwright report в артефактах CI run выше\n2. Найти упавший тест — регрессия в коде или устаревший тест\n3. Исправить в новой ветке → PR (пройдёт AI Review, E2E-блокировка на PR не распространяется — только на _новые_ задачи)\n4. После merge этот issue закроется автоматически")
            gh issue create \
              --repo "$REPO" \
              --title "🚨 E2E тесты упали на main — команда на паузе" \
              --label "e2e-broken" \
              --body "$BODY"

          elif [ "$E2E_RESULT" = "success" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$REPO" \
              --comment "✅ E2E восстановлены на main (commit \`${{ github.sha }}\`). Команда возобновляет работу."
          fi
