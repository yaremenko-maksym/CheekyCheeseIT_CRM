name: CI
# re-index: force GitHub to register workflow_dispatch trigger

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to run CI on'
        required: false
        default: 'main'
  pull_request:
    # Default types [opened, synchronize, reopened] — no `labeled` here.
    # Label-triggered fast merge lives in .github/workflows/auto-merge-on-label.yml
    # which does NOT re-run CI (just waits for green checks, then squash-merges).
    #
    # NOTE: paths-ignore intentionally NOT used here. Branch protection requires
    # `Typecheck · Lint · Unit Tests` and `E2E Tests` contexts; if the workflow
    # is skipped entirely (via paths-ignore), required checks never appear and
    # docs-only PRs are permanently BLOCKED. Instead we always-run skeleton jobs
    # and gate work via `dorny/paths-filter` early-exit (see jobs below).
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest
    # Дефолтные права токена в этом репо = `read` (настройка репозитория), а
    # job-level `permissions:` их не дополняет, а ЗАМЕНЯЕТ. Без этого блока шаги
    # `gh label create` / `gh pr edit --add-label "ci-failed"` ниже получали 403
    # и метка не ставилась никогда (найдено security-review PR #441; тот же
    # 403 независимо всплыл на PR #438 — грант из #441 уже закрывает и его).
    # Это ровно про тему задачи — не терять сигнал о красном CI.
    permissions:
      contents: read
      pull-requests: write
    # DB-free: unit tests use dbAvailable-guard and skip integration specs when
    # DATABASE_URL is absent. Integration specs run in the dedicated `integration`
    # job below, which has a Postgres service and full seed+fixture setup.
    # S3 dummy creds are still needed so env-schema validation passes at import time.
    env:
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # Always-run skeleton: detect whether any non-docs file changed. If only
      # docs/markdown/CODEOWNERS were touched, every work-step below is skipped
      # and the job short-circuits to success — satisfying the required status
      # check without doing wasted work.
      #
      # PR-only (task-infra-post-merge-ci): paths-filter derives its diff from
      # the PR's base..head range. On push / workflow_dispatch there is no such
      # range — the action falls back to comparing the default branch against
      # itself, and a wrong guess there reports "no changes", which would
      # short-circuit the entire post-merge run to a *silent green*. That is
      # the one outcome a post-merge gate must never produce, so non-PR scope
      # is resolved explicitly below instead of being inferred here.
      - name: Detect non-docs changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      # Single source of truth for "should this job do work?" — every work-step
      # below keys off `steps.scope.outputs.code`.
      #   pull_request    → paths-filter verdict (docs-only PRs stay cheap).
      #   push / dispatch → always `true`. A post-merge run exists to validate
      #                     the actual state of `main`, so it must never skip
      #                     itself. Actions minutes are free on this public
      #                     repo, so running the full suite even on a docs-only
      #                     merge is a fair price for the guarantee that a
      #                     green post-merge run means main was really tested.
      - name: Resolve run scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then CODE="$PR_CODE"; else CODE=true; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Run scope: event=$EVENT code=$CODE"
          {
            echo "### CI scope"
            echo ""
            echo "- event: \`$EVENT\`"
            echo "- ref: \`$GITHUB_REF\`"
            echo "- work-steps enabled: \`$CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Typst binary (task-resume-template, PR #504): apps/api/src/test/typst-availability.ts
      # asserts loudly — rather than skipping — when Typst isn't on PATH, because "a suite
      # that quietly does nothing when a tool is missing is the exact failure this project
      # keeps paying for" (that file's own header). The résumé render specs need the REAL
      # binary, and it must be the EXACT version apps/api/Dockerfile's `typst` build stage
      # ships: résumé PDF byte-determinism (PR #504's AC1) depends on every environment —
      # CI, prod, a developer's machine — rendering with the same Typst build, since Typst
      # gives no cross-version guarantee on glyph shaping/layout.
      #
      # Version + checksum are NOT duplicated here. A second hardcoded copy in this file is
      # exactly the shape of drift this repo's other guards exist to catch after the fact
      # (check-prod-ddl-wiring.py, check-ssh-action-capture-stdout-version.py) — this instead
      # removes the second place to drift: install-typst-from-dockerfile.sh parses BOTH the
      # version and the SHA-256 straight out of apps/api/Dockerfile's typst stage at every
      # run and checksum-verifies the download against that parsed pin (same fail-closed
      # `sha256sum -c` the Dockerfile itself uses). Bump TYPST_VERSION in the Dockerfile and
      # the very next CI run installs the new pin with no second edit anywhere; if the
      # Dockerfile's own pin is ever wrong, the checksum step rejects the download outright
      # instead of silently installing an unverified binary. See that script's own header for
      # the full rationale and scripts/devops/tests/test-install-typst-from-dockerfile.sh for
      # the proof (positive case + checksum-mismatch + Dockerfile-parse-broke, all asserted).
      #
      # Cached on the Dockerfile's own hash, so a version bump there also busts this cache —
      # no separate cache-key bump to remember.
      - uses: actions/cache@v4
        id: typst-cache
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/crm-typst-bin
          key: typst-${{ runner.os }}-${{ hashFiles('apps/api/Dockerfile') }}

      - name: Install Typst (version + checksum parsed from apps/api/Dockerfile)
        if: steps.scope.outputs.code == 'true' && steps.typst-cache.outputs.cache-hit != 'true'
        run: scripts/devops/install-typst-from-dockerfile.sh "$HOME/.cache/crm-typst-bin"

      - name: Add Typst to PATH
        if: steps.scope.outputs.code == 'true'
        run: echo "$HOME/.cache/crm-typst-bin" >> "$GITHUB_PATH"

      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # Full build needed so vite generates routeTree.gen.ts before tsc runs.
      # Turbo cache makes this a no-op on subsequent runs for unchanged packages.
      - if: steps.scope.outputs.code == 'true'
        run: pnpm build

      # Meta-gate from PR #500 (infra/lint-teeth): fails the build if any
      # workspace package is missing a `lint` or `typecheck` script — exactly
      # the gap that let `turbo lint`/`turbo typecheck` silently skip
      # packages/shared and apps/e2e for months while reporting green (see
      # scripts/check-package-gates.mjs header for the full incident).
      #
      # This PR wires the CALL in; the script itself ships in #500 and this
      # PR is meant to merge strictly AFTER it (see this PR's description).
      # Until then `scripts/check-package-gates.mjs` does not exist on this
      # branch and the step below fails on purpose — with an explicit
      # `::error::` message naming why, instead of a bare Node
      # MODULE_NOT_FOUND stack trace.
      - name: Package gates (every package must declare lint + typecheck)
        if: steps.scope.outputs.code == 'true'
        run: |
          if [ ! -f scripts/check-package-gates.mjs ]; then
            echo "::error::scripts/check-package-gates.mjs not found. This check ships in PR #500 (infra/lint-teeth), which this PR depends on and must merge first — see this PR's description." >&2
            exit 1
          fi
          node scripts/check-package-gates.mjs

      - if: steps.scope.outputs.code == 'true'
        run: pnpm typecheck

      - if: steps.scope.outputs.code == 'true'
        run: pnpm lint

      # Run unit tests only — no DATABASE_URL means dbAvailable=false and
      # integration specs skip themselves via their guard. No DB service needed.
      - name: Run unit tests (no DB)
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @crm/shared --filter @crm/api --filter @crm/web --filter @crm/landing test

      # FM-5 guard: every apps/e2e/tests/**/*.spec.ts must be either in a CI shard
      # or explicitly listed as debt in KNOWN_UNSHARDED. Pure Python parse — no stack
      # required. Fails with a list of uncovered files + fix instructions.
      - name: E2E shard coverage guard
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/devops/check-e2e-shard-coverage.py

      # Incident guard (task-infra-vacancy-i18n-ddl, 2026-07-25): PR #422 shipped
      # apps/api/drizzle/manual/2026-07-25_vacancy_i18n_seo.sql, but deploy.yml was
      # never updated to copy/apply it — the DDL and its deploy-time application live
      # in different zones (apps/api/** vs .github/workflows/**) and silently drifted
      # apart, taking GET /api/public/vacancies down in prod with a green pipeline the
      # whole time. Same pattern as the E2E shard guard above: every manual DDL file
      # must either be referenced in deploy.yml or be an explicit, reasoned exception.
      - name: Prod DDL wiring guard
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/devops/check-prod-ddl-wiring.py

      # Incident guard (fix/backup-freshness-wiring, 2026-08-04): deploy.yml's backup-
      # freshness check was written against appleboy/ssh-action's CURRENT docs
      # (`capture_stdout: true` + `outputs.stdout`), but its version pin was left at
      # v1.2.0 — a version whose action.yml has neither, so the step silently produced
      # empty output on every single run and turned a healthy-backups deploy into a
      # false "backups are broken" alert. Same pattern as the two guards above: a
      # feature and its prerequisite drifted apart in different parts of the same file
      # and nothing ever connected them. See the guard script's own header for the
      # full incident + why this is a repo-wide check, not scoped to one step.
      - name: ssh-action capture_stdout version guard
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/devops/check-ssh-action-capture-stdout-version.py

      # Guards for the guards (task-guards-teeth, 2026-08-07). The three steps
      # above — plus six more check-* scripts that run on the VPS during deploy —
      # stood between this repo and production with ZERO tests. That is not a
      # theoretical worry: check-prod-ddl-wiring.py, created in response to a real
      # prod outage (#422), turned out to be satisfiable by a COMMENT mentioning
      # the migration filename, so it would have stayed green through the very
      # incident it was written for. This step runs every guard against both a
      # correct input AND a deliberately-broken one, and fails if any guard cannot
      # be made to go red. It also runs the meta-guard, which fails when a NEW
      # check-* script arrives without a test, or with a test that only ever
      # asserts green.
      #
      # WHY A STEP HERE AND NOT ITS OWN JOB: this job's name is one of the two
      # contexts branch protection actually requires ("Typecheck · Lint · Unit
      # Tests" — verified against the API on 2026-08-07, see guard-test-gate.yml's
      # corrected header). A standalone job would be visible but not required, i.e.
      # ignorable — which is the same "looks like a check, isn't one" failure this
      # task is about.
      #
      # Cost: seconds, not minutes, and no install/build dependency — the step
      # needs only bash/python3/node/curl. A wall-clock figure is deliberately not
      # quoted here: the first version of this comment said "~10s", which was
      # already wrong when written and drifted further as cases were added. The
      # run's own timing in the Actions UI is the authoritative number, and unlike
      # a comment it cannot go stale.
      - name: Guard tests (every check-* script, both directions)
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/devops/tests/run-guard-tests.sh

      # ── Mutation gate (task-mutation-gate, 2026-08-11) ────────────────────
      #
      # Whole-repo, sub-second, no diff dependency: every `// Stryker disable`
      # comment must say WHY it is there. Kept separate from — and ahead of —
      # the gate below, because the gate only ever sees mutants generated inside
      # the CHANGED lines of this PR, so a suppression that drifts into untouched
      # code would otherwise never be looked at again.
      - name: Mutation suppressions must state a reason
        if: steps.scope.outputs.code == 'true'
        run: node scripts/devops/check-mutation-suppressions.mjs

      # The gate itself. PR-only on purpose: it mutates the lines this branch
      # CHANGED, which is a question only a PR has an answer to. On a push to
      # main the equivalent question is "what survives across the whole
      # repository", and that is the nightly's job
      # (.github/workflows/mutation-nightly.yml) — running `--changed` here would
      # diff main against itself and report a confident, meaningless green.
      #
      # No MUTATION_BASE_SHA is passed. The script resolves the base from the
      # checkout itself: on a `pull_request` event GitHub checks out the MERGE
      # commit, so HEAD^1 is the exact base tree this PR was merged against —
      # more trustworthy than `pull_request.base.sha`, which is a snapshot of the
      # branch tip at event time and can name a different commit than the merge
      # actually used. `fetch-depth: 2` above is what makes HEAD^1 available (the
      # same thing dorny/paths-filter relies on). If the base cannot be resolved
      # the script exits 2 rather than reporting "nothing changed".
      #
      # Budget: 15 minutes. On the diffs measured for this PR the gate costs
      # 3.5s (2 changed lines) to ~10s (223 changed lines, 55 mutants); the
      # largest recent PR in this repo (#504, 4565 changed lines in apps/api)
      # generates 2220 mutants and is the case this budget exists for. Exceeding
      # it is RED with an explicit message, never a silent skip — see the script's
      # TIME BUDGET section.
      - name: Mutation gate (changed code only)
        if: steps.scope.outputs.code == 'true' && github.event_name == 'pull_request'
        env:
          MUTATION_BUDGET_SECONDS: '900'
        run: node scripts/devops/mutation-gate.mjs --changed

      - name: Upload mutation report
        if: always() && steps.scope.outputs.code == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-pr-${{ github.event.pull_request.number }}
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

      - name: Docs-only short-circuit
        if: steps.scope.outputs.code != 'true'
        run: echo "Docs-only PR — skipping quality work, satisfying required status."

      - name: Remove ci-failed label on success
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "ci-failed" 2>/dev/null || true

      - name: Label PR on CI failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "ci-failed" --repo "$REPO" \
            --color "d73a4a" --description "CI checks failed" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "ci-failed"

  integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    # Runs DB-backed *.integration.spec.ts against a real Postgres instance.
    # Separated from the unit-test `quality` job so unit tests stay fast and
    # DB-free, while integration specs get migrate + seed + fixture data.
    permissions:
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # PR-only filter + explicit non-PR scope — see the matching pair of steps
      # in the `quality` job above for the full rationale.
      - name: Detect non-docs changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      - name: Resolve run scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then CODE="$PR_CODE"; else CODE=true; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Run scope: event=$EVENT code=$CODE"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.scope.outputs.code == 'true'
        run: pnpm build

      # Push schema directly to fresh CI Postgres (no migration history needed).
      - name: Push DB schema
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @crm/api db:push

      # Seed canonical users (stable UUIDs) so integration specs can satisfy FK
      # constraints without per-test inserts of baseline data.
      - name: Seed DB
        if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @crm/api db:seed

      # Insert QA fixtures required by two integration specs:
      #
      # 1) documents-unified.integration.spec.ts test #11:
      #      ADMIN must see DRAFT contracts. Seed creates SIGNED + READY_TO_SIGN only.
      #      Adds QA SENIOR (27b9524e-...) + DRAFT employee_contract.
      #
      # 2) onboarding-contract.integration.spec.ts tests 1b + 3:
      #      DRAFT-only user (QA_FIX3, 354d26e9-...) must exist with DRAFT contract.
      #
      # source_template_id is resolved at runtime (seed assigns random UUIDs via
      # .returning()), so we SELECT the active SENIOR template inserted by db:seed.
      #
      # employee_contracts has partial unique index WHERE status != 'CANCELLED' —
      # ON CONFLICT DO NOTHING is safe on a fresh CI DB.
      - name: Insert integration test fixtures (QA SENIORs + DRAFT contracts)
        if: steps.scope.outputs.code == 'true'
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U crm_user -d crm_db <<'SQL'
            -- ── Fixture 1: qa-ac6-7x9k2m (documents-unified test #11) ──────────
            INSERT INTO users (
              id, email, display_name, legal_full_name,
              role, senior_share_percent, created_at, updated_at
            ) VALUES (
              '27b9524e-0b48-4226-8f90-65b4662c1250',
              'qa-ac6-7x9k2m@cheekycheese.dev',
              'QA Senior Draft',
              'QA Тестовий Сеньйор',
              'SENIOR', 26, NOW(), NOW()
            ) ON CONFLICT (id) DO NOTHING;

            INSERT INTO employee_contracts (
              user_id, source_template_id, body_markdown,
              status, signed_contract_id, created_by_user_id, created_at, updated_at
            )
            SELECT
              '27b9524e-0b48-4226-8f90-65b4662c1250',
              id,
              'QA DRAFT contract fixture — documents-unified integration test',
              'DRAFT', NULL,
              'a8f4d3b1-c2e5-4a1f-9b3d-8c7e6f5a4b21',
              NOW(), NOW()
            FROM contract_templates
            WHERE target_role = 'SENIOR' AND is_active = true
            LIMIT 1
            ON CONFLICT DO NOTHING;

            -- ── Fixture 2: qa-fix3-uuid (onboarding-contract tests 1b + 3) ─────
            INSERT INTO users (
              id, email, display_name, legal_full_name,
              role, senior_share_percent, created_at, updated_at
            ) VALUES (
              '354d26e9-0234-4e09-bcc9-dea5770cbdf4',
              'qa-fix3-uuid@cheekycheese.dev',
              'QA Fix3',
              'QA Fix3 Seed UUID Testovyi',
              'SENIOR', 26, NOW(), NOW()
            ) ON CONFLICT (id) DO NOTHING;

            INSERT INTO employee_contracts (
              user_id, source_template_id, body_markdown,
              status, signed_contract_id, created_by_user_id, created_at, updated_at
            )
            SELECT
              '354d26e9-0234-4e09-bcc9-dea5770cbdf4',
              id,
              'QA DRAFT contract fixture — onboarding-contract integration test',
              'DRAFT', NULL,
              'a8f4d3b1-c2e5-4a1f-9b3d-8c7e6f5a4b21',
              NOW(), NOW()
            FROM contract_templates
            WHERE target_role = 'SENIOR' AND is_active = true
            LIMIT 1
            ON CONFLICT DO NOTHING;
          SQL

      # Run only *.integration.spec.ts — unit specs are covered by the `quality` job.
      # Vitest 3.x positional arg is a PATH SUBSTRING filter, not a shell glob.
      # "**/*.integration.spec.ts" contains no real path chars → 0 matches.
      # "integration.spec" is a substring present in every integration spec path
      # and absent from all unit specs (verified against 7 files in apps/api/src/).
      # --reporter=verbose shows each test name so CI logs confirm real execution
      # (not silent skip via dbAvailable guard).
      - name: Run integration tests
        if: steps.scope.outputs.code == 'true'
        run: |
          pnpm --filter @crm/api exec vitest run \
            --reporter=verbose \
            integration.spec

      - name: Docs-only short-circuit
        if: steps.scope.outputs.code != 'true'
        run: echo "Docs-only PR — skipping integration tests, satisfying required status."

      - name: Label PR on integration failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "ci-failed" --repo "$REPO" \
            --color "d73a4a" --description "CI checks failed" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "ci-failed"

  # ── Job `auto_merge` УДАЛЁН 2026-07-27 (review PR #441) ───────────────────
  #
  # Это был второй, спящий merge-путь: он мог сквошить PR прямо из `ci.yml`,
  # если метка `merge-approved` уже висела на PR в момент прогона. На практике
  # не срабатывал — `ci.yml` намеренно не слушает `labeled`, поэтому метку
  # всегда ставят ПОСЛЕ того, как CI позеленел, и мержит `auto-merge-on-label.yml`.
  #
  # Почему удалён, а не починен (security-review PR #441, MED):
  #   1. Он нёс `contents: write` + `pull-requests: write` (+ добавленный в #441
  #      `actions: write`) в workflow с триггером `pull_request`. Для веток
  #      ЭТОГО репо (а все наши агенты работают в них) GitHub исполняет версию
  #      workflow из merge-ref — то есть ветка могла переписать условие
  #      `contains(labels, 'merge-approved')` в своей же версии файла и
  #      само-смержиться без апрува владельца. Ровно класс инцидента
  #      2026-06-21 (reviewer self-merge, PR #271).
  #   2. В нём же жил HIGH-баг из #441: два `gh workflow run` в ОДНОМ `run:`
  #      под дефолтным `bash -eo pipefail` — падение первой команды гарантированно
  #      обрывало вторую.
  # Удаление закрывает оба разом и не трогает рабочий путь мержа.
  #
  # Ветка `merge-approved` → сквош → dispatch deploy + CI живёт целиком в
  # `.github/workflows/auto-merge-on-label.yml`.

  e2e:
    name: E2E (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: auth-nav
            files: tests/auth.spec.ts tests/navigation.spec.ts tests/debug.spec.ts tests/mock_test.spec.ts tests/app-shell-responsive.spec.ts
          - name: team-users
            files: tests/team.spec.ts tests/users.spec.ts tests/rbac-hr-on-senior.spec.ts tests/rbac-junior-on-other.spec.ts
          - name: projects
            files: tests/projects.spec.ts tests/projects-senior-share-override.spec.ts tests/drop-attach-project.spec.ts
          - name: finance
            # company-share-cta.spec.ts (task-company-share-cta, PR #445): CTA
            # strip + two-step payout modal for the senior's company-share
            # payout. Same mocked-route pattern as the other two files here
            # (mocks /transactions + /payout-requests, no real backend calls)
            # — content-wise a finance flow, and per recent main runs `finance`
            # is consistently one of the shorter E2E shards (misc/team-users
            # are the longest), so the ~19 extra (fast, mocked) tests here are
            # unlikely to make it the new critical-path leg.
            files: tests/finance.spec.ts tests/finance-senior-flow.spec.ts tests/company-share-cta.spec.ts
          - name: misc
            # tests/job-sourcing-mobile.spec.ts (task-job-sourcing-slice1, PR #493): the "Подбор
            # вакансий" modal on the kanban — same screen/mock-stack shape as
            # tests/interviews.spec.ts right next to it (page.route mocks only, no live
            # backend), 11 tests, ~5s. Placed here rather than a new shard: misc is already the
            # heaviest shard by both file count (16 specs) and wall time (~4:53 of a 15-minute
            # job timeout on a recent main run, gh run 31194170529) but has ample headroom —
            # 11 fast mocked tests do not meaningfully move that number.
            files: tests/interviews.spec.ts tests/job-sourcing-mobile.spec.ts tests/profile-self-edit.spec.ts tests/requisites-warning.spec.ts tests/admin-actions.spec.ts tests/onboarding-logout.spec.ts tests/documents-pdf-preview.spec.ts tests/persist-query.spec.ts tests/vacancies.spec.ts tests/crm
          - name: drop-finance
            files: tests/pending-settlement.spec.ts tests/drop-role-end-to-end.spec.ts tests/rbac-matrix-smoke.spec.ts tests/drop-share-usdt-income.spec.ts tests/drop-share-usdt-gates.spec.ts tests/project-payment-type-and-drop-share.spec.ts tests/drop-share-slider.spec.ts tests/transaction-receipts.spec.ts
          # task-landing-e2e-in-ci.md Part 2. Different stack shape than every
          # other leg above (no apps/web dev server; apps/landing prerender +
          # `vite preview` instead — see the matrix.shard.name == 'landing'
          # branches sprinkled through the steps below) but the SAME job, so
          # it runs in parallel with the other shards (not chained) and gets
          # the "E2E (landing)" name for free from the templated `name:`
          # field above — no separate job, no extra required-check wiring.
          # `tests/landing/` (a directory prefix, not a single *.spec.ts) —
          # same convention as `tests/crm` in the misc shard above — so the
          # shard-coverage guard (scripts/devops/check-e2e-shard-coverage.py)
          # auto-covers every spec under this directory, including future
          # ones, without a per-file list here.
          - name: landing
            files: tests/landing/
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # MinIO нельзя запустить через `services:` — GHA service container schema
      # не поддерживает `command:`/`args:`, а MinIO image без команды exit'ит.
      # Поднимаем через `docker run` ниже (см. step "Start MinIO + bucket").

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api
      # S3 / MinIO (PHASE 6) — dev dummy creds, MinIO service started above.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Throttler: raise limits in E2E CI so money-path specs (drop-finance shard)
      # don't get 429. THROTTLE_RELAXED is only honoured in non-production (guardrail
      # in env.ts). THROTTLER_LIMIT=2000 is enough for the heaviest rbac-matrix-smoke.
      THROTTLE_RELAXED: 'true'
      THROTTLER_LIMIT: '2000'

    steps:
      # `inputs.ref` — как в `quality` / `integration` (review PR #441, LOW).
      # Раньше этот job чекаутил голый `github.sha`, поэтому диспатч с явным
      # `-f ref=...` гонял E2E по одному дереву, а typecheck/unit — по другому,
      # и вердикт «main зелёный» собирался из разных коммитов.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # Always-run skeleton: detect whether any non-docs file changed. If only
      # docs were touched, all work-steps skip and the shard short-circuits to
      # success — `e2e_summary` aggregator sees success and propagates to the
      # required `E2E Tests` status check.
      #
      # PR-only filter + explicit non-PR scope — see the matching pair of steps
      # in the `quality` job above for the full rationale.
      - name: Detect non-docs changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**.md'
              - '!.github/CODEOWNERS'

      - name: Resolve run scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then CODE="$PR_CODE"; else CODE=true; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Run scope: event=$EVENT code=$CODE"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.code == 'true'
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - uses: actions/cache@v4
        id: pw-cache
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # landing shard never touches document/S3 flows — skip the MinIO
      # container for that leg only (every other leg keeps it, unchanged).
      - name: Start MinIO + bucket
        if: steps.scope.outputs.code == 'true' && matrix.shard.name != 'landing'
        run: |
          docker run -d --name minio \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          # Wait for healthy
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then echo "MinIO ready"; break; fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          # Bootstrap bucket (mc image entrypoint is `mc`, override with /bin/sh).
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/crm-documents &&
            echo 'MinIO bucket crm-documents ready (CI)'
          "

      - if: steps.scope.outputs.code == 'true'
        run: pnpm build

      - if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @crm/api db:push

      - if: steps.scope.outputs.code == 'true'
        run: pnpm --filter @crm/api db:seed

      - name: Start API
        if: steps.scope.outputs.code == 'true'
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      # landing shard never navigates apps/web — skip starting it for that leg.
      - name: Start Web
        if: steps.scope.outputs.code == 'true' && matrix.shard.name != 'landing'
        run: nohup pnpm --filter @crm/web start > /tmp/web.log 2>&1 &

      # Every shard (including landing) needs the API. Split out of the old
      # combined "Wait for services" step so the apps/web wait can be skipped
      # for the landing leg (nothing ever listens on :3000 there).
      - name: Wait for API
        if: steps.scope.outputs.code == 'true'
        run: timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'

      - name: Wait for Web
        if: steps.scope.outputs.code == 'true' && matrix.shard.name != 'landing'
        run: timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        if: steps.scope.outputs.code == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.scope.outputs.code == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      # ── landing-only steps (task-landing-e2e-in-ci.md КОНТРАКТ) ─────────
      # Real admin HTTP API (dev-login → POST/PATCH /api/vacancies), not a
      # direct DB write — needs the API already answering (Wait for API,
      # above). See apps/e2e/scripts/seed-landing.ts module doc.
      - name: Seed landing vacancy fixtures
        if: steps.scope.outputs.code == 'true' && matrix.shard.name == 'landing'
        run: pnpm --filter @crm/e2e seed:landing

      # `vite build && node scripts/prerender.mjs` — the script drives its
      # OWN headless Chromium (installed above) against a scratch preview
      # server (default :4173) to snapshot every route, then exits; the real
      # :3002 preview used by Playwright is started in the next step.
      # PRERENDER_API_ORIGIN is pointed at the local seeded API — the default
      # is the PROD domain (apps/landing/README.md "Env vars"), which would
      # otherwise silently pull real prod vacancy data into a CI build
      # instead of the fixtures seeded above.
      - name: Build landing (prerender)
        if: steps.scope.outputs.code == 'true' && matrix.shard.name == 'landing'
        env:
          PRERENDER_API_ORIGIN: http://localhost:3001
        run: pnpm --filter @crm/landing build:prerender

      # task-infra-silent-failures (2026-08-01) — independent, non-Coder-zone
      # witness on top of prerender.mjs's own JSON-LD assertions: inspects the
      # already-built dist/ output directly instead of trusting the build not
      # to have silently regressed. Placed right here (not a separate job) so
      # it runs against the exact vacancy set "Seed landing vacancy fixtures"
      # just seeded, before the preview server below serves it to Playwright.
      # See scripts/devops/check-landing-seo-coverage.mjs module doc for why
      # this exists on top of, not instead of, the seeding above.
      - name: Verify landing build shipped real vacancy SEO markup
        if: steps.scope.outputs.code == 'true' && matrix.shard.name == 'landing'
        run: node scripts/devops/check-landing-seo-coverage.mjs

      # Same VITE_PROXY_API_TARGET override apps/landing/vite.config.ts's
      # `preview.proxy['/api']` documents for local dev — proxies the built
      # SPA's /api/* calls to the API started earlier in this job.
      - name: Start landing preview
        if: steps.scope.outputs.code == 'true' && matrix.shard.name == 'landing'
        env:
          VITE_PROXY_API_TARGET: http://localhost:3001
        run: nohup pnpm --filter @crm/landing start > /tmp/landing.log 2>&1 &

      - name: Wait for landing preview
        if: steps.scope.outputs.code == 'true' && matrix.shard.name == 'landing'
        run: timeout 30 bash -c 'until curl -sf http://localhost:3002; do sleep 2; done'

      - name: Run E2E tests (shard ${{ matrix.shard.name }})
        if: steps.scope.outputs.code == 'true'
        env:
          SHARD_FILES: ${{ matrix.shard.files }}
        run: |
          if [ "${{ matrix.shard.name }}" = "landing" ]; then
            pnpm --filter @crm/e2e exec playwright test --project=landing
          else
            pnpm --filter @crm/e2e exec playwright test $SHARD_FILES
          fi

      - name: Docs-only short-circuit
        if: steps.scope.outputs.code != 'true'
        run: echo "Docs-only PR — skipping E2E shard ${{ matrix.shard.name }}, satisfying required status."

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard.name }}-${{ github.sha }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Print logs on failure
        if: failure() && steps.scope.outputs.code == 'true'
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true
          echo "=== LANDING LOG ===" && cat /tmp/landing.log || true

      - name: Stop MinIO
        if: always() && steps.scope.outputs.code == 'true'
        run: docker rm -f minio || true

  # Aggregate status of all 5 E2E shards into one PR-level check.
  # Branch protection / auto-merge depend on this single job rather than
  # юзинг 5 separate matrix-instance checks.
  e2e_summary:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    steps:
      - name: Aggregate shard results
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "All 5 shards aggregate result: $E2E_RESULT"
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::E2E shards failed (result=$E2E_RESULT). See individual shard logs above."
            exit 1
          fi
          echo "All E2E shards passed ✓"

  # When E2E fails on main — open a blocking issue.
  # When E2E recovers — close it automatically.
  # Only runs on main (not PRs).
  #
  # Condition tightened 2026-07-27 (task-infra-post-merge-ci): the previous
  # form was `(ref == main || event == workflow_dispatch) && (event == push ||
  # event == workflow_dispatch)`, which any workflow_dispatch satisfied — a
  # dispatch on a *feature branch* could open the `e2e-broken` "team on hold"
  # issue. Now the ref must actually be main, on any non-PR event.
  notify_e2e:
    name: E2E Health Gate
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      issues: write

    steps:
      - name: Open or close e2e-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          E2E_RESULT="${{ needs.e2e.result }}"

          gh label create "e2e-broken" --repo "$REPO" \
            --color "d73a4a" --description "E2E failing on main — team on hold" \
            2>/dev/null || true

          OPEN=$(gh issue list --repo "$REPO" \
            --label "e2e-broken" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$E2E_RESULT" = "failure" ] && [ -z "$OPEN" ]; then
            BODY=$(printf "## E2E сломаны на \`main\`\n\n**Commit:** \`${{ github.sha }}\`\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n## Правило\n\nВсе текущие задачи ставятся на **паузу**. Coder, Reviewer и AutoTest не принимают новые задачи пока E2E на main не восстановлены.\n\nAI Review автоматически отклоняет новые PR пока этот issue открыт.\n\n## Как исправить\n\n1. Открыть Playwright report в артефактах CI run выше\n2. Найти упавший тест — регрессия в коде или устаревший тест\n3. Исправить в новой ветке → PR (пройдёт AI Review, E2E-блокировка на PR не распространяется — только на _новые_ задачи)\n4. После merge этот issue закроется автоматически")
            gh issue create \
              --repo "$REPO" \
              --title "🚨 E2E тесты упали на main — команда на паузе" \
              --label "e2e-broken" \
              --body "$BODY"

          elif [ "$E2E_RESULT" = "success" ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$REPO" \
              --comment "✅ E2E восстановлены на main (commit \`${{ github.sha }}\`). Команда возобновляет работу."
          fi

  # ── Post-merge alert (task-infra-post-merge-ci, 2026-07-27) ───────────────
  #
  # `notify_e2e` above covers ONE leg (E2E) with the agent-facing `e2e-broken`
  # "team on hold" protocol. This job covers the WHOLE post-merge run —
  # typecheck/lint/unit, integration and E2E — and routes to the channel the
  # assistant actually watches (issues in the private telemetry repo), so a red
  # main cannot sit unnoticed until the next PR trips over it.
  #
  # Deliberately NOT a merge gate: prod deploys in parallel with this run (see
  # deploy.yml), so by the time an alert fires the bad state is usually already
  # live. The alert exists to trigger a fast revert/hotfix decision, and the
  # issue body says so.
  post_merge_alert:
    name: Post-merge Alert
    runs-on: ubuntu-latest
    needs: [quality, integration, e2e_summary]
    # `always()` so the job still runs when a leg failed. Guarded to main +
    # non-PR so PR runs and feature-branch dispatches never open alerts.
    #
    # Третье условие (review PR #441, MED) закрывает расцепление «какой код
    # исполняется» и «какие гарды проверяются»: `github.ref` на диспатче — это
    # ветка, С КОТОРОЙ взят workflow-файл, а `inputs.ref` — то, что реально
    # чекаутится. `gh workflow run ci.yml --ref main -f ref=<чужая-ветка>`
    # проходил гард `github.ref == main` и запускал ЧУЖОЙ
    # `scripts/devops/post-merge-alert.sh` — а этот job единственный в ci.yml,
    # кто держит `secrets.TELEMETRY_ISSUES_PAT`. Требует repo-write (внешнему
    # контрибьютору недоступно), но blast-radius скомпрометированного
    # агентского доступа включал бы телеметрийный PAT.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.ref == '' || inputs.ref == 'main')
    permissions:
      issues: write
    env:
      # PRIVATE repo — same channel as telemetry-digest.yml, which is what the
      # assistant polls. CI alerts carry no PII (SHA, subject, run URL), so the
      # privacy constraint documented there is not at stake either way.
      PRIVATE_REPO: yaremenko-maksym/cheekycheese-telemetry
    steps:
      # Пин на main, а НЕ `inputs.ref` — belt-and-braces к гарду выше: job
      # исполняет скрипт с PAT, поэтому дерево берём только с main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # Roll the three required legs into one verdict.
      #   any failure            → failure (alert)
      #   all success            → success (close any open alert)
      #   anything else          → neither; a run cancelled by the next merge's
      #                            `cancel-in-progress` is NOT a red main.
      - name: Aggregate post-merge result
        id: agg
        env:
          QUALITY: ${{ needs.quality.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e_summary.result }}
        run: |
          FAILED=""
          [ "$QUALITY" = "failure" ] && FAILED="$FAILED quality"
          [ "$INTEGRATION" = "failure" ] && FAILED="$FAILED integration"
          [ "$E2E" = "failure" ] && FAILED="$FAILED e2e"
          FAILED="${FAILED# }"

          if [ -n "$FAILED" ]; then
            RESULT=failure
          elif [ "$QUALITY" = "success" ] && [ "$INTEGRATION" = "success" ] && [ "$E2E" = "success" ]; then
            RESULT=success
          else
            RESULT=inconclusive
            # `inconclusive` — это НЕ только штатная отмена по
            # `cancel-in-progress` (следующий мерж обгонит этот прогон и
            # провалидирует надмножество). Сюда же попадают инфра-сбои: job не
            # стартовал, раннер умер, docker-pull таймаут на `Initialize
            # containers` (был реальный прецедент). В этом случае main остался
            # НЕ провалидированным, и issue не откроется — поэтому хотя бы
            # ::warning, чтобы состояние не выглядело как «всё хорошо».
            echo "::warning::Post-merge run inconclusive (quality=$QUALITY integration=$INTEGRATION e2e=$E2E) — main НЕ провалидирован. Если это не отмена по cancel-in-progress (следующий мерж), перезапустить: gh workflow run ci.yml --ref main"
          fi

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "failed_legs=${FAILED:-none}" >> "$GITHUB_OUTPUT"
          {
            echo "### Post-merge verdict: \`$RESULT\`"
            echo ""
            echo "| leg | result |"
            echo "| --- | --- |"
            echo "| quality | \`$QUALITY\` |"
            echo "| integration | \`$INTEGRATION\` |"
            echo "| e2e | \`$E2E\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Commit subject read from git rather than `github.event.head_commit.*`:
      # it works on both push and workflow_dispatch, and keeps an
      # attacker-controlled string out of workflow-expression interpolation
      # (it reaches the script as plain env, then as literal argv to `gh`).
      # Both values come from the checked-out HEAD rather than `github.sha`:
      # on a dispatch the checkout resolves `main` at run time, which can be a
      # newer commit than the one that triggered it, and the alert should name
      # the commit that was actually validated.
      # Heredoc-разделитель, генерируемый В РАНТАЙМЕ — рекомендованный GitHub
      # способ писать в $GITHUB_OUTPUT значение, которое пришло не от нас.
      # `%s` сам по себе однострочный, так что формат сейчас не сломать, но
      # безопасность тут была БЫ случайной: замена `%s` на `%B` (или переход на
      # `github.event.head_commit.message`) мгновенно превратила бы это в
      # output-инъекцию с подменой соседнего `sha=`. Фиксируем явно.
      #
      # Делимитер именно случайный, а не константа в публичном исходнике
      # (re-review PR #446, LOW): константу видно всем, и подобрать subject,
      # буквально равный ей, теоретически возможно — со случайным маркером
      # это невозможно by construction.
      - name: Read validated commit
        id: commit
        run: |
          DELIM="COMMIT_SUBJECT_EOF_$(openssl rand -hex 8)"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "subject<<$DELIM"
            git log -1 --pretty=%s
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Private telemetry repo when the PAT works (assistant's channel);
      # otherwise fall back to an issue on this public repo via GITHUB_TOKEN.
      # Channel is chosen by whether the token actually WORKS, not merely
      # whether it's set (review PR #441, MED — a fine-grained PAT past its
      # expiry is a non-empty string). Extracted to
      # scripts/devops/resolve-alert-channel.sh (task-infra-silent-failures,
      # 2026-08-01) so deploy-alert.yml's identical alert job reuses the
      # exact same probe instead of a second, divergence-prone copy — see
      # that script's header for the full rationale.
      - name: Resolve alert channel
        id: channel
        env:
          PAT: ${{ secrets.TELEMETRY_ISSUES_PAT }}
          PUBLIC_REPO: ${{ github.repository }}
        run: ./scripts/devops/resolve-alert-channel.sh

      - name: Open / update / close the alert issue
        env:
          GH_TOKEN: ${{ steps.channel.outputs.use_pat == 'true' && secrets.TELEMETRY_ISSUES_PAT || github.token }}
          ALERT_REPO: ${{ steps.channel.outputs.repo }}
          RESULT: ${{ steps.agg.outputs.result }}
          FAILED_LEGS: ${{ steps.agg.outputs.failed_legs }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_SUBJECT: ${{ steps.commit.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: ci
        run: ./scripts/devops/post-merge-alert.sh

      # Make the red main visible in the Actions UI too, not only as an issue.
      - name: Fail the job when main is red
        if: steps.agg.outputs.result == 'failure'
        run: |
          echo "::error::Post-merge CI is RED on main (failed: ${{ steps.agg.outputs.failed_legs }})."
          exit 1
