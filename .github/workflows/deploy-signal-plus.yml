name: Deploy Signal Plus

# task-signal-plus-step2-deploy — step 2 of the "утренняя перекличка" plan
# (.claude/tasks/task-signal-plus-service.md). Builds+pushes the
# services/signal-plus/ image and deploys it as its OWN compose project
# (`signal-plus`, /opt/signal-plus) on the same VPS the CRM stack (`crm`,
# /opt/crm) already runs on — see docker-compose.yml's header comment for
# why this MUST be a separate compose project (CRM's own `deploy.yml` runs
# `up -d --remove-orphans` against /opt/crm on every deploy, which would
# otherwise treat a signal-plus container as an orphan and kill it).
#
# Deliberately its own workflow file, not a job added to deploy.yml: same
# reasoning as deploy-alert.yml already documents for the CRM stack — this
# service has its own trigger (a different `paths:` filter), its own image,
# its own VPS directory, and touching deploy.yml's already very large file
# for an unrelated service is not worth the risk.
#
# Two jobs (SR-M-7 + CR-M-6, PR #650 security/code review round 2, ids
# 5107124812/5107141323 — "одна правка"): neither of this service's own two
# test suites (pytest, and the shell regression test for SR-H-2's
# revoked-key check) gated a PR before this — the ONLY place `python -m
# pytest` ran at all was this workflow's own `test` build stage, which only
# ever built on `push: main`, i.e. AFTER merge. `build-and-test` now runs on
# every PR that touches this service (or this workflow file) and on every
# push to main; `deploy` (SSH, VPS secrets, `docker compose up -d`) still
# runs ONLY on `push: main`/`workflow_dispatch` — never on a PR, and
# `needs: build-and-test` means it cannot even start until the build+tests
# it depends on have already passed.
#
# STOP LINE (task-signal-plus-step2-deploy.md): this workflow builds, pushes,
# writes the VPS's .env, and runs `docker compose up -d` — it does NOT link
# the Signal account (step 3, `signal-cli link`, run manually by the owner
# per README.md "Деплой и линковка"). Do not dispatch this workflow against
# the real VPS until SIGNAL_PLUS_ENV/VPS_* secrets exist and the owner says
# to.
on:
  pull_request:
    paths:
      - 'services/signal-plus/**'
      - '.github/workflows/deploy-signal-plus.yml'
  push:
    branches: [main]
    paths:
      - 'services/signal-plus/**'
  workflow_dispatch:

concurrency:
  # Scoped per-PR (so rapid pushes to the SAME PR cancel each other, not a
  # push:main deploy in flight) — a bare `deploy-signal-plus` group here
  # would let a PR update cancel an in-progress PRODUCTION deploy, or vice
  # versa, which is a different failure class than "a superseded run should
  # not race the one that replaced it" (the reason this existed at all).
  group: deploy-signal-plus-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # `cheekycheeseit-crm-<component>` — same family as the CRM stack's own
  # images (see docker-compose.ghcr.yml: cheekycheeseit-crm-api,
  # cheekycheeseit-crm-nginx), not a separate `cheekycheeseit-signal-plus`
  # name: this is still one owner/one GHCR namespace, and keeping the prefix
  # shared makes `cheekycheeseit-crm-*` list every image this project
  # publishes in one grep/one `gh api .../packages` call.
  IMAGE_NAME: yaremenko-maksym/cheekycheeseit-crm-signal-plus

jobs:
  build-and-test:
    name: Build & test signal-plus image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push:false, load:true — this build's whole point is to gate PRs
      # (and re-confirm push:main) cheaply; it never needs to reach GHCR.
      # The `test` stage (python -m pytest — 176 tests as of fix-round 2,
      # including SR-M-7's wrapped tests/test_verify_release_signature.sh)
      # already fails the whole build if anything is red, same as before —
      # this job just makes THAT failure visible on the PR itself instead
      # of only after merge.
      - name: Build signal-plus image locally (test stage gates pytest + shell GPG test)
        uses: docker/build-push-action@v6
        with:
          context: services/signal-plus
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=signal-plus
          cache-to: type=gha,mode=max,scope=signal-plus

      # SR-M-8 (security review round 2, id 5107124812): CR-M-1's original
      # smoke test ran a bare `docker run --entrypoint ... --version`, with
      # none of docker-compose.yml's own hardening (`read_only`, `tmpfs`,
      # `cap_drop: [ALL]`, `no-new-privileges`) — it proved the binary can
      # execute, not that it can execute in the profile it will actually
      # run under in production. `docker compose run` against the REAL
      # compose file (not a hand-reconstructed flag list) answers that with
      # a fact, on ubuntu-latest's real amd64 hardware, where the
      # QEMU/Apple-Silicon CPU-ISA emulation gap this binary hits locally
      # does not apply (see the Dockerfile's own comment on that).
      # IMAGE_TAG points compose at the image `load: true` just placed in
      # this runner's local Docker daemon — nothing is pulled from GHCR.
      #
      # SR-M-9 (PR #650 security review round 3, id 5108694371) rewrote
      # this step entirely -- the version above was STRUCTURALLY unable to
      # catch SR-H-4 (a real HIGH finding), for two independent reasons,
      # both fixed here:
      #   1. `--entrypoint /opt/signal-cli-pinned/signal-cli` REPLACES
      #      docker-entrypoint.sh outright -- the real container never
      #      starts this way, so SIGNAL_TMPDIR/TMPDIR/SQLITE_TMPDIR never
      #      get created and the binary-seed/PATH-symlink bootstrap never
      #      runs either. No override here: the command below is the CMD
      #      `docker compose run` passes to the REAL entrypoint, which
      #      bootstraps first and then `exec`s it, exactly like production.
      #   2. `--version` never initializes the account manager, so it never
      #      loads libsignal_jni at all -- this smoke test passed on every
      #      single run, including the one immediately before SR-H-4 was
      #      found, despite the binary being unable to load its own native
      #      library in this exact hardening profile. `listGroups` against
      #      a fake, never-registered E.164 number does load it (same
      #      manager-init path every real subcommand goes through --
      #      signal_plus/signal.py's own module docstring cites
      #      App.java's `initManagerFromAccount`), so a failure to load is
      #      now something this step can actually observe.
      #
      # SR-L-9 (PR #650 security review round 4, id 5109138286): the round-3
      # version above hand-typed `signal-cli -Djava.io.tmpdir=/data/tmp -a
      # +15550000000 listGroups`, which this comment claimed "matches, does
      # not reimplement" signal_plus/signal.py's own argv construction --
      # but a hand-typed copy is exactly a reimplementation, and could
      # silently drift from the real one (e.g. if SIGNAL_TMPDIR's default
      # ever changed, this literal `/data/tmp` would not). Runs the actual
      # application entry point instead -- `signal-plus --groups` (the
      # `signal_plus.cli:main` console script from pyproject.toml, same one
      # `CMD ["signal-plus"]` in the Dockerfile launches for the real
      # daemon) -- against SIGNAL_ACCOUNT/SIGNAL_GROUP_ID's own placeholder
      # values from `.env.example`. This makes signal_plus/signal.py's
      # `_run_signal_cli` build the ENTIRE argv itself, flag included, so
      # this step now genuinely exercises the real code path, not a parallel
      # one that merely looks like it.
      - name: Smoke-test under the real hardening profile (docker compose run)
        working-directory: services/signal-plus
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        run: |
          cp .env.example .env

          SMOKE_OUTPUT="$(docker compose -p signal-plus-ci run --rm signal-plus \
            signal-plus --groups 2>&1)" || true
          echo "signal-plus --groups, placeholder account from .env.example (under read_only+tmpfs+cap_drop:ALL+no-new-privileges, via the REAL entrypoint and the REAL application argv construction): $SMOKE_OUTPUT"

          if printf '%s' "$SMOKE_OUTPUT" | grep -qF "Can't load library"; then
            echo "::error::native library failed to load under the hardening profile -- $SMOKE_OUTPUT"
            docker compose -p signal-plus-ci down -v
            exit 1
          fi
          if ! printf '%s' "$SMOKE_OUTPUT" | grep -qF "is not registered"; then
            echo "::error::expected the placeholder account (.env.example's SIGNAL_ACCOUNT) to reach signal-cli's own 'is not registered' check (proof the native library loaded and the process reached the network) -- got: $SMOKE_OUTPUT"
            docker compose -p signal-plus-ci down -v
            exit 1
          fi

          docker compose -p signal-plus-ci down -v

      # ── "Pull it back like the VPS does" repro (task-signal-plus-pull-fix.md #3) ──
      # The build above never leaves THIS runner's own Docker daemon --
      # `load: true` hands BuildKit's finished image straight to the local
      # image store, so it cannot exercise a bug that only shows up when a
      # layer is PUSHED to a registry and then PULLED BACK, unpacked by
      # containerd's overlayfs snapshotter. That exact round trip is what
      # broke on the VPS (run 33946345307): "failed to Lchown
      # .../opt/signal-cli-pinned/signal-cli for UID 0, GID 0: ... no such
      # file or directory" during `docker compose -p signal-plus pull`,
      # Ubuntu 24.04.3 x86_64, Docker with the containerd image store
      # (`daemon.json`'s `features.containerd-snapshotter` -- the SAME key
      # flipped below). No GHCR, no deploy secret: a throwaway `registry:2`
      # container stands in for the registry, and this runner's OWN dockerd
      # is switched onto the same snapshotter the VPS runs, first.
      - name: Switch this runner's dockerd onto the containerd image store (matches the VPS)
        run: |
          # Merge, don't clobber -- ubuntu-latest already ships a
          # daemon.json (log-driver settings etc.); overwriting it outright
          # risks breaking something else later in this same job that reads
          # one of those existing keys.
          EXISTING="$(cat /etc/docker/daemon.json 2>/dev/null || echo '{}')"
          echo "$EXISTING" | jq '. * {"features":{"containerd-snapshotter":true},"insecure-registries":["localhost:5000"]}' \
            | sudo tee /etc/docker/daemon.json >/dev/null
          cat /etc/docker/daemon.json
          sudo systemctl restart docker
          # Fail loudly here, not three steps down, if the daemon quietly
          # stayed on the old graphdriver -- that would make every check
          # below pass for the wrong reason (never touching the code path
          # that actually broke on the VPS).
          docker info --format '{{json .DriverStatus}}' | tee /tmp/driver-status.json
          grep -q 'io.containerd.snapshotter.v1' /tmp/driver-status.json

      - name: Start a throwaway local registry (stands in for GHCR)
        run: docker run -d -p 5000:5000 --name local-registry registry:2

      - name: 'Reproduce the VPS path: build, push to a registry, pull it back'
        working-directory: services/signal-plus
        run: |
          # The builder docker/setup-buildx-action created above uses the
          # `docker-container` driver (a separate BuildKit container) --
          # pushing to `localhost:5000` from inside that container needs
          # its own network+TLS-trust wiring. `default` is the builder
          # that has existed since before that action ran, wired directly
          # into THIS runner's own dockerd (the `docker` driver) -- it
          # already inherits the daemon.json trust/snapshotter change above
          # for free, because it IS that daemon, not a container next to it.
          docker buildx use default
          docker buildx build --platform linux/amd64 \
            --push -t localhost:5000/signal-plus:pull-repro .
          # Force an actual network pull+extract of what was just pushed --
          # the point is to exercise containerd's overlayfs differ on a
          # fresh snapshot, not to reuse the builder's own local cache.
          docker rmi localhost:5000/signal-plus:pull-repro 2>/dev/null || true
          docker pull localhost:5000/signal-plus:pull-repro

  deploy:
    name: Push & deploy signal-plus
    needs: build-and-test
    # CR-M-6: deploy (SSH, VPS secrets, docker compose up -d) never runs on
    # a pull_request event — only on push:main or a manual dispatch. A PR
    # cannot reach the VPS or any deploy secret through this workflow.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      # For the alert step's `gh issue` calls when TELEMETRY_ISSUES_PAT is
      # absent/expired and resolve-alert-channel.sh falls back to this repo.
      issues: write
    env:
      # Same channel as ci.yml's `post_merge_alert` / deploy-alert.yml — the
      # private repo the assistant actually watches. Deploy-failure alerts
      # carry no PII (SHA, subject, failed legs, run URL), same as those, so
      # the privacy constraint documented in post-merge-alert.sh is not at
      # stake either way. Was missing here (run 33853234219): resolve-alert-channel.sh
      # requires PRIVATE_REPO and PUBLIC_REPO both non-empty (see that
      # script's own guard), so its absence failed "Resolve alert channel"
      # outright and no KIND=signal-plus alert was ever opened.
      PRIVATE_REPO: yaremenko-maksym/cheekycheese-telemetry

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: sha (immutable, matches this run's commit — usable for a
      # manual rollback via `docker compose ... pull` after editing .env's
      # IMAGE_TAG by hand) + latest (what docker-compose.yml's
      # `${IMAGE_TAG:-latest}` default resolves to when IMAGE_TAG is unset).
      # No third `:main` "rolling" tag — task-signal-plus-step2-deploy.md
      # says "тег sha + latest", not the 3-tag scheme deploy.yml uses for
      # the CRM images. Same cache scope as build-and-test's own build, so
      # this reuses those layers instead of rebuilding from scratch —
      # build-and-test already gated this exact content (`needs:` above).
      - name: Build & push signal-plus image
        uses: docker/build-push-action@v6
        with:
          context: services/signal-plus
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=signal-plus
          cache-to: type=gha,mode=max,scope=signal-plus

      # Single secret blob (task: "один секрет-блоб") — unlike CRM's
      # .env.production (composed from ~25 individual secrets field-by-field,
      # see deploy.yml's "Write .env.production on VPS" job), this service's
      # whole .env fits in one KEY=VALUE-per-line secret, same shape as
      # services/signal-plus/.env.example. Simpler is correct here: one
      # owner-maintained value instead of a secret per env var for a service
      # this small.
      #
      # `umask 077` (task-signal-plus-step2-deploy.md, explicit ask — CRM's
      # own .env.production write does NOT do this, only `chmod 600`
      # afterward, which leaves a brief window where the file exists at the
      # shell's default mode before the chmod runs): scoped to a subshell so
      # it cannot leak into any later command in this same script.
      - name: Write .env on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Travels over the encrypted SSH channel as an env var, never
          # substituted into the YAML string — same reasoning as deploy.yml's
          # "No ${{ secrets.* }} interpolation happens here" comment on its
          # own .env write step.
          SIGNAL_PLUS_ENV: ${{ secrets.SIGNAL_PLUS_ENV }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SIGNAL_PLUS_ENV,IMAGE_TAG
          script: |
            set -euo pipefail

            if [ -z "$SIGNAL_PLUS_ENV" ]; then
              echo "::error::SIGNAL_PLUS_ENV secret is empty/unset — cannot write /opt/signal-plus/.env. Create it first (see this PR's body for the exact format)."
              exit 1
            fi

            mkdir -p /opt/signal-plus
            (
              umask 077
              printf '%s\n' "$SIGNAL_PLUS_ENV" > /opt/signal-plus/.env
              # IMAGE_TAG is consumed TWICE from the same file: by
              # docker-compose.yml's own `${IMAGE_TAG:-latest}` substitution
              # (Compose auto-loads .env from the project directory) AND,
              # harmlessly, injected into the container's runtime env via
              # this same file's `env_file:` — signal_plus.config.Config
              # only ever reads its own named vars, so the extra unused var
              # is ignored there. Same pattern as CRM's own
              # .env.production, which appends IMAGE_TAG the same way.
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> /opt/signal-plus/.env
            )
            chmod 600 /opt/signal-plus/.env
            echo "==> /opt/signal-plus/.env written (mode 600)"

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'services/signal-plus/docker-compose.yml'
          target: '/opt/signal-plus'
          # scp-action otherwise preserves the source path's directory tree
          # under target (confirmed against its documented behavior: CRM's
          # own copy-compose job relies on the SAME preservation, copying
          # root-level files like docker-compose.prod.yml with no leading
          # directory, so nothing there needed stripping). This source has
          # TWO leading path elements (services/, signal-plus/) before the
          # filename — stripping both lands the file directly at
          # /opt/signal-plus/docker-compose.yml instead of nested three
          # directories deeper.
          strip_components: 2

      - name: Pull and start signal-plus (docker compose -p signal-plus up -d)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail

            mkdir -p /opt/signal-plus
            cd /opt/signal-plus

            echo "==> Logging in to GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            # SR-L-2 (security review 5105061153): logout on ANY exit (trap,
            # not a final happy-path-only step) so a mid-script failure
            # (pull/up -d) does not leave the credential still stored on the
            # VPS just because the script aborted (set -e) before reaching a
            # plain end-of-script logout line.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            echo "==> Pulling signal-plus image"
            # infra/signal-plus-pull-fix (run 33946345307): `docker compose
            # pull` here once failed on the VPS's containerd overlayfs
            # snapshotter extracting the signal-cli-pinned layer ("failed to
            # Lchown ... no such file or directory"). Forensics on the ACTUAL
            # pushed bytes found them well-formed (see the Dockerfile's own
            # comment + this PR's body for the full trail), and the same
            # image extracted cleanly on every other containerd
            # overlayfs-snapshotter setup this was tried against -- no
            # deterministic, reproducible cause was found. With that as the
            # honest state of the evidence, this retries a handful of times
            # with backoff before giving up for real, the same shape as the
            # pnpm-audit gate's "slow, not dead" registry fix (PR #654): ride
            # out a one-off extraction hiccup, but a genuinely broken pull
            # still fails loud, just not on the first attempt.
            PULL_ATTEMPTS=4
            attempt=1
            until docker compose -p signal-plus pull; do
              if [ "$attempt" -ge "$PULL_ATTEMPTS" ]; then
                echo "::error::docker compose -p signal-plus pull failed after $PULL_ATTEMPTS attempts"
                exit 1
              fi
              delay=$((10 * attempt))
              echo "::warning::docker compose -p signal-plus pull failed (attempt $attempt/$PULL_ATTEMPTS) -- retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
            done

            echo "==> Starting signal-plus (does NOT touch /opt/crm — separate compose project)"
            docker compose -p signal-plus up -d

            echo "==> docker compose -p signal-plus ps"
            docker compose -p signal-plus ps

      # ── Alert on failure — steps in THIS job, not a second job/workflow ──
      # deploy-alert.yml needs its own separate workflow file only because
      # `workflow_run` can react to nothing but a workflow it names — not
      # applicable here, this job already owns every step it would need to
      # know about. `if: always()` + `${{ job.status }}` (documented GitHub
      # Actions behavior: reflects the status of every step that has run so
      # far in this job) gives the same alert with zero extra jobs — see the
      # devops agent's golden rule against adding jobs where a step will do.
      #
      # Text is honest about what actually happened (task:
      # "текст — правдивый: не «прод задеплоен»", citing PR #644's
      # resume-perf-guard fix for the same "alert text must not overclaim"
      # principle): KIND=signal-plus's own body in post-merge-alert.sh
      # (added by this PR) describes a build/push/SSH-deploy failure for
      # THIS workflow specifically, not a claim about the CRM stack or about
      # signal-plus having actually sent a "+" — this workflow has no way to
      # know that; it only knows whether ITS OWN steps succeeded.
      #
      # Read/resolve/alert split into three steps, each copied verbatim from
      # ci.yml's `post_merge_alert` job (same repo, same script, same
      # channel-resolution probe) rather than reinvented inline — see that
      # job's own comments for why each individual choice (random heredoc
      # delimiter, env: not string-interpolation, PAT-actually-works probe)
      # is made this way.
      - name: Read deployed commit
        if: always()
        id: commit
        run: |
          DELIM="COMMIT_SUBJECT_EOF_$(openssl rand -hex 8)"
          {
            echo "subject<<$DELIM"
            git log -1 --pretty=%s
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve alert channel
        if: always()
        id: channel
        env:
          PAT: ${{ secrets.TELEMETRY_ISSUES_PAT }}
          PUBLIC_REPO: ${{ github.repository }}
        run: ./scripts/devops/resolve-alert-channel.sh

      - name: Open / update / close the alert issue
        if: always()
        env:
          GH_TOKEN: ${{ steps.channel.outputs.use_pat == 'true' && secrets.TELEMETRY_ISSUES_PAT || github.token }}
          ALERT_REPO: ${{ steps.channel.outputs.repo }}
          RESULT: ${{ job.status }}
          FAILED_LEGS: 'build/push/SSH-deploy'
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ steps.commit.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: signal-plus
        run: ./scripts/devops/post-merge-alert.sh

      # No separate "fail the job when red" step here, unlike ci.yml's
      # post_merge_alert / deploy-alert.yml: those exist because THAT job's
      # own steps never fail by themselves (aggregation/alerting only, on
      # results computed from a SEPARATE job/run) — without an explicit
      # `exit 1` they would show green in the Actions UI even when the thing
      # they are reporting on is red. Here the deploy steps that can
      # actually fail (build/push/write-env/copy-compose/pull+up) live in
      # THIS SAME job, so a failure among them already makes this job's own
      # conclusion `failure` — the alert steps above run anyway (`if:
      # always()`) but do not and cannot un-fail it.
