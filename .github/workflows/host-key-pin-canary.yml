name: Host-key pin canary

# NEGATIVE-CONTROL CANARY for host-key pinning. Manual only: never on push, never on a schedule.
#
# Why: a green deploy cannot tell "the fingerprint matched" from "the action silently ignored an
# input it does not declare". For each action version this runs a PAIR against the real VPS:
#   negative control - deliberately WRONG fingerprint; expected to FAIL (host-key mismatch)
#   positive control - the correct fingerprint, same target; expected to SUCCEED
# The positive half is what separates "the pin enforces" from "this step is broken for an
# unrelated reason". The final assert job-step turns the outcomes into one readable result:
# green only if every control behaved as expected.
#
# Writes to the VPS: only files under a run-unique /tmp path, removed in the same run.
# Never touches /opt/crm, the stack, the database or any file the deploy uses.
#
# The wrong literal below is a TEST VALUE (the real fingerprint with its case inverted). It is
# tolerated only here, in an exact count, by scripts/devops/check-ssh-action-host-key-pinned.py
# (CANARY_FILES). Do not copy it anywhere else.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-key-pin-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Host-key pin canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      # Run-unique throwaway directory on the VPS. Validated against this prefix before removal.
      CANARY_PREFIX: /tmp/hostkey-canary-
      CANARY_DIR: /tmp/hostkey-canary-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Generate payload files on the runner
        run: |
          set -euo pipefail
          mkdir -p canary-payload
          for n in scp-neg scp-pos; do
            echo "host-key canary $n run ${GITHUB_RUN_ID}" > "canary-payload/${n}.txt"
          done
          ls -l canary-payload

      # ── Pair 1: ssh-action v1.2.0 (known-good reference row) ─────────────────────────
      - name: ssh-action v1.2.0 NEGATIVE (wrong fingerprint, expect FAIL)
        id: ssh120_neg
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # TEST VALUE: the real fingerprint with its case inverted. Must be rejected.
          fingerprint: SHA256:AuHfbJTFqiPWuLmua9z5OkwxN8CieDEDRQT2EhnNgZO
          envs: CANARY_DIR
          script: |
            set -eu
            mkdir -p "$CANARY_DIR"
            touch "$CANARY_DIR/ssh120-neg"

      - name: ssh-action v1.2.0 POSITIVE (correct fingerprint, expect PASS)
        id: ssh120_pos
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:aUhFBjtfQIpwUlMUA9Z5oKWXn8cIEdedrqt2eHNnGzo
          envs: CANARY_DIR
          script: |
            set -eu
            mkdir -p "$CANARY_DIR"
            touch "$CANARY_DIR/ssh120-pos"

      # ── Pair 2: ssh-action v1.2.3 (unproven at runtime) ──────────────────────────────
      - name: ssh-action v1.2.3 NEGATIVE (wrong fingerprint, expect FAIL)
        id: ssh123_neg
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # TEST VALUE: the real fingerprint with its case inverted. Must be rejected.
          fingerprint: SHA256:AuHfbJTFqiPWuLmua9z5OkwxN8CieDEDRQT2EhnNgZO
          envs: CANARY_DIR
          script: |
            set -eu
            mkdir -p "$CANARY_DIR"
            touch "$CANARY_DIR/ssh123-neg"

      - name: ssh-action v1.2.3 POSITIVE (correct fingerprint, expect PASS)
        id: ssh123_pos
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:aUhFBjtfQIpwUlMUA9Z5oKWXn8cIEdedrqt2eHNnGzo
          envs: CANARY_DIR
          script: |
            set -eu
            mkdir -p "$CANARY_DIR"
            touch "$CANARY_DIR/ssh123-pos"

      # ── Pair 3: scp-action v0.1.7 (carries 48 of the 55 call sites) ──────────────────
      # scp-action keeps the source directory tree under target, so the files land at
      # $CANARY_DIR/canary-payload/scp-{neg,pos}.txt. Each control copies its own file.
      - name: scp-action v0.1.7 NEGATIVE (wrong fingerprint, expect FAIL)
        id: scp_neg
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # TEST VALUE: the real fingerprint with its case inverted. Must be rejected.
          fingerprint: SHA256:AuHfbJTFqiPWuLmua9z5OkwxN8CieDEDRQT2EhnNgZO
          source: canary-payload/scp-neg.txt
          target: ${{ env.CANARY_DIR }}

      - name: scp-action v0.1.7 POSITIVE (correct fingerprint, expect PASS)
        id: scp_pos
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:aUhFBjtfQIpwUlMUA9Z5oKWXn8cIEdedrqt2eHNnGzo
          source: canary-payload/scp-pos.txt
          target: ${{ env.CANARY_DIR }}

      # ── Verification and cleanup: always run, on the proven version with the real pin ──
      # Verify: every positive file landed AND every negative file is absent. The second half
      # is what shows no data crossed on a mismatch (a failed step alone does not).
      - name: Verify what landed on the host (positive present, negative absent)
        id: verify
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:aUhFBjtfQIpwUlMUA9Z5oKWXn8cIEdedrqt2eHNnGzo
          envs: CANARY_DIR,CANARY_PREFIX
          script: |
            set -u
            case "$CANARY_DIR" in
              "$CANARY_PREFIX"*) ;;
              *) echo "REFUSING: CANARY_DIR '$CANARY_DIR' is outside $CANARY_PREFIX"; exit 1 ;;
            esac
            bad=0
            for f in ssh120-pos ssh123-pos canary-payload/scp-pos.txt; do
              if [ -f "$CANARY_DIR/$f" ]; then echo "OK   present: $f"; else echo "BAD  MISSING (positive control wrote nothing): $f"; bad=1; fi
            done
            for f in ssh120-neg ssh123-neg canary-payload/scp-neg.txt; do
              if [ -e "$CANARY_DIR/$f" ]; then echo "BAD  PRESENT (data crossed on a host-key mismatch): $f"; bad=1; else echo "OK   absent: $f"; fi
            done
            exit "$bad"

      # Cleanup: remove ONLY the run-unique directory, after re-validating its exact shape.
      - name: Remove the throwaway directory from the host
        id: cleanup
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:aUhFBjtfQIpwUlMUA9Z5oKWXn8cIEdedrqt2eHNnGzo
          envs: CANARY_DIR
          script: |
            set -eu
            if ! printf '%s' "$CANARY_DIR" | grep -Eq '^/tmp/hostkey-canary-[0-9]+-[0-9]+$'; then
              echo "REFUSING to remove '$CANARY_DIR': not a canary directory"; exit 1
            fi
            rm -rf -- "$CANARY_DIR"
            test ! -e "$CANARY_DIR" && echo "removed $CANARY_DIR"
