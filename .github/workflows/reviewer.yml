name: Reviewer

on:
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# Only run on non-draft PRs with ai-review-ready label
# This controls AI cost — we don't run on every push

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff context

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reviewer reads its system prompt and performs code review
          prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            ОБЯЗАТЕЛЬНО прочитай перед началом:
            1. Файл `docs/agents/reviewer.md` — твой полный системный промпт и чек-лист
            2. Файл `.clauderules` — правила кода (критичный документ)
            3. Файл `CLAUDE.md` — раздел "Ключевые технические заметки" и "Архитектурные решения"

            Затем проверь изменения в этом PR согласно чек-листу из `docs/agents/reviewer.md`.

            Создай GitHub PR Review (APPROVE или REQUEST_CHANGES) с детальными комментариями.
            Используй GitHub MCP для создания review: `mcp__github__create_pull_request_review`.

            PR номер: ${{ github.event.pull_request.number || inputs.pr_number }}
            Репозиторий: ${{ github.repository }}
          allowed_tools: |
            Read
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
