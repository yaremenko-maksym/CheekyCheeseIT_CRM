name: DevOps

# Triggered by PM agent with a task file path.
# Each task_file gets its own concurrency group — parallel DevOps instances possible.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Path to task file (e.g. docs/specs/tasks/task-infra-redis.md)'
        required: true
        type: string
      task_hint:
        description: 'Short hint for branch name (e.g. "infra-redis")'
        required: false
        type: string

concurrency:
  group: devops-${{ inputs.task_file }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement Infra Task
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.email "devops-agent@github-actions"
          git config user.name "DevOps Agent"

      - name: Claude DevOps Agent
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — DevOps-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/devops.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-devops.md — архитектура пайплайна, concurrency, secrets.
            Прочитай ${{ inputs.task_file }} — это твоя текущая задача.

            Реализуй задачу согласно инструкциям в docs/agents/devops.md:
            1. Создай ветку infra/<slug-из-заголовка-task-файла>
            2. Внеси все изменения в инфраструктурные файлы
            3. Закоммить конкретными файлами (не git add .)
            4. Создай PR через GitHub MCP и добавь label ai-review-ready

            Repo: ${{ github.repository }}
            task_hint: ${{ inputs.task_hint }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
            mcp__github__create_pull_request
            mcp__github__create_branch
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__add_issue_comment
