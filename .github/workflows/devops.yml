name: DevOps

# Triggered by PM agent with a task file path.
# Each task_file gets its own concurrency group — parallel DevOps instances possible.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Path to task file (e.g. docs/specs/tasks/task-infra-redis.md)'
        required: true
        type: string
      task_hint:
        description: 'Short hint for branch name (e.g. "infra-redis")'
        required: false
        type: string
      target_branch:
        description: 'Existing branch to work on (optional). If empty — create new infra/ branch from main.'
        required: false
        type: string
        default: ''

concurrency:
  group: devops-${{ inputs.task_file }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement Infra Task
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify task file exists
        if: inputs.task_file != ''
        env:
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          if [ ! -f "$TASK_FILE" ]; then
            echo "::error::Task file '$TASK_FILE' not found in repo HEAD"
            echo "::error::PM must commit and push the task file before running the workflow"
            exit 1
          fi
          echo "Task file verified: $TASK_FILE"

      - name: Configure git
        run: |
          git config user.email "devops-agent@github-actions"
          git config user.name "DevOps Agent"

      - name: Setup branch
        run: |
          if [ -n "$TARGET_BRANCH" ]; then
            git fetch origin
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
          else
            BRANCH=$(grep -m1 "^## Ветка:" "$TASK_FILE" 2>/dev/null | sed 's/## Ветка:[[:space:]]*//' | tr -d "[:space:]")
            if [ -z "$BRANCH" ]; then
              BRANCH="infra/${TASK_HINT}"
            fi
            git checkout main && git pull origin main
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git checkout -b "$BRANCH" --track "origin/$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
          fi
          echo "Working on branch: $(git branch --show-current)"
        env:
          TASK_FILE: ${{ inputs.task_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TASK_HINT: ${{ inputs.task_hint }}

      - name: Claude DevOps Agent
        uses: anthropics/claude-code-action@beta
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — DevOps-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/devops.md — полный системный промпт.
            Прочитай docs/agents/CLAUDE-devops.md — архитектура пайплайна, concurrency, secrets.
            Прочитай task-файл (путь передан как task_hint контекст) — запомни "Acceptance criteria".

            ## ШАГ 1 — Разведка (ОБЯЗАТЕЛЬНО, до любого Edit/Write)

            Найди существующие паттерны в инфраструктурных файлах:
            - mcp__ast-grep__find_code: найди похожие шаги, job-конфиги в .github/workflows/
            - mcp__ast-grep__find_code_by_rule: найди все места использования изменяемых секретов/переменных

            Для GitHub Actions синтаксиса — получи актуальную документацию:
            - mcp__context7__resolve-library-id → mcp__context7__query-docs
            Не угадывай синтаксис expressions/contexts по памяти.

            ## ШАГ 2 — Реализация

            Ветка уже настроена workflow-ом. Проверь: git branch --show-current

            После каждого изменения YAML — валидируй через Bash:
            python3 -c "import yaml; yaml.safe_load(open('<file>'))"

            ## ШАГ 3 — Коммит и PR

            git add <конкретные файлы> (НЕ git add .)
            Перед mcp__github__create_pull_request — проверь идемпотентность через Bash:
            gh pr list --repo REPO --head BRANCH --json number --jq '.[0].number // empty'
            Если PR существует — добавь label к существующему, не создавай новый.

            В body PR обязательно укажи:
            - Список изменений
            - "Task: docs/specs/tasks/task-SLUG.md" (имя task-файла из задачи)
            - Checklist acceptance criteria из task-файла

            Добавь label ai-review-ready.

            Repo: ${{ github.repository }}
            task_hint: ${{ inputs.task_hint }}
            target_branch: ${{ inputs.target_branch }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
            mcp__github__create_pull_request
            mcp__github__create_branch
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__add_issue_comment
