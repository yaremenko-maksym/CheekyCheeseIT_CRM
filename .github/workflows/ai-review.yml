name: AI Review

# Triggered only when label 'ai-review-ready' is added or PR becomes ready_for_review
# Controls cost: we pay for AI only when the author signals the code is ready.
on:
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: number

concurrency:
  # Separate groups for workflow_dispatch vs pull_request so a branch-sync push
  # cannot cancel an actively-running manual trigger (and vice-versa).
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Code Review (no infrastructure needed)
  # Fast: ~4-6 min. No services, no build.
  # Decides whether QA testing is needed via qa-task.md artifact.
  # ─────────────────────────────────────────────
  reviewer:
    name: Code Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    outputs:
      approved: ${{ steps.check_approved.outputs.approved }}
      review_state: ${{ steps.check_approved.outputs.review_state }}

    steps:
      - name: Get PR head SHA
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            SHA=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefOid --jq '.headRefOid')
            echo "sha=${SHA}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.sha }}
          fetch-depth: 0  # full history for diff context

      - name: Dismiss stale CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"
          # Dismiss any CHANGES_REQUESTED reviews from github-actions[bot] so
          # the reviewer can freely submit APPROVE on the current commit.
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Starting fresh review cycle — previous findings may be resolved" \
              2>/dev/null || true
          done

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: '*'
          mode: agent
          direct_prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/reviewer.md — это твой полный системный промпт и чек-лист.
            Прочитай docs/agents/CLAUDE-reviewer.md — архитектурные решения и ограничения проекта.

            Проверь изменения этого PR по чек-листу из docs/agents/reviewer.md.

            ОБЯЗАТЕЛЬНЫЙ шаг — вызови mcp__github__create_pull_request_review:
            - event: "APPROVE" если нет критичных нарушений
            - event: "REQUEST_CHANGES" если есть хотя бы одно критичное нарушение
            - body: полный текст review со всеми найденными проблемами
            Bash недоступен — только MCP вызов. Без этого вызова review не появится в GitHub.

            После review выполни Шаг 5 из docs/agents/reviewer.md:
            - При APPROVE: создай пустой файл autotest-approved.flag (Write инструмент)

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs

      - name: Check reviewer decision
        id: check_approved
        if: always()
        run: |
          if [ -f autotest-approved.flag ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "review_state=APPROVED" >> $GITHUB_OUTPUT
            echo "Reviewer APPROVED — AutoTest may run"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "review_state=CHANGES_REQUESTED" >> $GITHUB_OUTPUT
            echo "Reviewer REQUEST_CHANGES — AutoTest will not run"
          fi

  # ─────────────────────────────────────────────
  # Job 2: AutoTest (writes E2E tests post-approval)
  # Runs ONLY after Reviewer approves.
  # Fast: ~4-6 min. No services, no build — just Claude + git.
  # E2E regression testing runs in ci.yml (deterministic, not AI).
  # On logical error found: REQUEST_CHANGES → full cycle restarts.
  # ─────────────────────────────────────────────
  autotest:
    name: AutoTest
    runs-on: ubuntu-latest
    needs: [reviewer]
    if: |
      always() &&
      needs.reviewer.outputs.approved == 'true' &&
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    steps:
      - name: Get PR head ref
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            REF=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefName --jq '.headRefName')
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Configure git for AutoTest commits
        run: |
          git config user.email "autotest-agent@github-actions"
          git config user.name "AutoTest Agent"

      - name: Claude AutoTest
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-autotest.md — структура тестов, паттерны.
            Работай в РЕЖИМЕ 1: PR Post-Approval.

            Reviewer (и QA если запускался) уже проверили и одобрили этот PR.
            Твоя задача: написать E2E тесты для нового функционала который был одобрен.
            Если найдена логическая ошибка — оставь REQUEST_CHANGES review (не коммить тесты).

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

  # ─────────────────────────────────────────────
  # Job 3: Merge PR
  # Runs ONLY after Reviewer + AutoTest approve.
  # Squash-merges the PR so test files written by AutoTest are included.
  # ─────────────────────────────────────────────
  merge:
    name: Merge PR
    runs-on: ubuntu-latest
    needs: [reviewer, autotest]
    if: |
      always() &&
      needs.reviewer.outputs.approved == 'true' &&
      needs.autotest.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Ensure CI passed, then merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"

          # Get current PR head SHA and branch
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          BRANCH=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')

          # Check if required CI check already passed for current HEAD
          check_ci() {
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Typecheck · Lint · Unit Tests")] | first | .conclusion // empty' 2>/dev/null
          }

          CI_STATUS=$(check_ci)
          if [ "$CI_STATUS" != "success" ]; then
            echo "CI not passing (status: ${CI_STATUS:-absent}) for HEAD ${HEAD_SHA}. Triggering ci.yml on branch $BRANCH..."
            gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
            sleep 15
            for i in $(seq 1 40); do
              CI_STATUS=$(check_ci)
              echo "Attempt $i/40: CI status=${CI_STATUS:-pending}"
              if [ "$CI_STATUS" = "success" ]; then break; fi
              if [ "$CI_STATUS" = "failure" ] || [ "$CI_STATUS" = "cancelled" ]; then
                echo "CI failed with status: $CI_STATUS"
                exit 1
              fi
              sleep 15
            done
          fi

          if [ "$CI_STATUS" != "success" ]; then
            echo "CI did not complete in time (last status: ${CI_STATUS:-absent})"
            exit 1
          fi

          echo "CI passed. Dismissing stale reviews and merging..."

          # Dismiss any stale CHANGES_REQUESTED reviews so they don't block merge
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Superseded by approved AI review" 2>/dev/null || true
          done

          sleep 5
          gh pr merge "$PR" --squash --repo "$REPO"

  # ─────────────────────────────────────────────
  # Job 5: Trigger Coder on REQUEST_CHANGES
  # Runs ONLY if reviewer or autotest has REQUEST_CHANGES or failure.
  # Auto-creates active-task.md and triggers coder workflow.
  # ─────────────────────────────────────────────
  trigger_coder:
    name: Trigger Coder
    runs-on: ubuntu-latest
    needs: [reviewer, autotest]
    if: |
      always() &&
      (
        needs.reviewer.outputs.approved != 'true' ||
        needs.autotest.result == 'failure'
      )
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Get review body
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REVIEW_BODY=$(gh api repos/${{ github.repository }}/pulls/$PR/reviews \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body // "No review body found"')
          echo "pr=$PR" >> $GITHUB_OUTPUT
          {
            echo "body<<REVIEW_EOF"
            echo "$REVIEW_BODY"
            echo "REVIEW_EOF"
          } >> $GITHUB_OUTPUT

      - name: Write active-task.md
        run: |
          PR="${{ steps.review.outputs.pr }}"
          BRANCH=$(gh pr view "$PR" --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          cat > docs/specs/active-task.md << TASK_EOF
          # Fix PR #${PR} — Reviewer REQUEST_CHANGES

          ## Гілка для виправлення
          **НЕ створювати нову гілку.** Checkout і push в існуючу: \`${BRANCH}\`
          PR #${PR} автоматично підхопить новий коміт.

          ## Findings від Reviewer

          ${{ steps.review.outputs.body }}

          ## Алгоритм
          1. git fetch origin ${BRANCH} && git checkout ${BRANCH}
          2. Виправити всі знайдені проблеми
          3. pnpm typecheck && pnpm lint
          4. Закоммітити конкретними файлами (не git add .)
          5. git push origin ${BRANCH}
          6. НЕ створювати новий PR — коміт йде в існуючий PR #${PR}
          TASK_EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger Coder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.review.outputs.pr }}"
          gh workflow run coder.yml \
            --repo ${{ github.repository }} \
            -f task_hint="fix-pr-${PR}"
