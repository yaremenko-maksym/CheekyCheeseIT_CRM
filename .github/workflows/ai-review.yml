name: AI Review

# Triggered only when label 'ai-review-ready' is added or PR becomes ready_for_review
# Controls cost: we pay for AI only when the author signals the code is ready.
on:
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: number

concurrency:
  # Separate groups for workflow_dispatch vs pull_request so a branch-sync push
  # cannot cancel an actively-running manual trigger (and vice-versa).
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Code Review (no infrastructure needed)
  # Fast: ~4-6 min. No services, no build.
  # Decides whether QA testing is needed via qa-task.md artifact.
  # ─────────────────────────────────────────────
  reviewer:
    name: Code Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    outputs:
      needs_qa: ${{ steps.check_qa.outputs.needs_qa }}
      approved: ${{ steps.check_approved.outputs.approved }}
      review_state: ${{ steps.check_approved.outputs.review_state }}

    steps:
      - name: Get PR head SHA
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            SHA=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefOid --jq '.headRefOid')
            echo "sha=${SHA}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.sha }}
          fetch-depth: 0  # full history for diff context

      - name: Dismiss stale CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"
          # Dismiss any CHANGES_REQUESTED reviews from github-actions[bot] so
          # the reviewer can freely submit APPROVE on the current commit.
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Starting fresh review cycle — previous findings may be resolved" \
              2>/dev/null || true
          done

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: '*'
          mode: agent
          direct_prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/reviewer.md — это твой полный системный промпт и чек-лист.
            Прочитай docs/agents/CLAUDE-reviewer.md — архитектурные решения и ограничения проекта.

            Проверь изменения этого PR по чек-листу из docs/agents/reviewer.md.

            ОБЯЗАТЕЛЬНЫЙ шаг — вызови mcp__github__create_pull_request_review:
            - event: "APPROVE" если нет критичных нарушений
            - event: "REQUEST_CHANGES" если есть хотя бы одно критичное нарушение
            - body: полный текст review со всеми найденными проблемами
            Bash недоступен — только MCP вызов. Без этого вызова review не появится в GitHub.

            После review выполни Шаг 5 из docs/agents/reviewer.md:
            - При APPROVE: создай пустой файл autotest-approved.flag (Write инструмент)
            - Реши нужно ли QA-тестирование и если да — создай файл qa-task.md

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs

      - name: Check if QA needed
        id: check_qa
        if: always()
        run: |
          if [ -f qa-task.md ]; then
            echo "needs_qa=true" >> $GITHUB_OUTPUT
            echo "QA task found — QA Manual Test will run"
            cat qa-task.md
          else
            echo "needs_qa=false" >> $GITHUB_OUTPUT
            echo "No QA task — skipping QA Manual Test"
          fi

      - name: Upload QA task artifact
        if: steps.check_qa.outputs.needs_qa == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-task-${{ github.event.pull_request.number || inputs.pr_number }}
          path: qa-task.md
          retention-days: 1

      - name: Check reviewer decision
        id: check_approved
        if: always()
        run: |
          if [ -f autotest-approved.flag ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "review_state=APPROVED" >> $GITHUB_OUTPUT
            echo "Reviewer APPROVED — AutoTest may run"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "review_state=CHANGES_REQUESTED" >> $GITHUB_OUTPUT
            echo "Reviewer REQUEST_CHANGES — AutoTest will not run"
          fi

  # ─────────────────────────────────────────────
  # Job 2: QA Manual Test (full infrastructure)
  # Runs ONLY if reviewer created qa-task.md.
  # ~12-18 min (dominated by app startup + AI).
  # ─────────────────────────────────────────────
  qa:
    name: QA Manual Test
    runs-on: ubuntu-latest
    needs: reviewer
    outputs:
      approved: ${{ steps.check_qa_approved.outputs.approved }}
    if: |
      always() &&
      needs.reviewer.outputs.needs_qa == 'true' &&
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @crm/api db:push

      - run: pnpm --filter @crm/api db:seed

      - name: Start API
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        run: nohup pnpm --filter @crm/web start > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - name: Download QA task from reviewer
        uses: actions/download-artifact@v4
        with:
          name: qa-task-${{ github.event.pull_request.number || inputs.pr_number }}

      - name: Claude QA Manual Test
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — QA Manual Tester для CRM Cheeky Cheese IT.

            Прочитай docs/agents/qa.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-qa.md — seed пользователи, порты, RBAC матрица.
            Прочитай qa-task.md — это задача от Reviewer агента с конкретными флоу для тестирования.

            Приложение запущено:
            - Web: http://localhost:3000
            - API: http://localhost:3001/api
            - БД: PostgreSQL + seed данные

            Тестируй ТОЛЬКО то, что указано в qa-task.md.
            Используй Playwright MCP для браузерной автоматизации.
            Создай PR Review (APPROVE или REQUEST_CHANGES) через GitHub MCP.

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__playwright__browser_navigate
            mcp__playwright__browser_click
            mcp__playwright__browser_fill_form
            mcp__playwright__browser_type
            mcp__playwright__browser_snapshot
            mcp__playwright__browser_take_screenshot
            mcp__playwright__browser_wait_for
            mcp__playwright__browser_evaluate
            mcp__playwright__browser_press_key
            mcp__playwright__browser_select_option
            mcp__playwright__browser_network_requests
            mcp__postgres__query
            mcp__github__get_pull_request
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

      - name: Check QA decision
        id: check_qa_approved
        if: always()
        run: |
          if [ -f qa-autotest-approved.flag ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "QA APPROVED — AutoTest may run"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "QA REQUEST_CHANGES — AutoTest will not run"
          fi

      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true

  # ─────────────────────────────────────────────
  # Job 3: AutoTest (writes E2E tests post-approval)
  # Runs ONLY after Reviewer (+ QA if triggered) both approve.
  # Fast: ~4-6 min. No services, no build — just Claude + git.
  # On logical error found: REQUEST_CHANGES → full cycle restarts.
  # ─────────────────────────────────────────────
  autotest:
    name: AutoTest
    runs-on: ubuntu-latest
    needs: [reviewer, qa]
    if: |
      always() &&
      needs.reviewer.outputs.approved == 'true' &&
      (needs.qa.result == 'skipped' || needs.qa.outputs.approved == 'true') &&
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    steps:
      - name: Get PR head ref
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            REF=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefName --jq '.headRefName')
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Configure git for AutoTest commits
        run: |
          git config user.email "autotest-agent@github-actions"
          git config user.name "AutoTest Agent"

      - name: Claude AutoTest
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-autotest.md — структура тестов, паттерны.
            Работай в РЕЖИМЕ 1: PR Post-Approval.

            Reviewer (и QA если запускался) уже проверили и одобрили этот PR.
            Твоя задача: написать E2E тесты для нового функционала который был одобрен.
            Если найдена логическая ошибка — оставь REQUEST_CHANGES review (не коммить тесты).

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

  # ─────────────────────────────────────────────
  # Job 4: Merge PR
  # Runs ONLY after Reviewer (+ QA if triggered) + AutoTest all approve.
  # Squash-merges the PR so test files written by AutoTest are included.
  # ─────────────────────────────────────────────
  merge:
    name: Merge PR
    runs-on: ubuntu-latest
    needs: [reviewer, qa, autotest]
    if: |
      always() &&
      needs.reviewer.outputs.approved == 'true' &&
      (needs.qa.result == 'skipped' || needs.qa.outputs.approved == 'true') &&
      needs.autotest.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Update branch and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          # Dismiss any stale CHANGES_REQUESTED reviews so they don't block merge
          REPO="${{ github.repository }}"
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Superseded by approved AI review" 2>/dev/null || true
          done
          # Allow GitHub to process updates before merging
          sleep 10
          gh pr merge "$PR" --squash --repo ${{ github.repository }}

  # ─────────────────────────────────────────────
  # Job 5: Trigger Coder on REQUEST_CHANGES
  # Runs ONLY if reviewer or autotest has REQUEST_CHANGES or failure.
  # Auto-creates active-task.md and triggers coder workflow.
  # ─────────────────────────────────────────────
  trigger_coder:
    name: Trigger Coder
    runs-on: ubuntu-latest
    needs: [reviewer, autotest]
    if: |
      always() &&
      (
        needs.reviewer.outputs.approved != 'true' ||
        needs.autotest.result == 'failure'
      )
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Get review body
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REVIEW_BODY=$(gh api repos/${{ github.repository }}/pulls/$PR/reviews \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body // "No review body found"')
          echo "pr=$PR" >> $GITHUB_OUTPUT
          {
            echo "body<<REVIEW_EOF"
            echo "$REVIEW_BODY"
            echo "REVIEW_EOF"
          } >> $GITHUB_OUTPUT

      - name: Write active-task.md
        run: |
          PR="${{ steps.review.outputs.pr }}"
          BRANCH=$(gh pr view "$PR" --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          cat > docs/specs/active-task.md << TASK_EOF
          # Fix PR #${PR} — Reviewer REQUEST_CHANGES

          ## Гілка для виправлення
          **НЕ створювати нову гілку.** Checkout і push в існуючу: \`${BRANCH}\`
          PR #${PR} автоматично підхопить новий коміт.

          ## Findings від Reviewer

          ${{ steps.review.outputs.body }}

          ## Алгоритм
          1. git fetch origin ${BRANCH} && git checkout ${BRANCH}
          2. Виправити всі знайдені проблеми
          3. pnpm typecheck && pnpm lint
          4. Закоммітити конкретними файлами (не git add .)
          5. git push origin ${BRANCH}
          6. НЕ створювати новий PR — коміт йде в існуючий PR #${PR}
          TASK_EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Trigger Coder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.review.outputs.pr }}"
          gh workflow run coder.yml \
            --repo ${{ github.repository }} \
            -f task_hint="fix-pr-${PR}"
