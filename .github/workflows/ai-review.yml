name: AI Review

# Triggered when PR is marked ready_for_review or via manual dispatch.
on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (e.g. 8)'
        required: true
        type: string

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: AutoTest — writes E2E tests FIRST
  # Runs before Code Review so reviewer can check both code + tests.
  # If logical error found → fails → triggers Coder + BA escalation.
  # ─────────────────────────────────────────────
  autotest:
    name: AutoTest
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Get PR head ref
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            REF=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefName --jq '.headRefName')
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Configure git for AutoTest commits
        run: |
          git config user.email "autotest-agent@github-actions"
          git config user.name "AutoTest Agent"

      - name: Claude AutoTest
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — AutoTest-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/autotest.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-autotest.md — структура тестов, паттерны.
            Работай в РЕЖИМЕ 1: PR Post-Approval.

            Ты запускаешься ДО Code Review. Reviewer проверит и твои тесты тоже.

            ЕСЛИ тесты написаны успешно: закоммить и запушь их в ветку PR.

            ЕСЛИ найдена логическая ошибка в коде:
            1. Оставь REQUEST_CHANGES review через mcp__github__create_pull_request_review
            2. Создай пустой файл autotest-logic-error.flag (Write инструмент)
            НЕ коммить тесты при логической ошибке.

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

      - name: Check AutoTest result
        id: check_result
        if: always()
        run: |
          if [ -f autotest-logic-error.flag ]; then
            echo "AutoTest found logical error — signaling failure"
            exit 1
          fi
          echo "AutoTest completed successfully"

  # ─────────────────────────────────────────────
  # Job 2: Code Review — reviews code + AutoTest's tests
  # Runs ONLY after AutoTest succeeds (no logic errors).
  # 1 APPROVE from reviewer is required for merge.
  # ─────────────────────────────────────────────
  reviewer:
    name: Code Review
    runs-on: ubuntu-latest
    needs: [autotest]
    if: |
      always() &&
      needs.autotest.result == 'success' &&
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    outputs:
      approved: ${{ steps.check_approved.outputs.approved }}
      review_state: ${{ steps.check_approved.outputs.review_state }}

    steps:
      - name: Get PR head ref (latest — includes AutoTest commits)
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.pull_request.head.ref }}" ]; then
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            REF=$(gh pr view "${{ inputs.pr_number }}" \
              --repo ${{ github.repository }} \
              --json headRefName --jq '.headRefName')
            echo "ref=${REF}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - name: Check E2E health on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          BROKEN=$(gh issue list --repo "$REPO" \
            --label "e2e-broken" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$BROKEN" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "E2E на main сломаны (issue #${BROKEN}). AI Review не запущен — сначала исправьте E2E."
            exit 1
          fi

      - name: Dismiss stale CHANGES_REQUESTED reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Starting fresh review cycle" \
              2>/dev/null || true
          done

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: '*'
          mode: agent
          direct_prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/reviewer.md — полный системный промпт и чек-лист.
            Прочитай docs/agents/CLAUDE-reviewer.md — архитектурные решения и ограничения.

            Проверь изменения этого PR по чек-листу из docs/agents/reviewer.md.
            ВАЖНО: AutoTest уже написал E2E тесты — проверь также apps/e2e/tests/.
            Если тесты некорректны или не покрывают нужный функционал — укажи это в review.

            ОБЯЗАТЕЛЬНЫЙ шаг — вызови mcp__github__create_pull_request_review:
            - event: "APPROVE" если нет критичных нарушений (включая тесты)
            - event: "REQUEST_CHANGES" если есть хотя бы одно критичное нарушение
            - body: полный текст review со всеми найденными проблемами

            После review, при APPROVE: создай пустой файл autotest-approved.flag (Write инструмент)

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs

      - name: Check reviewer decision
        id: check_approved
        if: always()
        run: |
          if [ -f autotest-approved.flag ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "review_state=APPROVED" >> $GITHUB_OUTPUT
            echo "Reviewer APPROVED — Merge may proceed"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "review_state=CHANGES_REQUESTED" >> $GITHUB_OUTPUT
            echo "Reviewer REQUEST_CHANGES — Coder will be triggered"
          fi

  # ─────────────────────────────────────────────
  # Job 3: Merge PR
  # Requires: 1 APPROVE from Code Reviewer + CI + E2E passing.
  # ─────────────────────────────────────────────
  merge:
    name: Merge PR
    runs-on: ubuntu-latest
    needs: [reviewer]
    if: |
      always() &&
      needs.reviewer.outputs.approved == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Ensure CI + E2E passed, then merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"

          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          BRANCH=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')

          check_run() {
            local NAME="$1"
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"${NAME}\")] | first | .conclusion // empty" 2>/dev/null
          }

          QUALITY=$(check_run "Typecheck · Lint · Unit Tests")
          E2E=$(check_run "E2E Tests")

          if [ "$QUALITY" != "success" ] || [ "$E2E" != "success" ]; then
            echo "Triggering ci.yml on $BRANCH (quality=${QUALITY:-absent} e2e=${E2E:-absent})..."
            gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
            sleep 15
            for i in $(seq 1 60); do
              QUALITY=$(check_run "Typecheck · Lint · Unit Tests")
              E2E=$(check_run "E2E Tests")
              echo "Attempt $i/60: quality=${QUALITY:-pending} e2e=${E2E:-pending}"
              if [ "$QUALITY" = "success" ] && [ "$E2E" = "success" ]; then break; fi
              if [ "$QUALITY" = "failure" ] || [ "$QUALITY" = "cancelled" ]; then
                echo "Quality check failed: $QUALITY"; exit 1
              fi
              if [ "$E2E" = "failure" ] || [ "$E2E" = "cancelled" ]; then
                echo "E2E check failed: $E2E"; exit 1
              fi
              sleep 15
            done
          fi

          if [ "$QUALITY" != "success" ] || [ "$E2E" != "success" ]; then
            echo "Checks did not complete in time"
            exit 1
          fi

          echo "All checks passed. Dismissing stale reviews and merging..."
          gh api "repos/${REPO}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | .[].id' | \
          while read -r REVIEW_ID; do
            gh api "repos/${REPO}/pulls/${PR}/reviews/${REVIEW_ID}/dismissals" \
              --method PUT \
              --field message="Superseded by approved AI review" 2>/dev/null || true
          done

          sleep 5
          gh pr merge "$PR" --squash --repo "$REPO"

  # ─────────────────────────────────────────────
  # Job 4: BA Escalation — AutoTest found logical error
  # Creates GitHub issue for BA + user to decide next steps.
  # ─────────────────────────────────────────────
  ba_escalation:
    name: BA Escalation
    runs-on: ubuntu-latest
    needs: [autotest]
    if: |
      always() &&
      needs.autotest.result == 'failure'
    permissions:
      issues: write

    steps:
      - name: Create BA escalation issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          REPO="${{ github.repository }}"
          PR_URL="https://github.com/${REPO}/pull/${PR}"
          gh label create "needs-ba-action" --repo "$REPO" --color "e4e669" 2>/dev/null || true
          gh label create "escalation" --repo "$REPO" --color "d93f0b" 2>/dev/null || true
          gh issue create \
            --repo "$REPO" \
            --title "Логическая ошибка в PR #${PR} — требуется решение BA" \
            --label "escalation,needs-ba-action" \
            --body "AutoTest нашёл логическую ошибку в PR #${PR}. Coder получил задачу на исправление, но решение требует участия BA. PR: ${PR_URL}. BA читает review в PR, обсуждает с пользователем, обновляет docs/business/ при необходимости. После решения перезапустить: gh workflow run ai-review.yml -f pr_number=${PR}"

  # ─────────────────────────────────────────────
  # Job 5: Trigger Coder on REQUEST_CHANGES
  # Runs if AutoTest found logic error OR Reviewer gave CHANGES_REQUESTED.
  # Verifies a real CHANGES_REQUESTED review exists before triggering.
  # ─────────────────────────────────────────────
  trigger_coder:
    name: Trigger Coder
    runs-on: ubuntu-latest
    needs: [autotest, reviewer]
    if: |
      always() &&
      (
        needs.autotest.result == 'failure' ||
        needs.reviewer.outputs.approved != 'true'
      )
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify actual CHANGES_REQUESTED review exists
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          echo "pr=$PR" >> $GITHUB_OUTPUT

          COUNT=$(gh api "repos/${{ github.repository }}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')

          if [ "$COUNT" = "0" ]; then
            echo "No CHANGES_REQUESTED review found — skipping Coder trigger."
            echo "has_review=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          REVIEW_BODY=$(gh api "repos/${{ github.repository }}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body')
          echo "has_review=true" >> $GITHUB_OUTPUT
          {
            echo "body<<REVIEW_EOF"
            echo "$REVIEW_BODY"
            echo "REVIEW_EOF"
          } >> $GITHUB_OUTPUT

      - name: Write active-task.md
        if: steps.review.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.review.outputs.pr }}"
          BRANCH=$(gh pr view "$PR" --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          cat > docs/specs/active-task.md << TASK_EOF
          # Fix PR #${PR} — Review REQUEST_CHANGES

          ## Гілка для виправлення
          **НЕ створювати нову гілку.** Checkout і push в існуючу: \`${BRANCH}\`
          PR #${PR} автоматично підхопить новий коміт.

          ## Findings від Review

          ${{ steps.review.outputs.body }}

          ## Алгоритм
          1. git fetch origin ${BRANCH} && git checkout ${BRANCH}
          2. Виправити всі знайдені проблеми (код або E2E тести)
          3. pnpm typecheck && pnpm lint
          4. Закоммітити конкретними файлами (не git add .)
          5. git push origin ${BRANCH}
          6. НЕ створювати новий PR — коміт йде в існуючий PR #${PR}
          TASK_EOF

      - name: Trigger Coder
        if: steps.review.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.review.outputs.pr }}"
          gh workflow run coder.yml \
            --repo ${{ github.repository }} \
            -f task_hint="fix-pr-${PR}"
