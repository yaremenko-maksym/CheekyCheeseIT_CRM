name: AI Review

# Triggered only when label 'ai-review-ready' is added or PR becomes ready_for_review
# Controls cost: we pay for AI only when the author signals the code is ready.
on:
  pull_request:
    types: [ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: number

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Code Review (no infrastructure needed)
  # Fast: ~4-6 min. No services, no build.
  # ─────────────────────────────────────────────
  reviewer:
    name: Code Review
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff context

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            Ты — Reviewer-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/reviewer.md — это твой полный системный промпт и чек-лист.
            Также прочитай .clauderules и CLAUDE.md (раздел "Ключевые технические заметки").

            Проверь изменения этого PR по чек-листу из docs/agents/reviewer.md.
            Создай GitHub PR Review (APPROVE или REQUEST_CHANGES) через GitHub MCP.

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment
            mcp__context7__resolve-library-id
            mcp__context7__query-docs

  # ─────────────────────────────────────────────
  # Job 2: QA Manual Test (full infrastructure)
  # Runs after reviewer. Separate job so it can
  # run in parallel with reviewer on re-runs.
  # ~12-18 min (dominated by app startup + AI).
  # ─────────────────────────────────────────────
  qa:
    name: QA Manual Test
    runs-on: ubuntu-latest
    needs: reviewer
    if: |
      always() &&
      github.event.pull_request.draft == false &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'ai-review-ready')
      )
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      API_PORT: 3001
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      JWT_SECRET: ci-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @crm/api db:migrate

      - run: pnpm --filter @crm/api db:seed

      - name: Start API
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        run: nohup pnpm --filter @crm/web preview --port 3000 > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - name: Claude QA Manual Test
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            Ты — QA Manual Tester для CRM Cheeky Cheese IT.

            Прочитай docs/agents/qa.md — это твой полный системный промпт.
            Также прочитай docs/business/user-flows.md и docs/specs/active-task.md.

            Приложение запущено:
            - Web: http://localhost:3000
            - API: http://localhost:3001/api
            - БД: PostgreSQL + seed данные

            Протестируй изменения PR согласно промпту в docs/agents/qa.md.
            Используй Playwright MCP для браузерной автоматизации.
            Создай PR Review (APPROVE или REQUEST_CHANGES) через GitHub MCP.

            PR: ${{ github.event.pull_request.number || inputs.pr_number }}
            Repo: ${{ github.repository }}
          allowed_tools: |
            Read
            Write
            mcp__playwright__browser_navigate
            mcp__playwright__browser_click
            mcp__playwright__browser_fill_form
            mcp__playwright__browser_type
            mcp__playwright__browser_snapshot
            mcp__playwright__browser_take_screenshot
            mcp__playwright__browser_wait_for
            mcp__playwright__browser_evaluate
            mcp__playwright__browser_press_key
            mcp__playwright__browser_select_option
            mcp__playwright__browser_network_requests
            mcp__postgres__query
            mcp__github__get_pull_request
            mcp__github__create_pull_request_review
            mcp__github__add_issue_comment

      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true
