name: API Permission Denied Watch

# Measure 2 of the least-privilege ADR (docs/architecture/2026-10-17-db-least-privilege-roles.md,
# "What step 4 does not reach"), a PREREQUISITE of switching the API to `crm_app`:
# match `permission denied` / SQLSTATE 42501 in the API's logs, STANDING (not only
# during a deploy), and make a hit reach the owner.
#
# Why standing: six of eight cron services use a fully mocked DatabaseService, so a
# misclassified table is found by the first cron fire (daily or monthly, plausibly
# after the 48-hour deploy log watch) as a 42501 inside a handler that swallows its
# errors. Nothing else would ever say so.
#
# HOW IT PAGES. A hit (or a blind scan) FAILS this run, and GitHub's failed-run
# notification is the page: the same mechanism deploy-freshness.yml already relies
# on, no new dependency. It is the only owner-reaching channel this repository has;
# the "alert issue" channel (post-merge-alert.sh) is read by an assistant, which is a
# record, not a page. Limits are in the PR body.
#
# HOW IT READS. One read-only SSH command (`docker compose logs`, filtered), using the
# deploy's existing VPS_* secrets. Nothing on the VPS is changed.
# Logic, exit codes and the output hygiene (this repo and its Actions logs are PUBLIC,
# so no raw log line is ever printed): scripts/devops/check-api-permission-denied.sh
# (tested: scripts/devops/tests/test-check-api-permission-denied.sh).
#
# Cost: one job, one SSH round-trip, ~20 s, every 30 minutes. No extra jobs.
# Window: 40 min against a 30 min period, so a scan skipped or delayed by the shared
# runner pool does not open a gap. The overlap means a hit can be reported by two
# consecutive runs; that is intended (the second is the reminder).
# Known gap: a deploy recreates the api container and its logs go with it. The deploy
# scans its own window (deploy-stack-on-vps.sh); the minutes between the last scan and
# the recreate are not covered.
on:
  schedule:
    # Off the hour and off deploy-freshness (:23), every 30 minutes.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'How far back to read, e.g. 40m or 6h (after an outage, widen it)'
        required: false
        default: '40m'

concurrency:
  group: api-permission-denied-watch-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: API logs hold no permission denied / 42501
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # The pattern has ONE definition (the checker). The remote grep gets it from here.
      # `window` is validated before it reaches a remote shell.
      - name: Resolve pattern and window
        id: cfg
        env:
          WINDOW_INPUT: ${{ github.event.inputs.window }}
        run: |
          set -euo pipefail
          window="${WINDOW_INPUT:-40m}"
          if ! printf '%s' "$window" | grep -Eq '^[0-9]{1,4}[mh]$'; then
            echo "::error::window '$window' is not <number>m or <number>h"
            exit 2
          fi
          # The allowlists are READ from the checked-out source on every scan (no baked
          # copy to drift). The script exits 2 below a plausibility floor, so a manifest
          # whose shape changed turns this run red instead of quietly making every
          # object `unknown`.
          scripts/devops/derive-permission-denied-allowlists.sh > "$RUNNER_TEMP/allowlists.txt"
          {
            echo "window=$window"
            echo "re=$(scripts/devops/check-api-permission-denied.sh --print-pattern)"
            cat "$RUNNER_TEMP/allowlists.txt"
          } >> "$GITHUB_OUTPUT"

      # READ-ONLY. VERSION PIN: capture_stdout needs >= v1.2.1 (see
      # scripts/devops/check-ssh-action-capture-stdout-version.py), same pin as the
      # backup-freshness step in deploy.yml.
      # No `continue-on-error`: if SSH fails the run goes red, which is the point.
      # LOG HYGIENE (this repo and its Actions logs are PUBLIC): the matching AND the
      # sanitising happen HERE, on the VPS. Only validated fields leave production
      # (timestamp, logger, object, sqlstate, counters); no raw log text, not even
      # truncated. Both streams of `docker compose logs` are folded into a variable,
      # so nothing from the container reaches stderr either. Measured by reading
      # appleboy/ssh-action v1.2.3 entrypoint.sh: with capture_stdout the output goes
      # to GITHUB_OUTPUT (tee -a) and is not echoed to the job log; stderr is still
      # streamed. The env: block of the next step IS rendered in the log, which is why
      # the envelope must be fields-only no matter what the action does.
      - name: Read the API logs over SSH (read-only)
        id: logscan
        uses: appleboy/ssh-action@v1.2.3
        env:
          LOGSCAN_RE: ${{ steps.cfg.outputs.re }}
          LOGSCAN_SINCE: ${{ steps.cfg.outputs.window }}
          LOGSCAN_TABLES: ${{ steps.cfg.outputs.tables }}
          LOGSCAN_LOGGERS: ${{ steps.cfg.outputs.loggers }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LOGSCAN_RE,LOGSCAN_SINCE,LOGSCAN_TABLES,LOGSCAN_LOGGERS
          capture_stdout: true
          script: |
            set -u
            cd /opt/crm
            dc="docker compose -f docker-compose.prod.yml -f docker-compose.ghcr.yml --env-file .env.production"
            names=$($dc ps --format '{{.Name}}' api 2>/dev/null)
            n=$(printf '%s\n' "$names" | grep -c . || true)
            cname=$(printf '%s\n' "$names" | head -n 1 | tr -dc 'A-Za-z0-9_./-' | cut -c1-60)
            if ! logs=$($dc logs --no-color --timestamps --since "$LOGSCAN_SINCE" api 2>&1); then
              echo "LOGSCAN_FAILED=compose_logs"
              exit 0
            fi
            echo "LOGSCAN_API_CONTAINERS=$n"
            echo "LOGSCAN_CONTAINER=${cname:-unknown}"
            echo "LOGSCAN_LINES=$(printf '%s\n' "$logs" | grep -c . || true)"
            echo "LOGSCAN_HITS=$(printf '%s\n' "$logs" | grep -aEic -e "$LOGSCAN_RE" || true)"
            printf '%s\n' "$logs" | grep -aEi -e "$LOGSCAN_RE" | tail -n 20 | while IFS= read -r l; do
              ts=$(printf '%s' "$l" | sed -nE 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]{8,20}Z) .*/\1/p')
              # ALLOWLIST, not a pattern: a log line is partly attacker-influenced, so a
              # name is shown only if it is ON a list derived from the repository
              # (LOGSCAN_LOGGERS / LOGSCAN_TABLES, see derive-permission-denied-
              # allowlists.sh). Anything else becomes `unknown`.
              # `unknown` REDUCES PRECISION, IT NEVER SUPPRESSES THE HIT: the line was
              # already counted and is still emitted, so it still pages. An
              # unrecognised object is the case most likely to be interesting.
              lg=$(printf '%s' "$l" | sed -nE 's/.*(ERROR|WARN|FATAL) *\[([A-Za-z0-9_.-]{1,60})\].*/\2/p' | head -n 1)
              case " $LOGSCAN_LOGGERS " in *" $lg "*) [ -n "$lg" ] || lg=unknown ;; *) lg=unknown ;; esac
              lo=$(printf '%s' "$l" | tr 'A-Z' 'a-z')
              pre=""
              kn=$(printf '%s' "$lo" | sed -nE 's/.*permission denied for (table|sequence|schema|function|relation|view|type|database) "?([a-z_][a-z0-9_.]{0,62}).*/\1 \2/p' | head -n 1)
              if [ -z "$kn" ]; then
                pre="owner-only:"
                kn=$(printf '%s' "$lo" | sed -nE 's/.*must be owner of (table|sequence|schema|function|relation|view|type|database) "?([a-z_][a-z0-9_.]{0,62}).*/\1 \2/p' | head -n 1)
              fi
              ob=""
              if [ -n "$kn" ]; then
                kind=${kn%% *}
                nm=${kn#* }
                nm=${nm#public.}
                case " $LOGSCAN_TABLES " in *" $nm "*) ob="$pre$kind:$nm" ;; *) ob="$pre$kind:unknown" ;; esac
              fi
              if printf '%s' "$lo" | grep -Eq '(sqlstate|code)[^0-9a-z]{0,6}42501'; then
                st=42501
              elif [ -n "$ob" ]; then
                st=42501-by-message
              else
                st=unclassified
              fi
              echo "LOGSCAN_HIT ts=${ts:-unknown} logger=${lg:-unknown} object=${ob:-unknown} sqlstate=$st"
            done
            echo "LOGSCAN_END"

      # exit 1 = a hit, exit 2 = the scan could not see: both red, on purpose.
      - name: Scan the envelope (fails on a hit or when blind)
        env:
          LOGSCAN_STDOUT: ${{ steps.logscan.outputs.stdout }}
          # The checker re-verifies every logger and object against the SAME lists.
          LOGSCAN_TABLES: ${{ steps.cfg.outputs.tables }}
          LOGSCAN_LOGGERS: ${{ steps.cfg.outputs.loggers }}
        run: printf '%s\n' "$LOGSCAN_STDOUT" | scripts/devops/check-api-permission-denied.sh
