name: Telemetry Digest

# ── Why this workflow exists ────────────────────────────────────────────────
# task-telemetry-api (spec: docs/superpowers/specs/2026-07-24-crm-telemetry-design.md)
# §4 "Канал автономных фиксов": prod errors reach the assistant WITHOUT the
# owner in the loop, via scheduled GitHub issues in a PRIVATE repo. Weekly UX
# aggregates land as a separate digest issue for the assistant to analyze.
#
# ── Merge order (critical — see scripts/devops/telemetry-digest-runbook.md) ─
# This infra-PR (T3, infra/telemetry-digest) is designed to merge BEFORE
# task-telemetry-api (T1, PR #412, feature/telemetry-api) lands the actual
# `GET /api/telemetry/digest` endpoint. Every guard below exists so this
# workflow runs GREEN from day one — on a schedule — with a ::notice/
# ::warning instead of a red run, until BOTH #412 (endpoint) and
# TELEMETRY_ISSUES_PAT (owner-provided secret, may be absent indefinitely)
# are in place:
#   1. TELEMETRY_ISSUES_PAT unset            → ::warning + skip (exit 0)
#   2. digest endpoint returns 404 (pre-#412) → ::notice + skip (exit 0)
#   3. digest endpoint returns 401/403        → ::error + fail (token drift)
#   4. network error / 5xx                    → ::error + fail
#
# ── Privacy (hard rule — see design spec §"Решения владельца" + §5) ────────
# Error payloads carry stack traces / route / userRole — repro context that
# is PII-adjacent. Issues from this workflow go ONLY to the PRIVATE repo
# below (PRIVATE_REPO). NEVER point this workflow at the public
# CheekyCheeseIT_CRM repo.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Which digest to run manually'
        required: false
        type: choice
        default: errors
        options:
          - errors
          - weekly-ux
          - both
  schedule:
    # Hourly — new/regressed prod errors -> GitHub issues (prod-error label).
    - cron: '0 * * * *'
    # Monday 07:00 UTC — weekly UX-aggregates digest issue (ux-insights label).
    - cron: '0 7 * * 1'

concurrency:
  # Scope by trigger + job selection so a manual dispatch never races the
  # hourly/weekly schedule for the same digest type; cheap to just re-run
  # next hour/week if ever cancelled by an overlapping trigger.
  #
  # `inputs.job || github.event.schedule || 'manual'` (NOT a bare
  # `|| 'schedule'` fallback): `github.event.schedule` is the actual cron
  # string that fired ('0 * * * *' vs '0 7 * * 1'), so hourly and weekly
  # schedule runs land in DIFFERENT groups. A bare 'schedule' fallback would
  # collapse both crons into one group whenever they land in the same
  # minute (e.g. Monday 07:00 UTC — both crons fire) and
  # cancel-in-progress would kill one of the two digests outright.
  group: telemetry-digest-${{ github.event_name }}-${{ inputs.job || github.event.schedule || 'manual' }}
  cancel-in-progress: true

env:
  DIGEST_URL: https://app.cheekycheese.tech/api/telemetry/digest
  # PRIVATE repo — issues carry stack traces / route / userRole (PII-adjacent
  # repro context). NEVER point this at the public CheekyCheeseIT_CRM repo —
  # see design spec §"Решения владельца" (Приватность) and the runbook.
  PRIVATE_REPO: yaremenko-maksym/cheekycheese-telemetry

# Default-deny: this workflow only talks to an external private repo via the
# TELEMETRY_ISSUES_PAT secret (not GITHUB_TOKEN) — no repo-scoped permissions
# needed on THIS repo at all.
permissions:
  contents: read

jobs:
  # ── Hourly: new/regressed prod errors → issues in the private repo ───────
  errors-digest:
    name: Errors digest (hourly)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'errors' || inputs.job == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *')
    steps:
      # ── Guard 1: TELEMETRY_ISSUES_PAT not yet provisioned ────────────────
      # Owner-provided fine-grained PAT (issues:write, PRIVATE_REPO only) —
      # may be absent indefinitely (see task-infra-telemetry-digest). Without
      # it there is nothing this job can do, so it skips cleanly rather than
      # failing the run.
      - name: Guard — TELEMETRY_ISSUES_PAT provisioned?
        id: pat-check
        env:
          PAT: ${{ secrets.TELEMETRY_ISSUES_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::TELEMETRY_ISSUES_PAT secret is not set — skipping this run. Issue creation on the private telemetry repo requires this PAT; the owner has not provisioned it yet. See scripts/devops/telemetry-digest-runbook.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Guard 2/3/4: fetch the digest, classify the response ─────────────
      - name: Fetch error digest
        id: fetch
        if: steps.pat-check.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.TELEMETRY_DIGEST_TOKEN }}
        run: |
          SINCE=$(date -u -d '-24 hours' '+%Y-%m-%dT%H:%M:%SZ')
          echo "==> fetching ${DIGEST_URL}?since=${SINCE}"
          HTTP_CODE=$(curl -sS --max-time 20 -o /tmp/digest.json -w '%{http_code}' \
            -H "X-Telemetry-Token: ${TOKEN}" \
            "${DIGEST_URL}?since=${SINCE}" || echo "000")
          echo "==> http_code=${HTTP_CODE}"

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::GET ${DIGEST_URL} returned 404 — the endpoint is not deployed yet (task-telemetry-api / PR #412 has not merged to main). Skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::GET ${DIGEST_URL} returned ${HTTP_CODE} — TELEMETRY_DIGEST_TOKEN mismatch between this GitHub secret and the deployed prod API. Check both are in sync — see scripts/devops/telemetry-digest-runbook.md."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::GET ${DIGEST_URL} failed — http_code=${HTTP_CODE} (network error or API 5xx). Check prod API health."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # ── Dedup + create/comment issues for each new/regressed error ───────
      # Dedup between hourly runs is two-layer:
      #   1. API-side: the digest endpoint marks returned errors NOTIFIED
      #      (idempotent via `since`) — an unchanged error is not returned
      #      again on the next hourly run.
      #   2. Workflow-side (this step): `gh search issues` by the fingerprint
      #      prefix among OPEN issues in PRIVATE_REPO, as a second guard
      #      against re-runs (e.g. a manual workflow_dispatch re-run in the
      #      same hour). A match → comment (regression note) instead of a
      #      new issue.
      # Title format (fixed contract, see runbook): `[<fingerprint:12>] <message ≤80 chars>`.
      - name: Create / update GitHub issues for new & regressed errors
        if: steps.pat-check.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TELEMETRY_ISSUES_PAT }}
        run: |
          set -euo pipefail

          # severity:auto does not exist yet in the private repo (unlike
          # prod-error, already created by the owner) — create-if-missing,
          # idempotent (label create is a no-op if it already exists).
          gh label create "severity:auto" --repo "$PRIVATE_REPO" \
            --color "ededed" --description "Auto-created by telemetry-digest.yml" \
            2>/dev/null || true

          COUNT=$(jq '.errors | length' /tmp/digest.json)
          echo "==> ${COUNT} error(s) in this digest window"

          jq -c '.errors[]' /tmp/digest.json | while IFS= read -r ERR; do
            FINGERPRINT=$(echo "$ERR" | jq -r '.fingerprint')
            SHORT_FP="${FINGERPRINT:0:12}"
            # Strip newlines so the issue title always stays single-line.
            MESSAGE_RAW=$(echo "$ERR" | jq -r '.message | gsub("\n"; " ")')
            # Truncate via jq's `.[0:80]`, NOT bash `${VAR:0:80}` — jq slices
            # by Unicode codepoint, bash slices by byte. A byte-slice on a
            # multi-byte message (Cyrillic, emoji, etc.) can cut a
            # character in half mid-sequence, producing invalid UTF-8 /
            # mojibake in the issue title.
            SHORT_MSG=$(echo "$ERR" | jq -r '(.message | gsub("\n"; " "))[0:80]')
            TITLE="[${SHORT_FP}] ${SHORT_MSG}"

            ROUTE=$(echo "$ERR" | jq -r '.route // "n/a"')
            USER_ROLE=$(echo "$ERR" | jq -r '.userRole // "n/a"')
            SOURCE=$(echo "$ERR" | jq -r '.source')
            COUNT_N=$(echo "$ERR" | jq -r '.count')
            FIRST_SEEN=$(echo "$ERR" | jq -r '.firstSeen')
            LAST_SEEN=$(echo "$ERR" | jq -r '.lastSeen')
            STACK_RAW=$(echo "$ERR" | jq -r '.stack // "(no stack)"')

            # SECURITY: message/stack are attacker-influenced (client-reported
            # error content — see runbook "Untrusted content" note). Collapse
            # any run of 3+ backticks down to 2 so the content can never form
            # a markdown fence-closing sequence on its own — combined with
            # the 10-backtick OUTER fence below (comfortably longer than any
            # backtick run survivng this filter), the stack trace can never
            # break out of its <details> code block early.
            # shellcheck disable=SC2016
            MESSAGE=$(printf '%s' "$MESSAGE_RAW" | sed -E 's/`{3,}/``/g')
            # shellcheck disable=SC2016
            STACK=$(printf '%s' "$STACK_RAW" | sed -E 's/`{3,}/``/g')

            # Search open issues for the fingerprint prefix, then confirm an
            # exact title-prefix match locally (defends against GH search's
            # fuzzy tokenizer producing a false-positive collision). `--`
            # before the positional query is defense-in-depth: SHORT_FP is
            # always a fixed-format 12-char hex string and can never start
            # with `-`, but this keeps it from ever being misparsed as a
            # flag regardless.
            EXISTING=$(gh search issues --repo "$PRIVATE_REPO" --state open --match title --json number,title -- "${SHORT_FP}" \
              | jq -r --arg fp "[${SHORT_FP}]" '[.[] | select(.title | startswith($fp))][0].number // empty')

            if [ -n "$EXISTING" ]; then
              echo "==> Regression on existing issue #${EXISTING} (fingerprint ${SHORT_FP}) — commenting"
              gh issue comment "$EXISTING" --repo "$PRIVATE_REPO" \
                --body "Регресс: ошибка снова наблюдается. count=${COUNT_N}, last_seen=${LAST_SEEN}."
              continue
            fi

            echo "==> New error (fingerprint ${SHORT_FP}) — creating issue"
            # Built with printf (not a heredoc) so every line stays inside the
            # `run: |` YAML block scalar's indentation — a heredoc with
            # flush-left body lines would prematurely terminate the scalar.
            # %s substitution keeps this safe even if message/stack contain
            # shell metacharacters: printf's format string is single-quoted
            # (no expansion of its own) and each value is passed as a
            # separate argv entry, never re-parsed as shell syntax.
            # Intentional: the 10-backtick markdown code fence and %s
            # placeholders below must stay literal (single quotes) — values
            # are substituted via printf argv, not $-expansion. The fence is
            # 10 backticks (not the usual 3) as defense-in-depth on top of
            # the MESSAGE/STACK backtick-collapsing above: even if a stray
            # backtick run somehow survived that filter, it would need to
            # reach 10 in a row at the start of a line to prematurely close
            # this fence.
            # shellcheck disable=SC2016
            BODY=$(printf '**Message:** %s\n**Source:** %s\n**Route:** %s\n**Role:** %s\n**Count:** %s\n**First seen:** %s\n**Last seen:** %s\n\n<details>\n<summary>Stack trace (sanitized)</summary>\n\n``````````\n%s\n``````````\n\n</details>\n\n## Чеклист фикса\n\n- [ ] Репро\n- [ ] Фикс\n- [ ] Тест\n- [ ] Deploy\n- [ ] RESOLVED\n' \
              "$MESSAGE" "$SOURCE" "$ROUTE" "$USER_ROLE" "$COUNT_N" "$FIRST_SEEN" "$LAST_SEEN" "$STACK")
            gh issue create --repo "$PRIVATE_REPO" \
              --title "$TITLE" \
              --label "prod-error" \
              --label "severity:auto" \
              --body "$BODY"
          done

  # ── Weekly (Monday 07:00 UTC): UX aggregates → single digest issue ───────
  # A SEPARATE job from errors-digest (AC: "не смешивается") — different
  # label (ux-insights vs prod-error), different cadence, different content
  # shape (markdown tables, not per-error issues).
  weekly-ux:
    name: Weekly UX digest
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'weekly-ux' || inputs.job == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1')
    steps:
      - name: Guard — TELEMETRY_ISSUES_PAT provisioned?
        id: pat-check
        env:
          PAT: ${{ secrets.TELEMETRY_ISSUES_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::TELEMETRY_ISSUES_PAT secret is not set — skipping weekly UX digest. See scripts/devops/telemetry-digest-runbook.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch weekly UX digest
        id: fetch
        if: steps.pat-check.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.TELEMETRY_DIGEST_TOKEN }}
        run: |
          SINCE=$(date -u -d '-7 days' '+%Y-%m-%dT%H:%M:%SZ')
          echo "==> fetching ${DIGEST_URL}?since=${SINCE}&ux=1"
          HTTP_CODE=$(curl -sS --max-time 20 -o /tmp/ux-digest.json -w '%{http_code}' \
            -H "X-Telemetry-Token: ${TOKEN}" \
            "${DIGEST_URL}?since=${SINCE}&ux=1" || echo "000")
          echo "==> http_code=${HTTP_CODE}"

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::GET ${DIGEST_URL} returned 404 — the endpoint is not deployed yet (task-telemetry-api / PR #412 has not merged to main). Skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::GET ${DIGEST_URL} returned ${HTTP_CODE} — TELEMETRY_DIGEST_TOKEN mismatch between this GitHub secret and the deployed prod API. Check both are in sync — see scripts/devops/telemetry-digest-runbook.md."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::GET ${DIGEST_URL} failed — http_code=${HTTP_CODE} (network error or API 5xx). Check prod API health."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create weekly UX-insights issue
        if: steps.pat-check.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TELEMETRY_ISSUES_PAT }}
        run: |
          set -euo pipefail

          gh label create "ux-insights" --repo "$PRIVATE_REPO" \
            --color "c5def5" --description "Weekly UX telemetry digest" \
            2>/dev/null || true

          ISO_DATE=$(date -u '+%Y-%m-%d')
          TITLE="UX weekly ${ISO_DATE}"

          # SECURITY: route/target values are UX-event data (route comes
          # from the browser location, target from a `[data-track]`
          # attribute) — not free text, but not a fixed enum either. Escape
          # literal `|` -> `\|` before interpolating into a markdown table
          # cell so an unusual value can never inject an extra column /
          # break the table's row structure. `esc` is redefined per jq
          # invocation below (each `jq -r` is a separate process).
          {
            echo "## Топ роутов по ролям"
            echo ""
            echo "| Role | Route | Visits | Median duration (ms) |"
            echo "| --- | --- | --- | --- |"
            jq -r 'def esc: gsub("\\|"; "\\|"); .ux.topRoutesByRole[]? | "| \(.role|esc) | \(.route|esc) | \(.visits) | \(.medianDurationMs // "n/a") |"' /tmp/ux-digest.json
            echo ""
            echo "## Клики по фичам"
            echo ""
            echo "| Target | Count |"
            echo "| --- | --- |"
            jq -r 'def esc: gsub("\\|"; "\\|"); .ux.featureClicks[]? | "| \(.target|esc) | \(.count) |"' /tmp/ux-digest.json
            echo ""
            echo "## Брошенные формы"
            echo ""
            echo "| Route | Abandon | Submit | Rate |"
            echo "| --- | --- | --- | --- |"
            jq -r 'def esc: gsub("\\|"; "\\|"); .ux.formAbandonRates[]? | "| \(.route|esc) | \(.abandonCount) | \(.submitCount) | \(.abandonRate) |"' /tmp/ux-digest.json
            echo ""
            echo "## Медианные тайминги"
            echo ""
            echo "| Route | Median duration (ms) |"
            echo "| --- | --- |"
            jq -r 'def esc: gsub("\\|"; "\\|"); .ux.medianDurations[]? | "| \(.route|esc) | \(.medianDurationMs) |"' /tmp/ux-digest.json
            echo ""
            echo "## Выводы ассистента"
            echo ""
            echo "(заполнит оркестратор)"
          } > /tmp/ux-issue-body.md

          gh issue create --repo "$PRIVATE_REPO" \
            --title "$TITLE" \
            --label "ux-insights" \
            --body-file /tmp/ux-issue-body.md
