name: Review Gate

# Additive process gate (lite): a PR may merge only after an intentional, recorded review
# decision — for EVERY author, the owner included.
#
# WHY (audit 2026-10-21): every PR merged by the second, write-role collaborator reached `main`
# with zero reviews, although each touched a critical-path zone (finance, Drizzle migrations,
# webhooks, deploy workflows). The review step existed only as procedure inside the owner's
# orchestration pipeline, which a collaborator working in another harness never runs. Native
# "required reviews" do not fit: the owner authors most PRs and GitHub forbids approving your own.
#
# DECISION: scripts/architect/review-gate.mjs (pure function; unit tests in review-gate.test.mjs,
# run on PRs by architect-scripts.yml). PASS if any of:
#   - docs-only diff (every changed path `*.md` or under `.claude/`) — light-track exemption;
#   - a review whose verdict line is `Verdict: APPROVE`, with no `Verdict: BLOCK` after it;
#   - label `skip-review` AND a PR-body line `Skip-Review-Reason: <why>` (>= 10 chars), echoed
#     into the job summary.
# Otherwise FAIL with an instruction naming both ways forward.
#
# THREAT MODEL (short): this enforces an intentional, recorded choice — it makes "no review" a
# visible, attributable act instead of a silent default. It is NOT a defence against a malicious
# write-role user (anyone can post a review saying `Verdict: APPROVE`, set a label, or run his own
# workflows on his own branches); that needs environment-scoped secrets / rulesets, tracked
# separately.
#
# TRIGGERS:
#   - `pull_request_target` runs the BASE branch's copy of this file, so a PR cannot edit the gate
#     that judges its own pushes, labels and body edits. `edited` is included so that adding the
#     `Skip-Review-Reason:` line re-runs the check.
#   - `pull_request_review` (submitted, dismissed) is included for convenience, so a posted review
#     turns the check green without a further push. Known consequence, accepted with the lite scope:
#     that event has no `_target` variant and runs the PR's OWN copy of this workflow — a PR that
#     edits this file controls the result of its review-triggered runs. That is a deliberate act
#     visible in the diff, which is exactly the class of act this gate exists to make visible.
#
# NEVER check out or run the PR's code: the job checks out `main` only (sparse, no credentials) and
# reads the PR through the REST API as data. No `${{ }}` expression carrying PR-controlled text is
# interpolated into a `run:` script.
#
# No `paths:` filter (a required check must report on every PR, or PRs sit "waiting for status")
# and no `concurrency:` block (a cancelled run leaves a `cancelled` conclusion that auto-merge reads
# as a hard failure). A run takes seconds and is idempotent.
#
# SPOOFING NOTE for whoever adds this context to branch protection: bind it to the GitHub Actions
# app (app_id 15368, like the four existing contexts) — an unbound context can be satisfied by a
# commit status that any write-role user may post through the statuses API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gate:
    name: Review Gate
    # pull_request_review has no `branches:` filter; judge only PRs into main.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main (gate logic only — never the PR's code)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/architect

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every list is fetched fresh (not from the event payload) and COUNTED in the log: an
      # instrument that did not look must not report a negative
      # (.claude/rules/common/verification-integrity.md). An empty file list is rejected by the
      # script itself — a PR always changes at least one file.
      - name: Fetch PR data (REST API, read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          D: ${{ runner.temp }}/review-gate
        run: |
          set -euo pipefail
          mkdir -p "$D"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' \
            | jq -R . | jq -s . >"$D/files.json"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | {author: .user.login, state: .state, body: (.body // ""), submitted_at: .submitted_at}' \
            | jq -s . >"$D/reviews.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{labels: [.labels[].name], body: (.body // "")}' >"$D/pr.json"
          jq -n --slurpfile files "$D/files.json" --slurpfile reviews "$D/reviews.json" --slurpfile pr "$D/pr.json" \
            '{files: $files[0], reviews: $reviews[0], labels: $pr[0].labels, body: $pr[0].body}' >"$D/pr-data.json"
          f="$D/pr-data.json"
          echo "fetched: files=$(jq '.files | length' "$f") reviews=$(jq '.reviews | length' "$f")" \
            "labels=$(jq -c '.labels' "$f") body-chars=$(jq '.body | length' "$f")"

      - name: Evaluate
        env:
          IN: ${{ runner.temp }}/review-gate/pr-data.json
        run: node scripts/architect/review-gate.mjs --input "$IN" --summary "$GITHUB_STEP_SUMMARY"
