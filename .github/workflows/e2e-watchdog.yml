name: E2E Watchdog

# ОТКЛЮЧЁН 2026-07-27 (security-review PR #441). Job загейчен `if: false` —
# workflow остаётся в репо как заготовка, но не исполняется ни при каких
# условиях. Появится в Actions UI как "skipped" — это намеренно, та же
# конвенция, что у `ecc-code-review.yml`.
#
# ПОЧЕМУ ОТКЛЮЧЁН — цепочка, которую он замыкал:
#
#   1. Триггер `workflow_run: workflows:[CI], branches:[main]`. До PR #441 CI
#      на main фактически НЕ завершался (последний прогон — 2026-06-13,
#      push-триггер был мёртв из-за GITHUB_TOKEN-сквоша), поэтому воркфлоу
#      спал ~1.5 месяца. PR #441 включил post-merge прогон CI на main — и тем
#      самым РАЗБУДИЛ этот watchdog: теперь он оценивается после каждого мержа.
#   2. При красном CI он делал: `checkout` с `token: ADMIN_PAT` (при дефолтном
#      `persist-credentials: true` owner-PAT оседает в `.git/config` раннера)
#      → `git commit && git push` НАПРЯМУЮ в `main` (branch protection с
#      `enforce_admins: false` owner-PAT пропускает) → `gh workflow run
#      autotest.yml`.
#   3. Авто-коммит в main = НАСТОЯЩЕЕ push-событие (не GITHUB_TOKEN, а PAT) →
#      триггерит `deploy.yml` → прод переразворачивается в заведомо красном
#      состоянии → новый post-merge CI → снова failure → снова авто-коммит.
#      Самоподдерживающийся цикл; `concurrency` его НЕ гасит (это не
#      параллельность, а повтор).
#
# Сейчас цепочка не срабатывает лишь по случайности: путь
# `docs/specs/tasks/templates/task-fix-e2e-broken.md` (строка ниже) не
# существует — реальный путь `.claude/tasks/templates/task-fix-e2e-broken.md`,
# а `autotest.yml` вообще удалён. Т.е. от боевого цикла нас отделяла ОДНА
# починенная строка. Это и есть причина отключить, а не «починить путь».
#
# Если возрождать — переписать так: НИКАКОГО `git push` в main из автоматики
# (создавать PR), `persist-credentials: false`, убрать dispatch несуществующего
# workflow, и не использовать owner-PAT там, где хватает GITHUB_TOKEN.
# Пока живой канал сигнала о красном main — `post_merge_alert` + `notify_e2e`
# в `ci.yml` (см. scripts/devops/post-merge-ci-runbook.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: e2e-watchdog
  cancel-in-progress: true

jobs:
  dispatch-autotest:
    name: Dispatch AutoTest to fix E2E (DISABLED)
    runs-on: ubuntu-latest
    # `false &&` — жёсткий выключатель. НЕ снимать, не переписав шаги ниже
    # по чек-листу в шапке файла.
    if: false && github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}

      - name: Check if E2E job failed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          E2E_CONCLUSION=$(gh run view "$RUN_ID" \
            --repo "$REPO" \
            --json jobs \
            --jq '.jobs[] | select(.name == "E2E Tests") | .conclusion')
          echo "e2e_conclusion=$E2E_CONCLUSION" >> $GITHUB_OUTPUT

      - name: Dispatch AutoTest if E2E failed
        if: steps.check.outputs.e2e_conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          TASK_FILE="docs/specs/tasks/task-fix-e2e-auto-${TIMESTAMP}.md"
          sed \
            -e "s|{{timestamp}}|$TIMESTAMP|g" \
            -e "s|{{sha}}|$HEAD_SHA|g" \
            -e "s|{{run_url}}|$RUN_URL|g" \
            docs/specs/tasks/templates/task-fix-e2e-broken.md > /tmp/task-content.md

          cp /tmp/task-content.md "$TASK_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TASK_FILE"
          git commit -m "chore(watchdog): auto-create E2E fix task for ${HEAD_SHA}"
          git push

          gh workflow run autotest.yml \
            --repo "$REPO" \
            -f task_file="$TASK_FILE"
