name: E2E Tests

# Запускается только PM-агентом после User Testing APPROVE.
# Никогда не запускается автоматически.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run E2E against'
        required: true
        type: string

concurrency:
  group: e2e-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-32-chars-minimum-xxxxx' }}
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api
      NODE_ENV: test
      API_PORT: 3001
      # S3 / MinIO (PHASE 6) — dev dummy creds, MinIO service started below.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crm_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MinIO нельзя запустить через `services:` — GHA service container schema
      # не поддерживает `command:`/`args:`, а MinIO image без команды exit'ит.
      # Поднимаем через `docker run` ниже (см. step "Start MinIO + bucket").

    steps:
      - name: Get PR head ref
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          REF=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName --jq '.headRefName')
          echo "ref=${REF}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Start MinIO + bucket
        run: |
          docker run -d --name minio \
            --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          # Wait for healthy
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then echo "MinIO ready"; break; fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          # Bootstrap bucket (mc image entrypoint is `mc`, override with /bin/sh).
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/crm-documents &&
            echo 'MinIO bucket crm-documents ready (CI)'
          "

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/playwright.config.*') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - name: Push DB schema + seed
        run: |
          pnpm --filter @crm/api db:push
          pnpm --filter @crm/api db:seed

      - name: Build shared
        run: pnpm --filter @crm/shared build

      - name: Build web
        run: pnpm --filter @crm/web build

      - name: Build API
        run: pnpm --filter @crm/api build

      - name: Start API
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        run: nohup pnpm --filter @crm/web start > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run Playwright E2E
        run: pnpm --filter @crm/e2e test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Post E2E result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ E2E passed — ready to merge"
          else
            STATUS="❌ E2E failed — see artifacts below"
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "$(printf '## 🎭 E2E Results\n%s\nRun: https://github.com/%s/actions/runs/%s' \
              "$STATUS" "$REPO" "$RUN_ID")"

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-pr-${{ inputs.pr_number }}
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
          retention-days: 7

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  # Merge is handled by PM locally after E2E passes.
  # PM runs: gh pr merge <N> --squash --delete-branch
