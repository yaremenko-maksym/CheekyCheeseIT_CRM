name: E2E Tests

# Запускается только PM-агентом после User Testing APPROVE.
# Никогда не запускается автоматически.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run E2E against'
        required: true
        type: string

concurrency:
  group: e2e-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      DATABASE_URL: postgresql://crm_user:password@localhost:5432/crm_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-32-chars-minimum-xxxxx' }}
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/auth/google/callback
      SESSION_SECRET: ci-session-secret-32-chars-minimum-x
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3001/api
      NODE_ENV: test
      API_PORT: 3001
      # S3 / RustFS (PHASE 6) — dev creds, S3 stand started below.
      # Prod overrides via secrets: AWS_ACCESS_KEY_ID_PROD / AWS_SECRET_ACCESS_KEY_PROD / S3_BUCKET_PROD / S3_REGION_PROD.
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_BUCKET: crm-documents
      S3_USE_SSE: 'false'
      AWS_ACCESS_KEY_ID: crmdevaccesskey
      AWS_SECRET_ACCESS_KEY: crmdevsecretkey
      # Throttler: raise limits so full-suite manual run does not get 429 on drop-finance specs.
      # THROTTLE_RELAXED is only honoured in non-production (guardrail in env.ts).
      THROTTLE_RELAXED: 'true'
      THROTTLER_LIMIT: '2000'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crm_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # S3-стенд (RustFS) поднимается через `docker run` в шаге ниже, а не
      # `services:` — бакет нужно забутстрапить сразу после старта сервера,
      # это делаем в том же шаге (см. "Start S3 stand + bucket").

    steps:
      - name: Get PR head ref
        id: pr_head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          REF=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName --jq '.headRefName')
          echo "ref=${REF}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_head.outputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Start S3 stand + bucket
        run: |
          # RustFS — S3-compatible stand for CI/dev (owner decision
          # 2026-09-24, replaces the previous stand whose images became
          # unpullable everywhere: quay.io 401, dl.min.io 410, Docker Hub
          # 404). Apache-2.0, active, https://github.com/rustfs/rustfs.
          # Pinned by multi-arch index digest (amd64+arm64), tag 1.0.0,
          # verified 2026-09-24 against https://hub.docker.com/r/rustfs/rustfs.
          docker run -d --name s3-stand \
            --network host \
            -e RUSTFS_ACCESS_KEY=crmdevaccesskey \
            -e RUSTFS_SECRET_KEY=crmdevsecretkey \
            -e RUSTFS_CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
          # Wait for healthy
          for i in {1..30}; do
            if curl -sf http://localhost:9000/health; then echo "S3 stand ready"; break; fi
            echo "Waiting for S3 stand... ($i/30)"
            sleep 2
          done
          # Bootstrap bucket. `aws s3 mb` against RustFS is idempotent by
          # itself (verified locally, re-run exits 0) — no
          # `--ignore-existing`-style flag needed.
          # Pinned by multi-arch index digest (amd64+arm64), verified 2026-09-24.
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=crmdevaccesskey \
            -e AWS_SECRET_ACCESS_KEY=crmdevsecretkey \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8 \
            --endpoint-url http://localhost:9000 s3 mb s3://crm-documents
          echo "S3 bucket crm-documents ready (CI)"

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/playwright.config.*') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @crm/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached run)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @crm/e2e exec playwright install-deps chromium

      - name: Push DB schema + seed
        run: |
          pnpm --filter @crm/api db:push
          pnpm --filter @crm/api db:seed

      - name: Build shared
        run: pnpm --filter @crm/shared build

      - name: Build web
        run: pnpm --filter @crm/web build

      - name: Build API
        run: pnpm --filter @crm/api build

      - name: Start API
        run: nohup pnpm --filter @crm/api start > /tmp/api.log 2>&1 &

      - name: Start Web
        run: nohup pnpm --filter @crm/web start > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run Playwright E2E
        run: pnpm --filter @crm/e2e test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Post E2E result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ E2E passed — ready to merge"
          else
            STATUS="❌ E2E failed — see artifacts below"
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "$(printf '## 🎭 E2E Results\n%s\nRun: https://github.com/%s/actions/runs/%s' \
              "$STATUS" "$REPO" "$RUN_ID")"

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-pr-${{ inputs.pr_number }}
          path: |
            apps/e2e/test-results/
            apps/e2e/playwright-report/
          retention-days: 7

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "=== API LOG ===" && cat /tmp/api.log || true
          echo "=== WEB LOG ===" && cat /tmp/web.log || true

      - name: Stop S3 stand
        if: always()
        run: docker rm -f s3-stand || true

  # Merge is handled by PM locally after E2E passes.
  # PM runs: gh pr merge <N> --squash --delete-branch
