name: BA Escalation Notification

on:
  push:
    paths:
      - 'docs/escalations/**'
    branches-ignore:
      - main  # only on feature branches (QA creates escalation files in PR branch)

jobs:
  notify-escalation:
    name: Create Issue for BA
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Get new escalation files
        id: escalation
        run: |
          FILES=$(git diff HEAD~1 --name-only -- docs/escalations/ | grep -v '.gitkeep')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "has_escalation=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Issue for BA
        if: steps.escalation.outputs.has_escalation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="${{ steps.escalation.outputs.files }}"
          BRANCH="${{ github.ref_name }}"

          gh issue create \
            --title "🔴 BA Escalation: новая эскалация от QA-агента" \
            --body "QA-агент нашёл проблему в ветке \`${BRANCH}\`.

          **Файлы эскалации:**
          ${FILES}

          **Действия BA:**
          1. Прочитать файлы эскалации
          2. Задать вопросы пользователю если нужно
          3. Обновить \`docs/business/\`
          4. При необходимости — обновить \`docs/specs/active-task.md\`

          Ветка PR: https://github.com/${{ github.repository }}/tree/${BRANCH}" \
            --label "escalation,needs-ba-action"
