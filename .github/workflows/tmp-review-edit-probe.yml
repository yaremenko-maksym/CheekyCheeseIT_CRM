# Temporary probe (security finding SR-H-1, PR #1524). Never merged; deleted after the run.
name: tmp-review-edit-probe
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
jobs:
  probe:
    if: github.head_ref == 'tmp/review-edit-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Try to edit the owner's review and issue comment as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          RID=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate -q '[.[] | select(.user.login=="yaremenko-maksym" and (.body|startswith("probe-review")))] | last | .id')
          echo "review id: ${RID:-none}"
          if [ -n "$RID" ] && [ "$RID" != "null" ]; then
            gh api -i -X PUT "repos/$REPO/pulls/$PR/reviews/$RID" -f body='probe-review EDITED by github-actions[bot]' 2>&1 | grep -iE '^HTTP/|"message"|"body"' | head -10
          fi
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '[.[] | select(.user.login=="yaremenko-maksym" and (.body|startswith("probe-comment")))] | last | .id')
          echo "comment id: ${CID:-none}"
          if [ -n "$CID" ] && [ "$CID" != "null" ]; then
            gh api -i -X PATCH "repos/$REPO/issues/comments/$CID" -f body='probe-comment EDITED by github-actions[bot]' 2>&1 | grep -iE '^HTTP/|"message"|"body"' | head -10
          fi
          exit 0
