name: Coder

# Triggered by PM agent with a task file path.
# Each task_file gets its own concurrency group → parallel Coder instances possible.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Path to task file (e.g. docs/specs/tasks/task-auth-api.md)'
        required: true
        type: string
      task_hint:
        description: 'Short hint for branch name (e.g. "auth-api")'
        required: false
        type: string
      target_branch:
        description: 'Existing branch to work on (optional). If empty — create new branch from main.'
        required: false
        type: string
        default: ''

concurrency:
  # Each task file gets its own group → parallel runs for different tasks are safe
  group: coder-${{ inputs.task_file }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement Task
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify task file exists
        if: inputs.task_file != ''
        env:
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          if [ ! -f "$TASK_FILE" ]; then
            echo "::error::Task file '$TASK_FILE' not found in repo HEAD"
            echo "::error::PM must commit and push the task file before running the workflow"
            exit 1
          fi
          echo "Task file verified: $TASK_FILE"

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.email "coder-agent@github-actions"
          git config user.name "Coder Agent"

      - name: Setup branch
        run: |
          if [ -n "$TARGET_BRANCH" ]; then
            git fetch origin
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"
          else
            BRANCH=$(grep -m1 "^## Ветка:" "$TASK_FILE" 2>/dev/null | sed 's/## Ветка:[[:space:]]*//' | tr -d "[:space:]")
            if [ -z "$BRANCH" ]; then
              BRANCH="feature/${TASK_HINT}"
            fi
            git checkout main && git pull origin main
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              git checkout -b "$BRANCH" --track "origin/$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
          fi
          echo "Working on branch: $(git branch --show-current)"
        env:
          TASK_FILE: ${{ inputs.task_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TASK_HINT: ${{ inputs.task_hint }}

      - name: Claude Coder Agent
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — Coder-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/coder.md — полный системный промпт.
            Прочитай docs/agents/CLAUDE-coder.md — структура монорепо, статус фаз, gotchas.
            Прочитай task-файл по пути TASK_FILE (передан в конце этого промпта) — это ЕДИНСТВЕННЫЙ источник требований. Запомни все "Acceptance criteria" из него.

            ## ШАГ 1 — Разведка перед кодом (ОБЯЗАТЕЛЬНО, до любого Edit/Write)

            Найди существующие паттерны — НЕ через grep, только через ast-grep:
            - mcp__ast-grep__find_code: найди похожие компоненты, сервисы, схемы в проекте
            - mcp__ast-grep__find_code_by_rule: найди все использования затронутых типов/функций

            Для любого NestJS / TanStack Router / Zod / Drizzle кода — получи актуальную документацию:
            - mcp__context7__resolve-library-id → mcp__context7__query-docs
            Не угадывай API по памяти — версии отличаются от обучающих данных.

            ## ШАГ 2 — Реализация

            Порядок строго: packages/shared → apps/api (schema → migration → service → controller) → apps/web

            ЕСЛИ задача включает новые страницы или сложные UI компоненты (диалоги, карточки, таблицы,
            формы) — ОБЯЗАТЕЛЬНО вызови Skill "frontend-design" перед написанием JSX.
            Это не опционально. Skill даёт production-grade дизайн вместо дефолтного.

            После написания каждого нового файла — проверяй типы: pnpm typecheck

            ## ШАГ 3 — Линтинг (ОБЯЗАТЕЛЬНО через MCP, не через pnpm lint)

            Запусти eslint MCP на все изменённые файлы:
            mcp__eslint__lint-files: { "filePaths": ["apps/api/src/...", "apps/web/app/..."] }
            Исправь все ошибки (severity: error) до коммита.

            ## ШАГ 4 — E2E атомарность (ОБЯЗАТЕЛЬНО при изменении UI-текстов или DOM)

            Если менялись тексты кнопок/заголовков, aria-label, data-testid, URL роутов, структура DOM:
            - mcp__ast-grep__find_code: найди затронутые тесты в apps/e2e/ по изменённому тексту
            - Обнови селекторы в том же коммите — PR с расхождением кода и тестов не принимается

            ## ШАГ 4.5 — Верификация Acceptance Criteria (ОБЯЗАТЕЛЬНО перед коммитом)

            Открой TASK_FILE, найди раздел "## Acceptance criteria".
            Для КАЖДОГО пункта выполни git diff HEAD -- <изменённые файлы> и найди
            КОНКРЕТНУЮ строку кода которая реализует этот пункт.

            Правила верификации:
            - UI/JSX пункты → ищи изменение в git diff (className, onClick, href и т.д.)
            - Логика/данные → mcp__ast-grep__find_code для проверки паттерна в коде
            - НЕ используй Playwright для верификации — dev-сервер не запущен в CI

            Выведи чеклист:
            - [x] Пункт 1 — <файл>:<строка> в git diff
            - [ ] Пункт 2 — НЕ НАЙДЕНО в diff, возвращаюсь к реализации

            Если хотя бы один пункт [ ] — вернись к ШАГ 2.
            НЕ создавай PR пока все пункты не в diff.

            ЗАПРЕЩЕНО:
            - Создавать .js/.mjs/.ts скрипты для "тестирования" вне task-файла
            - Сохранять *.png/*.jpg файлы в репозиторий
            - Создавать output.txt или любые temp-файлы
            - Трогать файлы не упомянутые в task-файле (раздел "Файл 1:", "Файл 2:" и т.д.)

            ## ШАГ 5 — Коммит и PR

            git add <конкретные файлы> (НЕ git add .)
            git commit -m "feat: <описание из задачи>"
            git push origin $(git branch --show-current)  # КРИТИЧНО: без git push изменения потеряны — GHA runner ephemeral!
            Перед mcp__github__create_pull_request — проверь идемпотентность через Bash:
            gh pr list --repo REPO --head BRANCH --json number --jq '.[0].number // empty'
            Если PR существует — добавь label к существующему, не создавай новый.

            В body PR обязательно укажи:
            - Список изменений
            - "Task: docs/specs/tasks/task-SLUG.md" (имя task-файла из задачи)
            - Checklist acceptance criteria из task-файла

            Добавь label ai-review-ready.

            Repo: ${{ github.repository }}
            task_file: ${{ inputs.task_file }}
            task_hint: ${{ inputs.task_hint }}
            target_branch: ${{ inputs.target_branch }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__ast-grep__dump_syntax_tree
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
            mcp__eslint__lint-files
            mcp__postgres__query
            mcp__playwright__browser_navigate
            mcp__playwright__browser_take_screenshot
            mcp__playwright__browser_snapshot
            mcp__github__create_pull_request
            mcp__github__create_branch
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__add_issue_comment

      - name: Safety net — push uncommitted changes
        if: always()
        run: |
          BRANCH=$(git branch --show-current)

          # Remove known debug artifacts before staging
          find . -maxdepth 3 \( \
            -name "output.txt" \
            -o -name "debug-*.png" \
            -o -name "screenshot-*.png" \
            -o -name "test-*.mjs" \
            -o -name "test-*.js" \
          \) -not -path "./.git/*" -delete 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            # Only stage tracked files + specific known directories
            git add apps/ packages/ docs/ .github/ \
              --ignore-errors 2>/dev/null || git add -A
            # Skip commit if only junk remains
            STAGED=$(git diff --cached --stat | wc -l)
            if [ "$STAGED" -gt 0 ]; then
              echo "::warning::Agent left uncommitted changes — creating safety-net commit"
              git commit -m "chore(agent): safety-net — agent forgot to commit changes"
            fi
          fi

          REMOTE_EXISTS=$(git ls-remote --heads origin "$BRANCH" | wc -l)
          if [ "$REMOTE_EXISTS" -eq 0 ]; then
            git push -u origin "$BRANCH"
          else
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse "origin/$BRANCH" 2>/dev/null || echo "none")
            if [ "$LOCAL" != "$REMOTE" ]; then
              git push origin "$BRANCH"
            fi
          fi
