name: Coder

# Triggered by PM agent with a task file path.
# Each task_file gets its own concurrency group → parallel Coder instances possible.
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Path to task file (e.g. docs/specs/tasks/task-auth-api.md)'
        required: true
        type: string
      task_hint:
        description: 'Short hint for branch name (e.g. "auth-api")'
        required: false
        type: string
      target_branch:
        description: 'Existing branch to work on (optional). If empty — create new branch from main.'
        required: false
        type: string
        default: ''

concurrency:
  # Each task file gets its own group → parallel runs for different tasks are safe
  group: coder-${{ inputs.task_file }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement Task
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for claude_code_oauth_token OIDC auth

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 7.32.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.email "coder-agent@github-actions"
          git config user.name "Coder Agent"

      - name: Claude Coder Agent
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          mode: agent
          direct_prompt: |
            Ты — Coder-агент для CRM Cheeky Cheese IT.

            Прочитай docs/agents/coder.md — это твой полный системный промпт.
            Прочитай docs/agents/CLAUDE-coder.md — команды, структура, статус, gotchas.
            Прочитай ${{ inputs.task_file }} — это твоя текущая задача.

            Реализуй задачу согласно инструкциям в docs/agents/coder.md:
            1. Определи ветку для работы:
               - Если target_branch не пустой: git fetch origin && git checkout <target_branch> && git pull origin <target_branch>
               - Если target_branch пустой: git checkout main && git pull && git checkout -b feature/<slug из заголовка task-файла>
            2. Реализуй все изменения в правильном порядке (shared → api → web → tests)
            3. Запусти pnpm typecheck и pnpm lint — исправь все ошибки
            4. Закоммить изменения конкретными файлами (не git add .)
            5. Создай PR через GitHub MCP и добавь label ai-review-ready

            Repo: ${{ github.repository }}
            task_hint: ${{ inputs.task_hint }}
            target_branch: ${{ inputs.target_branch }}
          allowed_tools: |
            Read
            Write
            Edit
            Bash
            mcp__ast-grep__find_code
            mcp__ast-grep__find_code_by_rule
            mcp__ast-grep__dump_syntax_tree
            mcp__context7__resolve-library-id
            mcp__context7__query-docs
            mcp__eslint__lint-files
            mcp__postgres__query
            mcp__playwright__browser_navigate
            mcp__playwright__browser_take_screenshot
            mcp__playwright__browser_snapshot
            mcp__github__create_pull_request
            mcp__github__create_branch
            mcp__github__get_pull_request
            mcp__github__get_pull_request_files
            mcp__github__add_issue_comment
