name: Verify job-source credentials

# task-verify-job-source-credentials (2026-08-11): the owner provisioned five
# repo secrets for the job-aggregator integrations — JOOBLE_API_KEY,
# ADZUNA_APP_ID, ADZUNA_APP_KEY, CAREERJET_AFFID, RAPIDAPI_KEY — and nobody
# had verified a single one of them actually authenticates against its
# service. This workflow makes ONE minimal real request per service and
# reports, per service, independently: does the credential work, how many
# records came back, and does a returned record carry a company name (that
# last bit matters beyond curiosity — see the RapidAPI step below and the
# check script's own comments: some sources, like EURES, never carry a
# company name, which is exactly the signal the "don't apply to your own
# company" filter depends on).
#
# WHY workflow_dispatch ONLY, never push/pull_request/schedule: RapidAPI's
# JSearch free tier is capped at 200 requests per calendar MONTH, HARD (not a
# rolling window — burn it and every call fails until next month). A single
# extra push-triggered run per day would exhaust a month's quota in under a
# week. Do not add a `schedule:` or `push:` trigger to this file for "keeping
# it fresh" — run it by hand when you actually need the answer.
#
# WHY one job, four continue-on-error steps (not four jobs): each service is
# checked independently on purpose — one failing must not skip the other
# three, and the final summary must show which one(s) failed. `continue-on-
# error: true` on each check step gets that within a single job (this repo's
# DevOps rule is "no unnecessary extra jobs" — a step accomplishes the same
# independence for a fraction of the runner overhead of four separate jobs).
# The Summary step reads each step's real `outcome` (continue-on-error only
# masks `conclusion`, not `outcome`) and is the one that actually fails the
# job when anything is missing or broken — see its own comment below.
#
# WHAT "invalid credential -> red" means here, proven for real: this exact
# check script was run by hand against all four LIVE services with
# deliberately-wrong credential values before this workflow was ever
# committed, and every one of the four went red (Jooble: Cloudflare
# bot-challenge, HTTP 403; Adzuna: HTTP 401 "Authorisation failed";
# Careerjet: HTTP 401; RapidAPI: HTTP 403 "not subscribed") — see the PR
# description for the full transcript. The OFFLINE, deterministic version of
# that same proof (so it can run on every push without touching a live
# service or RapidAPI's quota) is
# scripts/devops/tests/test-check-job-source-credentials.sh, wired into
# ci.yml's "Guard tests" step via the check-*/test-check-* meta-guard
# (scripts/devops/check-guard-tests-exist.sh).
on:
  workflow_dispatch: {}

# No push/pull_request trigger exists for this workflow, so the usual
# per-PR concurrency group (see .claude/agents/devops.md §6.3) does not
# apply. This group has exactly one purpose: if someone fires this off twice
# by hand in quick succession, the second run QUEUES instead of running
# concurrently (cancel-in-progress: false) — avoiding two parallel calls to
# the RapidAPI step for no reason, given its quota.
concurrency:
  group: verify-job-source-credentials
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify job-source credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # ── Jooble ──────────────────────────────────────────────────────────
      - name: Jooble — POST https://jooble.org/api/{key}
        id: jooble
        continue-on-error: true
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: |
          bash scripts/devops/check-job-source-credentials.sh jooble | tee /tmp/report-jooble.txt

      # ── Adzuna ──────────────────────────────────────────────────────────
      # Ukraine is not in Adzuna's coverage; `pl` (Poland) is the nearest
      # covered market — see the check script's own comment.
      - name: Adzuna — job search (country=pl)
        id: adzuna
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          bash scripts/devops/check-job-source-credentials.sh adzuna | tee /tmp/report-adzuna.txt

      # ── Careerjet ───────────────────────────────────────────────────────
      - name: Careerjet — legacy affid search
        id: careerjet
        continue-on-error: true
        env:
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
        run: |
          bash scripts/devops/check-job-source-credentials.sh careerjet | tee /tmp/report-careerjet.txt

      # ── RapidAPI JSearch ────────────────────────────────────────────────
      # HARD CAP: 200 requests per calendar MONTH on the free tier — not
      # rolling, not soft. This step makes exactly ONE request. Do not add a
      # retry, a matrix, or a scheduled trigger to this workflow because of
      # it — see the top-of-file comment. A rejected/invalid key does NOT
      # consume this quota (confirmed live: the RapidAPI gateway rejects an
      # unrecognized/unsubscribed key with HTTP 403 before the request is
      # ever proxied to JSearch), so re-running this step after fixing a
      # broken key is safe; re-running it just to "double-check" a WORKING
      # key is not free and should not become a habit.
      - name: RapidAPI JSearch — 200 req/month hard cap, ONE call only
        id: rapidapi
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          bash scripts/devops/check-job-source-credentials.sh rapidapi | tee /tmp/report-rapidapi.txt

      # ── Summary — the step that actually decides pass/fail ─────────────
      # `continue-on-error` on the four steps above only forces their
      # `conclusion` to success so the job keeps going; `outcome` still holds
      # the real result, which is what this step reads. A missing secret
      # (check script exit 2) and a rejected credential (exit 1) both show up
      # as outcome=failure here — deliberately the same bucket, because both
      # mean "this credential was not verified working", which is the one
      # thing this workflow exists to answer. `if: always()` so this step —
      # and therefore the loud, non-zero job result — runs even if every
      # single service above failed.
      - name: Summary — verdict per service
        if: always()
        env:
          JOOBLE_OUTCOME: ${{ steps.jooble.outcome }}
          ADZUNA_OUTCOME: ${{ steps.adzuna.outcome }}
          CAREERJET_OUTCOME: ${{ steps.careerjet.outcome }}
          RAPIDAPI_OUTCOME: ${{ steps.rapidapi.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          SERVICES = ["jooble", "adzuna", "careerjet", "rapidapi"]

          # Anchored, ORDER-FIXED pattern: count/http/company are matched as
          # the exact token immediately following their own "key=" marker, so
          # arbitrary text inside `reason` (the last, free-text field) cannot
          # be mistaken for an earlier field — a naive greedy "grab the last
          # match of count=" regex could be fooled by a reason string that
          # happens to contain the substring "count=".
          LINE_RE = re.compile(
              r"^REPORT service=(?P<service>\S+) result=(?P<result>\S+) "
              r"http=(?P<http>\S+) count=(?P<count>\S+) company=(?P<company>\S+) "
              r"reason=(?P<reason>.*)$"
          )

          rows = []
          overall_fail = False

          for svc in SERVICES:
              path = f"/tmp/report-{svc}.txt"
              report_line = None
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      for line in f:
                          if line.startswith("REPORT "):
                              report_line = line.strip()
              except OSError:
                  report_line = None

              step_outcome = os.environ.get(f"{svc.upper()}_OUTCOME", "unknown")

              m = LINE_RE.match(report_line) if report_line else None
              if m is None:
                  rows.append((svc, "NO-REPORT", "-", "-", "-", "step produced no REPORT line"))
                  overall_fail = True
                  continue

              result = m.group("result")
              reason = m.group("reason").replace("|", "/")
              rows.append((svc, result, m.group("http"), m.group("count"), m.group("company"), reason))

              # Trust BOTH signals: the script's own verdict AND the step's
              # actual outcome (continue-on-error steps still expose the real
              # outcome) — either one saying "not success" is enough to fail
              # the job. A script that printed OK but exited non-zero (or
              # vice versa) is a bug worth surfacing, not averaging away.
              if result != "OK" or step_outcome != "success":
                  overall_fail = True

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Job-source credential check",
              "",
              "| Service | Result | HTTP | Records | Company field | Reason |",
              "|---|---|---|---|---|---|",
          ]
          for svc, result, http, count, company, reason in rows:
              lines.append(f"| {svc} | {result} | {http} | {count} | {company} | {reason} |")
          lines.append("")
          if overall_fail:
              lines.append("**At least one credential is missing or not working — see table above.**")
          else:
              lines.append("**All five credentials verified working.**")

          print("\n".join(lines))
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          sys.exit(1 if overall_fail else 0)
          PY
