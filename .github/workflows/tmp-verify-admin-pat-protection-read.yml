name: TEMP Verify ADMIN_PAT protection read

# THROWAWAY — review round MED-3 on PR #542. Answers exactly one question:
# can secrets.ADMIN_PAT actually read repos/:owner/:repo/branches/main/
# protection? Read-only, no side effects. Deleted once the answer is known
# and recorded in the PR — this file must not survive to merge.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Attempt the read
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          OUT=$(gh api "repos/$REPO/branches/main/protection" --jq '.required_status_checks.contexts' 2>&1)
          RC=$?
          echo "exit code: $RC"
          echo "output:"
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "RESULT: ADMIN_PAT CAN read branch protection."
          else
            echo "RESULT: ADMIN_PAT CANNOT read branch protection."
          fi
