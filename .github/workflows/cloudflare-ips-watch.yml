name: Cloudflare IP Ranges Watch

# task-cloudflare-ips-watch (2026-08-18) — the owner applied the Hetzner
# network firewall the same day this workflow was written
# (docs/runbooks/origin-mtls-and-firewall.md §1), restricting :80/:443 to
# Cloudflare's published edge ranges ONLY. Before that firewall, a stale
# nginx/cloudflare-ips.txt was noise in nginx's realip/rate-limit logs
# (scripts/devops/check-cloudflare-ips-freshness.sh's own header has the full
# writeup). After it, a range Cloudflare adds and this file lacks means real
# visitors on that range get a connection timeout on the SITE — and the owner,
# testing from their own machine, is very unlikely to be the visitor who hits
# it. Staleness went from "run the precondition check before a specific
# procedure" to "needs eyes on it twice a day, every day".
#
# THIS DOES NOT REPLACE `check-cloudflare-ips-freshness.sh` — that script
# remains the ONE place the actual fetch-and-diff logic lives (still the
# MANDATORY precondition for scripts/devops/origin-gate-rollout-runbook.md's
# flip procedure, run on demand by a human). This workflow reuses it via
# `scripts/devops/cloudflare-ips-watch.sh`, which owns the DECISION of what to
# DO with the result — see that script's own header for the full contract and
# why the comparison logic is not duplicated a second time here.
#
# WHY A SCHEDULED JOB IS JUSTIFIED HERE, given the project's own "no
# unnecessary recurring CI jobs" rule (DevOps golden rule #4,
# .claude/agents/devops.md): this is not decorative monitoring — a stale file
# now drops real traffic. Twice a day (not more) keeps the CI-minutes cost
# small relative to what an unnoticed drift costs (part of the site
# unreachable for however long it takes someone to notice by hand).
#
# NO SMTP SECRET ANYWHERE. Delivery to the owner rides GitHub's own two native
# notification channels: an ASSIGNED issue (assignee notification — see
# cloudflare-ips-watch.sh's AC4) when a real drift is found, and a scheduled
# workflow's own "your workflow failed" notification when the sentinel itself
# cannot verify (AC7) — the same reasoning deploy-alert.yml documents for its
# own channel choice, applied without even needing that workflow's private-
# repo indirection: everything here is public CIDR data, so it goes straight
# to THIS repo, cross-linked with the PR it opens in the same repo.
on:
  schedule:
    # 06:11 and 18:11 UTC — off the hour (shared runner pool), roughly 12h
    # apart. Twice a day per the task, not more — see the cost note above.
    - cron: '11 6,18 * * *'
  workflow_dispatch:

# Only one drift-check in flight at a time — it pushes to a single fixed
# branch (infra/cloudflare-ips-auto-update) and edits a single dedup'd issue;
# two overlapping runs would race on both. A run that is 90% done finishing
# is worth more than a fresh one restarting, so the in-flight run is not
# cancelled (same reasoning as mutation-nightly.yml's sweep).
concurrency:
  group: cloudflare-ips-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    name: Check Cloudflare ranges, open PR + issue on drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the single bot-owned branch
      pull-requests: write # open/update the sync PR (never auto-merged)
      issues: write # open/update the assigned alert issue
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Run the watcher
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER_LOGIN: ${{ github.repository_owner }}
        run: scripts/devops/cloudflare-ips-watch.sh
