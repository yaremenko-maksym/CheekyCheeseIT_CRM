# ============================================================
# docker-compose.extraction.yml — the opt-in extraction project (own project name), hosted-only
#
# ADR docs/architecture/2026-11-03-extraction-model-router.md §2.4, §8.6, Amendment 2026-11-08
# (H.4: the worker stays, the local runtime goes). Owner-run: docs/runbooks/extraction-worker.md.
# No deploy names this file, so a merged change cannot start the worker on production:
# scripts/devops/check-extraction-worker-compose.mjs fails CI if one does.
#
# Usage (on the host, in the compose directory):
#   docker compose -f docker-compose.extraction.yml --env-file .env.extraction-pins up -d
#
# .env.extraction-pins holds no secret, only the pin below. The pin is required: unset, compose
# refuses. The worker's own secrets live in .env.extraction-worker.
#
# Networks: this project owns both. `api` (project crm) is attached to `entry` with
# `docker network connect`, by the deploy script after each `up`, only when the network
# exists. So neither project's compose file names the other, and a deploy's
# `down --remove-orphans` has nothing foreign on a network it removes.
# ============================================================

name: crm-extraction

services:
  # ── Extraction worker (ADR §2.4): same image as `api`, worker entrypoint ──
  # A deploy does not touch this service, so its tag is pinned here and moved by the owner.
  extraction-worker:
    image: ghcr.io/yaremenko-maksym/cheekycheeseit-crm-api:${EXTRACTION_WORKER_IMAGE_TAG:?pin the worker image tag}
    restart: unless-stopped
    command: ['node', 'dist/extraction-worker/main']
    # The image's own USER, stated so the guard can refuse root.
    user: node
    # The api image's HEALTHCHECK probes :3001; it does not apply to the worker.
    healthcheck:
      disable: true
    env_file:
      - .env.extraction-worker
    environment:
      NODE_ENV: production
      EXTRACTION_WORKER_HOST: 0.0.0.0
      EXTRACTION_WORKER_PORT: '3100'
      EXTRACTION_ROUTER_STATE_FILE: /var/lib/extraction-worker/router-state.json
    volumes:
      - worker_state:/var/lib/extraction-worker
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 64
    # Writable: the state volume and /tmp only.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    networks:
      entry:
        # The one plain-HTTP host the API's transport accepts (EXTRACTION_WORKER_HOST in
        # packages/inference/src/http/bounded-request.ts): api calls http://crm-extraction-worker:3100.
        aliases: [crm-extraction-worker]
      egress: {}

volumes:
  # Undo never removes it (§8.6): router state only, no secret, no CRM data.
  # Nothing set (the default local driver): a driver_opts bind would mount the host into the worker.
  worker_state: {}

networks:
  # The §2.4 entry: the worker and its caller. Fixed name: the deploy attaches `api` by it.
  entry:
    name: crm-extraction-entry
    driver: bridge
    internal: true
  # Outbound to the hosted providers (gemini, groq, cloudflare). The worker alone: no fixed name,
  # so it resolves to crm-extraction_egress and is never a network of the main stack.
  # Fixed subnet, outside Docker's default pools, so the later host egress firewall can target it.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.17.0/28
